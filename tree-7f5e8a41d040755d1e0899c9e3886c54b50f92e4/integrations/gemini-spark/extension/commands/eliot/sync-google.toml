description = "Plan and execute a Google Workspace or Google Cloud action with exact readback and ELIOT receipt validation."
prompt = """
Perform this Google task using the ELIOT safety sequence: {{args}}

1. Identify the exact Google product, action, direction, target, expected revision, and payload digest.
2. Call `eliotr_create_google_sync_plan`.
3. If the plan is mutating, show the exact effect and ask the user for confirmation before any Google tool call.
4. Use only the official `google-workspace` or `gcloud` MCP extension named by the plan.
5. Re-read the exact resource after the action and normalize stable ID, revision/generation/etag, observed time, and digest.
6. Call `eliotr_validate_google_sync_receipt`.
7. Report the receipt as a candidate transport observation. Do not claim canonical ELIOT state changed.
"""
