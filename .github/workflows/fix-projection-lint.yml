name: fix-projection-lint

on:
  push:
    branches:
      - agent/p0-projection-executor-20260831

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-projection-executor-20260831
          fetch-depth: 0
      - name: Remove verified dead symbols
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'packages/cloudflare-projection/src/core-authority.ts': [
                  ('  assertProjectionSha256,\n', ''),
              ],
              'packages/cloudflare-projection/src/core-load.ts': [
                  ('function optionalIdentifier(value: unknown, label: string): string | undefined {\n  if (value === null || value === undefined) return undefined;\n  return assertProjectionIdentifier(value, label);\n}\n\n', ''),
              ],
              'packages/cloudflare-projection/src/work-store.ts': [
                  ('  ProjectionWorkReceipt,\n', ''),
              ],
          }
          for name, edits in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f'{name}: expected exactly one match for {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit source-only lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/cloudflare-projection/src/core-authority.ts \
                  packages/cloudflare-projection/src/core-load.ts \
                  packages/cloudflare-projection/src/work-store.ts
          git commit -m 'fix(er38): remove dead projection symbols'
          git push origin HEAD:agent/p0-projection-executor-20260831
