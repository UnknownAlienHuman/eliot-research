name: repair-dead-code-workflow-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-dead-code-workflow-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Cancel superseded reachability run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and .path == ".github/workflows/dead-code-reachability-once.yml") | .id' \
            | while read -r run_id; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
              done
          sleep 10
          git fetch origin main
          git reset --hard origin/main
      - name: Correct verification ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/dead-code-reachability-once.yml')
          source = path.read_text(encoding='utf-8')
          block = '''          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status'''
          fixed = '''          pnpm boundaries:check
          pnpm budgets:check
          pnpm check:implementation-status'''
          if block not in source:
              raise SystemExit('reachability verification-order anchor missing')
          path.write_text(source.replace(block, fixed, 1), encoding='utf-8', newline='\n')
          PY
      - name: Commit repaired reachability workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-dead-code-workflow-once.yml
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "ci: validate reachability ownership in dependency order"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
