name: Fix external-agent v8 recovery bounds

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-external-agent-v8.yml
      - .github/scripts/fix-external-agent-v8.py

permissions:
  contents: write

concurrency:
  group: fix-external-agent-v8
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply reviewed fixes
        run: python .github/scripts/fix-external-agent-v8.py
      - name: Static and scoped compile checks
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          payload = Path("packages/cloudflare-workflows/src/external-agent-task-payload.ts").read_text()
          branch = Path("packages/cloudflare-research/src/research-external-branch-analysis.ts").read_text()
          migration = Path("infra/d1/core/migrations/0086_external_agent_task_payload.sql").read_text()
          assert "MAX_PAYLOAD_BYTES = 96 * 1024" in payload
          assert "recorded.expires_at !== expiresAt" not in payload
          assert "INLINE_EXCERPT_BUDGET_BYTES = 0" in branch
          assert "allowed_operations.includes(\"evidence\")" in branch
          assert "BETWEEN 1 AND 98304" in migration
          assert 3 * (96 * 1024 + 64 * 1024 + 4 * 1024) < 512 * 1024
          print("EXTERNAL_AGENT_V8_STATIC_OK")
          PY
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/cloudflare-workflows --filter @eliotr/cloudflare-research --filter @eliotr/core typecheck
          pnpm d1:depth
      - name: Commit fixes
        run: |
          git rm .github/workflows/fix-external-agent-v8.yml .github/scripts/fix-external-agent-v8.py
          git diff --check
          git add \
            infra/d1/core/migrations/0086_external_agent_task_payload.sql \
            packages/cloudflare-workflows/src/external-agent-task-payload.ts \
            packages/cloudflare-research/src/research-external-branch-analysis.ts \
            apps/eliotr-core/src/research-external-agent-routing.ts \
            apps/eliotr-core/src/research-session.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'fix: make computer-agent recovery replay safe' \
            -m 'Reuse the first immutable task deadline after lost publication acknowledgements. Bound handle-first task payloads below the duplicated MCP result envelope, require exact evidence-read authority, and direct agents to reopen excerpts through bounded current-authority reads. Refs #301.'
          git push origin HEAD:main
