name: wiki-product-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wiki-product-once.yml

permissions:
  contents: write

concurrency:
  group: wiki-product-once
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Materialize and harden Wiki product slice
        run: |
          python3 scripts/materialize-wiki-once.py
          python3 scripts/harden-wiki-once.py
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify without Astro, Qdrant or external services
        run: |
          pnpm --filter @eliotr/research test
          pnpm --filter @eliotr/interfaces typecheck
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit verified product code to main
        run: |
          git rm .github/workflows/wiki-product-once.yml scripts/materialize-wiki-once.py scripts/harden-wiki-once.py
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement durable Wiki proposals and publication storage"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
