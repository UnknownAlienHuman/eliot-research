name: wiki-product-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wiki-product-once.yml

permissions:
  contents: write

concurrency:
  group: wiki-product-once
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Materialize and harden Wiki product slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hardener = Path("scripts/harden-wiki-once.py")
          source = hardener.read_text(encoding="utf-8")
          replacements = {
            'commit_end = store.index("        ];", commit_start) + len("        ];")':
              'batch_start = store.index("try { await database.batch(statements);", commit_start)\ncommit_end = store.rfind("\\n", commit_start, batch_start) + 1',
            'store = store[:commit_start] + statements + store[commit_end:]':
              'store = store[:commit_start] + statements + "\\n" + store[commit_end:]',
            "race_anchor = '''      expect(": "race_anchor = '''    expect(",
            ')\n        .toMatchObject({ code: "WIKI_HEAD_CONFLICT" });':
              ')\n      .toMatchObject({ code: "WIKI_HEAD_CONFLICT" });',
          }
          for old, new in replacements.items():
            if old not in source:
              raise SystemExit(f"Wiki hardener anchor missing: {old}")
            source = source.replace(old, new, 1)
          hardener.write_text(source, encoding="utf-8", newline="\n")

          cas = Path("scripts/fix-wiki-cas-once.py")
          source = cas.read_text(encoding="utf-8")
          source = source.replace(
            'start = source.index("      async commitHeadAndOutbox(")',
            'start = source.index("async commitHeadAndOutbox(")',
            1,
          ).replace(
            'end = source.index("      async readHead(", start)',
            'end = source.index("async readHead(", start)',
            1,
          )
          cas.write_text(source, encoding="utf-8", newline="\n")
          PY
          python3 scripts/materialize-wiki-once.py
          python3 scripts/harden-wiki-once.py
          python3 scripts/fix-wiki-cas-once.py
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Capture strict core test typecheck
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false 2>&1 | tee /tmp/wiki-strict-typecheck.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > /tmp/wiki-strict-typecheck.status
          exit 0
      - name: Pack exact generated checkout and diagnostics
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='*/node_modules' \
            --exclude=dist \
            --exclude='*/dist' \
            --exclude=.wrangler \
            --exclude='*/.wrangler' \
            -czf /tmp/wiki-generated-checkout.tgz .
      - name: Upload exact generated checkout
        uses: actions/upload-artifact@v4
        with:
          name: wiki-generated-checkout-${{ github.sha }}
          path: |
            /tmp/wiki-generated-checkout.tgz
            /tmp/wiki-strict-typecheck.log
            /tmp/wiki-strict-typecheck.status
          if-no-files-found: error
          retention-days: 1
      - name: Enforce strict core test typecheck
        run: test "$(cat /tmp/wiki-strict-typecheck.status)" = 0
      - name: Research package tests
        run: pnpm --filter @eliotr/research test
      - name: Interfaces typecheck
        run: pnpm --filter @eliotr/interfaces typecheck
      - name: Core tests
        run: pnpm --filter @eliotr/core test
      - name: Workspace typecheck
        run: pnpm typecheck
      - name: Workspace lint
        run: pnpm lint
      - name: Boundary checks
        run: pnpm boundaries:check
      - name: Source budgets
        run: pnpm budgets:check
      - name: Work packet ownership
        run: pnpm work-packets:check
      - name: Implementation status consistency
        run: pnpm check:implementation-status
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified product code to main
        run: |
          git rm .github/workflows/wiki-product-once.yml scripts/materialize-wiki-once.py scripts/harden-wiki-once.py scripts/fix-wiki-cas-once.py
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement durable Wiki proposals and publication storage"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
