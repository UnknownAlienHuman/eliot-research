name: wiki-product-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wiki-product-once.yml

permissions:
  contents: write

concurrency:
  group: wiki-product-once
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Materialize Wiki product slice
        run: |
          python3 scripts/materialize-wiki-once.py
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path("apps/eliotr-core/src/wiki-service.ts")
          service = service_path.read_text(encoding="utf-8")
          start = service.index("/** Existing SemanticApi operation.")
          end = service.index("/** Server-side/manual review path", start)
          factory = "export function createWikiProposalService(\n  env: Pick<Env, \"CORE_DB\" | \"WORK_BUCKET\">,\n): SemanticApi[\"proposeWiki\"] {\n  return (context: AuthenticatedRequestContext, raw: unknown) => propose(env, context, raw);\n}\n\n"
          service_path.write_text(service[:start] + factory + service[end:], encoding="utf-8", newline="\n")

          store_path = Path("apps/eliotr-core/src/wiki-publication-store.ts")
          store = store_path.read_text(encoding="utf-8")
          old_sha = 'return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), (byte) => byte.toString(16).padStart(2, "0")).join("");'
          new_sha = 'const stable = Uint8Array.from(bytes);\n  return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", stable.buffer)), (byte) => byte.toString(16).padStart(2, "0")).join("");'
          if old_sha not in store:
              raise SystemExit("Wiki SHA-256 type anchor missing")
          store_path.write_text(store.replace(old_sha, new_sha, 1), encoding="utf-8", newline="\n")

          http_path = Path("apps/eliotr-core/src/http.ts")
          http = http_path.read_text(encoding="utf-8")
          if "  QueryRequest,\n" not in http:
              anchor = "  CatalogRequest,\n"
              if anchor not in http:
                  raise SystemExit("HTTP QueryRequest import anchor missing")
              http = http.replace(anchor, anchor + "  QueryRequest,\n", 1)
          old_query = "const data = await application.services.semantic.query(context, await readJsonBodyWithinBytes(request, match.route.maximum_request_bytes));"
          new_query = "const data = await application.services.semantic.query(context, await readJsonBodyWithinBytes(request, match.route.maximum_request_bytes) as QueryRequest);"
          old_run = "return apiResult(request, env, await application.services.semantic.run(context, await readJsonBodyWithinBytes(request, match.route.maximum_request_bytes)));"
          new_run = "return apiResult(request, env, await application.services.semantic.run(context, await readJsonBodyWithinBytes(request, match.route.maximum_request_bytes) as QueryRequest));"
          if old_query not in http or old_run not in http:
              raise SystemExit("HTTP bounded DTO anchors missing")
          http = http.replace(old_query, new_query, 1).replace(old_run, new_run, 1)
          http_path.write_text(http, encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify Wiki product without Astro, Qdrant or external services
        run: |
          pnpm --filter @eliotr/research test
          pnpm --filter @eliotr/interfaces typecheck
          pnpm --filter @eliotr/core exec vitest run src/bounded-json.test.ts test/wiki-publication-store.test.ts test/wiki-service.test.ts
          pnpm --filter @eliotr/core typecheck
          pnpm lint
          pnpm budgets:check
          pnpm work-packets:check
          git diff --check
      - name: Commit verified product code to main
        run: |
          git rm .github/workflows/wiki-product-once.yml scripts/materialize-wiki-once.py
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement durable Wiki proposals and publication storage"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
