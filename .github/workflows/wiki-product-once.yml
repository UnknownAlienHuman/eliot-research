# revision: complete split imports
name: wiki-product-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wiki-product-once.yml

permissions:
  contents: write

concurrency:
  group: wiki-product-once
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Materialize and harden Wiki product slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hardener = Path("scripts/harden-wiki-once.py")
          source = hardener.read_text(encoding="utf-8")
          replacements = {
            'commit_end = store.index("        ];", commit_start) + len("        ];")':
              'batch_start = store.index("try { await database.batch(statements);", commit_start)\ncommit_end = store.rfind("\\n", commit_start, batch_start) + 1',
            'store = store[:commit_start] + statements + store[commit_end:]':
              'store = store[:commit_start] + statements + "\\n" + store[commit_end:]',
            "race_anchor = '''      expect(": "race_anchor = '''    expect(",
            ')\n        .toMatchObject({ code: "WIKI_HEAD_CONFLICT" });':
              ')\n      .toMatchObject({ code: "WIKI_HEAD_CONFLICT" });',
          }
          for old, new in replacements.items():
            if old not in source:
              raise SystemExit(f"Wiki hardener anchor missing: {old}")
            source = source.replace(old, new, 1)
          hardener.write_text(source, encoding="utf-8", newline="\n")

          cas = Path("scripts/fix-wiki-cas-once.py")
          source = cas.read_text(encoding="utf-8")
          source = source.replace(
            'start = source.index("      async commitHeadAndOutbox(")',
            'start = source.index("async commitHeadAndOutbox(")',
            1,
          ).replace(
            'end = source.index("      async readHead(", start)',
            'end = source.index("async readHead(", start)',
            1,
          )
          cas.write_text(source, encoding="utf-8", newline="\n")
          PY
          python3 scripts/materialize-wiki-once.py
          python3 scripts/harden-wiki-once.py
          python3 scripts/fix-wiki-cas-once.py
          python3 scripts/split-wiki-store-once.py
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace and strict test graph
        run: |
          pnpm typecheck
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
      - name: Run product tests
        run: |
          pnpm --filter @eliotr/research test
          pnpm --filter @eliotr/interfaces typecheck
          pnpm --filter @eliotr/core test
      - name: Run structural gates
        run: |
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit verified product code to main
        run: |
          git rm .github/workflows/wiki-product-once.yml \
            scripts/materialize-wiki-once.py \
            scripts/harden-wiki-once.py \
            scripts/fix-wiki-cas-once.py \
            scripts/split-wiki-store-once.py
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement durable Wiki proposals and publication storage"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
