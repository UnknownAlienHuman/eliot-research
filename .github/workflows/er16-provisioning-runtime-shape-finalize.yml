name: er16-provisioning-runtime-shape-finalize

on:
  push:
    branches:
      - agent/ER-16-ai-search-instance-provisioning-20260903
    paths:
      - .github/workflows/er16-provisioning-runtime-shape-finalize.yml

permissions:
  contents: write

concurrency:
  group: er16-provisioning-runtime-shape-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-ai-search-instance-provisioning-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Apply the official Workers runtime readback shape
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-er16-provisioning-runtime-shape.py
          git rm -- scripts/tmp-er16-provisioning-runtime-shape.py
          git rm -- .github/workflows/er16-provisioning-runtime-shape-finalize.yml
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify the strict runtime-compatible provisioning boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm contracts:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm work-packets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/cloudflare-ai --reporter=verbose
          pnpm exec vitest run packages/platform-cloudflare packages/cloudflare-projection --reporter=verbose
          pnpm cf:dry-run
          git diff --check

      - name: Commit the verified runtime-shape correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: qualify AI Search runtime readback shape [runtime-shape-finalized]"
          git push origin HEAD:agent/ER-16-ai-search-instance-provisioning-20260903
