name: cleanup-product-temporaries-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-product-temporaries-once.yml

permissions:
  contents: write

concurrency:
  group: eliot-main-product-write
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary implementation machinery
        run: |
          rm -f .github/workflows/cleanup-product-temporaries-once.yml
          rm -f .github/workflows/local-backend-federation-finalize-once.yml
          rm -f .github/workflows/lifecycle-reconcile-once.yml
          rm -f .github/workflows/backend-product-finalize-once.yml
          rm -f .github/workflows/wiki-product-once.yml
          rm -f .github/workflows/research-changes-recovery-once.yml
          rm -f .github/workflows/research-changes-authority-gate-once.yml
          rm -f .github/workflows/research-changes-authority-once.yml
          rm -f .github/workflows/research-v3-promotion-once.yml
          rm -f scripts/materialize-wiki-once.py scripts/harden-wiki-once.py
          rm -f scripts/recover-research-changes-once.py
          rm -f scripts/repair-research-changes-contour-once.py
          rm -f scripts/harden-research-changes-authority-once.py
          rm -f scripts/promote-research-v3-once.py
          rm -f scripts/implement-lifecycle-reconcile-once.py
          rm -f scripts/recover-federation-composition-once.py
          rm -f infra/verification/research-changes-authority-audit.json
          git add -A
          git diff --cached --check
      - name: Commit cleanup to main
        run: |
          if git diff --cached --quiet; then
            echo "No temporary files remain"
            exit 0
          fi
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git commit -m "ci: remove temporary product implementation workflows"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
