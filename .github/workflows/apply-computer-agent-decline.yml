name: Apply computer-agent dispatch decline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          check-latest: false
      - name: Apply, verify, and publish exact target decline
        run: |
          set -euo pipefail
          gzip -dc .github/decline-payload/runner.sh.gz > /tmp/run-computer-agent-decline.sh
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/run-computer-agent-decline.sh')
          text = path.read_text(encoding='utf-8')
          baseline = 'BASELINE="cca6982de00fddf27b6422a8b1df6864a5dc43b1"\n'
          if text.count(baseline) != 1:
              raise SystemExit('decline verifier baseline marker changed')
          text = text.replace(
              baseline,
              baseline + 'STAGING_HEAD="$(git rev-parse HEAD)"\n',
          )
          head_pattern = re.compile(
              r'if \[\[ "\$\(git rev-parse HEAD\)" != "\$BASELINE" \]\]; then\n'
              r'\s*echo "unexpected baseline: \$\(git rev-parse HEAD\)" >&2\n'
              r'\s*exit 1\nfi'
          )
          text, head_count = head_pattern.subn(
              'if [[ "$(git rev-parse HEAD^)" != "$BASELINE" ]]; then\n'
              '  echo "unexpected product parent: $(git rev-parse HEAD^)" >&2\n'
              '  exit 1\nfi',
              text,
          )
          origin_pattern = re.compile(
              r'if \[\[ "\$\(git rev-parse origin/main\)" != "\$BASELINE" \]\]; then\n'
              r'\s*echo "origin/main moved during verification" >&2\n'
              r'\s*exit 1\nfi'
          )
          text, origin_count = origin_pattern.subn(
              'if [[ "$(git rev-parse origin/main)" != "$STAGING_HEAD" ]]; then\n'
              '  echo "origin/main moved during verification" >&2\n'
              '  exit 1\nfi',
              text,
          )
          if head_count != 1 or origin_count != 1:
              raise SystemExit(
                  f'decline verifier baseline guards changed: head={head_count}, origin={origin_count}'
              )
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x /tmp/run-computer-agent-decline.sh
          /tmp/run-computer-agent-decline.sh
