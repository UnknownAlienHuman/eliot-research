name: Apply computer-agent dispatch decline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          check-latest: false
      - name: Apply, verify, and publish exact target decline
        run: |
          set -euo pipefail
          gzip -dc .github/decline-payload/apply.py.gz > /tmp/apply-computer-agent-decline.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply-computer-agent-decline.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def replace_once(')
          end = text.find('\ndef ', start + 1)
          if end < 0:
              raise SystemExit('decline apply replace_once boundary changed')
          block = text[start:end]
          guard = '    if count != 1:\n'
          writer = '    target.write_text(text.replace(old, new), encoding="utf-8")\n'
          if block.count(guard) != 1 or block.count(writer) != 1:
              raise SystemExit('decline apply replace_once body changed')
          marker = 'Computer-agent dispatch migrations 0090 and 0091 are required'
          block = block.replace(
              guard,
              '    sequential_decline_schema = (\n'
              '        path == "apps/eliotr-core/src/computer-agent-dispatch-store.ts"\n'
              f'        and "{marker}" in old\n'
              '    )\n'
              '    if count != 1 and not (sequential_decline_schema and count == 2):\n',
          )
          block = block.replace(
              writer,
              '    updated = text.replace(old, new, 1) if sequential_decline_schema else text.replace(old, new)\n'
              '    target.write_text(updated, encoding="utf-8")\n',
          )
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
          gzip -n -c /tmp/apply-computer-agent-decline.py > .github/decline-payload/apply.py.gz

          gzip -dc .github/decline-payload/runner.sh.gz > /tmp/run-computer-agent-decline.sh
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/run-computer-agent-decline.sh')
          text = path.read_text(encoding='utf-8')
          baseline = 'BASELINE="cca6982de00fddf27b6422a8b1df6864a5dc43b1"\n'
          if text.count(baseline) != 1:
              raise SystemExit('decline verifier baseline marker changed')
          text = text.replace(
              baseline,
              baseline + 'STAGING_HEAD="$(git rev-parse HEAD)"\n',
          )
          head_pattern = re.compile(
              r'if \[\[ "\$\(git rev-parse HEAD\)" != "\$BASELINE" \]\]; then\n'
              r'\s*echo "unexpected baseline: \$\(git rev-parse HEAD\)" >&2\n'
              r'\s*exit 1\nfi'
          )
          bounded_staging = '''if ! git merge-base --is-ancestor "$BASELINE" "$STAGING_HEAD"; then
            echo "decline product baseline is not an ancestor of staging HEAD" >&2
            exit 1
          fi
          UNEXPECTED_STAGING="$(git diff --name-only "$BASELINE..$STAGING_HEAD" -- . \\
            ':(exclude).github/decline-payload/**' \\
            ':(exclude).github/workflows/apply-computer-agent-decline.yml')"
          if [[ -n "$UNEXPECTED_STAGING" ]]; then
            echo "unexpected non-staging paths before decline verification:" >&2
            printf '%s\\n' "$UNEXPECTED_STAGING" >&2
            exit 1
          fi'''
          text, head_count = head_pattern.subn(bounded_staging, text)
          origin_pattern = re.compile(
              r'if \[\[ "\$\(git rev-parse origin/main\)" != "\$BASELINE" \]\]; then\n'
              r'\s*echo "origin/main moved during verification" >&2\n'
              r'\s*exit 1\nfi'
          )
          text, origin_count = origin_pattern.subn(
              'if [[ "$(git rev-parse origin/main)" != "$STAGING_HEAD" ]]; then\n'
              '  echo "origin/main moved during verification" >&2\n'
              '  exit 1\nfi',
              text,
          )
          if head_count != 1 or origin_count != 1:
              raise SystemExit(
                  f'decline verifier baseline guards changed: head={head_count}, origin={origin_count}'
              )
          issuer_literal = re.compile(
              r'(?P<key>(?:["\']issuer["\']|issuer)\s*:\s*)'
              r'(?P<quote>["\'])(?P<value>[^"\']+)(?P=quote)'
          )
          valid_issuer = re.compile(
              r'^https://[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.cloudflareaccess\.com$'
          )
          invalid_values = sorted({
              match.group('value')
              for match in issuer_literal.finditer(text)
              if not valid_issuer.fullmatch(match.group('value'))
          })
          if not invalid_values or len(invalid_values) > 4:
              raise SystemExit(
                  f'decline synthetic issuer identities changed: {invalid_values!r}'
              )
          total_replacements = 0
          for index, old_issuer in enumerate(invalid_values, start=1):
              replacement = f'https://fixture-{index}.cloudflareaccess.com'
              occurrence_count = (
                  text.count(f"'{old_issuer}'") + text.count(f'"{old_issuer}"')
              )
              if occurrence_count < 1 or occurrence_count > 16:
                  raise SystemExit(
                      f'decline synthetic issuer occurrence count changed for {old_issuer!r}: '
                      f'{occurrence_count}'
                  )
              text = text.replace(
                  f"'{old_issuer}'", f"'{replacement}'"
              ).replace(
                  f'"{old_issuer}"', f'"{replacement}"'
              )
              total_replacements += occurrence_count
              if old_issuer in text:
                  raise SystemExit(
                      f'decline synthetic issuer replacement is incomplete for {old_issuer!r}'
                  )
          if total_replacements < 2 or total_replacements > 32:
              raise SystemExit(
                  f'decline total synthetic issuer occurrence count changed: {total_replacements}'
              )
          cleanup_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)git rm (?=(?:\\[ \t]*$|\.github/))'
          )
          text, cleanup_count = cleanup_pattern.subn(
              lambda match: f"{match.group('indent')}git rm -f ", text
          )
          if cleanup_count != 1:
              raise SystemExit(
                  f'decline self-removal command changed: {cleanup_count}'
              )
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x /tmp/run-computer-agent-decline.sh
          /tmp/run-computer-agent-decline.sh
