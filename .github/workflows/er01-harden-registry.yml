name: er01-harden-registry

on:
  push:
    branches:
      - "agent/ER-01-contract-registry-20260901"
    paths:
      - ".github/workflows/er01-harden-registry.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Apply the exact registry hardening patch
        run: |
          python docs/contracts/er01-harden.py
          rm docs/contracts/er01-harden.py
          rm -f \
            docs/contracts/schema-corpus.v1.json \
            docs/contracts/schema-index.v1.json \
            docs/contracts/compatibility-registry.v1.json \
            docs/contracts/canonical-fixtures.v1.json
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild the initial generated generation
        run: |
          pnpm --filter @eliotr/contracts build
          node docs/contracts/generate.mjs --bootstrap
      - name: Validate contract and product boundaries
        run: |
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/contracts --reporter=verbose
          node docs/contracts/generate.mjs --check
          pnpm build:pwa
          pnpm cf:types
          pnpm cf:dry-run
          git diff --check
      - name: Commit the hardened registry
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all packages/contracts docs/contracts
          git commit -m "refactor(contracts): isolate and harden registry tooling"
          git push origin "HEAD:${HEAD_REF}"
