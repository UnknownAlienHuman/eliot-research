name: publish-reviewed-s05-compatibility

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-s05.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - name: Reconstruct and apply the reviewed S05 patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = b1bf0cb67091ad6c0356e521f2595482ba7c24ca
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request

          blob_shas = [
              "32de90b6f62722a3cbf21fb0625516946d823019",
              "ae211d2d3d13e60de6943009e18a5090a97903a1",
              "837927d70630ae948b0d17682ada9ab2fb131c65",
              "3438f4ca51ec9e479bd19d2e1194eee5a4715dc0",
              "7cb5cc2bf7d9b9074c7e4cf5d943d60ad8caf592",
          ]
          encoded_parts = []
          for blob_sha in blob_shas:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/UnknownAlienHuman/eliot-research/git/blobs/{blob_sha}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              transported = base64.b64decode(item["content"])
              observed_blob = hashlib.sha1(b"blob " + str(len(transported)).encode() + b"\0" + transported).hexdigest()
              if observed_blob != blob_sha:
                  raise SystemExit(f"blob mismatch: {blob_sha} != {observed_blob}")
              encoded_parts.append(b"".join(transported.split()))
          encoded = b"".join(encoded_parts)
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != "ff311b6e0c87cfc9b4075f60ce7629a7825fd37f9e7eac3c84cee29b45289af9":
              raise SystemExit("gzip digest mismatch")
          pathlib.Path("/tmp/s05.patch.gz").write_bytes(compressed)
          PY
          gzip -dc /tmp/s05.patch.gz > /tmp/s05.patch
          test "$(wc -c < /tmp/s05.patch)" = 99758
          test "$(sha256sum /tmp/s05.patch | cut -d' ' -f1)" = b803d133274360b9d7f35b85f16cd422cd47620edd83f7e98a243d47b11bed02
          git apply --check /tmp/s05.patch
          git apply --index /tmp/s05.patch
          git rm .github/workflows/publish-s05.yml
          test "$(git write-tree)" = a38a7ebd015681f1a366a407bfe2024b457ddec5
          git diff --cached --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate the critical S05 boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s05-validation
          pnpm exec tsc -b apps/eliotr-pwa/tsconfig.json apps/eliotr-core/tsconfig.json --pretty false
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          changed_ts="$(git diff --cached --name-only -- '*.ts')"
          test -n "$changed_ts"
          pnpm exec eslint $changed_ts
          node scripts/check-boundaries.mjs
          node scripts/check-work-packets.mjs
          node scripts/test-research-backend-fingerprint.mjs
          node scripts/test-research-deployment-authority.mjs
          node scripts/test-deployment-apply-ordering.mjs
          node scripts/test-deployment-orchestration.mjs
          node scripts/test-deployment-verification.mjs
          pnpm --dir apps/eliotr-core exec vitest run test/research-deployment-compatibility.test.ts 2>&1 | tee /tmp/s05-validation/compatibility.log
          pnpm --dir apps/eliotr-core exec vitest run test/research-run-status.test.ts -t 'keeps the original run readable under an equal-backend PWA-only deployment' 2>&1 | tee /tmp/s05-validation/status.log
          test "$(git write-tree)" = a38a7ebd015681f1a366a407bfe2024b457ddec5
          git diff --cached --check
      - name: Publish the exact tested tree to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = a38a7ebd015681f1a366a407bfe2024b457ddec5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: continue Research across identical backend deployments (S05)'
          test "$(git rev-parse 'HEAD^{tree}')" = a38a7ebd015681f1a366a407bfe2024b457ddec5
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-compatibility-validation
          path: /tmp/s05-validation/
          if-no-files-found: warn
          retention-days: 7
