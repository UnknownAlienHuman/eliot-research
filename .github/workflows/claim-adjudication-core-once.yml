name: claim-adjudication-core-once

on:
  push:
    branches: [main]
    paths: [.github/workflows/claim-adjudication-core-once.yml]

permissions:
  contents: write

concurrency:
  group: claim-adjudication-core-once
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.head_commit.message == 'ci: implement shared claim adjudication core'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Write and integrate shared cognitive adjudication
        run: |
          mkdir -p packages/research/test
          cat > packages/research/src/claim-adjudication.ts <<'EOF'
          export type ClaimEvidenceRelation = "SUPPORTS" | "CONTRADICTS";
          export type ClaimEvidenceAssurance = "LOCATOR" | "EXCERPT" | "EXACT";
          export type ClaimAdjudicationDisposition =
            | "SUPPORTED"
            | "MIXED"
            | "CONTRADICTED"
            | "STALE"
            | "INSUFFICIENT";

          export interface ClaimEvidenceObservation {
            readonly observation_ref: string;
            readonly source_revision_ref: string;
            readonly source_family_ref?: string;
            readonly relation: ClaimEvidenceRelation;
            readonly assurance: ClaimEvidenceAssurance;
            readonly current: boolean;
          }

          export interface ClaimAdjudicationInput {
            readonly claim_ref: string;
            readonly required_assurance: ClaimEvidenceAssurance;
            readonly current_state: boolean;
            readonly minimum_independent_sources?: number;
            readonly observations: readonly ClaimEvidenceObservation[];
          }

          export interface ClaimAdjudicationResult {
            readonly claim_ref: string;
            readonly disposition: ClaimAdjudicationDisposition;
            readonly support_count: number;
            readonly qualifying_support_count: number;
            readonly contradiction_count: number;
            readonly stale_support_count: number;
            readonly independent_support_source_count: number;
            readonly support_observation_refs: readonly string[];
            readonly contradiction_observation_refs: readonly string[];
            readonly limitation_codes: readonly (
              | "NO_SUPPORT"
              | "ASSURANCE_BELOW_REQUIRED"
              | "CURRENT_EVIDENCE_STALE"
              | "INDEPENDENT_SOURCE_FLOOR_UNMET"
              | "UNRESOLVED_CONTRADICTION"
            )[];
          }

          export type ClaimAdjudicationErrorCode =
            | "CLAIM_ADJUDICATION_INPUT_INVALID"
            | "CLAIM_ADJUDICATION_LIMIT_EXCEEDED";

          export class ClaimAdjudicationError extends TypeError {
            public constructor(public readonly code: ClaimAdjudicationErrorCode, message: string) {
              super(message);
              this.name = "ClaimAdjudicationError";
            }
          }

          const SAFE_REF = /^[A-Za-z0-9][A-Za-z0-9:._/@%+-]{0,511}$/u;
          const MAX_OBSERVATIONS = 4096;
          const ASSURANCE_RANK: Readonly<Record<ClaimEvidenceAssurance, number>> = Object.freeze({
            LOCATOR: 0,
            EXCERPT: 1,
            EXACT: 2,
          });

          function invalid(message: string): never {
            throw new ClaimAdjudicationError("CLAIM_ADJUDICATION_INPUT_INVALID", message);
          }

          function safeRef(value: unknown, label: string): string {
            if (typeof value !== "string" || !SAFE_REF.test(value) || value.includes("..") || value.includes("\\")) {
              invalid(`${label} is invalid`);
            }
            return value;
          }

          function assurance(value: unknown): ClaimEvidenceAssurance {
            if (value !== "LOCATOR" && value !== "EXCERPT" && value !== "EXACT") invalid("evidence assurance is invalid");
            return value;
          }

          function relation(value: unknown): ClaimEvidenceRelation {
            if (value !== "SUPPORTS" && value !== "CONTRADICTS") invalid("evidence relation is invalid");
            return value;
          }

          function compare(left: string, right: string): number {
            return left < right ? -1 : left > right ? 1 : 0;
          }

          /**
           * Deterministic fail-closed claim adjudication.
           *
           * Contradictions are never cancelled by a larger support count. Assurance is a floor,
           * never an average. For current-state claims, stale support cannot qualify. Independence
           * is measured by explicit source family when present, otherwise by exact source revision.
           */
          export function adjudicateClaimEvidence(input: ClaimAdjudicationInput): ClaimAdjudicationResult {
            if (input === null || typeof input !== "object") invalid("claim adjudication input is invalid");
            const claimRef = safeRef(input.claim_ref, "claim reference");
            const requiredAssurance = assurance(input.required_assurance);
            if (typeof input.current_state !== "boolean") invalid("current-state requirement is invalid");
            const minimumIndependentSources = input.minimum_independent_sources ?? 1;
            if (!Number.isSafeInteger(minimumIndependentSources) || minimumIndependentSources < 1 || minimumIndependentSources > 64) {
              invalid("independent source floor is invalid");
            }
            if (!Array.isArray(input.observations)) invalid("claim observations are invalid");
            if (input.observations.length > MAX_OBSERVATIONS) {
              throw new ClaimAdjudicationError("CLAIM_ADJUDICATION_LIMIT_EXCEEDED", "claim observation count exceeds its bound");
            }

            const seen = new Set<string>();
            const supportRefs: string[] = [];
            const contradictionRefs: string[] = [];
            const independentSources = new Set<string>();
            let supportCount = 0;
            let qualifyingSupportCount = 0;
            let contradictionCount = 0;
            let staleSupportCount = 0;
            let assuranceBelowRequired = false;

            for (const observation of input.observations) {
              if (observation === null || typeof observation !== "object") invalid("claim observation is invalid");
              const observationRef = safeRef(observation.observation_ref, "observation reference");
              if (seen.has(observationRef)) invalid("observation reference is duplicated");
              seen.add(observationRef);
              const sourceRevisionRef = safeRef(observation.source_revision_ref, "source revision reference");
              const sourceFamilyRef = observation.source_family_ref === undefined
                ? sourceRevisionRef
                : safeRef(observation.source_family_ref, "source family reference");
              const observedRelation = relation(observation.relation);
              const observedAssurance = assurance(observation.assurance);
              if (typeof observation.current !== "boolean") invalid("evidence currentness is invalid");

              if (observedRelation === "CONTRADICTS") {
                contradictionCount += 1;
                contradictionRefs.push(observationRef);
                continue;
              }

              supportCount += 1;
              supportRefs.push(observationRef);
              if (input.current_state && !observation.current) {
                staleSupportCount += 1;
                continue;
              }
              if (ASSURANCE_RANK[observedAssurance] < ASSURANCE_RANK[requiredAssurance]) {
                assuranceBelowRequired = true;
                continue;
              }
              qualifyingSupportCount += 1;
              independentSources.add(sourceFamilyRef);
            }

            supportRefs.sort(compare);
            contradictionRefs.sort(compare);
            const limitations: ClaimAdjudicationResult["limitation_codes"][number][] = [];
            if (supportCount === 0) limitations.push("NO_SUPPORT");
            if (assuranceBelowRequired) limitations.push("ASSURANCE_BELOW_REQUIRED");
            if (staleSupportCount > 0) limitations.push("CURRENT_EVIDENCE_STALE");
            if (independentSources.size < minimumIndependentSources) limitations.push("INDEPENDENT_SOURCE_FLOOR_UNMET");
            if (contradictionCount > 0) limitations.push("UNRESOLVED_CONTRADICTION");

            let disposition: ClaimAdjudicationDisposition;
            if (contradictionCount > 0 && qualifyingSupportCount > 0) disposition = "MIXED";
            else if (contradictionCount > 0) disposition = "CONTRADICTED";
            else if (qualifyingSupportCount >= 1 && independentSources.size >= minimumIndependentSources) disposition = "SUPPORTED";
            else if (input.current_state && staleSupportCount > 0) disposition = "STALE";
            else disposition = "INSUFFICIENT";

            return Object.freeze({
              claim_ref: claimRef,
              disposition,
              support_count: supportCount,
              qualifying_support_count: qualifyingSupportCount,
              contradiction_count: contradictionCount,
              stale_support_count: staleSupportCount,
              independent_support_source_count: independentSources.size,
              support_observation_refs: Object.freeze(supportRefs),
              contradiction_observation_refs: Object.freeze(contradictionRefs),
              limitation_codes: Object.freeze(limitations),
            });
          }
          EOF

          cat > packages/research/test/claim-adjudication.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { adjudicateClaimEvidence } from "../src/claim-adjudication.js";

          function support(ref: string, input: Partial<{
            source_revision_ref: string; source_family_ref: string; assurance: "LOCATOR" | "EXCERPT" | "EXACT"; current: boolean;
          }> = {}) {
            return {
              observation_ref: ref,
              source_revision_ref: input.source_revision_ref ?? `source-${ref}`,
              ...(input.source_family_ref === undefined ? {} : { source_family_ref: input.source_family_ref }),
              relation: "SUPPORTS" as const,
              assurance: input.assurance ?? "EXACT" as const,
              current: input.current ?? true,
            };
          }
          const contradiction = (ref: string) => ({ ...support(ref), relation: "CONTRADICTS" as const });

          describe("deterministic claim adjudication", () => {
            it("supports only when assurance, currentness and independence floors are earned", () => {
              expect(adjudicateClaimEvidence({
                claim_ref: "claim-1", required_assurance: "EXACT", current_state: true, minimum_independent_sources: 2,
                observations: [
                  support("support-b", { source_family_ref: "family-b" }),
                  support("support-a", { source_family_ref: "family-a" }),
                ],
              })).toMatchObject({ disposition: "SUPPORTED", qualifying_support_count: 2, independent_support_source_count: 2 });
            });

            it("never lets ten supports erase one contradiction", () => {
              const observations = Array.from({ length: 10 }, (_, index) => support(`support-${index}`));
              observations.push(contradiction("contradiction-1") as never);
              expect(adjudicateClaimEvidence({ claim_ref: "claim-2", required_assurance: "EXACT", current_state: false, observations }))
                .toMatchObject({ disposition: "MIXED", support_count: 10, contradiction_count: 1 });
            });

            it("does not average weak assurance into exact evidence", () => {
              expect(adjudicateClaimEvidence({
                claim_ref: "claim-3", required_assurance: "EXACT", current_state: false,
                observations: [support("weak-a", { assurance: "EXCERPT" }), support("weak-b", { assurance: "EXCERPT" })],
              })).toMatchObject({ disposition: "INSUFFICIENT", qualifying_support_count: 0 });
            });

            it("returns STALE when a current-state claim has only stale support", () => {
              expect(adjudicateClaimEvidence({
                claim_ref: "claim-4", required_assurance: "EXCERPT", current_state: true,
                observations: [support("old", { assurance: "EXACT", current: false })],
              })).toMatchObject({ disposition: "STALE", stale_support_count: 1 });
            });

            it("is order-independent but rejects duplicate observation identity", () => {
              const left = [support("b"), support("a")];
              const right = [...left].reverse();
              const first = adjudicateClaimEvidence({ claim_ref: "claim-5", required_assurance: "EXACT", current_state: false, observations: left });
              const second = adjudicateClaimEvidence({ claim_ref: "claim-5", required_assurance: "EXACT", current_state: false, observations: right });
              expect(second).toEqual(first);
              expect(() => adjudicateClaimEvidence({
                claim_ref: "claim-5", required_assurance: "EXACT", current_state: false,
                observations: [support("same"), contradiction("same")],
              })).toThrow("duplicated");
            });
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path.cwd()

          index_path = root / "packages/research/src/index.ts"
          index = index_path.read_text(encoding="utf-8")
          export = 'export * from "./claim-adjudication.js";'
          if export not in index:
              index = index.rstrip() + f"\n{export}\n"
              index_path.write_text(index, encoding="utf-8", newline="\n")

          wiki_path = root / "apps/eliotr-core/src/wiki-evidence-map.ts"
          wiki = wiki_path.read_text(encoding="utf-8")
          import_line = 'import { adjudicateClaimEvidence } from "@eliotr/research";\n'
          if import_line not in wiki: wiki = import_line + wiki
          old = '''              let support = 0;
              let contradiction = 0;
              let previousEvidence = "";
              for (const rawEvidence of statement.evidence) {
                const evidence = record(rawEvidence, ["evidence_ref", "source_revision_ref", "excerpt_sha256", "relation", "assurance", "current"], "Wiki evidence observation");
                const evidenceRef = ref(evidence.evidence_ref, "Wiki evidence reference");
                const sourceRevisionRef = ref(evidence.source_revision_ref, "Wiki evidence source revision");
                if (!dependencies.includes(sourceRevisionRef)) fail("Wiki evidence source is outside the dependency closure");
                if (seenEvidence.has(evidenceRef) || (previousEvidence !== "" && previousEvidence >= evidenceRef)) {
                  fail("Wiki evidence observations are duplicate or noncanonical");
                }
                seenEvidence.add(evidenceRef);
                previousEvidence = evidenceRef;
                if (typeof evidence.excerpt_sha256 !== "string" || !DIGEST.test(evidence.excerpt_sha256)) fail("Wiki evidence digest is invalid");
                if (evidence.relation !== "SUPPORTS" && evidence.relation !== "CONTRADICTS") fail("Wiki evidence relation is invalid");
                if (evidence.assurance !== "EXACT" && evidence.assurance !== "EXCERPT" && evidence.assurance !== "LOCATOR") fail("Wiki evidence assurance is invalid");
                if (typeof evidence.current !== "boolean") fail("Wiki evidence currentness is invalid");
                if (statement.current_state && !evidence.current) fail("a current-state statement depends on stale evidence");
                if (evidence.relation === "SUPPORTS") {
                  support += 1;
                  if (statement.label === "SOURCE_SUPPORTED" && evidence.assurance !== "EXACT") {
                    fail("a source-supported statement lacks exact evidence");
                  }
                } else contradiction += 1;
              }
              evidenceCount += statement.evidence.length;
              if (evidenceCount > MAX_TOTAL_EVIDENCE) fail("Wiki evidence map exceeds its total observation bound");
              if (support < 1) fail("Wiki statement has no supporting evidence");
              if (contradiction > 0) conflictCount += contradiction;
'''
          new = '''              let previousEvidence = "";
              const observations: Array<{
                observation_ref: string; source_revision_ref: string; relation: "SUPPORTS" | "CONTRADICTS";
                assurance: "EXACT" | "EXCERPT" | "LOCATOR"; current: boolean;
              }> = [];
              for (const rawEvidence of statement.evidence) {
                const evidence = record(rawEvidence, ["evidence_ref", "source_revision_ref", "excerpt_sha256", "relation", "assurance", "current"], "Wiki evidence observation");
                const evidenceRef = ref(evidence.evidence_ref, "Wiki evidence reference");
                const sourceRevisionRef = ref(evidence.source_revision_ref, "Wiki evidence source revision");
                if (!dependencies.includes(sourceRevisionRef)) fail("Wiki evidence source is outside the dependency closure");
                if (seenEvidence.has(evidenceRef) || (previousEvidence !== "" && previousEvidence >= evidenceRef)) {
                  fail("Wiki evidence observations are duplicate or noncanonical");
                }
                seenEvidence.add(evidenceRef);
                previousEvidence = evidenceRef;
                if (typeof evidence.excerpt_sha256 !== "string" || !DIGEST.test(evidence.excerpt_sha256)) fail("Wiki evidence digest is invalid");
                if (evidence.relation !== "SUPPORTS" && evidence.relation !== "CONTRADICTS") fail("Wiki evidence relation is invalid");
                if (evidence.assurance !== "EXACT" && evidence.assurance !== "EXCERPT" && evidence.assurance !== "LOCATOR") fail("Wiki evidence assurance is invalid");
                if (typeof evidence.current !== "boolean") fail("Wiki evidence currentness is invalid");
                observations.push({
                  observation_ref: evidenceRef,
                  source_revision_ref: sourceRevisionRef,
                  relation: evidence.relation,
                  assurance: evidence.assurance,
                  current: evidence.current,
                });
              }
              const adjudication = adjudicateClaimEvidence({
                claim_ref: statementRef,
                required_assurance: statement.label === "SOURCE_SUPPORTED" ? "EXACT" : "EXCERPT",
                current_state: statement.current_state,
                observations,
              });
              evidenceCount += statement.evidence.length;
              if (evidenceCount > MAX_TOTAL_EVIDENCE) fail("Wiki evidence map exceeds its total observation bound");
              conflictCount += adjudication.contradiction_count;
              if (adjudication.disposition === "STALE") fail("a current-state statement depends on stale evidence");
              if (adjudication.disposition === "MIXED" || adjudication.disposition === "CONTRADICTED") {
                fail("Wiki evidence map contains unresolved contradictions");
              }
              if (adjudication.disposition !== "SUPPORTED") fail("Wiki statement has no qualifying supporting evidence");
'''
          if old in wiki:
              wiki = wiki.replace(old, new, 1)
          elif "const adjudication = adjudicateClaimEvidence" not in wiki:
              raise SystemExit("Wiki adjudication integration anchor missing")
          wiki_path.write_text(wiki, encoding="utf-8", newline="\n")

          manifest_path = root / "docs/agent-work/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packets = []
          def collect(value):
              if isinstance(value, dict):
                  if isinstance(value.get("id"), str): packets.append(value)
                  for child in value.values(): collect(child)
              elif isinstance(value, list):
                  for child in value: collect(child)
          collect(manifest)
          owners = []
          for packet in packets:
              paths = packet.get("owned_paths") if isinstance(packet.get("owned_paths"), list) else packet.get("ownedPaths")
              if isinstance(paths, list) and any(path == "packages/research/**" or path.startswith("packages/research/") for path in paths if isinstance(path, str)):
                  owners.append(packet)
          # Prefer the packet already owning the research package as a wildcard.
          exact = [packet for packet in owners if any(path == "packages/research/**" for path in (packet.get("owned_paths") or packet.get("ownedPaths") or []))]
          owner = exact[0] if len(exact) == 1 else owners[0] if len(owners) == 1 else None
          if owner is None: raise SystemExit(f"research package owner is ambiguous: {[p.get('id') for p in owners]}")
          ownership = {
              owner["id"]: ["packages/research/src/claim-adjudication.ts", "packages/research/test/claim-adjudication.test.ts"],
          }
          for packet_id, paths in ownership.items():
              packet = next((value for value in packets if value.get("id") == packet_id), None)
              if packet is None: raise SystemExit(f"missing packet {packet_id}")
              key = "owned_paths" if isinstance(packet.get("owned_paths"), list) else "ownedPaths" if isinstance(packet.get("ownedPaths"), list) else None
              if key is None: raise SystemExit(f"owned paths missing {packet_id}")
              for item in paths:
                  if item not in packet[key]: packet[key].append(item)
              docs = list((root / "docs/agent-work").glob(f"{packet_id}-*.md"))
              if len(docs) != 1: raise SystemExit(f"packet doc ambiguous {packet_id}")
              doc_path = docs[0]
              doc = doc_path.read_text(encoding="utf-8")
              heading = re.search(r"(?im)^##\s+Owned paths\s*$", doc)
              if heading is None: raise SystemExit(f"Owned paths heading missing {packet_id}")
              tail = doc[heading.end():]
              next_heading = re.search(r"(?m)^##\s+", tail)
              end = heading.end() + (next_heading.start() if next_heading else len(tail))
              section = doc[heading.end():end]
              additions = [item for item in paths if f'`{item}`' not in section]
              if additions:
                  if not section.endswith("\n"): section += "\n"
                  section += "".join(f'- `{item}`\n' for item in additions)
                  doc = doc[:heading.end()] + section + doc[end:]
                  doc_path.write_text(doc, encoding="utf-8", newline="\n")
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify shared adjudication through real Wiki publication
        run: |
          pnpm exec vitest run packages/research/test/claim-adjudication.test.ts --reporter=verbose
          pnpm --filter @eliotr/core exec vitest run test/wiki-evidence-map.test.ts test/wiki-publication-store.test.ts test/wiki-review-service.test.ts --reporter=verbose
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm budgets:check
          pnpm work-packets:check
          pnpm boundaries:check
          git diff --check
      - name: Commit only green cognitive product code
        run: |
          git rm .github/workflows/claim-adjudication-core-once.yml
          git config user.name "Eliot Research Product Builder"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: add shared claim evidence adjudication"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
