name: export-review-source
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-review-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify reviewed patch and store immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          const repo = 'UnknownAlienHuman/eliot-research';
          const expectedTree = '01641dd29d21af6d646a0faa47edec8cfc2ec3a4';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 15000 }).trim();
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(git('rev-parse', 'HEAD^'), 'ec8588d696630228f512fa4c30d108d5940f850e');
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git object request returned HTTP ${response.status}`);
            return response.json();
          };
          const pieces = [];
          for (const sha of ['e82067d1e385bdbf9a3d0ed318990af8da30ec16', '224483c07234f363515b83cf1c48d1c6c4de1860', '35d58e45763f7667b47124cdcd668ed906561d9b']) {
            const blob = await api(`/git/blobs/${sha}`);
            assert.equal(blob.sha, sha); assert.equal(blob.encoding, 'base64');
            pieces.push(Buffer.from(blob.content, 'base64').toString('utf8'));
          }
          const patch = brotliDecompressSync(Buffer.from(pieces.join(''), 'base64'), { maxOutputLength: 100000 });
          assert.equal(createHash('sha256').update(patch).digest('hex'),
            '36529d54772f7c777e03d2267e8f0d1a07b1f8085e03e7f259c0c20ecacb16f7');
          writeFileSync('/tmp/discovery.patch', patch, { mode: 0o600 });
          git('apply', '--index', '--whitespace=error', '/tmp/discovery.patch');
          git('rm', '.github/workflows/export-review-source.yml');
          git('diff', '--cached', '--check');
          assert.equal(git('write-tree'), expectedTree);
          for (const gate of ['check-work-packets', 'check-implementation-status', 'check-budgets', 'check-boundaries']) {
            execFileSync(process.execPath, [`scripts/${gate}.mjs`], { stdio: 'inherit', timeout: 20000 });
          }
          const changes = execFileSync('git', ['diff', '--cached', '--name-status', '-z'], { encoding: 'utf8' }).split('\0');
          if (changes.at(-1) === '') changes.pop();
          assert.equal(changes.length % 2, 0);
          const entries = [];
          for (let i = 0; i < changes.length; i += 2) {
            const [status, path] = changes.slice(i, i + 2);
            assert.ok(['A', 'M', 'D'].includes(status));
            if (status === 'D') { entries.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
            const bytes = execFileSync('git', ['show', `:${path}`]);
            const blob = await api('/git/blobs', { encoding: 'base64', content: bytes.toString('base64') });
            assert.equal(blob.sha, git('rev-parse', `:${path}`));
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const tree = await api('/git/trees', { base_tree: git('rev-parse', 'HEAD^{tree}'), tree: entries });
          assert.equal(tree.sha, expectedTree);
          console.log(`VERIFIED_SOURCE_TREE=${tree.sha}`);
          // Only immutable source objects: no commit, ref, branch or PR mutation.
          JS
