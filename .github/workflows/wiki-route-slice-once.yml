name: wiki-route-slice-once

on:
  push:
    branches: [main]
    paths: [.github/workflows/wiki-route-slice-once.yml]

permissions:
  contents: write

concurrency:
  group: wiki-route-slice-once
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.head_commit.message == 'ci: wire ER-12 Wiki proposal product route'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Require completed Wiki storage slice
        run: |
          test -f apps/eliotr-core/src/wiki-publication-store.ts
          test -f apps/eliotr-core/test/wiki-publication-store.test.ts
          test -f infra/d1/core/migrations/0042_wiki_publication.sql
      - name: Write semantic Wiki service and wire existing route
        shell: bash
        run: |
          cat > apps/eliotr-core/src/wiki-service.ts <<'EOF'
          import {
            VersionedRefSchema,
            WikiPageRevisionSchema,
            type VersionedRef,
            type WikiPageRevision,
          } from "@eliotr/contracts";
          import type { AuthenticatedRequestContext, SemanticApi } from "@eliotr/interfaces";
          import {
            createWikiPublisher,
            WikiPublicationError,
            type DraftRiskClass,
          } from "@eliotr/research";
          import { CatalogInputError } from "./catalog-service.js";
          import type { Env } from "./env.js";
          import { createD1R2WikiPublicationPort } from "./wiki-publication-store.js";

          const RISK_CLASSES = new Set<DraftRiskClass>([
            "D0_MECHANICAL",
            "D1_LOW_RISK_ADDITIVE",
            "D2_ANALYTICAL",
            "D3_AUTHORITY_SENSITIVE",
          ]);

          export const WIKI_PROPOSAL_PROTOCOL = "eliotr.wiki-proposal.v1";
          export const WIKI_PUBLICATION_PROTOCOL = "eliotr.wiki-publication.v1";

          export interface WikiProposalResult {
            readonly protocol: typeof WIKI_PROPOSAL_PROTOCOL;
            readonly proposal_ref: VersionedRef;
            readonly page_ref: VersionedRef;
            readonly risk_class: DraftRiskClass;
            readonly state: "PROPOSED";
          }

          export interface WikiPublicationResult {
            readonly protocol: typeof WIKI_PUBLICATION_PROTOCOL;
            readonly page_ref: VersionedRef;
            readonly status: "PUBLISHED";
            readonly reviewer_ref: string;
          }

          function fail(code: string, message: string, status = 400, retryable = false): never {
            throw new CatalogInputError(code, message, status, retryable);
          }

          function requireOwner(context: AuthenticatedRequestContext): void {
            if (context.client_class !== "owner_pwa") fail("WIKI_OWNER_REQUIRED", "Wiki mutation requires the owner profile", 403);
          }

          function idempotencyKey(context: AuthenticatedRequestContext): string {
            const value = context.request.headers.get("idempotency-key");
            if (value === null || value.length < 1 || value.length > 256 || /[\u0000-\u0020\u007f]/u.test(value)) {
              fail("WIKI_INPUT_INVALID", "idempotency-key header is required");
            }
            return value;
          }

          function strictRecord(raw: unknown, expected: readonly string[]): Record<string, unknown> {
            if (raw === null || typeof raw !== "object" || Array.isArray(raw)) fail("WIKI_INPUT_INVALID", "Wiki request must be an object");
            const record = raw as Record<string, unknown>;
            const keys = Object.keys(record);
            if (keys.length !== expected.length || expected.some((key) => !Object.hasOwn(record, key))) {
              fail("WIKI_INPUT_INVALID", "Wiki request has unknown or missing fields");
            }
            return record;
          }

          function proposalInput(raw: unknown): { page: WikiPageRevision; risk_class: DraftRiskClass } {
            const record = strictRecord(raw, ["page", "risk_class"]);
            const page = WikiPageRevisionSchema.safeParse(record.page);
            if (!page.success || page.data.status !== "DRAFT") fail("WIKI_INPUT_INVALID", "Wiki proposal must contain one strict DRAFT page");
            if (typeof record.risk_class !== "string" || !RISK_CLASSES.has(record.risk_class as DraftRiskClass)) {
              fail("WIKI_INPUT_INVALID", "Wiki risk class is invalid");
            }
            return { page: page.data, risk_class: record.risk_class as DraftRiskClass };
          }

          function publicationInput(raw: unknown): { proposal_ref: VersionedRef; expected_head_revision: number } {
            const record = strictRecord(raw, ["proposal_ref", "expected_head_revision"]);
            const proposal = VersionedRefSchema.safeParse(record.proposal_ref);
            if (!proposal.success || proposal.data.revision !== 1) fail("WIKI_INPUT_INVALID", "Wiki proposal reference is invalid");
            if (!Number.isSafeInteger(record.expected_head_revision) || (record.expected_head_revision as number) < 0) {
              fail("WIKI_INPUT_INVALID", "expected Wiki head revision is invalid");
            }
            return { proposal_ref: proposal.data, expected_head_revision: record.expected_head_revision as number };
          }

          function mapWiki(error: unknown): never {
            if (!(error instanceof WikiPublicationError)) throw error;
            const status = error.code === "WIKI_INPUT_INVALID" ? 400
              : error.code === "WIKI_PROPOSAL_NOT_FOUND" ? 404
                : error.code === "WIKI_POLICY_DENIED" ? 403
                  : error.code === "WIKI_HEAD_CONFLICT" || error.code === "WIKI_PROPOSAL_READBACK_MISMATCH"
                    || error.code === "WIKI_IMMUTABLE_READBACK_MISMATCH" ? 409
                    : error.code === "WIKI_PUBLICATION_INCOMPLETE" ? 422 : 503;
            fail(error.code, error.message, status, error.retryable || status === 503);
          }

          async function propose(
            env: Pick<Env, "CORE_DB" | "WORK_BUCKET">,
            context: AuthenticatedRequestContext,
            raw: unknown,
          ): Promise<WikiProposalResult> {
            requireOwner(context);
            const input = proposalInput(raw);
            const port = createD1R2WikiPublicationPort(env.CORE_DB, env.WORK_BUCKET, {
              principal_ref: context.principal_ref,
              idempotency_key: idempotencyKey(context),
            });
            try {
              const proposalRef = await createWikiPublisher(port).propose(input.page, input.risk_class);
              return {
                protocol: WIKI_PROPOSAL_PROTOCOL,
                proposal_ref: proposalRef,
                page_ref: { ...input.page.page_ref },
                risk_class: input.risk_class,
                state: "PROPOSED",
              };
            } catch (error) { mapWiki(error); }
          }

          /** Existing SemanticApi operation. The cast only bridges the legacy interface return alias; runtime bytes are strict. */
          export function createWikiProposalService(
            env: Pick<Env, "CORE_DB" | "WORK_BUCKET">,
          ): SemanticApi["proposeWiki"] {
            return (async (context: AuthenticatedRequestContext, raw: unknown) => propose(env, context, raw))
              as SemanticApi["proposeWiki"];
          }

          /** Server-side/manual review path; no public route is added until review receipt admission is composed. */
          export async function publishWikiProposal(
            env: Pick<Env, "CORE_DB" | "WORK_BUCKET">,
            context: AuthenticatedRequestContext,
            raw: unknown,
          ): Promise<WikiPublicationResult> {
            requireOwner(context);
            const input = publicationInput(raw);
            const port = createD1R2WikiPublicationPort(env.CORE_DB, env.WORK_BUCKET, {
              principal_ref: context.principal_ref,
              idempotency_key: idempotencyKey(context),
            });
            try {
              const page = await createWikiPublisher(port).publish(
                input.proposal_ref,
                input.expected_head_revision,
                context.principal_ref,
              );
              return {
                protocol: WIKI_PUBLICATION_PROTOCOL,
                page_ref: { ...page.page_ref },
                status: "PUBLISHED",
                reviewer_ref: context.principal_ref,
              };
            } catch (error) { mapWiki(error); }
          }
          EOF

          cat > apps/eliotr-core/test/wiki-service.test.ts <<'EOF'
          import { beforeAll, describe, expect, it } from "vitest";
          import type { AuthenticatedRequestContext } from "@eliotr/interfaces";
          import type { WikiPageRevision } from "@eliotr/contracts";
          import { body, count, db, principal, runtime, setupOrientationDatabase } from "./orientation-fixture.js";
          import { createWikiProposalService, publishWikiProposal } from "../src/wiki-service.js";
          import { recordWikiPublicationAuthority } from "../src/wiki-publication-store.js";

          beforeAll(async () => { await setupOrientationDatabase(); });

          async function digest(value: string): Promise<string> {
            return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value))),
              (byte) => byte.toString(16).padStart(2, "0")).join("");
          }

          function context(key: string, who = principal): AuthenticatedRequestContext {
            return {
              request: new Request("https://research.example/api/v1/research/wiki/propose", {
                method: "POST",
                headers: { "content-type": "application/json", "idempotency-key": key },
              }),
              principal_ref: who,
              client_class: "owner_pwa",
              credential_generation: "credential-v1",
              trace_id: `trace-${key}`,
            };
          }

          async function candidate(tag: string): Promise<WikiPageRevision> {
            const source = `# ${tag}\n\nVerified source body.\n`;
            const bodyKey = `wiki-service/body-${tag}`;
            const evidenceKey = `wiki-service/evidence-${tag}`;
            await runtime.WORK_BUCKET.put(bodyKey, source);
            await runtime.WORK_BUCKET.put(evidenceKey, JSON.stringify({ exact_claims: [`claim-${tag}`] }));
            return {
              page_ref: { id: `service-page-${tag}`, revision: 1 }, page_type: "Source", title: `Source ${tag}`,
              scope_snapshot_ref: { id: `scope-${tag}`, revision: 1 }, body_object_ref: bodyKey,
              body_sha256: await digest(source), statement_labels: { [`claim-${tag}`]: "SOURCE_SUPPORTED" },
              evidence_map_ref: evidenceKey, counterposition_refs: [], coverage_receipt_ref: { id: `coverage-${tag}`, revision: 1 },
              limitations: [], dependency_refs: [`source-revision-${tag}`], generator_generation: "wiki-generator-v1",
              status: "DRAFT", publication_metadata: { generated_by: "test" }, created_at: "2026-09-11T00:00:00.000Z",
            };
          }

          describe("Wiki semantic service", () => {
            it("persists an owner proposal, returns a stable protocol result and replays the same key", async () => {
              const page = await candidate("proposal");
              const service = createWikiProposalService(runtime);
              const first = await service(context("wiki-service-proposal"), { page, risk_class: "D2_ANALYTICAL" }) as unknown as {
                protocol: string; proposal_ref: { id: string; revision: number }; state: string;
              };
              const second = await service(context("wiki-service-proposal"), { page, risk_class: "D2_ANALYTICAL" });
              expect(first).toMatchObject({ protocol: "eliotr.wiki-proposal.v1", state: "PROPOSED" });
              expect(second).toEqual(first);
              expect(await count("wiki_publication_proposal")).toBeGreaterThanOrEqual(1);
            });

            it("rejects caller authority, unknown fields and divergent same-key bytes", async () => {
              const page = await candidate("negative");
              const service = createWikiProposalService(runtime);
              const foreign = context("wiki-service-foreign", "service-1");
              (foreign as { client_class: string }).client_class = "service";
              await expect(service(foreign, { page, risk_class: "D2_ANALYTICAL" })).rejects.toMatchObject({ code: "WIKI_OWNER_REQUIRED" });
              await expect(service(context("wiki-service-extra"), { page, risk_class: "D2_ANALYTICAL", extra: true }))
                .rejects.toMatchObject({ code: "WIKI_INPUT_INVALID" });
              await service(context("wiki-service-conflict"), { page, risk_class: "D2_ANALYTICAL" });
              await expect(service(context("wiki-service-conflict"), { page: { ...page, title: "changed" }, risk_class: "D2_ANALYTICAL" }))
                .rejects.toMatchObject({ code: "WIKI_PROPOSAL_READBACK_MISMATCH" });
            });

            it("keeps publication server-side, requires admitted authority, and derives reviewer from owner context", async () => {
              const page = await candidate("publish");
              const ctx = context("wiki-service-publish");
              const proposal = await createWikiProposalService(runtime)(ctx, { page, risk_class: "D3_AUTHORITY_SENSITIVE" }) as unknown as {
                proposal_ref: { id: string; revision: number };
              };
              await expect(publishWikiProposal(runtime, ctx, { proposal_ref: proposal.proposal_ref, expected_head_revision: 0 }))
                .rejects.toMatchObject({ code: "WIKI_PUBLICATION_INCOMPLETE" });
              await recordWikiPublicationAuthority(db, {
                proposal_ref: proposal.proposal_ref, principal_ref: principal,
                evidence_receipt_ref: "service-evidence-receipt", dependency_closure_receipt_ref: "service-dependency-receipt",
                verifier_receipt_ref: "service-verifier-receipt", coverage_complete: true,
                dependency_closure_complete: true, conflict_count: 0, changes_current_state: false,
              });
              await expect(publishWikiProposal(runtime, ctx, { proposal_ref: proposal.proposal_ref, expected_head_revision: 0 }))
                .resolves.toMatchObject({ protocol: "eliotr.wiki-publication.v1", status: "PUBLISHED", reviewer_ref: principal });
            });
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path.cwd()
          composition_path = root / "apps/eliotr-core/src/composition-root.ts"
          composition = composition_path.read_text(encoding="utf-8")
          import_line = 'import { createWikiProposalService } from "./wiki-service.js";\n'
          if import_line not in composition:
              composition = import_line + composition
          replacements = [
              ('proposeWiki: () => unavailable("research.wiki.propose")', 'proposeWiki: createWikiProposalService(env)'),
              ('proposeWiki: unavailable("research.wiki.propose")', 'proposeWiki: createWikiProposalService(env)'),
          ]
          changed = False
          for old, new in replacements:
              if old in composition:
                  composition = composition.replace(old, new, 1)
                  changed = True
                  break
          if not changed and 'proposeWiki: createWikiProposalService(env)' not in composition:
              raise SystemExit("composition root: research.wiki.propose unavailable seam was not found")
          composition_path.write_text(composition, encoding="utf-8", newline="\n")

          routes = (root / "packages/interfaces/src/routes.ts").read_text(encoding="utf-8")
          if 'research.wiki.propose' not in routes:
              raise SystemExit("route registry does not contain research.wiki.propose; refusing to invent a parallel route")

          http_path = root / "apps/eliotr-core/src/http.ts"
          http = http_path.read_text(encoding="utf-8")
          if 'match.route.operation_id === "research.wiki.propose"' not in http:
              anchor = 'if (match.route.operation_id === "research.query")'
              position = http.find(anchor)
              if position < 0:
                  raise SystemExit("HTTP dispatcher research.query anchor was not found")
              indentation = http[http.rfind("\n", 0, position) + 1:position]
              block = (
                  f'{indentation}if (match.route.operation_id === "research.wiki.propose") {{\n'
                  f'{indentation}  const data = await application.services.semantic.proposeWiki(\n'
                  f'{indentation}    context,\n'
                  f'{indentation}    await readJsonBodyWithinBytes(request, match.route.maximum_request_bytes),\n'
                  f'{indentation}  );\n'
                  f'{indentation}  return apiResult(request, env, data);\n'
                  f'{indentation}}}\n'
              )
              http = http[:position] + block + http[position:]
              http_path.write_text(http, encoding="utf-8", newline="\n")

          manifest_path = root / "docs/agent-work/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          owned = ["apps/eliotr-core/src/wiki-service.ts", "apps/eliotr-core/test/wiki-service.test.ts"]
          def find(value):
              if isinstance(value, dict):
                  if value.get("id") == "ER-12": return value
                  for child in value.values():
                      result = find(child)
                      if result is not None: return result
              elif isinstance(value, list):
                  for child in value:
                      result = find(child)
                      if result is not None: return result
              return None
          packet = find(manifest)
          if packet is None: raise SystemExit("ER-12 packet missing")
          key = "owned_paths" if "owned_paths" in packet else "ownedPaths" if "ownedPaths" in packet else None
          if key is None or not isinstance(packet[key], list): raise SystemExit("ER-12 owned paths missing")
          for item in owned:
              if item not in packet[key]: packet[key].append(item)
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")

          docs = list((root / "docs/agent-work").glob("ER-12-*.md"))
          if len(docs) != 1: raise SystemExit("ER-12 packet document missing or ambiguous")
          doc_path = docs[0]
          doc = doc_path.read_text(encoding="utf-8")
          for item in owned:
              if f'`{item}`' not in doc:
                  match = re.search(r"(?im)^##\s+Owned paths\s*$", doc)
                  if match is None: raise SystemExit("ER-12 Owned paths heading missing")
                  tail = doc[match.end():]
                  next_heading = re.search(r"(?m)^##\s+", tail)
                  end = match.end() + (next_heading.start() if next_heading else len(tail))
                  section = doc[match.end():end]
                  if not section.endswith("\n"): section += "\n"
                  section += f'- `{item}`\n'
                  doc = doc[:match.end()] + section + doc[end:]
          doc_path.write_text(doc, encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify real Wiki route without external services
        run: |
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm --filter @eliotr/core exec vitest run test/wiki-publication-store.test.ts test/wiki-service.test.ts --reporter=verbose
          pnpm typecheck
          pnpm lint
          pnpm budgets:check
          pnpm work-packets:check
          git diff --check
      - name: Commit verified route directly to main
        run: |
          git rm .github/workflows/wiki-route-slice-once.yml
          git config user.name "Eliot Research Product Builder"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire durable Wiki proposal service"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
