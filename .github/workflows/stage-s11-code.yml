name: stage-s11-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-s11-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Stage checksum-bound production blobs without updating any ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          const digest = (kind, bytes) => createHash(kind).update(bytes).digest('hex');
          const blobHash = (bytes) => digest('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, { method,
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`Git API ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          const transporter = '.github/workflows/stage-s11-code.yml';
          assert(text('branch','--show-current') === 'main', 'Not on main');
          assert(text('rev-parse','HEAD') === process.env.GITHUB_SHA, 'Main advanced before checkout');
          assert(text('rev-parse','HEAD^') === '6f9040525440387fda560e097157493121fa619c', 'Unexpected parent');
          const parentTree = text('rev-parse','HEAD^{tree}');
          git('rm','--',transporter);
          assert(text('write-tree') === '834a5360b3987939f1e0e751a543a5bcbd6c7fbd', 'Unexpected base tree');
          const chunks = ['ac2ccf786e7993063d49678c3acd6b93f056ccb1','2e6e3628eb8626182215e2f336b852c3b679147e','6c2ef1ddbee28ad5c778863352485d9ae2376800','a258153b7b8d40134ba1b297ab26ec4f7a1cd2ba','10f097b5d7729b42a6dae68cdf714296cfb61ebc','63011c0e3ebde2388d6d216330928a78978f133c'];
          const parts = [];
          for (const sha of chunks) {
            const blob = await api(`git/blobs/${sha}`);
            assert(blob.encoding === 'base64', 'Unexpected wire encoding');
            const bytes = Buffer.from(blob.content,'base64');
            assert(blobHash(bytes) === sha, 'Wire blob identity mismatch');
            parts.push(bytes.toString('utf8'));
          }
          const patch = gunzipSync(Buffer.from(parts.join(''),'base64'));
          assert(digest('sha256',patch) === '3a79eb57dea727fb81f03569f16c227525614dbf5cf34b9086c6fa526436a5c0', 'Patch hash mismatch');
          const patchPath = join(process.env.RUNNER_TEMP,'s11-code.patch');
          writeFileSync(patchPath,patch);
          git('apply','--unidiff-zero','--check',patchPath);
          git('apply','--unidiff-zero','--index',patchPath);
          git('diff','--cached','--check');
          git('diff','--exit-code');
          const tree = text('write-tree');
          assert(tree === 'ba47b2993f0506f75667d8eb6c040dc01e36d22b', 'Reviewed source tree mismatch');
          const paths = git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean);
          assert(paths.length === 16, 'Changed path count mismatch');
          assert(paths.every(path => path === transporter || (!path.startsWith('.github/') && !path.toLowerCase().includes('test'))), 'Unexpected infrastructure/test changes');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files','--stage','--',path);
            if (!index) {
              assert(path === transporter, 'Unexpected deletion');
              entries.push({path,mode:'100644',type:'blob',sha:null});
              continue;
            }
            const [mode,sha] = index.split(/\s+/);
            const bytes = git('cat-file','blob',sha);
            const stored = await api('git/blobs','POST',{content:bytes.toString('base64'),encoding:'base64'});
            assert(stored.sha === sha, 'Published blob mismatch');
            entries.push({path,mode,type:'blob',sha});
          }
          const out = join(process.env.RUNNER_TEMP,'s11-code-manifest');
          mkdirSync(out,{recursive:true});
          writeFileSync(join(out,'manifest.json'),JSON.stringify({base_sha:process.env.GITHUB_SHA,base_tree_sha:parentTree,tree_sha:tree,ref_updated:false,entries},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s11-code-manifest
          path: ${{ runner.temp }}/s11-code-manifest/
          retention-days: 3
          if-no-files-found: error
