name: er00-apply-hardening

on:
  pull_request:
    paths:
      - ".github/workflows/er00-apply-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ER-00-rust-m1-foundation-20260901'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify and materialize the hardened tree
        run: |
          cat .github/er00-hardening-payload/part-*.b64 > /tmp/eliot-m1-hardening.b64
          base64 --decode /tmp/eliot-m1-hardening.b64 > /tmp/eliot-m1-hardening.tar.gz
          echo "2270dccbbe041320ec4e437fb29966ed9163a232393f2a105641057f19d1139b  /tmp/eliot-m1-hardening.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/eliot-m1-hardening.tar.gz -C .
          python <<'PY'
          from pathlib import Path

          parser = Path('crates/eliotr-test-vectors/src/parser.rs')
          source = parser.read_text()
          old = 'for pair in value.as_bytes().chunks_exact(2) {'
          new = 'for pair in value.as_bytes().as_chunks::<2>().0 {'
          if source.count(old) != 1:
              raise SystemExit('unexpected strict parser source')
          parser.write_text(source.replace(old, new, 1))
          PY
          rm -rf .github/er00-hardening-payload
      - name: Format and lock the exact tree
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          node --check scripts/check-rust-vectors.mjs
          node --check scripts/check-rust-wasm.mjs
          node scripts/check-rust-vectors.mjs
          node scripts/check-rust-boundaries.mjs
          cargo fmt --all
          cargo generate-lockfile --manifest-path fuzz/Cargo.toml
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          git diff --check
      - name: Commit code and lockfiles without protected workflows
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git restore --source=HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/rust-deep-verification.yml \
            .github/workflows/er00-apply-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(rust): harden bounded M1 conformance"
          git push origin "HEAD:${HEAD_REF}"
