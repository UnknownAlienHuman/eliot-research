name: er26-provisioner-ownership-complete

on:
  push:
    branches:
      - agent/ER-26-ai-search-generation-operator-20260904

permissions:
  contents: write

concurrency:
  group: er26-provisioner-ownership-complete
  cancel-in-progress: false

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[er26-ownership-complete]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-generation-operator-20260904
          fetch-depth: 0

      - name: Synchronize all ER-26 provisioner files
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          packet_id = "ER-26"
          packet_path = Path("docs/agent-work/ER-26-cloudflare-provisioning-and-deployment.md")
          manifest_path = Path("docs/agent-work/manifest.json")
          candidates = [
              "scripts/lib/cloudflare-d1-http.mjs",
              "scripts/manage-ai-search-generation.mjs",
              "scripts/run-provisioner-tests.mjs",
              "scripts/test-ai-search-generation-operator.mjs",
              "scripts/test-ai-search-provisioning-readback.mjs",
              "scripts/test-ai-search-provisioning-reconciliation.mjs",
          ]
          candidates = [path for path in candidates if Path(path).exists()]

          packet_text = packet_path.read_text(encoding="utf-8")
          lines = packet_text.splitlines()
          headings = [i for i, line in enumerate(lines) if line == "## Owned paths"]
          if len(headings) != 1:
              raise SystemExit("ER-26 must contain exactly one Owned paths heading")
          start = headings[0] + 1
          end = next(
              (i for i in range(start, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          paths = [
              line[3:-1]
              for line in lines[start:end]
              if line.startswith("- `") and line.endswith("`")
          ]
          anchor = "scripts/provision-ai-search.mjs"
          insertion = paths.index(anchor) + 1 if anchor in paths else len(paths)
          for candidate in candidates:
              if candidate not in paths:
                  paths.insert(insertion, candidate)
                  insertion += 1
          lines[start:end] = [""] + [f"- `{path}`" for path in paths] + [""]
          packet_path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packet = next(
              (entry for entry in manifest.get("packets", []) if entry.get("id") == packet_id),
              None,
          )
          if packet is None:
              raise SystemExit("ER-26 is absent from manifest")
          for other in manifest.get("packets", []):
              if other.get("id") == packet_id:
                  continue
              overlap = sorted(set(paths) & set(other.get("owned_paths", [])))
              if overlap:
                  raise SystemExit(
                      f"ER-26 exact ownership overlaps {other.get('id')}: {overlap}"
                  )
          packet["owned_paths"] = paths
          manifest["baseline_commit"] = subprocess.check_output(
              ["git", "rev-parse", "origin/main"], text=True
          ).strip()
          manifest["generated_at"] = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git rm -- .github/workflows/er26-provisioner-ownership-complete.yml
          node scripts/check-work-packets.mjs
          git diff --check

      - name: Commit complete ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-26: complete provisioner ownership [er26-ownership-complete]"
          git push origin HEAD:agent/ER-26-ai-search-generation-operator-20260904
