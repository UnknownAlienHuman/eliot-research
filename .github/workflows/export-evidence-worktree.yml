name: materialize-evidence-overlay

on:
  push:
    branches:
      - agent/p0-evidence-resolution-20260831
    paths:
      - .eliotr-evidence-overlay.ready

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-evidence-resolution-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Verify and extract exact EvidenceHandle overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f .eliotr-evidence-overlay.ready
          test "$(find . -maxdepth 1 -name '.eliotr-evidence-overlay.part*.b64' -type f | wc -l)" -eq 7
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('.eliotr-evidence-overlay.part04.b64')
          expected = 'f149aaa6f06448577ca8cb4404715ca9e574b768e029cced4bfc41adc6227c6f'
          data = path.read_text(encoding='ascii')
          if sha256(data.encode('ascii')).hexdigest() != expected:
              if len(data) != 15999:
                  raise SystemExit(f'unexpected damaged part04 length: {len(data)}')
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              for index in range(len(data) + 1):
                  for character in alphabet:
                      candidate = data[:index] + character + data[index:]
                      if sha256(candidate.encode('ascii')).hexdigest() == expected:
                          path.write_text(candidate, encoding='ascii')
                          print(f'repaired part04 at offset {index}')
                          raise SystemExit(0)
              raise SystemExit('unable to reconstruct the single missing base64 character in part04')
          print('part04 already exact')
          PY
          cat > /tmp/evidence-overlay-parts.sha256 <<'EOF'
          d32c57b9324ec919ebf78913c90dc65d8448e9f8adb9d2e916b196ab35b7206f  .eliotr-evidence-overlay.part00.b64
          7beaf304fad5b9a3feca5d8c0ffd8f33ddc41fa7c78b8fd4e4f81d54b9674474  .eliotr-evidence-overlay.part01.b64
          c10c84e561212846798b6efee1adcbc441b50a321f697a13c4f7469cf4ade035  .eliotr-evidence-overlay.part02.b64
          a823c20540147b2bde94810ee721ea3d5085947b8a8e2c5617736a8f0d998f3f  .eliotr-evidence-overlay.part03.b64
          f149aaa6f06448577ca8cb4404715ca9e574b768e029cced4bfc41adc6227c6f  .eliotr-evidence-overlay.part04.b64
          74b68dd0ce05946eca15e1f7460a55df5e8bddb23ca4d0a72d446edbb1279815  .eliotr-evidence-overlay.part05.b64
          e462ce55f013491efd908b7e08c14cf1019282b180fcbf4c0236d5e683e83589  .eliotr-evidence-overlay.part06.b64
          EOF
          sha256sum --check --strict /tmp/evidence-overlay-parts.sha256
          cat .eliotr-evidence-overlay.part*.b64 | base64 --decode > /tmp/eliot-evidence-overlay.tgz
          echo 'ad6d9d6d24ba39af9aabee20aceff83ac23c282e3fc3577d84b77ef4a61ecb19  /tmp/eliot-evidence-overlay.tgz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/eliot-evidence-overlay.tgz
          rm -f .eliotr-evidence-overlay.part*.b64 .eliotr-evidence-overlay.ready
      - name: Apply verified source and fixture repairs
        shell: bash
        run: |
          set -euo pipefail
          python .github/evidence-repair.py
          rm -f .github/evidence-repair.py
      - name: Canonicalize and verify frozen workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Run complete deterministic repository gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          pnpm build:pwa
          pnpm cf:types
          pnpm cf:dry-run
          git diff --check
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(er39): enforce exact evidence and citation resolution'
          git push origin HEAD:agent/p0-evidence-resolution-20260831
