name: fast-ci

on:
  push:
    branches: [main, impl/stage-0-shell]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Replacement shell compile and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build Worker and React shell
        run: pnpm build
      - name: Wrangler packaging smoke
        run: pnpm exec wrangler deploy --dry-run --minify --outdir dist/worker
      - name: Upload checked build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replacement-shell-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
