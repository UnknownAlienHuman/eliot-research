name: fast-ci

on:
  push:
    branches: [main, impl/stage-0-shell]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Material shell, Access and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ELIOT_REMOTE_BINDINGS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated bindings
        run: pnpm cf:types --check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused Access and contrast tests
        run: pnpm test
      - name: Build Worker and React shell
        run: pnpm build
      - name: Wrangler packaging smoke
        run: pnpm exec wrangler deploy --dry-run --outdir dist/worker
      - name: Exercise signed MCP reads and proposal acceptance locally
        run: pnpm eval k4 --signed-agent-miniflare
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the actual local Worker and Material frame
        run: |
          cp .dev.vars.example .dev.vars
          pnpm db:local
          pnpm dev > /tmp/eliot-k0.log 2>&1 &
          trap 'kill $!' EXIT
          pnpm eval k0
          pnpm eval k1 --native-only
          pnpm eval k2 --native-only
          pnpm eval k2 --picker-only
          pnpm eval k2 --models-only
          pnpm eval k3 --native-only
      - name: Upload checked build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replacement-shell-${{ github.sha }}
          path: |
            dist
            eval/out/k0
            !dist/**/.dev.vars*
            !dist/**/.env*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
