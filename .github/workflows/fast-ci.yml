name: fast-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Typecheck, lint, unit and build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Worker and browser dependency boundaries
        run: node scripts/check-boundaries.mjs
      - name: Lint
        run: pnpm lint
      - name: Source sections, exact evidence and owner Research regressions
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          packages/retrieval/src/structural-projector.test.ts
          packages/retrieval/src/evidence-resolver.test.ts
          packages/retrieval/src/query-persistence.test.ts
          apps/eliotr-web/src/query/research.test.ts
          packages/owner-api-client/src/research/runs/authority.test.ts
          packages/owner-api-client/src/evidence/citations/audit.test.ts
          packages/owner-api-client/src/evidence/citations/reauthorization.test.ts
          apps/eliotr-web/src/query/reports.test.ts
          --reporter=verbose
      - name: Build served assets and owner web
        run: |
          pnpm build:pwa
          pnpm --dir apps/eliotr-web exec vite build --manifest
      - name: Worker packaging smoke without remote changes
        run: pnpm --dir apps/eliotr-core exec wrangler deploy --dry-run --minify --outdir dist
      - name: Save the checked Worker bundle for routine Wrangler deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-build-${{ github.sha }}
          path: apps/eliotr-core/dist
          if-no-files-found: error
          retention-days: 7
      - name: Save the checked owner web assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-web-build-${{ github.sha }}
          path: apps/eliotr-web/dist
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
