name: verify-s03-bridge-checkpoint
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-s03.yml]
permissions:
  contents: write
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Restore only reviewed bridge paths and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 008bb3e40cc97856c2689e7115e21fc87ab1b156
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          chunks = []
          for sha in ['54c3c644a77f45d4fc83024fd4eb4ba15c8f448f', 'd5ffc88022a6ea8bea96c2ec6812398fbffc7bb5']:
              url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  value = json.load(response)
              data = base64.b64decode(value['content'])
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha
              chunks.append(data)
          compressed = b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest() == '79d968074c121f99aaca4142ff62dc7be0d033dbb1f54cecf8cc959e3b9c43e8'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '863d91392178359e18196ccacaeb36e4fc20b70d05013098b6815b194acc705a'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'bridge.patch').write_bytes(patch)
          PY
          git apply --check --include='docs/agent-work/ER-44-local-owner-session.md' --include='scripts/lib/local-owner-bridge.mjs' --include='scripts/test-local-owner.mjs' "$RUNNER_TEMP/bridge.patch"
          git apply --index --include='docs/agent-work/ER-44-local-owner-session.md' --include='scripts/lib/local-owner-bridge.mjs' --include='scripts/test-local-owner.mjs' "$RUNNER_TEMP/bridge.patch"
          git rm .github/workflows/prepare-s03.yml
          test "$(git write-tree)" = f4a0853415980eb6777fc27c5907dcf87e83d076
      - name: Install frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify the narrow transport checkpoint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-result"
          node --version > "$RUNNER_TEMP/bridge-result/versions.txt"
          pnpm --version >> "$RUNNER_TEMP/bridge-result/versions.txt"
          pnpm test:local-owner | tee "$RUNNER_TEMP/bridge-result/owner-tests.log"
          node node_modules/eslint/bin/eslint.js scripts/lib/local-owner-bridge.mjs scripts/test-local-owner.mjs
          node node_modules/typescript/bin/tsc -b --pretty false
          node node_modules/typescript/bin/tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          git diff --cached --check
          git diff --exit-code
          printf '%s\n' 'BRIDGE_ONLY: S03 browser acceptance remains incomplete. Run 35498980510 failed the unchanged strict console ledger; its browser edits are excluded from this tree. Full product CI is not claimed green.' > "$RUNNER_TEMP/bridge-result/scope.txt"
      - name: Store verified Git blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const tree = text('write-tree');
          if (tree !== 'f4a0853415980eb6777fc27c5907dcf87e83d076') throw new Error('Unexpected checkpoint tree');
          git('diff', '--exit-code');
          const allowed = new Set(['docs/agent-work/ER-44-local-owner-session.md', 'scripts/lib/local-owner-bridge.mjs', 'scripts/test-local-owner.mjs', '.github/workflows/prepare-s03.yml']);
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          if (paths.length !== allowed.size || paths.some(path => !allowed.has(path))) throw new Error('Unexpected checkpoint path');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files', '--stage', '--', path);
            if (!index) { entries.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
            const [mode, sha] = index.split(/\s+/);
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, { method: 'POST', headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' }, body: JSON.stringify({ content: git('cat-file', 'blob', sha).toString('base64'), encoding: 'base64' }) });
            if (!response.ok) throw new Error(`Blob creation failed: ${response.status}`);
            if ((await response.json()).sha !== sha) throw new Error('Blob identity mismatch');
            entries.push({ path, mode, type: 'blob', sha });
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'bridge-result', 'verified-tree.json'), JSON.stringify({ base_sha: process.env.GITHUB_SHA, base_tree_sha: text('rev-parse', 'HEAD^{tree}'), tree_sha: tree, scope: 'S03_BRIDGE_ONLY', browser_acceptance: 'INCOMPLETE', ref_updated: false, entries }, null, 2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s03-bridge-only-${{ matrix.os }}
          path: ${{ runner.temp }}/bridge-result/
          if-no-files-found: error
          retention-days: 3
