name: Harden external-agent v8 settlement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-external-agent-v8.yml
      - .github/scripts/harden-external-agent-v8.py

permissions:
  contents: write

concurrency:
  group: harden-external-agent-v8
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply reviewed hardening
        run: python .github/scripts/harden-external-agent-v8.py
      - name: Static and scoped compile checks
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          migration = Path("infra/d1/core/migrations/0086_external_agent_task_payload.sql").read_text()
          consumer_path = Path("packages/cloudflare-research/src/research-external-branch-analysis.ts")
          consumer = consumer_path.read_text()
          assert "+5 minutes" not in migration
          assert "julianday(t.created_at)<=julianday(p.expires_at)" in migration
          assert "unknowns: z.array" not in consumer
          assert "limitations: z.array" not in consumer
          assert "failed_probe_refs: z.array" not in consumer
          assert "uniqueSorted(role.unknowns)" not in consumer
          assert "uniqueSorted(role.limitations)" not in consumer
          assert "uniqueSorted(role.failed_probe_refs)" not in consumer
          assert "eliotr.research.external-agent-blocked.v1" in consumer
          assert len(consumer.splitlines()) < 600
          print("EXTERNAL_AGENT_V8_HARDENING_STATIC_OK")
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/cloudflare-research --filter @eliotr/core typecheck
          pnpm d1:depth
      - name: Commit hardening
        run: |
          git rm .github/workflows/harden-external-agent-v8.yml .github/scripts/harden-external-agent-v8.py
          git diff --check
          git add \
            infra/d1/core/migrations/0086_external_agent_task_payload.sql \
            packages/cloudflare-research/src/research-external-branch-analysis.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'fix: harden computer-agent callback settlement' \
            -m 'Allow an exactly staged payload to recover task publication until its immutable deadline, not only for five minutes. Keep arbitrary agent prose and failed-probe identifiers quarantined; canonical branch status text and blocked-probe references are now derived server-side from the validated callback identity and admitted handle selections. Refs #301.'
          git push origin HEAD:main
