name: federation-runtime-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/federation-runtime-once.yml
      - scripts/one-shot/federation/payload.tar.gz.b64
      - scripts/one-shot/federation/payload-prefix.b64

permissions:
  contents: write

concurrency:
  group: federation-runtime-once
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Materialize authenticated federation runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile

          directory = Path("scripts/one-shot/federation")
          prefix = (directory / "payload-prefix.b64").read_text(encoding="ascii")
          suffix = (directory / "payload.tar.gz.b64").read_text(encoding="ascii")
          encoded = prefix + suffix
          payload = base64.b64decode(encoded, validate=True)
          expected = "ab74dfbca462ed4327386bce3752f2ebe19d1fc8d9b242688720a90f733cfa0c"
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit("federation payload digest mismatch")
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              for member in archive.getmembers():
                  target = (directory / member.name).resolve()
                  if directory.resolve() not in target.parents:
                      raise SystemExit("federation payload path traversal denied")
              archive.extractall(directory, filter="data")
          PY
          python3 scripts/one-shot/federation/implement.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"{label} anchor missing")
              file.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "apps/eliotr-core/test/federation-runtime-http.test.ts",
              "const encoder = new TextEncoder();\n",
              "const encoder = new TextEncoder();\nconst REQUEST_DEADLINE = new Date(Date.now() + 86_400_000).toISOString();\n",
              "federation replay deadline declaration",
          )
          replace_once(
              "apps/eliotr-core/test/federation-runtime-http.test.ts",
              "    deadline: new Date(Date.now() + 86_400_000).toISOString(),",
              "    deadline: REQUEST_DEADLINE,",
              "federation replay deadline use",
          )
          replace_once(
              "packages/cloudflare-federation/src/federation-bundle-authority.ts",
              "  return Object.freeze({\n    readAuthorizedManifest",
              "  return Object.freeze<FederationBundleAuthorityLike>({\n    readAuthorizedManifest",
              "federation bundle authority contextual typing",
          )
          replace_once(
              "apps/eliotr-core/src/composition-root.ts",
              "function unavailable(operation: string): Promise<never> {\n  return Promise.reject(new CapabilityUnavailableError(operation));\n}\n",
              "",
              "unused federation unavailable helper",
          )
          replace_once(
              "apps/eliotr-core/test/federation-runtime-http.test.ts",
              "  principal,\n",
              "",
              "unused federation test principal import",
          )
          replace_once(
              "packages/cloudflare-federation/src/federation-change-authority.ts",
              "function sameRef(left: VersionedRef, right: VersionedRef): boolean {\n  return left.id === right.id && left.revision === right.revision;\n}\n\n",
              "",
              "unused federation ref comparator",
          )
          replace_once(
              "packages/cloudflare-federation/src/federation-change-authority.ts",
              "  let valid = false;\n  try {\n    valid = await crypto.subtle.verify(\n      \"HMAC\",\n      key,\n      Uint8Array.from(signature).buffer,\n      Uint8Array.from(body).buffer,\n    );\n  } catch {\n    valid = false;\n  }",
              "  const valid = await crypto.subtle.verify(\n    \"HMAC\",\n    key,\n    Uint8Array.from(signature).buffer,\n    Uint8Array.from(body).buffer,\n  ).catch(() => false);",
              "federation cursor signature settlement",
          )
          replace_once(
              "docs/agent-work/ER-24-worker-composition-do-queue-and-schedules.md",
              "- `apps/eliotr-core/src/http-errors.ts`\n",
              "- `apps/eliotr-core/src/http-errors.ts`\n- `apps/eliotr-core/src/federation-http.ts`\n- `apps/eliotr-core/test/federation-runtime-http.test.ts`\n",
              "ER-24 federation ownership documentation",
          )
          PY
          git rm .github/workflows/federation-runtime-once.yml \
            scripts/one-shot/federation/payload.tar.gz.b64 \
            scripts/one-shot/federation/payload-prefix.b64
          rm -rf scripts/one-shot/federation
          git diff --check
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify structural and documentation gates
        run: |
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Verify federation product locally
        run: |
          pnpm typecheck
          pnpm --filter @eliotr/cloudflare-federation test
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
      - name: Commit verified product code to main
        run: |
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: compose authenticated federation runtime"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
