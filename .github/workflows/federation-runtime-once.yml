name: federation-runtime-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/federation-runtime-once.yml
      - scripts/one-shot/federation/payload.tar.gz.b64
      - scripts/one-shot/federation/payload-prefix.b64

permissions:
  contents: write

concurrency:
  group: federation-runtime-once
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Inspect authenticated federation runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile

          directory = Path("scripts/one-shot/federation")
          prefix = (directory / "payload-prefix.b64").read_text(encoding="ascii")
          suffix = (directory / "payload.tar.gz.b64").read_text(encoding="ascii")
          payload = base64.b64decode(prefix + suffix, validate=True)
          expected = "ab74dfbca462ed4327386bce3752f2ebe19d1fc8d9b242688720a90f733cfa0c"
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit("federation payload digest mismatch")
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              archive.extractall(directory, filter="data")
          PY
          python3 scripts/one-shot/federation/implement.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/eliotr-core/test/federation-runtime-http.test.ts")
          source = path.read_text(encoding="utf-8")
          anchor = "const encoder = new TextEncoder();\n"
          deadline = 'const REQUEST_DEADLINE = new Date(Date.now() + 86_400_000).toISOString();\n'
          old = "    deadline: new Date(Date.now() + 86_400_000).toISOString(),"
          new = "    deadline: REQUEST_DEADLINE,"
          if anchor not in source or old not in source:
              raise SystemExit("federation replay fixture anchors missing")
          path.write_text(source.replace(anchor, anchor + deadline, 1).replace(old, new, 1), encoding="utf-8", newline="\n")

          path = Path("packages/cloudflare-federation/src/federation-bundle-authority.ts")
          source = path.read_text(encoding="utf-8")
          old = "  return Object.freeze({\n    readAuthorizedManifest"
          new = "  return Object.freeze<FederationBundleAuthorityLike>({\n    readAuthorizedManifest"
          if old not in source:
              raise SystemExit("federation bundle authority contextual typing anchor missing")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          echo '--- composition-root.ts 50-80 ---'
          nl -ba apps/eliotr-core/src/composition-root.ts | sed -n '50,80p'
          echo '--- federation-runtime-http.test.ts 1-35 ---'
          nl -ba apps/eliotr-core/test/federation-runtime-http.test.ts | sed -n '1,35p'
          echo '--- federation-change-authority.ts 115-140 ---'
          nl -ba packages/cloudflare-federation/src/federation-change-authority.ts | sed -n '115,140p'
          echo '--- federation-change-authority.ts 280-315 ---'
          nl -ba packages/cloudflare-federation/src/federation-change-authority.ts | sed -n '280,315p'
          exit 1
