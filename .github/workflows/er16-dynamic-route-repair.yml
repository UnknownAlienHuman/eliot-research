name: er16-dynamic-route-repair

on:
  push:
    branches:
      - agent/ER-16-dynamic-route-provisioning-repair-20260903
    paths:
      - .github/workflows/er16-dynamic-route-repair.yml

permissions:
  contents: write

concurrency:
  group: er16-dynamic-route-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-dynamic-route-provisioning-repair-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          check-latest: false

      - name: Materialize the intended Dynamic Route implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-er16-dynamic-route-contract.py
          python3 scripts/tmp-er16-dynamic-route-provisioner.py
          python3 scripts/tmp-er16-dynamic-route-tests.py

          python3 <<'PY'
          from pathlib import Path

          promotion = Path("packages/cloudflare-ai/src/dynamic-route-promotion-codec.ts")
          text = promotion.read_text(encoding="utf-8")
          old = (
              "  type DynamicRoutePromotionWriteReceipt,\n"
              "  type DynamicRouteProvisioningReceipt,\n"
          )
          new = (
              "  type DynamicRoutePromotionWriteReceipt,\n"
              "  type DynamicRouteProvisioningErrorCode,\n"
              "  type DynamicRouteProvisioningReceipt,\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected promotion-codec import surface")
          promotion.write_text(text.replace(old, new, 1), encoding="utf-8")

          provisioner = Path("packages/cloudflare-ai/src/dynamic-route-provisioning.ts")
          text = provisioner.read_text(encoding="utf-8")
          old = (
              "  return Object.freeze({\n"
              "    provision(input) {\n"
              "      return provisionDynamicRouteGeneration(controlPlane, input);\n"
              "    },\n"
              "    promote(receipt, qualification, options) {\n"
          )
          new = (
              "  return Object.freeze({\n"
              "    provision(input: DynamicRouteProvisioningInput) {\n"
              "      return provisionDynamicRouteGeneration(controlPlane, input);\n"
              "    },\n"
              "    promote(\n"
              "      receipt: DynamicRouteProvisioningReceipt,\n"
              "      qualification: DynamicRouteQualificationEvidence,\n"
              "      options: DynamicRoutePromotionOptions,\n"
              "    ) {\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected provisioner factory surface")
          provisioner.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm scripts/tmp-er16-dynamic-route-contract.py
          rm scripts/tmp-er16-dynamic-route-provisioner.py
          rm scripts/tmp-er16-dynamic-route-tests.py
          rm .github/workflows/er16-dynamic-route-provisioning-finalize.yml
          rm .github/workflows/er16-dynamic-route-repair.yml
          node -e 'JSON.parse(require("node:fs").readFileSync("infra/ai-search/dynamic-route-provisioning-capability.json", "utf8"))'
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify contracts, ownership and package boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm contracts:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm work-packets:check

      - name: Lint, typecheck and execute the Dynamic Route corpus
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/cloudflare-ai packages/platform-cloudflare --reporter=verbose

      - name: Verify Worker composition remains buildable
        shell: bash
        run: |
          set -euo pipefail
          pnpm cf:dry-run
          git diff --check

      - name: Commit the actual implementation and remove staging debris
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: materialize verified Dynamic Route provisioning"
          git push origin HEAD:agent/ER-16-dynamic-route-provisioning-repair-20260903
