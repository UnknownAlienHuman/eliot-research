name: stage-s10-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-s10-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Stage the exact reviewed production blobs without updating a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const blobHash = (bytes) => hash('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, {
              method, signal: AbortSignal.timeout(30000),
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            });
            if (!response.ok) throw new Error(`Git ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          const head = process.env.GITHUB_SHA;
          const transporter = '.github/workflows/apply-s10-code.yml';
          const expectedTree = 'e987a2e59ad89c2366dbf2a29956fafa6748f461';
          assert(text('branch', '--show-current') === 'main', 'Not on main');
          assert(text('rev-parse', 'HEAD') === head, 'Main moved before checkout');
          const parentTree = text('rev-parse', 'HEAD^{tree}');
          git('rm', '--', transporter);
          assert(text('write-tree') === 'a721f491897d124159527391e62db61cdcf751c3', 'Unexpected base contents');
          const chunks = [
            'c34dd8e7341aeb8f9bd9a3e5ec6c7d915bdb8320',
            'b9c79a027e566d0bdbe27676f71a431895161e32',
            'dd6ff13db1584ff148d8c5e7c13174b849e680cf',
            'ac2cd4df80023893357bfbf3192d393cfd312637',
            '4b6844c6b82e0b9166573b1d60bf6911bcb79a8f',
          ];
          const parts = [];
          for (let i = 0; i < chunks.length; i++) {
            const sha = chunks[i];
            const result = await api(`git/blobs/${sha}`);
            assert(result.encoding === 'base64', 'Unexpected encoding');
            let bytes = Buffer.from(result.content, 'base64');
            assert(blobHash(bytes) === sha, 'Transfer chunk mismatch');
            if (i === 1) {
              // Repair two identified wire-copy typos, then enforce the original full identities.
              let wire = bytes.toString('utf8');
              for (const [from, to] of [['ax3TFd34lo0DP', 'ax3TFd34to0DP'], ['C2M7+6ib66ib6Qm2', 'C2M7+6ib66ib66ib6Qm2']]) {
                assert(wire.split(from).length === 2, 'Unexpected repair target');
                wire = wire.replace(from, to);
              }
              bytes = Buffer.from(wire, 'utf8');
              assert(blobHash(bytes) === 'cab699ac6bd47d122b93faf5be211df646105d73', 'Intended chunk mismatch');
            }
            assert(bytes.length === (i === 4 ? 4924 : 5500), 'Unexpected chunk length');
            parts.push(bytes);
          }
          const wire = Buffer.concat(parts);
          assert(blobHash(wire) === 'fc1eca5ff84a05dcbcc419d1d8466299c15d4b76', 'Complete wire mismatch');
          const patch = gunzipSync(Buffer.from(wire.toString('utf8'), 'base64'));
          assert(patch.length === 87797, 'Unexpected patch size');
          assert(hash('sha256', patch) === 'ef0dba328621d9c7b39d21f8a9a30eb41e72d323198e8692bb9eb50110d1c948', 'Patch checksum mismatch');
          const out = join(process.env.RUNNER_TEMP, 's10-code');
          mkdirSync(out, { recursive: true });
          const patchPath = join(out, 'code.patch');
          writeFileSync(patchPath, patch);
          git('apply', '--unidiff-zero', '--check', patchPath);
          git('apply', '--unidiff-zero', '--index', patchPath);
          git('diff', '--cached', '--check');
          git('diff', '--exit-code');
          assert(text('write-tree') === expectedTree, 'Reviewed production tree mismatch');
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          assert(paths.length === 30, 'Unexpected path count');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files', '--stage', '--', path);
            if (!index) {
              assert(path === transporter, 'Unexpected deletion');
              entries.push({ path, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const [mode, sha] = index.split(/\s+/);
            const data = git('cat-file', 'blob', sha);
            const created = await api('git/blobs', 'POST', { content: data.toString('base64'), encoding: 'base64' });
            assert(created.sha === sha, `Blob identity mismatch: ${path}`);
            entries.push({ path, mode, type: 'blob', sha });
          }
          writeFileSync(join(out, 'verified-tree.json'), JSON.stringify({ base_sha: head, base_tree_sha: parentTree,
            tree_sha: expectedTree, ref_updated: false, behavioral_tests_executed: false, entries }, null, 2));
          console.log(`STAGED_TREE=${expectedTree}; NO_REF_UPDATED; NO_TEST_RUN`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s10-code-manifest
          path: ${{ runner.temp }}/s10-code/verified-tree.json
          retention-days: 3
          if-no-files-found: error
