name: verify-s04-d1-mutations
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-s04.yml]
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Restore exact reviewed mutation-test tree without publishing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 256ddd70b05ed9d2fb9b481280d79618f8370156
          mkdir -p "$RUNNER_TEMP/s04-result"
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          sha = '4bd7366a25fe6ef099c986aa83df2ceacd648663'
          request = urllib.request.Request(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}", headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          data = base64.b64decode(result['content'])
          assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == sha
          patch = gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == 'f13a825fb4e475e3e6924082f985d24deec0d756fb891fc96bdfb84226c60f0d'
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 's04.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','rm','.github/workflows/verify-s04.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == '4b7e70652fcf7f4250f90fe0ef76968b38d6c745'
          PY
      - name: Install frozen toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
          node --version > "$RUNNER_TEMP/s04-result/versions.txt"
          pnpm --version >> "$RUNNER_TEMP/s04-result/versions.txt"
      - name: Strict types lint boundaries ownership and contracts
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -b --pretty false
          node node_modules/typescript/bin/tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          node node_modules/eslint/bin/eslint.js apps/eliotr-core/test/project-owner-service.test.ts apps/eliotr-core/test/wiki-owner-edit-parity.test.ts
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          git diff --cached --check
          git diff --exit-code
      - name: Actual Project and Wiki mutation D1 R2 regressions
        run: |
          set -euo pipefail
          pnpm --dir apps/eliotr-core exec vitest run test/project-owner-service.test.ts test/wiki-owner-edit-parity.test.ts | tee "$RUNNER_TEMP/s04-result/d1-tests.log"
      - name: Store verified Git blobs without publishing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const tree = text('write-tree');
          if (tree !== '4b7e70652fcf7f4250f90fe0ef76968b38d6c745') throw new Error('Tree identity changed');
          git('diff','--exit-code');
          const entries = [];
          for (const path of git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean)) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode,sha] = index.split(/\s+/);
            const data = git('cat-file','blob',sha);
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({content:data.toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Git blob creation failed: ${response.status}`);
            if ((await response.json()).sha !== sha) throw new Error('Blob identity changed');
            entries.push({path,mode,type:'blob',sha});
          }
          writeFileSync(join(process.env.RUNNER_TEMP,'s04-result','verified-tree.json'),JSON.stringify({base_sha:process.env.GITHUB_SHA,base_tree_sha:text('rev-parse','HEAD^{tree}'),tree_sha:tree,ref_updated:false,entries},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s04-verified-${{ matrix.os }}
          path: ${{ runner.temp }}/s04-result/
          if-no-files-found: error
          retention-days: 3
