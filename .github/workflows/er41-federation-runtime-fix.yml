name: er41-federation-runtime-fix

on:
  push:
    branches:
      - agent/ER-41-cloudflare-federation-runtime-20260904

permissions:
  contents: write

concurrency:
  group: er41-federation-runtime-fix
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[er41-runtime-fixed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-41-cloudflare-federation-runtime-20260904
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate

      - name: Apply exact ER-41 corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          authority = Path("packages/cloudflare-federation/src/federation-d1-authority.ts")
          text = authority.read_text(encoding="utf-8")
          old = "  if (\n    manifest.client_fence_ref !== binding.client_fence_ref ||\n"
          new = (
              "  if (\n"
              "    !sameRef(\n"
              "      manifest.manifest_ref,\n"
              "      binding.allowed_reference_manifest_ref,\n"
              "    ) ||\n"
              "    manifest.client_fence_ref !== binding.client_fence_ref ||\n"
          )
          if text.count(old) != 1:
              raise SystemExit("manifest authorization anchor missing or ambiguous")
          authority.write_text(text.replace(old, new), encoding="utf-8")

          codec = Path("packages/cloudflare-federation/src/federation-d1-codec.ts")
          text = codec.read_text(encoding="utf-8")
          start_marker = "  let invalid = false;\n"
          end_marker = "  if (invalid) {\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("job-state validation anchors missing or ambiguous")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              "  const expectedReceipt =\n"
              "    status.transport_state === \"CANCELLED\" && cancellationReason !== null\n"
              "      ? await federationCancellationReceiptRef(jobId, cancellationReason)\n"
              "      : null;\n"
              "  const invalid = status.transport_state === \"CANCELLED\"\n"
              "    ? status.completion_disposition !== \"CANCELLED\" ||\n"
              "      observed !== \"CANCELLED\" ||\n"
              "      cancellationReason === null ||\n"
              "      cancelledAt === null ||\n"
              "      cancelledAt !== updatedAt ||\n"
              "      result !== null ||\n"
              "      status.cancellation_receipt_ref !== expectedReceipt ||\n"
              "      status.terminal_receipt_ref !== expectedReceipt\n"
              "    : cancellationReason !== null ||\n"
              "      cancelledAt !== null ||\n"
              "      status.cancellation_receipt_ref !== undefined ||\n"
              "      (active && status.terminal_receipt_ref !== undefined) ||\n"
              "      ((active || status.transport_state === \"FAILED\") &&\n"
              "        (status.completion_disposition !== null ||\n"
              "          observed !== null ||\n"
              "          result !== null)) ||\n"
              "      (status.transport_state === \"COMPLETED\" && observed === null);\n"
          )
          codec.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          git rm -- .github/workflows/er41-federation-runtime-fix.yml
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm --filter @eliotr/cloudflare-federation test
          node scripts/check-budgets.mjs
          node scripts/check-work-packets.mjs
          git diff --check

      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-41: fence manifest revision and simplify terminal validation [er41-runtime-fixed]"
          git push origin HEAD:agent/ER-41-cloudflare-federation-runtime-20260904
