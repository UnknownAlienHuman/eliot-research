name: federation-product-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/federation-product-once.yml

permissions:
  contents: write

concurrency:
  group: research-product-serialization
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Wait for authenticated research changes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            git fetch origin main '+refs/heads/*:refs/remotes/origin/*'
            if ! git cat-file -e origin/main:.github/workflows/research-changes-product-once.yml 2>/dev/null; then
              root="$(git show origin/main:apps/eliotr-core/src/composition-root.ts)"
              if grep -q 'research.changes' <<<"$root" \
                && ! grep -q 'changes:.*unavailable("research.changes")' <<<"$root"; then
                git reset --hard origin/main
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'research.changes did not settle within 25 minutes' >&2
          exit 1
      - name: Select and extract a current-main-compatible federation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          root = Path.cwd()

          def run(*args: str, check: bool = True) -> str:
              result = subprocess.run(args, text=True, encoding='utf-8', stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and result.returncode != 0:
                  raise SystemExit(f"command failed: {' '.join(args)}\n{result.stderr}")
              return result.stdout

          def show(ref: str, path: str) -> str | None:
              result = subprocess.run(['git', 'show', f'{ref}:{path}'], text=True, encoding='utf-8', stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              return result.stdout if result.returncode == 0 else None

          refs = [line.strip() for line in run('git', 'for-each-ref', '--format=%(refname)', 'refs/remotes/origin').splitlines()]
          candidates: list[tuple[int, int, str, str]] = []
          for ref in refs:
              if ref.endswith('/HEAD') or ref == 'refs/remotes/origin/main':
                  continue
              composition = show(ref, 'apps/eliotr-core/src/composition-root.ts')
              if composition is None:
                  continue
              if 'unavailable("federation.submit")' in composition:
                  continue
              if not re.search(r'create\w*Federation|federationApi\([^)]*env|federation:\s*create', composition, re.I):
                  continue
              names = run('git', 'ls-tree', '-r', '--name-only', ref, check=False).splitlines()
              owned = [name for name in names if re.search(r'(^|/)(?:cloudflare-)?federation(?:/|[-.])|apps/eliotr-core/(?:src|test)/[^/]*federation', name)]
              if not any(name.endswith('.test.ts') for name in owned):
                  continue
              ahead = int(run('git', 'rev-list', '--count', f'HEAD..{ref}').strip() or '0')
              behind = int(run('git', 'rev-list', '--count', f'{ref}..HEAD').strip() or '0')
              timestamp = int(run('git', 'show', '-s', '--format=%ct', ref).strip())
              score = len(owned) * 100 + min(ahead, 100) - min(behind, 500)
              candidates.append((score, timestamp, ref, '\n'.join(owned)))

          if not candidates:
              raise SystemExit('No tested wired federation checkpoint exists on retained refs; refusing to invent an adapter from names alone')
          score, timestamp, selected, owned_blob = max(candidates, key=lambda item: (item[0], item[1]))
          owned = owned_blob.splitlines()
          print(f'selected federation checkpoint {selected}, score={score}, files={len(owned)}')

          current_composition_path = root / 'apps/eliotr-core/src/composition-root.ts'
          current = current_composition_path.read_text(encoding='utf-8')
          candidate = show(selected, 'apps/eliotr-core/src/composition-root.ts')
          assert candidate is not None

          def function_block(source: str, name: str) -> str:
              match = re.search(rf'function\s+{re.escape(name)}\s*\(', source)
              if match is None:
                  raise SystemExit(f'{name}: function not found in candidate')
              start = match.start()
              brace = source.find('{', match.end())
              if brace < 0:
                  raise SystemExit(f'{name}: opening brace not found')
              depth = 0
              quote: str | None = None
              escaped = False
              index = brace
              while index < len(source):
                  char = source[index]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                  elif char in {'"', "'", '`'}:
                      quote = char
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return source[start:index + 1]
                  index += 1
              raise SystemExit(f'{name}: unterminated function')

          old_block = function_block(current, 'federationApi')
          new_block = function_block(candidate, 'federationApi')
          if 'unavailable("federation.submit")' in new_block:
              raise SystemExit('selected federation function is still a placeholder')

          import_pattern = re.compile(r'import[\s\S]*?from\s+["\']([^"\']+)["\'];')
          imports_to_add: list[str] = []
          for match in import_pattern.finditer(candidate):
              specifier = match.group(1)
              statement = match.group(0)
              if 'federation' not in specifier.lower() and 'federation' not in statement.lower():
                  continue
              if statement not in current:
                  imports_to_add.append(statement)
          current = current.replace(old_block, new_block, 1)
          if imports_to_add:
              current = '\n'.join(imports_to_add) + '\n' + current

          current_service = re.search(r'federation:\s*federationApi\([^\n]*\)', current)
          candidate_service = re.search(r'federation:\s*federationApi\([^\n]*\)', candidate)
          if current_service is None or candidate_service is None:
              raise SystemExit('federation composition call was not found')
          current = current[:current_service.start()] + candidate_service.group(0) + current[current_service.end():]

          # Copy only federation-owned implementation and tests. Shared composition is
          # merged above; unrelated stale branch files are never checked out wholesale.
          copy_prefixes = (
              'apps/eliotr-core/src/',
              'apps/eliotr-core/test/',
              'packages/cloudflare-federation/',
              'packages/federation-api/',
          )
          copied: list[str] = []
          for name in owned:
              if not name.startswith(copy_prefixes):
                  continue
              if name in {'apps/eliotr-core/src/composition-root.ts', 'apps/eliotr-core/src/http.ts'}:
                  continue
              content = show(selected, name)
              if content is None:
                  continue
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8', newline='\n')
              copied.append(name)

          # Truthful capability surface: federation is locally composed but remains
          # not live-qualified until an independent deployed peer is observed.
          current = current.replace('      "FEDERATION",\n', '', 1)
          partial = re.search(r'partial_slices:\s*\[([^\]]*)\]', current)
          if partial is not None:
              values = [value.strip().strip('"') for value in partial.group(1).split(',') if value.strip()]
              if 'FEDERATION' not in values:
                  values.append('FEDERATION')
              replacement = 'partial_slices: [' + ', '.join(f'"{value}"' for value in values) + ']'
              current = current[:partial.start()] + replacement + current[partial.end():]
          else:
              enabled = re.search(r'enabled_slices:\s*\[[^\]]*\],', current)
              if enabled is None:
                  raise SystemExit('capability slice registry not found')
              current = current[:enabled.end()] + '\n    partial_slices: ["FEDERATION"],' + current[enabled.end():]
          current_composition_path.write_text(current, encoding='utf-8', newline='\n')

          # Copy candidate ownership/status deltas only when they mention an extracted
          # federation file; do not overwrite current shared registries.
          Path('/tmp/federation-selected.txt').write_text(selected + '\n' + '\n'.join(copied) + '\n', encoding='utf-8')
          if not copied:
              raise SystemExit('candidate supplied no dedicated federation implementation files')
          PY
      - name: Reject authority regressions before installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.ts' 'unavailable("federation\.' apps/eliotr-core/src/composition-root.ts
          grep -RIn --include='*.test.ts' 'idempot\|lost.ack\|foreign\|credential\|scope\|cancel' apps/eliotr-core/test packages/cloudflare-federation packages/federation-api >/tmp/federation-negative-evidence
          test -s /tmp/federation-negative-evidence
          if grep -RIn --include='*.ts' 'principal_ref\s*:\s*request\.|owner_ref\s*:\s*request\.' apps/eliotr-core/src packages/cloudflare-federation packages/federation-api; then
            echo 'caller-supplied identity reached a federation authority field' >&2
            exit 1
          fi
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify federation locally without peer, Astro or Qdrant
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @eliotr/federation-api test
          pnpm --filter @eliotr/cloudflare-federation test
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit the verified federation composition to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/federation-product-once.yml
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: compose authenticated durable federation"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
