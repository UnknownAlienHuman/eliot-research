name: er22-scope-helper-materialize

on:
  push:
    branches:
      - agent/ER-22-scope-depth-preflight-clean-20260904

permissions:
  contents: write

concurrency:
  group: er22-scope-helper-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[scope-helper-materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-22-scope-depth-preflight-clean-20260904
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Extract the bounded iterative scope walker
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path("apps/eliotr-core/src/federation-service.ts")
          service = service_path.read_text(encoding="utf-8")
          import_anchor = '} from "@eliotr/interfaces";\n'
          import_line = 'import { federationScopeExceedsDepth } from "./federation-scope-limits.js";\n'
          if service.count(import_anchor) != 1 or import_line in service:
              raise SystemExit("scope helper import anchor missing or already applied")
          service = service.replace(import_anchor, import_anchor + import_line)

          start_marker = "function preflightScopeDepth(value: unknown): void {\n"
          end_marker = "function selectedSourceCount("
          if service.count(start_marker) != 1 or service.count(end_marker) != 1:
              raise SystemExit("scope function extraction anchors missing or ambiguous")
          start = service.index(start_marker)
          end = service.index(end_marker, start)
          service = service[:start] + service[end:]

          old_call = "  preflightScopeDepth(value);\n"
          new_call = '  if (federationScopeExceedsDepth(isRecord(value) ? value.scope_expression : undefined, MAX_SCOPE_DEPTH)) fail("FEDERATION_SCOPE_TOO_DEEP", `scope expression exceeds depth ${MAX_SCOPE_DEPTH}`);\n'
          if service.count(old_call) != 1:
              raise SystemExit("preflight call anchor missing or ambiguous")
          service = service.replace(old_call, new_call)

          old_check = "  if (scopeDepth(request.scope_expression) > MAX_SCOPE_DEPTH) {\n"
          new_check = "  if (federationScopeExceedsDepth(request.scope_expression, MAX_SCOPE_DEPTH)) {\n"
          if service.count(old_check) != 1:
              raise SystemExit("post-parse depth anchor missing or ambiguous")
          service_path.write_text(service.replace(old_check, new_check), encoding="utf-8")

          helper = '''interface ScopeFrame {
            readonly value: unknown;
            readonly depth: number;
          }

          function isRecord(value: unknown): value is Record<string, unknown> {
            return value !== null && typeof value === "object" && !Array.isArray(value);
          }

          export function federationScopeExceedsDepth(
            scope: unknown,
            maximumDepth: number,
          ): boolean {
            const stack: ScopeFrame[] = [{ value: scope, depth: 1 }];
            while (stack.length > 0) {
              const current = stack.pop();
              if (current === undefined) break;
              if (current.depth > maximumDepth) return true;
              if (!isRecord(current.value)) continue;
              const kind = current.value.kind;
              if (kind === "UNION" || kind === "INTERSECT" || kind === "EXCEPT") {
                stack.push(
                  { value: current.value.left, depth: current.depth + 1 },
                  { value: current.value.right, depth: current.depth + 1 },
                );
              }
            }
            return false;
          }
          '''
          Path("apps/eliotr-core/src/federation-scope-limits.ts").write_text(
              helper.replace("          ", ""), encoding="utf-8"
          )

          document_path = Path("docs/agent-work/ER-22-generic-federation-boundary.md")
          document = document_path.read_text(encoding="utf-8")
          document_anchor = "- `apps/eliotr-core/src/federation-service.ts`\n- `apps/eliotr-core/src/federation-service.test.ts`"
          document_replacement = "- `apps/eliotr-core/src/federation-service.ts`\n- `apps/eliotr-core/src/federation-scope-limits.ts`\n- `apps/eliotr-core/src/federation-service.test.ts`"
          if document.count(document_anchor) != 1:
              raise SystemExit("ER-22 document ownership anchor missing or ambiguous")
          document_path.write_text(
              document.replace(document_anchor, document_replacement), encoding="utf-8"
          )

          manifest_path = Path("docs/agent-work/manifest.json")
          manifest = manifest_path.read_text(encoding="utf-8")
          manifest_anchor = '        "apps/eliotr-core/src/federation-service.ts",\n        "apps/eliotr-core/src/federation-service.test.ts"'
          manifest_replacement = '        "apps/eliotr-core/src/federation-service.ts",\n        "apps/eliotr-core/src/federation-scope-limits.ts",\n        "apps/eliotr-core/src/federation-service.test.ts"'
          if manifest.count(manifest_anchor) != 1:
              raise SystemExit("ER-22 manifest ownership anchor missing or ambiguous")
          manifest_path.write_text(
              manifest.replace(manifest_anchor, manifest_replacement), encoding="utf-8"
          )
          PY
          git rm -- .github/workflows/er22-scope-helper-materialize.yml
          pnpm install --frozen-lockfile
          pnpm budgets:check
          pnpm work-packets:check
          pnpm lint
          pnpm typecheck
          pnpm --filter @eliotr/core test
          git diff --check
      - name: Commit the product-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-22: extract bounded scope traversal [scope-helper-materialized]"
          git push origin HEAD:agent/ER-22-scope-depth-preflight-clean-20260904
