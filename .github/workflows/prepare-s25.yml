name: prepare-s25-verified-wiki-tree
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-s25.yml, .github/payloads/s25/**]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Restore reviewed tree without publishing a ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 003a0f2da41fcde0ea66fc098d4f870dfbbb14d6
          cat .github/payloads/s25/*.part | base64 -d > /tmp/s25.patch.gz
          echo 'c5d35ce1c7cb9dc0b56e70db7546498e836d3749683e338cf84378274922c3b2  /tmp/s25.patch.gz' | sha256sum -c -
          gzip -dc /tmp/s25.patch.gz > /tmp/s25.patch
          echo 'ae97269d9f3e16f3bbfd97562920fe58f1cc846928bec484cb7ef67192345e94  /tmp/s25.patch' | sha256sum -c -
          git apply --check /tmp/s25.patch
          git apply --index /tmp/s25.patch
          git rm -r .github/payloads/s25 .github/workflows/prepare-s25.yml
          test "$(git write-tree)" = bfcf33bef37935a658b68a0bf1d5496845afb9f7
          mkdir -p /tmp/s25-proof
      - name: Install frozen toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Types, ownership, boundaries and contracts
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -b --pretty false
          node node_modules/typescript/bin/tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          node node_modules/eslint/bin/eslint.js apps/eliotr-core/test/wiki-owner-edit-parity.test.ts
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          git diff --cached --check
      - name: Wiki and publication domain regressions
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run packages/research/src/wiki.test.ts packages/domain/src/publication.test.ts | tee /tmp/s25-proof/domain.log
      - name: Real local Workers, D1 and R2 owner-edit parity
        working-directory: apps/eliotr-core
        shell: bash
        run: |
          set -euo pipefail
          node ../../node_modules/vitest/vitest.mjs run test/wiki-owner-edit-parity.test.ts | tee /tmp/s25-proof/workers.log
      - name: Store verified Git blobs only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const expectedTree = 'bfcf33bef37935a658b68a0bf1d5496845afb9f7';
          if (text('write-tree') !== expectedTree) throw new Error('Verified tree changed');
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`;
          const entries = [];
          for (const path of git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean)) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode, expected] = index.split(/\s+/);
            const response = await fetch(root, {method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28'},body:JSON.stringify({content:git('cat-file','blob',expected).toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Blob upload failed: ${response.status}`);
            const blob = await response.json();
            if (blob.sha !== expected) throw new Error(`Blob identity mismatch: ${path}`);
            entries.push({path,mode,type:'blob',sha:blob.sha});
          }
          const proof = {base_sha:process.env.GITHUB_SHA,tree_sha:expectedTree,ref_updated:false,live_executed:false,entries};
          writeFileSync('/tmp/s25-proof/verified-tree.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s25-verified-wiki-tree
          path: /tmp/s25-proof/
          retention-days: 1
          if-no-files-found: error
