name: local-source-export
on:
  push:
    branches: [agent/launch-01-library-20260905]
    paths: [.github/workflows/local-source-export.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify exact reviewed source and upload immutable objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          const repo = 'UnknownAlienHuman/eliot-research';
          const expectedTree = '077d312e23630939313f6ddfaa07d087b86a2ba8';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 15000 }).trim();
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/agent/launch-01-library-20260905');
          assert.equal(git('rev-parse', 'HEAD^'), 'd5e77d1109b125b9ad0012680175b2a3dc6e6f6b');
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git object API ${path} returned ${response.status}`);
            return response.json();
          };
          const pieces = [];
          for (const sha of [
            'a118f145e11d44a15c9a7018b28312d253f9cbd6',
            'eb849cc73d39ca8f4e2f32539db6fe715021d9be',
            'da390fb0d0f147a10df628c8540bb8f9647cc887',
            '672ff7dfce24cfbe0a1b17c16d9717bb3ffdfe29',
          ]) {
            const blob = await api(`/git/blobs/${sha}`);
            assert.equal(blob.sha, sha);
            assert.equal(blob.encoding, 'base64');
            const bytes = Buffer.from(blob.content, 'base64');
            assert.ok(bytes.length <= 12000);
            pieces.push(bytes.toString('utf8'));
          }
          const patch = brotliDecompressSync(Buffer.from(pieces.join(''), 'base64'), { maxOutputLength: 300000 });
          assert.equal(createHash('sha256').update(patch).digest('hex'),
            '02a3fbe7f78fca48e6cc7ba41372c470448afa6eadd4f7480b19e3862b7d9039');
          writeFileSync('/tmp/reviewed-source.patch', patch, { mode: 0o600 });
          git('apply', '--index', '--whitespace=error', '/tmp/reviewed-source.patch');
          git('rm', '.github/workflows/local-source-export.yml');
          git('diff', '--cached', '--check');
          assert.equal(git('write-tree'), expectedTree);
          for (const gate of ['check-work-packets', 'check-implementation-status', 'check-budgets', 'check-boundaries']) {
            execFileSync(process.execPath, [`scripts/${gate}.mjs`], { stdio: 'inherit', timeout: 20000 });
          }
          const changes = execFileSync('git', ['diff', '--cached', '--name-status', '-z'], { encoding: 'utf8' }).split('\0');
          if (changes.at(-1) === '') changes.pop();
          assert.equal(changes.length % 2, 0);
          const entries = [];
          for (let i = 0; i < changes.length; i += 2) {
            const [status, path] = changes.slice(i, i + 2);
            assert.ok(['A', 'M', 'D'].includes(status));
            assert.ok(path && !path.startsWith('/') && !path.split('/').includes('..'));
            if (status === 'D') { entries.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
            const bytes = execFileSync('git', ['show', `:${path}`]);
            const expected = git('rev-parse', `:${path}`);
            const blob = await api('/git/blobs', { encoding: 'base64', content: bytes.toString('base64') });
            assert.equal(blob.sha, expected);
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const stored = await api('/git/trees', { base_tree: git('rev-parse', 'HEAD^{tree}'), tree: entries });
          assert.equal(stored.sha, expectedTree);
          console.log(`VERIFIED_SOURCE_TREE=${stored.sha}`);
          // No commit, branch, PR or ref mutations. Caller attaches this verified source tree.
          JS
