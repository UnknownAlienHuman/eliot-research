name: claim-adjudication-api-once

on:
  push:
    branches: [main]
    paths: [.github/workflows/claim-adjudication-api-once.yml]

permissions:
  contents: write

concurrency:
  group: claim-adjudication-api-once
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.head_commit.message == 'ci: expose durable claim adjudication API'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Write durable batch adjudication service
        run: |
          cat > infra/d1/core/migrations/0049_claim_adjudication.sql <<'EOF'
          PRAGMA foreign_keys = ON;

          CREATE TABLE IF NOT EXISTS research_claim_adjudication (
            adjudication_id TEXT NOT NULL,
            revision INTEGER NOT NULL CHECK (revision = 1),
            principal_ref TEXT NOT NULL,
            idempotency_key TEXT NOT NULL,
            request_sha256 TEXT NOT NULL CHECK (length(request_sha256) = 64),
            request_json TEXT NOT NULL CHECK (length(request_json) <= 65536),
            result_sha256 TEXT NOT NULL CHECK (length(result_sha256) = 64),
            result_json TEXT NOT NULL CHECK (length(result_json) <= 65536),
            created_at TEXT NOT NULL,
            PRIMARY KEY (adjudication_id, revision),
            UNIQUE (principal_ref, idempotency_key)
          );

          CREATE TRIGGER IF NOT EXISTS research_claim_adjudication_no_update
          BEFORE UPDATE ON research_claim_adjudication BEGIN SELECT RAISE(ABORT, 'CLAIM_ADJUDICATION_IMMUTABLE'); END;
          CREATE TRIGGER IF NOT EXISTS research_claim_adjudication_no_delete
          BEFORE DELETE ON research_claim_adjudication BEGIN SELECT RAISE(ABORT, 'CLAIM_ADJUDICATION_IMMUTABLE'); END;
          EOF

          cat > apps/eliotr-core/src/claim-adjudication-service.ts <<'EOF'
          import {
            ClaimAdjudicationError,
            adjudicateClaimEvidence,
            type ClaimAdjudicationInput,
            type ClaimAdjudicationResult,
            type ClaimEvidenceAssurance,
            type ClaimEvidenceObservation,
          } from "@eliotr/research";
          import type { AuthenticatedRequestContext } from "@eliotr/interfaces";
          import { CatalogInputError } from "./catalog-service.js";
          import type { Env } from "./env.js";

          export const CLAIM_ADJUDICATION_PROTOCOL = "eliotr.claim-adjudication.v1";
          const MAX_CLAIMS = 64;
          const MAX_TOTAL_OBSERVATIONS = 512;
          const MAX_PERSISTED_BYTES = 64 * 1024;

          interface StoredRow {
            adjudication_id: string;
            revision: number;
            principal_ref: string;
            idempotency_key: string;
            request_sha256: string;
            request_json: string;
            result_sha256: string;
            result_json: string;
          }

          export interface ClaimAdjudicationBatchResult {
            readonly protocol: typeof CLAIM_ADJUDICATION_PROTOCOL;
            readonly adjudication_ref: { readonly id: string; readonly revision: 1 };
            readonly results: readonly ClaimAdjudicationResult[];
            readonly publishable: boolean;
            readonly summary: Readonly<Record<ClaimAdjudicationResult["disposition"], number>>;
          }

          function fail(code: string, message: string, status = 400, retryable = false): never {
            throw new CatalogInputError(code, message, status, retryable);
          }

          function exact(value: unknown, expected: readonly string[], label: string): Record<string, unknown> {
            if (value === null || typeof value !== "object" || Array.isArray(value)) fail("CLAIM_ADJUDICATION_INPUT_INVALID", `${label} must be an object`);
            const record = value as Record<string, unknown>;
            if (Object.keys(record).length !== expected.length || expected.some((key) => !Object.hasOwn(record, key))) {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", `${label} has unknown or missing fields`);
            }
            return record;
          }

          function string(value: unknown, label: string): string {
            if (typeof value !== "string") fail("CLAIM_ADJUDICATION_INPUT_INVALID", `${label} must be a string`);
            return value;
          }

          function parseObservation(raw: unknown): ClaimEvidenceObservation {
            const value = exact(raw, ["observation_ref", "source_revision_ref", "source_family_ref", "relation", "assurance", "current"], "claim observation");
            if (value.source_family_ref !== null && typeof value.source_family_ref !== "string") {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", "source_family_ref must be string or null");
            }
            if (value.relation !== "SUPPORTS" && value.relation !== "CONTRADICTS") fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim relation is invalid");
            if (value.assurance !== "LOCATOR" && value.assurance !== "EXCERPT" && value.assurance !== "EXACT") {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim assurance is invalid");
            }
            if (typeof value.current !== "boolean") fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim currentness is invalid");
            return {
              observation_ref: string(value.observation_ref, "observation_ref"),
              source_revision_ref: string(value.source_revision_ref, "source_revision_ref"),
              ...(value.source_family_ref === null ? {} : { source_family_ref: value.source_family_ref }),
              relation: value.relation,
              assurance: value.assurance,
              current: value.current,
            } as ClaimEvidenceObservation;
          }

          function parseClaim(raw: unknown): ClaimAdjudicationInput {
            const value = exact(raw, ["claim_ref", "required_assurance", "current_state", "minimum_independent_sources", "observations"], "claim adjudication");
            if (value.required_assurance !== "LOCATOR" && value.required_assurance !== "EXCERPT" && value.required_assurance !== "EXACT") {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", "required assurance is invalid");
            }
            if (typeof value.current_state !== "boolean") fail("CLAIM_ADJUDICATION_INPUT_INVALID", "current-state flag is invalid");
            if (!Number.isSafeInteger(value.minimum_independent_sources) || (value.minimum_independent_sources as number) < 1
                || (value.minimum_independent_sources as number) > 64) {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", "independent source floor is invalid");
            }
            if (!Array.isArray(value.observations)) fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim observations are invalid");
            return {
              claim_ref: string(value.claim_ref, "claim_ref"),
              required_assurance: value.required_assurance as ClaimEvidenceAssurance,
              current_state: value.current_state,
              minimum_independent_sources: value.minimum_independent_sources as number,
              observations: value.observations.map(parseObservation),
            };
          }

          function parse(raw: unknown): readonly ClaimAdjudicationInput[] {
            const root = exact(raw, ["claims"], "claim adjudication request");
            if (!Array.isArray(root.claims) || root.claims.length < 1 || root.claims.length > MAX_CLAIMS) {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim batch is empty or over its bound", 413);
            }
            const claims = root.claims.map(parseClaim).sort((left, right) => left.claim_ref < right.claim_ref ? -1 : left.claim_ref > right.claim_ref ? 1 : 0);
            let observations = 0;
            for (let index = 0; index < claims.length; index += 1) {
              if (index > 0 && claims[index - 1]?.claim_ref === claims[index]?.claim_ref) fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim reference is duplicated");
              observations += claims[index]?.observations.length ?? 0;
            }
            if (observations > MAX_TOTAL_OBSERVATIONS) fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim observations exceed the batch bound", 413);
            return claims;
          }

          function principal(context: AuthenticatedRequestContext): string {
            if (context.client_class !== "owner_pwa") fail("CLAIM_ADJUDICATION_OWNER_REQUIRED", "claim adjudication requires the owner profile", 403);
            if (context.principal_ref.length < 1 || context.principal_ref.length > 256 || context.principal_ref !== context.principal_ref.trim()) {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", "claim adjudication principal is invalid");
            }
            return context.principal_ref;
          }

          function idempotency(context: AuthenticatedRequestContext): string {
            const value = context.request.headers.get("idempotency-key");
            if (value === null || value.length < 1 || value.length > 256 || /[\u0000-\u0020\u007f]/u.test(value)) {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", "idempotency-key header is required");
            }
            return value;
          }

          async function digest(value: string): Promise<string> {
            return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value))),
              (byte) => byte.toString(16).padStart(2, "0")).join("");
          }

          function boundedJson(value: unknown, label: string): string {
            let encoded: string;
            try { encoded = JSON.stringify(value); }
            catch { fail("CLAIM_ADJUDICATION_INPUT_INVALID", `${label} is not serializable`); }
            if (new TextEncoder().encode(encoded).byteLength > MAX_PERSISTED_BYTES) {
              fail("CLAIM_ADJUDICATION_INPUT_INVALID", `${label} exceeds its persisted byte bound`, 413);
            }
            return encoded;
          }

          function decodeResult(row: StoredRow): ClaimAdjudicationBatchResult {
            if (row.revision !== 1) fail("CLAIM_ADJUDICATION_READBACK_CORRUPT", "claim adjudication revision is invalid", 409);
            let value: unknown;
            try { value = JSON.parse(row.result_json); }
            catch { fail("CLAIM_ADJUDICATION_READBACK_CORRUPT", "claim adjudication result is malformed", 409); }
            const result = value as ClaimAdjudicationBatchResult;
            if (result === null || typeof result !== "object" || result.protocol !== CLAIM_ADJUDICATION_PROTOCOL
                || result.adjudication_ref?.id !== row.adjudication_id || result.adjudication_ref?.revision !== 1
                || !Array.isArray(result.results) || typeof result.publishable !== "boolean") {
              fail("CLAIM_ADJUDICATION_READBACK_CORRUPT", "claim adjudication result identity is malformed", 409);
            }
            return result;
          }

          export async function adjudicateClaims(
            env: Pick<Env, "CORE_DB">,
            context: AuthenticatedRequestContext,
            raw: unknown,
          ): Promise<ClaimAdjudicationBatchResult> {
            const principalRef = principal(context);
            const key = idempotency(context);
            const claims = parse(raw);
            const requestJson = boundedJson({ claims }, "claim adjudication request");
            const requestSha = await digest(requestJson);
            const adjudicationId = `claim-adjudication-${requestSha.slice(0, 48)}`;

            let prior: StoredRow | null;
            try {
              prior = await env.CORE_DB.prepare(
                "SELECT adjudication_id, revision, principal_ref, idempotency_key, request_sha256, request_json, result_sha256, result_json " +
                "FROM research_claim_adjudication WHERE principal_ref = ?1 AND idempotency_key = ?2 LIMIT 1",
              ).bind(principalRef, key).first<StoredRow>();
            } catch { fail("CLAIM_ADJUDICATION_SETTLEMENT_UNCERTAIN", "claim adjudication readback is unavailable", 503, true); }
            if (prior !== null) {
              if (prior.adjudication_id !== adjudicationId || prior.request_sha256 !== requestSha || prior.request_json !== requestJson) {
                fail("CLAIM_ADJUDICATION_CONFLICT", "claim adjudication idempotency identity is occupied by different inputs", 409);
              }
              if (await digest(prior.result_json) !== prior.result_sha256) fail("CLAIM_ADJUDICATION_READBACK_CORRUPT", "claim adjudication result digest is corrupt", 409);
              return decodeResult(prior);
            }

            let results: ClaimAdjudicationResult[];
            try { results = claims.map(adjudicateClaimEvidence); }
            catch (error) {
              if (error instanceof ClaimAdjudicationError) fail(error.code, error.message, error.code === "CLAIM_ADJUDICATION_LIMIT_EXCEEDED" ? 413 : 400);
              throw error;
            }
            const summary: Record<ClaimAdjudicationResult["disposition"], number> = {
              SUPPORTED: 0, MIXED: 0, CONTRADICTED: 0, STALE: 0, INSUFFICIENT: 0,
            };
            for (const result of results) summary[result.disposition] += 1;
            const output: ClaimAdjudicationBatchResult = {
              protocol: CLAIM_ADJUDICATION_PROTOCOL,
              adjudication_ref: { id: adjudicationId, revision: 1 },
              results,
              publishable: results.every((result) => result.disposition === "SUPPORTED"),
              summary: Object.freeze(summary),
            };
            const resultJson = boundedJson(output, "claim adjudication result");
            const resultSha = await digest(resultJson);
            try {
              await env.CORE_DB.prepare(
                "INSERT OR IGNORE INTO research_claim_adjudication " +
                "(adjudication_id, revision, principal_ref, idempotency_key, request_sha256, request_json, result_sha256, result_json, created_at) " +
                "VALUES (?1,1,?2,?3,?4,?5,?6,?7,strftime('%Y-%m-%dT%H:%M:%fZ','now'))",
              ).bind(adjudicationId, principalRef, key, requestSha, requestJson, resultSha, resultJson).run();
            } catch { fail("CLAIM_ADJUDICATION_SETTLEMENT_UNCERTAIN", "claim adjudication persistence is uncertain", 503, true); }
            let stored: StoredRow | null;
            try {
              stored = await env.CORE_DB.prepare(
                "SELECT adjudication_id, revision, principal_ref, idempotency_key, request_sha256, request_json, result_sha256, result_json " +
                "FROM research_claim_adjudication WHERE principal_ref = ?1 AND idempotency_key = ?2 LIMIT 1",
              ).bind(principalRef, key).first<StoredRow>();
            } catch { fail("CLAIM_ADJUDICATION_SETTLEMENT_UNCERTAIN", "claim adjudication readback is unavailable", 503, true); }
            if (stored === null || stored.adjudication_id !== adjudicationId || stored.request_sha256 !== requestSha
                || stored.request_json !== requestJson || stored.result_sha256 !== resultSha || stored.result_json !== resultJson) {
              fail("CLAIM_ADJUDICATION_CONFLICT", "claim adjudication persistence lost exact readback", 409);
            }
            return decodeResult(stored);
          }
          EOF

          cat > apps/eliotr-core/test/claim-adjudication-service.test.ts <<'EOF'
          import { beforeAll, describe, expect, it } from "vitest";
          import type { AuthenticatedRequestContext } from "@eliotr/interfaces";
          import { body, count, principal, run, runtime, setupOrientationDatabase } from "./orientation-fixture.js";
          import { adjudicateClaims } from "../src/claim-adjudication-service.js";

          beforeAll(async () => { await setupOrientationDatabase(); });

          function context(key: string, who = principal): AuthenticatedRequestContext {
            return {
              request: new Request("https://research.example/api/v1/research/claims/adjudicate", {
                method: "POST", headers: { "content-type": "application/json", "idempotency-key": key },
              }),
              principal_ref: who, client_class: "owner_pwa", credential_generation: "credential-v1", trace_id: `trace-${key}`,
            };
          }

          function observation(ref: string, relation: "SUPPORTS" | "CONTRADICTS" = "SUPPORTS", current = true) {
            return {
              observation_ref: ref,
              source_revision_ref: `source-${ref}`,
              source_family_ref: `family-${ref}`,
              relation,
              assurance: "EXACT",
              current,
            };
          }

          function request() {
            return { claims: [
              { claim_ref: "claim-supported", required_assurance: "EXACT", current_state: false, minimum_independent_sources: 1, observations: [observation("support")] },
              { claim_ref: "claim-mixed", required_assurance: "EXACT", current_state: false, minimum_independent_sources: 1, observations: [observation("mixed-support"), observation("mixed-contradiction", "CONTRADICTS")] },
              { claim_ref: "claim-stale", required_assurance: "EXACT", current_state: true, minimum_independent_sources: 1, observations: [observation("stale", "SUPPORTS", false)] },
            ] };
          }

          describe("durable claim adjudication API", () => {
            it("persists deterministic dispositions and never calls a model", async () => {
              const result = await adjudicateClaims(runtime, context("claim-api"), request());
              expect(result.protocol).toBe("eliotr.claim-adjudication.v1");
              expect(result.results.map((item) => item.disposition)).toEqual(["MIXED", "STALE", "SUPPORTED"]);
              expect(result.publishable).toBe(false);
              expect(result.summary).toMatchObject({ SUPPORTED: 1, MIXED: 1, STALE: 1 });
              expect(await count("research_claim_adjudication")).toBeGreaterThanOrEqual(1);
            });

            it("replays exact inputs and rejects changed same-key inputs without another row", async () => {
              const ctx = context("claim-replay");
              const first = await adjudicateClaims(runtime, ctx, request());
              const before = await count("research_claim_adjudication");
              const second = await adjudicateClaims(runtime, ctx, request());
              expect(second).toEqual(first);
              expect(await count("research_claim_adjudication")).toBe(before);
              const changed = request();
              changed.claims[0]!.current_state = true;
              await expect(adjudicateClaims(runtime, ctx, changed)).rejects.toMatchObject({ code: "CLAIM_ADJUDICATION_CONFLICT" });
            });

            it("rejects unknown fields, duplicate claims and service callers", async () => {
              await expect(adjudicateClaims(runtime, context("claim-extra"), { ...request(), extra: true }))
                .rejects.toMatchObject({ code: "CLAIM_ADJUDICATION_INPUT_INVALID" });
              const duplicate = request();
              duplicate.claims.push({ ...duplicate.claims[0]! });
              await expect(adjudicateClaims(runtime, context("claim-duplicate"), duplicate))
                .rejects.toMatchObject({ code: "CLAIM_ADJUDICATION_INPUT_INVALID" });
              const service = context("claim-service", "service-1");
              (service as { client_class: string }).client_class = "service";
              await expect(adjudicateClaims(runtime, service, request()))
                .rejects.toMatchObject({ code: "CLAIM_ADJUDICATION_OWNER_REQUIRED" });
            });

            it("serves the authenticated HTTP route", async () => {
              const response = await run(new Request("https://research.example/api/v1/research/claims/adjudicate", {
                method: "POST",
                headers: { "content-type": "application/json", "idempotency-key": "claim-http" },
                body: JSON.stringify(request()),
              }));
              const payload = await body(response);
              expect(response.status, JSON.stringify(payload)).toBe(200);
              expect(payload.data).toMatchObject({ protocol: "eliotr.claim-adjudication.v1", publishable: false });
            });
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path.cwd()
          operation_id = "research.claims.adjudicate"

          routes_path = root / "packages/interfaces/src/routes.ts"
          routes = routes_path.read_text(encoding="utf-8")
          if operation_id not in routes:
              match = re.search(r'operation_id\s*:\s*"research\.query"', routes)
              if match is None: raise SystemExit("research.query route missing")
              start = routes.rfind("{", 0, match.start())
              depth = 0; quote = None; escaped = False; end = None
              for index in range(start, len(routes)):
                  char = routes[index]
                  if quote is not None:
                      if escaped: escaped = False
                      elif char == "\\": escaped = True
                      elif char == quote: quote = None
                      continue
                  if char in ('"', "'"): quote = char
                  elif char == "{": depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0: end = index + 1; break
              if end is None: raise SystemExit("research.query route object end missing")
              clone = routes[start:end]
              clone = re.sub(r'(operation_id\s*:\s*")[^"]+(")', rf'\g<1>{operation_id}\2', clone, count=1)
              clone = re.sub(r'(path\s*:\s*")[^"]+(")', r'\g<1>/api/v1/research/claims/adjudicate\2', clone, count=1)
              clone = re.sub(r'(auth\s*:\s*")[^"]+(")', r'\g<1>owner\2', clone, count=1)
              routes = routes[:end] + ",\n" + clone + routes[end:]
              routes_path.write_text(routes, encoding="utf-8", newline="\n")

          http_path = root / "apps/eliotr-core/src/http.ts"
          http = http_path.read_text(encoding="utf-8")
          import_line = 'import { adjudicateClaims } from "./claim-adjudication-service.js";\n'
          if import_line not in http: http = import_line + http
          existing = re.compile(r'^[ \t]*if \(match\.route\.operation_id === "research\.claims\.adjudicate"\) \{\n[\s\S]*?^[ \t]*\}\n', re.MULTILINE)
          http = existing.sub("", http, count=1)
          anchor = re.search(r'^(?P<indent>[ \t]*)if \(match\.route\.operation_id === "research\.query"\)', http, re.MULTILINE)
          if anchor is None: raise SystemExit("research.query HTTP anchor missing")
          indent = anchor.group("indent")
          block = (
              f'{indent}if (match.route.operation_id === "{operation_id}") {{\n'
              f'{indent}  const data = await adjudicateClaims(\n'
              f'{indent}    env, context,\n'
              f'{indent}    await readJsonBodyWithinBytes(request, match.route.maximum_request_bytes),\n'
              f'{indent}  );\n'
              f'{indent}  return apiResult(request, env, data);\n'
              f'{indent}}}\n'
          )
          http = http[:anchor.start()] + block + http[anchor.start():]
          http_path.write_text(http, encoding="utf-8", newline="\n")

          manifest_path = root / "docs/agent-work/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packets = []
          def collect(value):
              if isinstance(value, dict):
                  if isinstance(value.get("id"), str): packets.append(value)
                  for child in value.values(): collect(child)
              elif isinstance(value, list):
                  for child in value: collect(child)
          collect(manifest)
          research = []
          for packet in packets:
              paths = packet.get("owned_paths") if isinstance(packet.get("owned_paths"), list) else packet.get("ownedPaths")
              if isinstance(paths, list) and any(path == "packages/research/**" for path in paths if isinstance(path, str)):
                  research.append(packet)
          if len(research) != 1: raise SystemExit(f"research owner ambiguous: {[p.get('id') for p in research]}")
          ownership = {
              research[0]["id"]: ["apps/eliotr-core/src/claim-adjudication-service.ts", "apps/eliotr-core/test/claim-adjudication-service.test.ts"],
              "ER-13": ["infra/d1/core/migrations/0049_claim_adjudication.sql"],
          }
          for packet_id, paths in ownership.items():
              packet = next((value for value in packets if value.get("id") == packet_id), None)
              if packet is None: raise SystemExit(f"missing packet {packet_id}")
              key = "owned_paths" if isinstance(packet.get("owned_paths"), list) else "ownedPaths" if isinstance(packet.get("ownedPaths"), list) else None
              if key is None: raise SystemExit(f"owned paths missing {packet_id}")
              for item in paths:
                  if item not in packet[key]: packet[key].append(item)
              docs = list((root / "docs/agent-work").glob(f"{packet_id}-*.md"))
              if len(docs) != 1: raise SystemExit(f"packet document ambiguous {packet_id}")
              doc_path = docs[0]
              doc = doc_path.read_text(encoding="utf-8")
              heading = re.search(r"(?im)^##\s+Owned paths\s*$", doc)
              if heading is None: raise SystemExit(f"Owned paths heading missing {packet_id}")
              tail = doc[heading.end():]
              next_heading = re.search(r"(?m)^##\s+", tail)
              end = heading.end() + (next_heading.start() if next_heading else len(tail))
              section = doc[heading.end():end]
              additions = [item for item in paths if f'`{item}`' not in section]
              if additions:
                  if not section.endswith("\n"): section += "\n"
                  section += "".join(f'- `{item}`\n' for item in additions)
                  doc = doc[:heading.end()] + section + doc[end:]
                  doc_path.write_text(doc, encoding="utf-8", newline="\n")
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify durable cognitive API locally
        run: |
          pnpm exec vitest run packages/research/test/claim-adjudication.test.ts --reporter=verbose
          pnpm --filter @eliotr/core exec vitest run test/claim-adjudication-service.test.ts test/wiki-evidence-map.test.ts --reporter=verbose
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm budgets:check
          pnpm work-packets:check
          pnpm boundaries:check
          git diff --check
      - name: Commit only green cognitive API code
        run: |
          git rm .github/workflows/claim-adjudication-api-once.yml
          git config user.name "Eliot Research Product Builder"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose durable claim adjudication API"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
