name: local-integration-snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/local-integration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          git rev-parse HEAD > /tmp/SNAPSHOT_HEAD_SHA
          git archive --format=tar.gz --output=/tmp/current-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-source
          path: |
            /tmp/current-source.tar.gz
            /tmp/SNAPSHOT_HEAD_SHA
          retention-days: 1
          if-no-files-found: error
