name: er21-federation-interface-test

on:
  push:
    branches:
      - agent/ER-21-federation-interface-unification-20260904

permissions:
  contents: write

concurrency:
  group: er21-federation-interface-test
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[er21-federation-tested]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-21-federation-interface-unification-20260904
          fetch-depth: 0

      - name: Add federation application contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/eliotr-core/src/index.test.ts")
          text = path.read_text(encoding="utf-8")
          import_anchor = 'import type { Env } from "./env.js";\n'
          import_line = 'import { createApplication } from "./composition-root.js";\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("index.test import anchor missing or ambiguous")
              text = text.replace(import_anchor, import_line + import_anchor)

          test_block = '''

          describe("federation application contract", () => {
            it("exposes the complete V1 surface and keeps every operation fail-closed", async () => {
              const fixture = databaseFixture();
              const application = createApplication({
                env: environment(fixture.database),
                executionContext: executionContext(),
              });

              expect(Object.keys(application.services.federation).sort()).toEqual([
                "cancel",
                "changes",
                "readBundle",
                "readBundleManifest",
                "result",
                "status",
                "submit",
              ]);
              await expect(
                application.services.federation.readBundle(
                  {} as never,
                  { id: "bundle-1", revision: 1 },
                ),
              ).rejects.toMatchObject({
                code: "IMPLEMENTATION_SLICE_PENDING",
                operation: "federation.bundle.read",
                retryable: false,
              });
              const capabilities = await application.services.owner.systemCapabilities(
                {} as never,
              );
              expect(capabilities.disabled_slices).toEqual(
                expect.arrayContaining(["FEDERATION"]),
              );
            });
          });
          '''
          if 'describe("federation application contract"' not in text:
              text = text.rstrip() + test_block
          path.write_text(text, encoding="utf-8")
          PY
          git rm -- .github/workflows/er21-federation-interface-test.yml
          git diff --check

      - name: Commit interface contract test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-21: prove complete federation V1 surface [er21-federation-tested]"
          git push origin HEAD:agent/ER-21-federation-interface-unification-20260904
