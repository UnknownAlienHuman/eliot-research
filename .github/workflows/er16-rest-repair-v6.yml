name: er16-rest-repair-v6

on:
  push:
    branches:
      - agent/ER-16-dynamic-route-rest-control-plane-20260903
    paths:
      - .github/workflows/er16-rest-repair-v6.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-dynamic-route-rest-control-plane-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Reproduce audited split and apply exact type repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path(".github/workflows/er16-rest-repair-v5.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end_marker = "\n          PY\n\n          rm -f .github/workflows/er16-rest-finalize.yml"
          end = workflow.index(end_marker, start)
          exec(
              compile(
                  textwrap.dedent(workflow[start:end]),
                  "er16-rest-split-and-clean.py",
                  "exec",
              ),
              {},
          )

          response_path = Path(
              "packages/cloudflare-ai/src/dynamic-route-rest-response-codec.ts"
          )
          response = response_path.read_text(encoding="utf-8")
          response_anchor = 'import {\n  DYNAMIC_ROUTE_REST_RESPONSE_MAX_BYTES,'
          response_import = (
              'import { canonicalModelGatewayJson } from "./model-gateway-request.js";\n'
          )
          if response.count(response_anchor) != 1:
              raise SystemExit("response-codec import anchor drifted")
          response_path.write_text(
              response.replace(
                  response_anchor,
                  response_import + response_anchor,
                  1,
              ),
              encoding="utf-8",
          )

          control_path = Path(
              "packages/cloudflare-ai/src/dynamic-route-rest-control-plane.ts"
          )
          control = control_path.read_text(encoding="utf-8")
          control_replacements = {
              "    async list(requestedGatewayId) {":
                  "    async list(requestedGatewayId: typeof DYNAMIC_ROUTE_GATEWAY_ID) {",
              "    async get(requestedGatewayId, providerRouteId) {":
                  "    async get(\n"
                  "      requestedGatewayId: typeof DYNAMIC_ROUTE_GATEWAY_ID,\n"
                  "      providerRouteId: string,\n"
                  "    ) {",
              "    async create(rawRequest) {":
                  "    async create(rawRequest: DynamicRouteCreateRequest) {",
              "    async request(method, url, body, ambiguousEffect) {":
                  "    async request(\n"
                  "      method: \"GET\" | \"POST\",\n"
                  "      url: string,\n"
                  "      body: unknown | undefined,\n"
                  "      ambiguousEffect: DynamicRouteRestAmbiguousEffect,\n"
                  "    ) {",
          }
          for old, new in control_replacements.items():
              if control.count(old) != 1:
                  raise SystemExit(f"control-plane signature drifted: {old!r}")
              control = control.replace(old, new, 1)
          control_path.write_text(control, encoding="utf-8")

          test_path = Path(
              "packages/cloudflare-ai/src/dynamic-route-rest-control-plane.test.ts"
          )
          test = test_path.read_text(encoding="utf-8")
          test_replacements = {
              "  type DynamicRouteRestFetchPort,\n":
                  "  type DynamicRouteRestFetchPort,\n"
                  "  type DynamicRouteRestResponse,\n",
              "): Response {\n  const text = JSON.stringify(body);":
                  "): DynamicRouteRestResponse {\n"
                  "  const text = JSON.stringify(body);",
              "  return new Response(text, {\n"
              "    status,\n"
              "    headers: { \"content-type\": \"application/json\", ...headers },\n"
              "  });":
                  "  return new Response(text, {\n"
                  "    status,\n"
                  "    headers: { \"content-type\": \"application/json\", ...headers },\n"
                  "  }) as unknown as DynamicRouteRestResponse;",
              "  responses: readonly (Response | Error)[],":
                  "  responses: readonly (DynamicRouteRestResponse | Error)[],",
              '      controlPlane(fetch).list("other-gateway"),':
                  '      controlPlane(fetch).list(\n'
                  '        "other-gateway" as typeof import(\n'
                  '          "./dynamic-route-provisioning-contract.js"\n'
                  '        ).DYNAMIC_ROUTE_GATEWAY_ID,\n'
                  '      ),',
          }
          for old, new in test_replacements.items():
              if test.count(old) != 1:
                  raise SystemExit(f"REST test fixture drifted: {old!r}")
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding="utf-8")

          packet_path = Path(
              "docs/agent-work/ER-16-ai-search-and-model-gateway-adapters.md"
          )
          packet_path.write_text(
              packet_path.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )
          PY

          rm -f .github/workflows/er16-rest-finalize.yml
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify repository and ER-16 boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm work-packets:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/cloudflare-ai/src/dynamic-route-rest-control-plane.test.ts
          pnpm exec vitest run packages/cloudflare-ai
          git diff --check

      - name: Commit the clean verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/er16-rest-repair.yml \
            .github/workflows/er16-rest-repair-v2.yml \
            .github/workflows/er16-rest-repair-v3.yml \
            .github/workflows/er16-rest-repair-v4.yml \
            .github/workflows/er16-rest-repair-v5.yml \
            .github/workflows/er16-rest-repair-v6.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: implement strict Dynamic Route REST control plane"
          git push origin HEAD:agent/ER-16-dynamic-route-rest-control-plane-20260903
