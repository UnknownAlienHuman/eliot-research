name: fix-projection-types

on:
  push:
    branches:
      - agent/p0-projection-executor-20260831

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-projection-executor-20260831
          fetch-depth: 0
      - name: Apply strict TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          edits = {
              'packages/cloudflare-projection/src/canonical.ts': [(
                  'export async function projectionSha256Bytes(value: Uint8Array): Promise<string> {\n  return hex(await crypto.subtle.digest("SHA-256", value));\n}\n',
                  'export async function projectionSha256Bytes(value: Uint8Array): Promise<string> {\n  const buffer = new ArrayBuffer(value.byteLength);\n  new Uint8Array(buffer).set(value);\n  return hex(await crypto.subtle.digest("SHA-256", buffer));\n}\n',
              )],
              'packages/cloudflare-projection/src/core-load.ts': [(
                  '  if (result.success === false) {\n    projectionFail(\n      "PROJECTION_SETTLEMENT_UNCERTAIN",\n      "active project membership readback failed",\n      true,\n    );\n  }\n',
                  '',
              )],
              'packages/cloudflare-projection/src/d1-search.ts': [(
                  '  if (result.success === false) {\n    projectionFail("PROJECTION_SETTLEMENT_UNCERTAIN", "D1 Search shadow readback failed", true);\n  }\n',
                  '',
              )],
          }
          for name, replacements in edits.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'{name}: expected exactly one strict replacement')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit source-only type fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/cloudflare-projection/src/canonical.ts \
                  packages/cloudflare-projection/src/core-load.ts \
                  packages/cloudflare-projection/src/d1-search.ts
          git commit -m 'fix(er38): satisfy strict projection types'
          git push origin HEAD:agent/p0-projection-executor-20260831
