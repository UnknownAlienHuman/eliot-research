name: verify-s16-canonical-cancellation
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-s16.yml]
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Restore checksum-bound candidate with native per-test fixture preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess, textwrap
          source = subprocess.check_output(['git','show','b6480dc18e2247478e3a001236bfd6e20b1fbda4:.github/workflows/verify-s16.yml'],text=True,encoding='utf-8')
          restore = source.split('      - name: Restore only checksum-bound reviewed S16 tree\n',1)[1].split('        run: |\n',1)[1].split('      - name: Install frozen toolchain\n',1)[0]
          restore = restore.replace('393406babd48b728396acd7baf81c2305690596f','b6480dc18e2247478e3a001236bfd6e20b1fbda4')
          pathlib.Path(os.environ['RUNNER_TEMP'],'s16-restore.sh').write_text(textwrap.dedent(restore),encoding='utf-8',newline='\n')
          PY
          "$BASH" "$RUNNER_TEMP/s16-restore.sh"
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request, subprocess
          sha = 'a3e0f4ccda5945f77a75374d14f33ec8e228ebdf'
          request = urllib.request.Request(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              result = json.load(response)
          data = base64.b64decode(result['content'])
          assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == sha
          patch = gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '6dc22879a647424be30a5512bfb42ec117abd74ee5ebeaed185469c715b6dd7b'
          path = pathlib.Path(os.environ['RUNNER_TEMP'],'s16-fixtures.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == 'b00bd1bbef24fbb6885ebc1fd4ea80674b1e38de'
          PY
      - name: Install frozen toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
          node --version > "$RUNNER_TEMP/s16-result/versions.txt"
          pnpm --version >> "$RUNNER_TEMP/s16-result/versions.txt"
      - name: Strict types lint ownership and unchanged contracts
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -b --pretty false
          node node_modules/typescript/bin/tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          node node_modules/eslint/bin/eslint.js apps/eliotr-core/test/research-session.test.ts apps/eliotr-core/test/research-workflow-recovery.test.ts
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          git diff --cached --check
          git diff --exit-code
      - name: Actual native DO D1 R2 recovery and terminal settlement
        run: |
          set -euo pipefail
          pnpm --dir apps/eliotr-core exec vitest run test/research-workflow-recovery.test.ts --no-file-parallelism 2>&1 | tee "$RUNNER_TEMP/s16-result/recovery.log"
      - name: Canonical cancellation persistence and session identity after eviction
        run: |
          set -euo pipefail
          pnpm --dir apps/eliotr-core exec vitest run test/research-session.test.ts --no-file-parallelism -t 'canonical cancellation persistence|starts, reads' 2>&1 | tee "$RUNNER_TEMP/s16-result/session.log"
      - name: Store verified Git blobs without publishing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git',args);
          const text = (...args) => git(...args).toString().trim();
          const tree = text('write-tree');
          if (tree !== 'b00bd1bbef24fbb6885ebc1fd4ea80674b1e38de') throw new Error('Tree identity changed');
          git('diff','--exit-code');
          const entries = [];
          for (const path of git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean)) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode,sha] = index.split(/\s+/);
            const bytes = git('cat-file','blob',sha);
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,{method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({content:bytes.toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Git blob creation failed: ${response.status}`);
            if ((await response.json()).sha !== sha) throw new Error('Blob identity changed');
            entries.push({path,mode,type:'blob',sha});
          }
          writeFileSync(join(process.env.RUNNER_TEMP,'s16-result','verified-tree.json'),JSON.stringify({base_sha:process.env.GITHUB_SHA,base_tree_sha:text('rev-parse','HEAD^{tree}'),tree_sha:tree,ref_updated:false,entries},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s16-verified-${{ matrix.os }}
          path: ${{ runner.temp }}/s16-result/
          if-no-files-found: error
          retention-days: 3
