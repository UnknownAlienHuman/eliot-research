name: er26-ai-search-provisioner-test-sync

on:
  push:
    branches:
      - agent/ER-26-ai-search-readback-parity-clean-20260904

permissions:
  contents: write

concurrency:
  group: er26-ai-search-provisioner-test-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[er26-test-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-readback-parity-clean-20260904
          fetch-depth: 0

      - name: Bind the legacy drift test to current desired state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/test-cloudflare-provisioners.mjs")
          text = path.read_text(encoding="utf-8")
          anchor = '''const canonicalConfigBefore = await readFile(canonicalConfigPath, "utf8");
          const backupRoot = resolve(repositoryRoot, `.eliotr-provisioner-test-backup-${process.pid}`);
          '''
          replacement = '''const canonicalConfigBefore = await readFile(canonicalConfigPath, "utf8");
          const desiredAiSearch = JSON.parse(await readFile(
            resolve(repositoryRoot, "infra/ai-search/instances.json"),
            "utf8",
          ));
          const desiredAiSearchInstanceId = desiredAiSearch.instances[0]?.id;
          assert.equal(typeof desiredAiSearchInstanceId, "string");
          const backupRoot = resolve(repositoryRoot, `.eliotr-provisioner-test-backup-${process.pid}`);
          '''
          if text.count(anchor) != 1:
              raise SystemExit("desired-state insertion anchor missing or ambiguous")
          text = text.replace(anchor, replacement)

          key = 'state.aiInstances.set("private-prose-g1", {'
          identity = '    id: "private-prose-g1",'
          if text.count(key) != 1 or text.count(identity) != 1:
              raise SystemExit("legacy AI Search drift fixture occurrence changed")
          text = text.replace(
              key,
              "state.aiInstances.set(desiredAiSearchInstanceId, {",
          ).replace(
              identity,
              "    id: desiredAiSearchInstanceId,",
          )
          path.write_text(text, encoding="utf-8")
          PY
          git rm -- .github/workflows/er26-ai-search-provisioner-test-sync.yml
          git diff --check

      - name: Commit synchronized test fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-26: bind AI Search drift fixture to desired state [er26-test-synced]"
          git push origin HEAD:agent/ER-26-ai-search-readback-parity-clean-20260904
