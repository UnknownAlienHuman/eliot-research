name: er26-ai-search-provisioner-test-sync

on:
  push:
    branches:
      - agent/ER-26-ai-search-readback-parity-20260903

permissions:
  contents: write

concurrency:
  group: er26-ai-search-provisioner-test-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[er26-test-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-readback-parity-20260903
          fetch-depth: 0

      - name: Make the immutable-drift fixture follow desired state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/test-cloudflare-provisioners.mjs")
          text = path.read_text(encoding="utf-8")

          anchor = '''const canonicalConfigBefore = await readFile(canonicalConfigPath, "utf8");
          const backupRoot = resolve(repositoryRoot, `.eliotr-provisioner-test-backup-${process.pid}`);
          '''
          replacement = '''const canonicalConfigBefore = await readFile(canonicalConfigPath, "utf8");
          const aiSearchDesired = JSON.parse(await readFile(
            resolve(repositoryRoot, "infra/ai-search/instances.json"),
            "utf8",
          ));
          const backupRoot = resolve(repositoryRoot, `.eliotr-provisioner-test-backup-${process.pid}`);
          '''
          if text.count(anchor) != 1:
              raise SystemExit("desired-state insertion anchor missing or ambiguous")
          text = text.replace(anchor, replacement)

          old = '''  state.aiNamespace = { id: "namespace-1", name: "eliotr" };
            state.aiInstances.set("private-prose-g1", {
              id: "private-prose-g1",
              embedding_model: "@cf/incompatible/model",
              index_method: { vector: true, keyword: true },
              fusion_method: "rrf",
              indexing_options: { keyword_tokenizer: "porter" },
              retrieval_options: { keyword_match_mode: "and" },
              max_num_results: 50,
              reranking: true,
              reranking_model: "@cf/baai/bge-reranker-base",
            });
          '''
          new = '''  state.aiNamespace = { id: "namespace-1", name: aiSearchDesired.namespace };
            const driftSpec = aiSearchDesired.instances[0];
            assert(driftSpec, "AI Search desired state must contain an instance");
            state.aiInstances.set(driftSpec.id, {
              ...structuredClone(driftSpec.create),
              embedding_model: "@cf/incompatible/model",
            });
          '''
          if text.count(old) != 1:
              raise SystemExit("immutable-drift fixture anchor missing or ambiguous")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          git rm -- .github/workflows/er26-ai-search-provisioner-test-sync.yml
          git diff --check

      - name: Commit synchronized fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-26: follow current AI Search desired generation [er26-test-synced]"
          git push origin HEAD:agent/ER-26-ai-search-readback-parity-20260903
