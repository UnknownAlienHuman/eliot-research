name: post-finalizer-wiki-publish-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-finalizer-wiki-publish-once.yml

permissions:
  contents: write

concurrency:
  group: post-finalizer-dead-code
  cancel-in-progress: false

jobs:
  publish-route:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Refresh after local backend finalization
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            git fetch origin main
            if ! git cat-file -e origin/main:.github/workflows/finalize-local-backend-once.yml 2>/dev/null; then
              git reset --hard origin/main
              echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              test -f apps/eliotr-core/src/wiki-service.ts
              exit 0
            fi
            sleep 15
          done
          echo 'local backend finalizer did not settle within one hour' >&2
          exit 1
      - name: Recover the retained reviewed-publication implementation
        shell: bash
        run: |
          set -euo pipefail
          git show 7a9a0578d336323945d94f608a45c680a26d3f40:.github/workflows/wiki-manual-publish-once.yml > /tmp/wiki-manual-publish-history.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/wiki-manual-publish-history.yml').read_text(encoding='utf-8').splitlines()
          candidates = []
          current_name = ''
          index = 0
          while index < len(source):
              named = re.match(r'^\s*-\s+name:\s*(.+?)\s*$', source[index])
              if named:
                  current_name = named.group(1).strip('"\'')
                  index += 1
                  continue
              block = re.match(r'^(\s*)run:\s*\|[-+]?\s*$', source[index])
              if block:
                  base = len(block.group(1))
                  index += 1
                  body = []
                  while index < len(source):
                      line = source[index]
                      if line.strip() and len(line) - len(line.lstrip()) <= base:
                          break
                      body.append(line[base + 2:] if len(line) >= base + 2 else '')
                      index += 1
                  script = '\n'.join(body).rstrip() + '\n'
                  score = (
                      script.count('publishWikiProposal') * 30
                      + script.count('research.wiki.publish') * 30
                      + script.count('wiki')
                      + script.count('cat >') * 10
                  )
                  candidates.append((score, len(script), current_name, script))
                  continue
              index += 1
          score, size, name, script = max(candidates, key=lambda item: (item[0], item[1]))
          if score < 80 or 'publishWikiProposal' not in script:
              raise SystemExit(f'reviewed publication implementation not found: score={score}, step={name}')
          forbidden = [token for token in ('git push', 'git commit', 'wrangler ', 'astro build', 'qdrant') if token in script.lower()]
          if forbidden:
              raise SystemExit(f'historical publication step contains forbidden effects: {forbidden}')
          Path('/tmp/materialize-wiki-publish.sh').write_text('set -euo pipefail\n' + script, encoding='utf-8')
          print(f'extracted {name}: score={score}, bytes={size}')
          PY
          bash /tmp/materialize-wiki-publish.sh
      - name: Enforce reviewed-publication authority
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn --include='*.ts' 'research.wiki.publish' apps/eliotr-core/src packages/interfaces/src >/dev/null
          grep -RIn --include='*.test.ts' 'WIKI_PUBLICATION_INCOMPLETE\|WIKI_POLICY_DENIED\|WIKI_HEAD_CONFLICT' apps/eliotr-core/test packages/research/src >/tmp/wiki-publish-negatives
          test -s /tmp/wiki-publish-negatives
          if grep -RIn --include='*.ts' 'reviewer_ref\s*:\s*(?:raw|request|body|record)\.' apps/eliotr-core/src packages/research/src; then
            echo 'caller-supplied reviewer identity reached publication authority' >&2
            exit 1
          fi
          if grep -RIn --include='*.ts' 'status:\s*"PUBLISHED"' apps/eliotr-core/src | grep -v 'wiki-service.ts'; then
            echo 'parallel Wiki publication path detected outside the canonical service' >&2
            exit 1
          fi
      - name: Enable pinned pnpm and install
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify reviewed publication locally
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @eliotr/research test
          pnpm --filter @eliotr/interfaces typecheck
          pnpm --filter @eliotr/core test
          pnpm --filter @eliotr/core typecheck
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit the verified Wiki publication route
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/post-finalizer-wiki-publish-once.yml
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose authority-gated Wiki publication"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$PRODUCT_BASE_SHA"
          git push origin HEAD:main
