name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Independent from verify/source budgets: a compiler failure must remain visible.
  # This prepares SQL only, not product fixtures or deployed D1 operations.
  d1-expression-depth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile both D1 schemas at expression depth 100
        run: node infra/d1/check-expression-depth.mjs

  source-budgets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Preserve native Windows source measurement
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enforce source heuristics without blocking independent jobs
        run: node scripts/check-budgets.mjs

  root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Record complete root test discovery without executing tests
        run: |
          pnpm --silent test:root:list --json > "$RUNNER_TEMP/root-vitest-files.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          const files = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'root-vitest-files.json'), 'utf8'));
          if (!Array.isArray(files) || files.length === 0 || files.some(entry => typeof entry.file !== 'string')) {
            throw new Error('Root Vitest discovery is missing or empty');
          }
          const names = files.map(entry => relative(process.cwd(), entry.file).replaceAll('\\', '/'));
          if (new Set(names).size !== names.length || names.some(name => name.startsWith('apps/eliotr-core/'))) {
            throw new Error('Root selection duplicates files or includes the separate Worker environment');
          }
          console.log(`Root Vitest selection: ${names.length} files`);
          console.log(names.sort().join('\n'));
          JS
      - name: Execute the complete root configuration once
        # No directory allowlist: new eligible directories are discovered automatically.
        # The native d1-mutations matrix deliberately repeats query-persistence on both OSes.
        run: pnpm test:root

  verify-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        id: dependencies
        run: |
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - name: Verify public repository privacy
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-public-repo-privacy.mjs
      - name: Verify normative contract fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm contracts:check
      - name: Verify package boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm boundaries:check
      - name: Prove forbidden imports fail closed
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm boundaries:negative
      - name: Verify swarm work packets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm work-packets:check
      - name: Verify branch and worktree hygiene
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm branch-hygiene:check
      - name: Verify delivery authority fixture
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm delivery:check
      - name: Verify ingest admission authority fixture
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm ingest:check
      - name: Verify projection execution authority fixture
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm projection:check
      - name: Verify exact evidence resolution authority fixture
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm evidence:check
      - name: Verify exact erasure closure authority fixture
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm erasure:check
      - name: Verify Gemini MCP integration fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm gemini:check
      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm typecheck
      - name: Typecheck navigation integration fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
      - name: Test Cloudflare provisioners
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:provisioners
      - name: Test Worker runtime
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:worker
      - name: Verify implementation-status registry
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm check:implementation-status
      - name: Build PWA
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: pwa-build
        run: pnpm build:pwa
      - name: Test built Library in Chromium with controlled HTTP fixtures
        if: ${{ !cancelled() && steps.pwa-build.outcome == 'success' }}
        run: pnpm test:library-browser
      - name: Prepare clean local PWA and both D1 stores
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: local-prepare
        run: pnpm local:prepare
      - name: Generate Cloudflare binding types
        if: ${{ !cancelled() && steps.local-prepare.outcome == 'success' }}
        id: binding-types
        run: pnpm cf:types
      - name: Dry-run Worker deployment
        if: ${{ !cancelled() && steps.pwa-build.outcome == 'success' && steps.binding-types.outcome == 'success' }}
        run: pnpm cf:dry-run

  research-screen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pwa
      - name: Question-first Research and exact citation UI (controlled HTTP)
        run: node scripts/test-library-browser.mjs --research-screen
        env:
          ELIOTR_SCREENSHOT_DIR: ${{ runner.temp }}/research-screen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-screen-${{ matrix.os }}
          path: ${{ runner.temp }}/research-screen/
          if-no-files-found: error
          retention-days: 7

  # These native SQL regressions must still run when an unrelated lint/budget
  # gate blocks the full suite. The existing verify and release gates remain.
  d1-mutations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Typecheck production and strict Worker tests
        id: d1-types
        run: |
          pnpm typecheck
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
      - name: Project and Wiki mutations on actual workerd D1 and R2
        # Keep independent cold workerd/migration pools from competing for the
        # same Windows host; per-test deadlines and in-test races stay intact.
        run: pnpm --dir apps/eliotr-core exec vitest run test/project-owner-service.test.ts test/wiki-owner-edit-parity.test.ts --no-file-parallelism

      # Independent regressions still run after a Project/Wiki failure; no
      # continue-on-error is used, so the job retains every failing result.
      - name: Backend execution fingerprint and deployment authority
        if: ${{ !cancelled() && steps.d1-types.outcome == 'success' }}
        run: |
          node scripts/test-research-backend-fingerprint.mjs
          node scripts/test-research-deployment-authority.mjs
      - name: Research continuation on actual workerd D1 and R2
        if: ${{ !cancelled() && steps.d1-types.outcome == 'success' }}
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-deployment-compatibility.test.ts --no-file-parallelism

      - name: Research recovery and canonical terminal settlement on actual DO D1 R2
        if: ${{ !cancelled() && steps.d1-types.outcome == 'success' }}
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-workflow-recovery.test.ts --no-file-parallelism
      - name: Canonical cancellation persistence and session identity after actual DO eviction
        if: ${{ !cancelled() && steps.d1-types.outcome == 'success' }}
        # The full Worker suite above still selects every test in this file.
        # This independent S16 check does not claim the unrelated admission fixtures pass.
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-session.test.ts --no-file-parallelism -t 'canonical cancellation persistence|starts, reads'

      # Intentional overlap with root-tests: one exact-query regression on both OSes.
      - name: Query persistence compatibility rejection and integrity
        if: ${{ !cancelled() && steps.d1-types.outcome == 'success' }}
        run: pnpm exec vitest run packages/retrieval/src/query-persistence.test.ts
      - name: Exact query replay and scope substitution on actual D1 and R2
        if: ${{ !cancelled() && steps.d1-types.outcome == 'success' }}
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-query-replay.test.ts --no-file-parallelism


  research-semantic:
    name: research-semantic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Typecheck production and strict Worker tests
        id: semantic-types
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
      - name: Research retrieval factory and legacy generation compatibility
        if: ${{ !cancelled() && steps.semantic-types.outcome == 'success' }}
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-retrieve-branches.test.ts --no-file-parallelism
      - name: Research semantic retrieval and exact evidence on actual D1 and R2
        if: ${{ !cancelled() && steps.semantic-types.outcome == 'success' }}
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-retrieve-semantic.test.ts --no-file-parallelism
      - name: Current protocol admission over actual HTTP and D1
        if: ${{ !cancelled() && steps.semantic-types.outcome == 'success' }}
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-input.test.ts --no-file-parallelism
      - name: Materialized history and control across stored generations
        if: ${{ !cancelled() && steps.semantic-types.outcome == 'success' }}
        run: pnpm --dir apps/eliotr-core exec vitest run test/research-run-status.test.ts --no-file-parallelism

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component clippy \
            --component llvm-tools-preview \
            --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default 1.98.0
      - name: Install pinned branch-coverage toolchain
        run: |
          rustup toolchain install nightly-2026-08-31 \
            --profile minimal \
            --component llvm-tools-preview
      - name: Install checksum-verified pinned Cargo tools
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: |
            cargo-nextest@0.9.143
            cargo-deny@0.20.2
            cargo-llvm-cov@0.9.0
          fallback: none
      - name: Verify pinned Cargo tool versions
        run: |
          cargo nextest --version | grep -F "cargo-nextest 0.9.143"
          cargo deny --version | grep -F "cargo-deny 0.20.2"
          cargo llvm-cov --version | grep -F "cargo-llvm-cov 0.9.0"
      - name: Verify locked workspace metadata
        run: cargo metadata --all-features --locked --format-version 1 > /dev/null
      - name: Verify Rust language boundaries
        run: node scripts/check-rust-boundaries.mjs
      - name: Verify shared vectors through TypeScript
        run: node scripts/check-rust-vectors.mjs
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint every Rust target and feature
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run native Rust tests
        run: cargo nextest run --workspace --all-features --locked
      - name: Run Rust documentation tests
        run: cargo test --doc --workspace --all-features --locked
      - name: Audit Rust dependencies and sources
        run: cargo deny check
      - name: Build and inspect the default portable Rust workspace
        run: |
          cargo build --workspace --target wasm32-unknown-unknown --release --locked
          node scripts/check-rust-wasm.mjs --mode default
      - name: Execute exact vectors through compiled Rust/Wasm
        run: |
          cargo build \
            --package eliotr-kernel-wasm \
            --target wasm32-unknown-unknown \
            --release \
            --features m1-self-test-export \
            --locked
          node scripts/check-rust-wasm.mjs --mode self-test
      - name: Enforce deterministic-core coverage
        run: |
          cargo +nightly-2026-08-31 llvm-cov \
            --package eliotr-canonical \
            --package eliotr-test-vectors \
            --all-features \
            --locked \
            --branch \
            --fail-under-lines 90 \
            --text
      - name: Verify the scheduled fuzz dependency lock
        run: |
          test -f fuzz/Cargo.lock
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          test -z "$(git status --porcelain -- fuzz/Cargo.lock)"

  windows-tooling:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Exercise native Windows checkout line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node-ready
        with:
          node-version: 22
      - name: Verify package boundaries on Windows
        if: ${{ !cancelled() && steps.node-ready.outcome == 'success' }}
        run: node scripts/check-boundaries.mjs
      - name: Verify Fetch-forbidden local Workers port guard on Windows
        if: ${{ !cancelled() && steps.node-ready.outcome == 'success' }}
        run: node scripts/test-miniflare-port-guard.mjs
      - name: Prove portable checkout and negative gates on Windows
        if: ${{ !cancelled() && steps.node-ready.outcome == 'success' }}
        run: node scripts/test-boundary-negative.mjs
      - name: Verify deployment HTTP guards on Windows
        if: ${{ !cancelled() && steps.node-ready.outcome == 'success' }}
        run: node scripts/test-deployment-verification.mjs
      - name: Verify deployment ordering on Windows
        if: ${{ !cancelled() && steps.node-ready.outcome == 'success' }}
        run: node scripts/test-deployment-orchestration.mjs
      - name: Prove test fixtures leave the checkout unchanged
        if: ${{ !cancelled() && steps.node-ready.outcome == 'success' }}
        run: |
          $changes = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) { Write-Error "Tests changed the checkout: $changes"; exit 1 }

  local-launch:
    name: local-launch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 10
          - os: windows-latest
            timeout_minutes: 15
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify local isolation and command ordering
        run: pnpm test:local-launch
      - name: Verify owner session and explicit local policy setup
        run: pnpm test:local-owner
      - name: Boot actual Worker with full local migrations, then restart
        run: pnpm local:smoke
      - name: Run actual owner browser acceptance
        run: pnpm test:owner-e2e

  # Retain the existing verify check name as the aggregate, not a success-only leaf.
  verify:
    if: ${{ always() }}
    needs:
      - d1-expression-depth
      - source-budgets
      - root-tests
      - verify-checks
      - research-screen
      - d1-mutations
      - research-semantic
      - rust
      - windows-tooling
      - local-launch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const results = JSON.parse(process.env.CI_NEEDS);
          if (results === null || typeof results !== 'object' || Array.isArray(results)) {
            throw new Error('Mandatory CI results are unavailable');
          }
          const jobs = Object.entries(results);
          if (jobs.length === 0) throw new Error('Mandatory CI results are empty');
          const lines = jobs.map(([name, result]) => `${name}: ${result?.result ?? 'missing'}`);
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Mandatory CI results\n\n${lines.join('  \n')}\n`);
          }
          // Failed, cancelled, skipped, malformed or missing evidence is never a green gate.
          if (jobs.some(([, result]) => result?.result !== 'success')) process.exitCode = 1;
          JS
