name: prepare-s27-verified-tree
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-s27.yml
      - .github/payloads/s27/**
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_HOME: /tmp/eliotr-corepack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Restore exact locally reviewed tree without updating main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = c238400c01302367447eb83efa105f20d8248635
          cat .github/payloads/s27/*.part | base64 -d > /tmp/s27.patch.gz
          echo '63b516fd60bfb22261d052e4b2df196e2f7bfc92acbb84b10a87a60bcd0e9c9b  /tmp/s27.patch.gz' | sha256sum -c -
          gzip -dc /tmp/s27.patch.gz > /tmp/s27.patch
          echo 'a9065dcc94f89792d66f3f1788d177858bc78c0ec3591efd36220138b81cd9f2  /tmp/s27.patch' | sha256sum -c -
          git apply --check /tmp/s27.patch
          git apply --index /tmp/s27.patch
          git rm -r .github/payloads/s27 .github/workflows/prepare-s27.yml
          test "$(git write-tree)" = 0bb0034f8cf80fae65a77a28d6c4db3361baa6e9
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify S27 and unchanged product contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/s27-result
          node scripts/test-branch-hygiene.mjs | tee /tmp/s27-result/tests.log
          node node_modules/eslint/bin/eslint.js scripts/branch-hygiene-lib.mjs scripts/branch-hygiene.mjs scripts/test-branch-hygiene.mjs
          node node_modules/typescript/bin/tsc -b --pretty false
          node scripts/check-boundaries.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          git diff --cached --check
          test "$(git write-tree)" = 0bb0034f8cf80fae65a77a28d6c4db3361baa6e9
      - name: Store verified Git objects only; caller publishes the ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git`;
          async function post(path, body) {
            const response = await fetch(`${root}/${path}`, {method:'POST', headers:{authorization:`Bearer ${process.env.GH_TOKEN}`, accept:'application/vnd.github+json', 'content-type':'application/json', 'x-github-api-version':'2022-11-28'}, body:JSON.stringify(body)});
            if (!response.ok) throw new Error(`Git object creation failed: ${response.status}`);
            return response.json();
          }
          const entries = [];
          const paths = git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean);
          for (const path of paths) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode, expected] = index.split(/\s+/);
            const bytes = git('cat-file','blob',expected);
            const blob = await post('blobs',{content:bytes.toString('base64'),encoding:'base64'});
            if (blob.sha !== expected) throw new Error(`Blob identity mismatch: ${path}`);
            entries.push({path,mode,type:'blob',sha:blob.sha});
          }
          const tree = await post('trees',{base_tree:text('rev-parse','HEAD^{tree}'),tree:entries});
          if (tree.sha !== '0bb0034f8cf80fae65a77a28d6c4db3361baa6e9') throw new Error('Tree identity mismatch');
          writeFileSync('/tmp/s27-result/verified-tree.json',JSON.stringify({base_sha:process.env.GITHUB_SHA,tree_sha:tree.sha,ref_updated:false,checks:['17 hygiene tests','scoped eslint','product typecheck','boundaries','work packets','implementation registry','generated contracts','diff check']},null,2));
          JS
      - name: Export public pinned local tools
        run: |
          tar -C "$COREPACK_HOME" -czf /tmp/s27-result/corepack.tar.gz .
          cp "$(command -v node)" /tmp/s27-result/node
          node --version > /tmp/s27-result/VERSIONS
          pnpm --version >> /tmp/s27-result/VERSIONS
          (cd /tmp/s27-result && sha256sum corepack.tar.gz node verified-tree.json tests.log > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: s27-verified-tree-and-tools
          path: /tmp/s27-result/
          retention-days: 1
          if-no-files-found: error
