name: er26-generation-operator-recovery

on:
  push:
    branches:
      - agent/ER-26-ai-search-generation-operator-20260904

permissions:
  contents: write

concurrency:
  group: er26-generation-operator-recovery
  cancel-in-progress: false

jobs:
  recover-final-tree:
    if: ${{ !contains(github.event.head_commit.message, '[er26-recovery-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-generation-operator-20260904
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Recover finalized operator content and ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          cli_path = Path("scripts/manage-ai-search-generation.mjs")
          cli = cli_path.read_text(encoding="utf-8")

          if "const documentSha256 = createHash" not in cli:
              pattern = re.compile(
                  r'''  const suffix = `\$\{receipt\.revision\}-\$\{receipt\.artifact_sha256\.slice\(0, 16\)\}`;\n'''
                  r'''  const path = resolve\(\n'''
                  r'''    stateDirectory,\n'''
                  r'''    `ai-search-generation-\$\{document\.operation\.toLowerCase\(\)\}-\$\{suffix\}\.json`,\n'''
                  r'''  \);\n'''
                  r'''  const bytes = `\$\{JSON\.stringify\(document, null, 2\)\}\\n`;'''
              )
              replacement = '''  const bytes = `${JSON.stringify(document, null, 2)}\\n`;
          const documentSha256 = createHash("sha256").update(bytes).digest("hex");
          const suffix =
            `${receipt.revision}-${receipt.artifact_sha256.slice(0, 16)}-${documentSha256.slice(0, 16)}`;
          const path = resolve(
            stateDirectory,
            `ai-search-generation-${document.operation.toLowerCase()}-${suffix}.json`,
          );'''
              cli, count = pattern.subn(replacement, cli, count=1)
              if count != 1:
                  raise SystemExit("operator receipt-path anchor missing or ambiguous")

          if "managed_ai_search_mutation: false" not in cli:
              old = "    live_provider_mutation: false,\n"
              new = '''    registry_d1_operation:
              command === "status" ? "READ_ONLY" : "MUTATING",
            managed_ai_search_mutation: false,
          '''
              if cli.count(old) != 1:
                  raise SystemExit("operator mutation-classification anchor missing or ambiguous")
              cli = cli.replace(old, new)

          cli_path.write_text(cli, encoding="utf-8")

          runner_path = Path("scripts/run-provisioner-tests.mjs")
          runner = runner_path.read_text(encoding="utf-8")
          operator_import = 'await import("./test-ai-search-generation-operator.mjs");\n'
          if operator_import not in runner:
              runner = runner.rstrip() + "\n" + operator_import
          runner_path.write_text(runner, encoding="utf-8")

          packet_id = "ER-26"
          packet_path = Path("docs/agent-work/ER-26-cloudflare-provisioning-and-deployment.md")
          manifest_path = Path("docs/agent-work/manifest.json")
          candidates = [
              "scripts/lib/cloudflare-d1-http.mjs",
              "scripts/manage-ai-search-generation.mjs",
              "scripts/run-provisioner-tests.mjs",
              "scripts/test-ai-search-generation-operator.mjs",
              "scripts/test-ai-search-provisioning-readback.mjs",
              "scripts/test-ai-search-provisioning-reconciliation.mjs",
          ]
          candidates = [path for path in candidates if Path(path).exists()]

          packet_text = packet_path.read_text(encoding="utf-8")
          packet_lines = packet_text.splitlines()
          headings = [
              index
              for index, line in enumerate(packet_lines)
              if line == "## Owned paths"
          ]
          if len(headings) != 1:
              raise SystemExit("ER-26 must contain exactly one Owned paths heading")
          start = headings[0] + 1
          end = next(
              (
                  index
                  for index in range(start, len(packet_lines))
                  if packet_lines[index].startswith("## ")
              ),
              len(packet_lines),
          )
          owned_paths = [
              line[3:-1]
              for line in packet_lines[start:end]
              if line.startswith("- `") and line.endswith("`")
          ]
          if len(owned_paths) != len(set(owned_paths)):
              raise SystemExit("ER-26 packet contains duplicate owned paths")

          insertion_anchor = "scripts/provision-ai-search.mjs"
          insertion_index = (
              owned_paths.index(insertion_anchor) + 1
              if insertion_anchor in owned_paths
              else len(owned_paths)
          )
          for candidate in candidates:
              if candidate not in owned_paths:
                  owned_paths.insert(insertion_index, candidate)
                  insertion_index += 1

          packet_lines[start:end] = [""] + [
              f"- `{path}`" for path in owned_paths
          ] + [""]
          packet_text = "\n".join(packet_lines).rstrip() + "\n"

          section = "## Active implementation slice — AI Search generation operator"
          if section not in packet_text:
              packet_text += f'''\n{section}\n\nThe operator uses the compiled generation lifecycle and the SEARCH_DB D1 adapter through the\nCloudflare D1 HTTP query endpoint. `status` is read-only. `declare`, `observe`, and `promote`\nrequire `--confirm-live`; promotion also requires the exact desired generation and the expected\nactive head. Credentials are accepted only through environment variables. Every registry mutation\nremains revision-and-digest fenced, requires exact authoritative readback, and is never retried while\nits effect is unknown.\n\n```text\npnpm exec tsc -b packages/cloudflare-ai/tsconfig.json --pretty false\nnode scripts/manage-ai-search-generation.mjs status\n```\n\nMutating commands write deterministic local receipts under `.eliotr-state`; they do not mutate an\nAI Search instance. Remote D1 execution, shadow indexing, T2/T3 adjudication, managed-generation\npromotion and rollback receipts remain `NOT_EXECUTED`.\n'''
          packet_path.write_text(packet_text, encoding="utf-8")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packets = {
              entry.get("id"): entry
              for entry in manifest.get("packets", [])
          }
          packet = packets.get(packet_id)
          if packet is None:
              raise SystemExit("ER-26 is absent from work-packet manifest")

          def pattern_kind(pattern):
              if pattern.endswith("/**"):
                  return True, pattern[:-3].rstrip("/")
              if "*" in pattern:
                  return True, pattern[:pattern.index("*")].rstrip("/")
              return False, pattern

          def patterns_overlap(left, right):
              left_broad, left_prefix = pattern_kind(left)
              right_broad, right_prefix = pattern_kind(right)
              if not left_broad and not right_broad:
                  return left_prefix == right_prefix
              if left_broad and right_broad:
                  return (
                      left_prefix == right_prefix
                      or left_prefix.startswith(right_prefix + "/")
                      or right_prefix.startswith(left_prefix + "/")
                  )
              broad_prefix = left_prefix if left_broad else right_prefix
              exact_prefix = right_prefix if left_broad else left_prefix
              return (
                  exact_prefix == broad_prefix
                  or exact_prefix.startswith(broad_prefix + "/")
              )

          for candidate in candidates:
              for other_id, other in packets.items():
                  if other_id == packet_id:
                      continue
                  for claim in other.get("owned_paths", []):
                      if patterns_overlap(candidate, claim):
                          raise SystemExit(
                              f"{candidate} overlaps {other_id}:{claim}"
                          )

          packet["owned_paths"] = owned_paths
          manifest["baseline_commit"] = subprocess.check_output(
              ["git", "rev-parse", "origin/main"],
              text=True,
          ).strip()
          manifest["generated_at"] = (
              datetime.now(timezone.utc)
              .isoformat(timespec="seconds")
              .replace("+00:00", "Z")
          )
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git rm -f --ignore-unmatch -- \
            .github/workflows/er26-generation-operator-finalize.yml \
            .github/workflows/er26-provisioner-ownership-complete.yml \
            .github/workflows/er26-generation-operator-recovery.yml
          git diff --check

      - name: Install frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify recovered operator tree
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc -b packages/cloudflare-ai/tsconfig.json --pretty false
          node scripts/test-ai-search-generation-operator.mjs
          node scripts/run-provisioner-tests.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-budgets.mjs
          pnpm lint
          pnpm typecheck

      - name: Commit verified recovered tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-26: recover finalized generation operator [er26-recovery-finalized]"
          git push origin HEAD:agent/ER-26-ai-search-generation-operator-20260904
