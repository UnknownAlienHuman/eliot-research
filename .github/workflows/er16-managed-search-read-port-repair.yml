name: er16-managed-search-read-port-repair

on:
  push:
    branches:
      - agent/ER-16-managed-search-read-port-20260903

permissions:
  contents: write

concurrency:
  group: er16-managed-search-read-port-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-managed-search-read-port-20260903
          fetch-depth: 0

      - name: Repair generated EOF handling
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/er16-managed-search-read-port-sync.yml")
          text = path.read_text(encoding="utf-8")
          old = 'path.write_text(text.rstrip() + addition + "\\n", encoding="utf-8")'
          new = 'path.write_text(text.rstrip() + addition.rstrip() + "\\n", encoding="utf-8")'
          if text.count(old) != 1:
              raise SystemExit("EOF generator anchor missing or ambiguous")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git rm -- .github/workflows/er16-managed-search-read-port-repair.yml
          git diff --check

      - name: Commit repaired generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: repair managed-read materializer EOF"
          git push origin HEAD:agent/ER-16-managed-search-read-port-20260903
