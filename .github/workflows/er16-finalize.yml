name: er16-finalize-managed-search-locator

on:
  push:
    branches:
      - agent/ER-16-managed-search-locator-boundary-20260902

permissions:
  contents: write

concurrency:
  group: er16-finalize-managed-search-locator
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[er16-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-managed-search-locator-boundary-20260902
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Materialize exact ER-16 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .er16-payload/piece-*.b64 > /tmp/er16-payload.tar.gz.b64
          base64 --decode /tmp/er16-payload.tar.gz.b64 > /tmp/er16-payload.tar.gz
          echo "005e35b942c1201d30e617adf0a14cdf498c0e37ecad29e22bfaf00a65f4b306  /tmp/er16-payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/er16-payload.tar.gz -C .
          rm -rf .er16-payload
          git rm -- .github/workflows/er16-finalize.yml
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify exact ER-16 change before commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm work-packets:check
          pnpm boundaries:check
          pnpm budgets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/platform-cloudflare/src/ai-search.test.ts --reporter=verbose
          git diff --check

      - name: Commit verified ER-16 change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: implement strict AI Search locator decoding [er16-finalized]"
          git push origin HEAD:agent/ER-16-managed-search-locator-boundary-20260902
