name: post-finalizer-dead-code-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-finalizer-dead-code-once.yml

permissions:
  contents: write

concurrency:
  group: post-finalizer-dead-code
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Wait for local backend finalization
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            git fetch origin main
            if ! git cat-file -e origin/main:.github/workflows/finalize-local-backend-once.yml 2>/dev/null; then
              git reset --hard origin/main
              echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo 'local backend finalizer did not settle within one hour' >&2
          exit 1
      - name: Enable pinned pnpm and install
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Build conservative production reachability graph
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/check-production-reachability.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import process from "node:process";
          import ts from "typescript";

          const ROOT = process.cwd();
          const EXTENSIONS = [".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs"];
          const EXCLUDED = new Set(["node_modules", "dist", "target", ".git", "coverage", "fixtures"]);
          const APPLY = process.argv.includes("--apply");
          const PRODUCTION_ROOTS = [path.join(ROOT, "packages"), path.join(ROOT, "apps", "eliotr-core", "src")];

          function normalized(file) { return path.normalize(file); }
          function relative(file) { return path.relative(ROOT, file).replaceAll("\\", "/"); }
          function walk(directory) {
            if (!fs.existsSync(directory)) return [];
            const output = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (EXCLUDED.has(entry.name)) continue;
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) output.push(...walk(absolute));
              else if (EXTENSIONS.includes(path.extname(entry.name))) output.push(normalized(absolute));
            }
            return output;
          }
          function isTest(file) {
            const unix = relative(file);
            return /(?:^|\/)(?:test|tests)(?:\/|$)/u.test(unix)
              || /\.(?:test|spec)\.[cm]?[jt]sx?$/u.test(unix);
          }
          const files = new Set(PRODUCTION_ROOTS.flatMap(walk).filter((file) => !isTest(file)));

          function resolveFile(candidate) {
            const attempts = [candidate];
            const extension = path.extname(candidate);
            if ([".js", ".mjs", ".cjs"].includes(extension)) {
              attempts.push(candidate.slice(0, -extension.length) + ".ts");
              attempts.push(candidate.slice(0, -extension.length) + ".tsx");
            }
            if (!extension) {
              for (const suffix of EXTENSIONS) attempts.push(candidate + suffix);
              for (const suffix of EXTENSIONS) attempts.push(path.join(candidate, "index" + suffix));
            }
            return attempts.map(normalized).find((attempt) => files.has(attempt)) ?? null;
          }

          const workspaces = new Map();
          for (const directory of [path.join(ROOT, "packages"), path.join(ROOT, "apps")]) {
            if (!fs.existsSync(directory)) continue;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const packageDirectory = path.join(directory, entry.name);
              const manifestPath = path.join(packageDirectory, "package.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              if (typeof manifest.name === "string") workspaces.set(manifest.name, packageDirectory);
            }
          }

          function exportedFiles(packageDirectory) {
            const manifestPath = path.join(packageDirectory, "package.json");
            if (!fs.existsSync(manifestPath)) return [];
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const raw = [];
            function collect(value) {
              if (typeof value === "string") raw.push(value);
              else if (Array.isArray(value)) value.forEach(collect);
              else if (value && typeof value === "object") Object.values(value).forEach(collect);
            }
            collect(manifest.exports);
            collect(manifest.main);
            collect(manifest.module);
            collect(manifest.types);
            const result = raw
              .filter((value) => value.startsWith("."))
              .map((value) => resolveFile(path.resolve(packageDirectory, value)))
              .filter(Boolean);
            const index = resolveFile(path.join(packageDirectory, "src", "index"));
            if (index) result.push(index);
            return [...new Set(result)];
          }

          function resolveSpecifier(owner, specifier) {
            if (specifier.startsWith(".")) return resolveFile(path.resolve(path.dirname(owner), specifier));
            const packageName = [...workspaces.keys()]
              .sort((left, right) => right.length - left.length)
              .find((name) => specifier === name || specifier.startsWith(name + "/"));
            if (!packageName) return null;
            const directory = workspaces.get(packageName);
            const suffix = specifier.slice(packageName.length).replace(/^\//u, "");
            if (suffix) {
              const direct = resolveFile(path.join(directory, "src", suffix));
              if (direct) return direct;
            }
            return exportedFiles(directory)[0] ?? null;
          }

          function parse(file) {
            const sourceText = fs.readFileSync(file, "utf8");
            const source = ts.createSourceFile(file, sourceText, ts.ScriptTarget.Latest, true);
            const specifiers = [];
            let hasTopLevelEffect = false;
            function literal(node) {
              if (node && ts.isStringLiteralLike(node)) specifiers.push(node.text);
            }
            for (const statement of source.statements) {
              if (ts.isImportDeclaration(statement)) {
                literal(statement.moduleSpecifier);
                if (!statement.importClause) hasTopLevelEffect = true;
              } else if (ts.isExportDeclaration(statement)) {
                literal(statement.moduleSpecifier);
              } else if (
                !ts.isInterfaceDeclaration(statement)
                && !ts.isTypeAliasDeclaration(statement)
                && !ts.isFunctionDeclaration(statement)
                && !ts.isClassDeclaration(statement)
                && !ts.isEnumDeclaration(statement)
                && !ts.isImportDeclaration(statement)
                && !ts.isExportDeclaration(statement)
                && !(ts.isVariableStatement(statement) && statement.modifiers?.some((modifier) => modifier.kind === ts.SyntaxKind.ExportKeyword))
              ) {
                hasTopLevelEffect = true;
              }
            }
            function visit(node) {
              if (ts.isCallExpression(node) && node.arguments.length === 1) {
                if (node.expression.kind === ts.SyntaxKind.ImportKeyword
                    || (ts.isIdentifier(node.expression) && node.expression.text === "require")) {
                  literal(node.arguments[0]);
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            return {
              dependencies: specifiers.map((specifier) => resolveSpecifier(file, specifier)).filter(Boolean),
              hasTopLevelEffect,
            };
          }

          const parsed = new Map([...files].map((file) => [file, parse(file)]));
          const roots = new Set();
          for (const directory of workspaces.values()) exportedFiles(directory).forEach((file) => roots.add(file));
          for (const name of ["index", "worker"] ) {
            const entry = resolveFile(path.join(ROOT, "apps", "eliotr-core", "src", name));
            if (entry) roots.add(entry);
          }
          for (const config of ["wrangler.toml", "wrangler.json", "wrangler.jsonc"]) {
            const file = path.join(ROOT, "apps", "eliotr-core", config);
            if (!fs.existsSync(file)) continue;
            const match = fs.readFileSync(file, "utf8").match(/(?:^|\n)\s*(?:"main"|main)\s*[:=]\s*["']([^"']+)["']/u);
            if (match) {
              const entry = resolveFile(path.resolve(path.dirname(file), match[1]));
              if (entry) roots.add(entry);
            }
          }

          const reachable = new Set();
          const queue = [...roots];
          while (queue.length > 0) {
            const file = queue.pop();
            if (!file || reachable.has(file)) continue;
            reachable.add(file);
            for (const dependency of parsed.get(file)?.dependencies ?? []) queue.push(dependency);
          }

          const statusPath = path.join(ROOT, "docs", "implementation", "implementation-status.json");
          const registered = new Set();
          if (fs.existsSync(statusPath)) {
            const status = JSON.parse(fs.readFileSync(statusPath, "utf8"));
            for (const entry of status.entries ?? []) {
              if (typeof entry.path === "string") registered.add(normalized(path.join(ROOT, entry.path)));
            }
          }

          const textCorpus = [];
          for (const directory of [path.join(ROOT, "scripts"), path.join(ROOT, "tests"), path.join(ROOT, "docs"), path.join(ROOT, "infra")]) {
            if (!fs.existsSync(directory)) continue;
            for (const file of walk(directory)) textCorpus.push(fs.readFileSync(file, "utf8"));
          }
          const corpus = textCorpus.join("\n");
          const candidates = [...files]
            .filter((file) => !reachable.has(file))
            .filter((file) => !registered.has(file))
            .filter((file) => !parsed.get(file)?.hasTopLevelEffect)
            .filter((file) => {
              const unix = relative(file);
              const withoutExtension = unix.slice(0, -path.extname(unix).length);
              const basename = path.basename(withoutExtension);
              return !corpus.includes(unix) && !corpus.includes(withoutExtension) && !corpus.includes(basename);
            })
            .sort();

          const allUnreachable = [...files].filter((file) => !reachable.has(file)).sort();
          const report = {
            protocol: "eliotr.production-reachability.v2",
            production_modules: files.size,
            reachable_modules: reachable.size,
            registered_unreachable: allUnreachable.filter((file) => registered.has(file)).map(relative),
            conservative_dead_candidates: candidates.map(relative),
          };
          const reportPath = path.join(ROOT, "infra", "verification", "production-reachability.json");
          fs.mkdirSync(path.dirname(reportPath), { recursive: true });
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + "\n");
          if (APPLY) {
            for (const file of candidates) fs.unlinkSync(file);
            console.log(`Deleted ${candidates.length} proven unreachable production modules`);
          } else if (candidates.length > 0) {
            console.error(`Proven unreachable production modules:\n${candidates.map((file) => `- ${relative(file)}`).join("\n")}`);
            process.exitCode = 1;
          } else {
            console.log(`Production reachability ${reachable.size}/${files.size}; no proven dead candidates`);
          }
          EOF
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts ??= {};
          pkg.scripts['dead-code:check'] = 'node scripts/check-production-reachability.mjs';
          pkg.scripts['dead-code:prune'] = 'node scripts/check-production-reachability.mjs --apply';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Prune candidates and verify every removal as one set
        shell: bash
        run: |
          set -euo pipefail
          pnpm dead-code:prune
          deleted="$(git ls-files --deleted -- '*.ts' '*.tsx' '*.js' '*.mjs' | wc -l)"
          echo "Deleted candidate modules: $deleted"
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          pnpm --filter @eliotr/contracts test
          pnpm --filter @eliotr/domain test
          pnpm --filter @eliotr/policy test
          pnpm --filter @eliotr/retrieval test
          pnpm --filter @eliotr/research test
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm rust:check
          pnpm dead-code:check
          git diff --check
      - name: Wire permanent CI prevention and ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          root = Path.cwd()
          ci_path = root / '.github/workflows/ci.yml'
          ci = ci_path.read_text(encoding='utf-8')
          if 'pnpm dead-code:check' not in ci:
              anchor = 'pnpm budgets:check'
              if anchor not in ci: raise SystemExit('CI budget anchor missing')
              ci = ci.replace(anchor, anchor + '\n          pnpm dead-code:check', 1)
              ci_path.write_text(ci, encoding='utf-8', newline='\n')

          values = [
              'scripts/check-production-reachability.mjs',
              'infra/verification/production-reachability.json',
          ]
          manifest_path = root / 'docs/agent-work/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          def find(value):
              if isinstance(value, dict):
                  if value.get('id') == 'ER-00': return value
                  for child in value.values():
                      found = find(child)
                      if found is not None: return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child)
                      if found is not None: return found
              return None
          packet = find(manifest)
          if packet is None: raise SystemExit('ER-00 packet missing')
          key = 'owned_paths' if 'owned_paths' in packet else 'ownedPaths'
          for value in values:
              if value not in packet[key]: packet[key].append(value)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          docs = list((root / 'docs/agent-work').glob('ER-00-*.md'))
          if len(docs) != 1: raise SystemExit(f'expected one ER-00 doc, found {len(docs)}')
          path = docs[0]
          text = path.read_text(encoding='utf-8')
          heading = re.search(r'(?im)^##\s+Owned paths\s*$', text)
          if heading is None: raise SystemExit('ER-00 Owned paths missing')
          additions = ''.join(f'\n- `{value}`' for value in values if f'`{value}`' not in text[heading.end():])
          path.write_text(text[:heading.end()] + additions + text[heading.end():], encoding='utf-8', newline='\n')
          PY
          pnpm work-packets:check
      - name: Commit verified dead-code cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/post-finalizer-dead-code-once.yml
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove proven unreachable production modules"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$PRODUCT_BASE_SHA"
          git push origin HEAD:main
