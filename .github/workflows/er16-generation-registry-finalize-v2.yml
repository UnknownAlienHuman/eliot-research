name: er16-generation-registry-finalize-v2

on:
  push:
    branches:
      - agent/ER-16-ai-search-generation-registry-20260903

permissions:
  contents: write

concurrency:
  group: er16-generation-registry-finalize-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[er16-registry-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-ai-search-generation-registry-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Repair registry decoder and package exports
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          index_path = Path("packages/cloudflare-ai/src/index.ts")
          index = index_path.read_text(encoding="utf-8")
          anchor = 'export * from "./ai-search-generation.js";\n'
          addition = (
              'export * from "./ai-search-generation-registry-contract.js";\n'
              'export * from "./ai-search-generation-registry-codec.js";\n'
              'export { createAiSearchGenerationRegistryService } from "./ai-search-generation-registry.js";\n'
          )
          if index.count(anchor) != 1 or addition in index:
              raise SystemExit("unexpected cloudflare-ai index state")
          index_path.write_text(index.replace(anchor, anchor + addition, 1), encoding="utf-8")

          codec_path = Path("packages/cloudflare-ai/src/ai-search-generation-registry-codec.ts")
          codec = codec_path.read_text(encoding="utf-8")
          old_constant = 'const IDENTIFIER = /^[A-Za-z0-9][A-Za-z0-9._:@/-]{0,255}$/u;\n'
          new_constant = old_constant + 'const MODEL_TOKEN = /^[A-Za-z0-9._:@/-]{1,256}$/u;\n'
          if codec.count(old_constant) != 1:
              raise SystemExit("unexpected registry identifier declaration")
          codec = codec.replace(old_constant, new_constant, 1)

          digest_helper = (
              'function digest(value: unknown, label: string): string {\n'
              '  if (typeof value !== "string" || !SHA256.test(value)) {\n'
              '    readbackFailure(`${label} is not canonical SHA-256`);\n'
              '  }\n'
              '  return value;\n'
              '}\n'
          )
          model_helper = (
              '\nfunction modelToken(value: unknown, label: string): string {\n'
              '  if (typeof value !== "string" || !MODEL_TOKEN.test(value)) {\n'
              '    readbackFailure(`${label} is not a bounded model token`);\n'
              '  }\n'
              '  return value;\n'
              '}\n'
          )
          if codec.count(digest_helper) != 1:
              raise SystemExit("unexpected registry digest helper")
          codec = codec.replace(digest_helper, digest_helper + model_helper, 1)

          old_call = '    ? identifier(value.embedding_model, `${label}.embedding_model`)\n'
          new_call = '    ? modelToken(value.embedding_model, `${label}.embedding_model`)\n'
          if codec.count(old_call) != 1:
              raise SystemExit("unexpected embedding-model decoder")
          codec_path.write_text(codec.replace(old_call, new_call, 1), encoding="utf-8")
          PY
          git rm -- .github/workflows/er16-generation-registry-finalize-v2.yml
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify exact generation-registry boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm work-packets:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/cloudflare-ai/src/ai-search-generation-registry.test.ts
          pnpm exec vitest run packages/cloudflare-ai/src
          pnpm cf:dry-run
          git diff --check

      - name: Commit verified clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: persist AI Search generation registry [er16-registry-finalized]"
          git push origin HEAD:agent/ER-16-ai-search-generation-registry-20260903
