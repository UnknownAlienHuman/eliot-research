name: stage-s13-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-s13-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Stage checksum-bound production blobs without moving refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const check = (value, reason) => { if (!value) throw new Error(reason); };
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const blobHash = (bytes) => hash('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, {
              method, headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git API ${method} ${path}: ${response.status}`);
            return response.json();
          }
          const head = process.env.GITHUB_SHA;
          const expectedTree = '03d3fba6f61083dd029d2c8032aa9bbca6949eae';
          const transporter = '.github/workflows/stage-s13-code.yml';
          check(text('branch', '--show-current') === 'main', 'Not on main');
          check(text('rev-parse', 'HEAD') === head, 'Concurrent main update');
          const baseTree = text('rev-parse', 'HEAD^{tree}');
          git('rm', '--', transporter);
          check(text('write-tree') === '5d7bd28a121fda8b318a0ef7b3c6b6036359744c', 'Base contents changed');
          const chunks = [];
          for (const sha of ['d06c5425e9457e1b9c287e0f36678eb3ea269a24','6d7a732cb4b618b2ad9e85bfddb61af30d4e51d6','09e0d6e1525dc4cd86dabd1d5d626fb7c2b89fe1','166e2eb5b7dc75ecfc1f03b63d9fdf87de5a8e6f']) {
            const blob = await api(`git/blobs/${sha}`);
            check(blob.encoding === 'base64', 'Unexpected blob encoding');
            const bytes = Buffer.from(blob.content, 'base64');
            check(blobHash(bytes) === sha, 'Transfer blob mismatch');
            chunks.push(bytes);
          }
          const wire = Buffer.concat(chunks);
          check(hash('sha256', wire) === '2397b3237de6ede5325b59cc24387ade0ab1b9ef5e9bb34e59fd2e704a5a489b', 'Transfer checksum mismatch');
          const patch = gunzipSync(Buffer.from(wire.toString('utf8'), 'base64'), { maxOutputLength: 100000 });
          check(hash('sha256', patch) === '7b64f66ddb5377e4ade043753120ef4dc7e8752932a295bf47070afaa80b8714', 'Patch checksum mismatch');
          const path = join(process.env.RUNNER_TEMP, 's13.patch');
          writeFileSync(path, patch);
          git('apply', '--unidiff-zero', '--check', path);
          git('apply', '--unidiff-zero', '--index', path);
          git('diff', '--cached', '--check');
          git('diff', '--exit-code');
          check(text('write-tree') === expectedTree, 'Reviewed tree mismatch');
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          check(paths.length === 14, 'Unexpected path count');
          const entries = [];
          for (const path of paths) {
            const entry = text('ls-files', '--stage', '--', path);
            if (!entry) {
              check(path === transporter, 'Unexpected deletion');
              entries.push({ path, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const [mode, sha] = entry.split(/\s+/);
            const bytes = git('cat-file', 'blob', sha);
            const saved = await api('git/blobs', 'POST', { content: bytes.toString('base64'), encoding: 'base64' });
            check(saved.sha === sha, `Stored blob mismatch: ${path}`);
            entries.push({ path, mode, type: 'blob', sha });
          }
          const output = join(process.env.RUNNER_TEMP, 's13-manifest');
          mkdirSync(output, { recursive: true });
          writeFileSync(join(output, 'manifest.json'), JSON.stringify({ head, baseTree, expectedTree, entries }, null, 2));
          console.log(`STAGED_TREE=${expectedTree}; ${entries.length} entries; no refs changed; no tests executed`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s13-code-manifest
          path: ${{ runner.temp }}/s13-manifest/manifest.json
          retention-days: 3
          if-no-files-found: error
