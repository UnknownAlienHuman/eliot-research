name: er26-ai-search-create-reconciliation-sync

on:
  push:
    branches:
      - agent/ER-26-ai-search-create-reconciliation-20260904

permissions:
  contents: write

concurrency:
  group: er26-ai-search-create-reconciliation-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[er26-create-reconciliation-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-create-reconciliation-20260904
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 22

      - name: Preserve provision-receipt namespace shape
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          provisioner = Path("scripts/provision-ai-search.mjs")
          text = provisioner.read_text(encoding="utf-8")
          old = '  namespace: { name: desired.namespace, disposition: namespaceDisposition },\n'
          new = '  namespace: desired.namespace,\n  namespace_disposition: namespaceDisposition,\n'
          if text.count(old) != 1:
              raise SystemExit("provision receipt namespace anchor missing or ambiguous")
          provisioner.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("scripts/test-ai-search-provisioning-create-reconciliation.mjs")
          text = test.read_text(encoding="utf-8")
          old = "  expectFailure(drifted, '\\\"field\\\": \\\"cache\\\"');\n"
          new = "  expectFailure(drifted, '\"field\": \"cache\"');\n"
          if text.count(old) == 1:
              test.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git rm -- .github/workflows/er26-ai-search-create-reconciliation-sync.yml
          git diff --check

      - name: Verify focused provisioner regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-provisioner-tests.mjs

      - name: Commit synchronized reconciliation slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-26: finalize AI Search create reconciliation [er26-create-reconciliation-synced]"
          git push origin HEAD:agent/ER-26-ai-search-create-reconciliation-20260904
