name: prepare-s24-verified-input-tree
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-s24.yml, .github/payloads/s24/**]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Restore exact reviewed tree, without publishing a ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 077909d6fa6e8df9cf55bb1bdb99e14f53f6736b
          cat .github/payloads/s24/*.part | base64 -d > /tmp/s24.patch.gz
          echo 'c355c93cd694ec01c91e002d9dcb501bc69595cd866379019bb104787b7ba5e2  /tmp/s24.patch.gz' | sha256sum -c -
          gzip -dc /tmp/s24.patch.gz > /tmp/s24.patch
          echo '2f0e7282cc0896a9479f94deafffd05a4618d700fc59cb7470dba33687a7ca47  /tmp/s24.patch' | sha256sum -c -
          git apply --check /tmp/s24.patch
          git apply --index /tmp/s24.patch
          git rm -r .github/payloads/s24 .github/workflows/prepare-s24.yml
          test "$(git write-tree)" = 373601f8c6d0cda822f058d219d0bf4defddd7d6
          mkdir -p /tmp/s24-proof
      - name: Install frozen toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Types, boundaries, contracts and scoped lint
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -b --pretty false
          node node_modules/typescript/bin/tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          mapfile -t files < <(git diff --cached --name-only HEAD | grep -E '\.(ts|mjs)$')
          node node_modules/eslint/bin/eslint.js "${files[@]}"
          git diff --cached --check
      - name: Retrieval, ledger, migration, UI and model-input regressions
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run packages/research packages/retrieval packages/cloudflare-research packages/cloudflare-navigation apps/eliotr-pwa/src/research-run-api.test.ts | tee /tmp/s24-proof/root-targeted.log
          node node_modules/vitest/vitest.mjs run infra/ai-search/model-gateway-execution.test.mjs -t S24 | tee /tmp/s24-proof/model-input.log
      - name: Actual local Workers, D1, R2 and workflow admission
        working-directory: apps/eliotr-core
        shell: bash
        run: |
          set -euo pipefail
          node ../../node_modules/vitest/vitest.mjs run test/research-input.test.ts test/research-protocol-freeze.test.ts test/navigation-service.test.ts test/bounded-json.test.ts | tee /tmp/s24-proof/workers.log
      - name: Store only verified Git blobs; authorized caller creates tree and publishes main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const expectedTree = '373601f8c6d0cda822f058d219d0bf4defddd7d6';
          if (text('write-tree') !== expectedTree) throw new Error('Verified tree changed');
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`;
          const entries = [];
          for (const path of git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean)) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode, expected] = index.split(/\s+/);
            const response = await fetch(root, {method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28'},body:JSON.stringify({content:git('cat-file','blob',expected).toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Blob upload failed: ${response.status}`);
            const blob = await response.json();
            if (blob.sha !== expected) throw new Error(`Blob identity mismatch: ${path}`);
            entries.push({path,mode,type:'blob',sha:blob.sha});
          }
          const proof = {base_sha:process.env.GITHUB_SHA,tree_sha:expectedTree,ref_updated:false,live_executed:false,entries};
          writeFileSync('/tmp/s24-proof/verified-tree.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s24-verified-input-tree
          path: /tmp/s24-proof/
          retention-days: 1
          if-no-files-found: error
