name: er01-materialize-reviewed-artifacts

on:
  push:
    branches:
      - "agent/ER-01-contract-registry-20260901"
    paths:
      - ".github/workflows/er01-materialize-reviewed-artifacts.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify owned source before generation
        run: |
          pnpm contracts:check
          pnpm boundaries:check
          pnpm budgets:check
          pnpm exec eslint packages/contracts/src docs/contracts/generate.mjs
          pnpm --filter @eliotr/contracts build
      - name: Regenerate the unpublished initial registry
        run: |
          rm -f docs/contracts/schema-corpus.v1.json docs/contracts/schema-index.v1.json docs/contracts/compatibility-registry.v1.json docs/contracts/canonical-fixtures.v1.json
          node docs/contracts/generate.mjs --bootstrap
      - name: Prove exact artifacts and append-only history
        run: |
          pnpm exec vitest run packages/contracts --reporter=verbose
          node docs/contracts/generate.mjs --check
          before="$(sha256sum docs/contracts/compatibility-registry.v1.json | cut -d' ' -f1)"
          node docs/contracts/generate.mjs --write
          after="$(sha256sum docs/contracts/compatibility-registry.v1.json | cut -d' ' -f1)"
          test "${before}" = "${after}"
          node docs/contracts/generate.mjs --check
          git diff --check
      - name: Commit generated artifacts
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contracts/schema-corpus.v1.json docs/contracts/schema-index.v1.json docs/contracts/compatibility-registry.v1.json docs/contracts/canonical-fixtures.v1.json
          git commit -m "docs(contracts): refresh reviewed schema artifacts"
          git push origin "HEAD:${HEAD_REF}"
