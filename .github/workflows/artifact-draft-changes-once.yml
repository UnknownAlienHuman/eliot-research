name: artifact-draft-changes-once

on:
  push:
    branches: [main]
    paths: [.github/workflows/artifact-draft-changes-once.yml]

permissions:
  contents: write

concurrency:
  group: artifact-draft-changes-once
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.head_commit.message == 'ci: emit terminal artifact draft changes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Bind terminal artifact draft authority to research changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path.cwd()
          sql_files = sorted((root / "infra/d1/core/migrations").glob("*.sql"))
          corpus = "\n".join(path.read_text(encoding="utf-8") for path in sql_files)

          def definitions():
              output = {}
              pattern = re.compile(r"CREATE\s+TABLE(?:\s+IF\s+NOT\s+EXISTS)?\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", re.I)
              for match in pattern.finditer(corpus):
                  name = match.group(1)
                  start = match.end()
                  depth = 1
                  quote = None
                  escaped = False
                  for index in range(start, len(corpus)):
                      char = corpus[index]
                      if quote is not None:
                          if escaped: escaped = False
                          elif char == "\\": escaped = True
                          elif char == quote: quote = None
                          continue
                      if char in ("'", '"'): quote = char
                      elif char == "(": depth += 1
                      elif char == ")":
                          depth -= 1
                          if depth == 0:
                              output[name] = corpus[start:index]
                              break
              return output

          table_defs = definitions()
          def columns(name):
              body = table_defs[name]
              result = {}
              for raw in body.splitlines():
                  line = raw.strip().rstrip(",")
                  if not line or re.match(r"^(PRIMARY|UNIQUE|FOREIGN|CHECK|CONSTRAINT)\b", line, re.I): continue
                  match = re.match(r'^(?:"([^"]+)"|`([^`]+)`|\[([^\]]+)\]|([A-Za-z_][A-Za-z0-9_]*))\s+([A-Za-z]+)', line)
                  if match:
                      column = next(value for value in match.groups()[:4] if value is not None)
                      result[column] = {"type": match.group(5).upper(), "line": line}
              for alter in re.finditer(rf"ALTER\s+TABLE\s+{re.escape(name)}\s+ADD\s+COLUMN\s+([A-Za-z_][A-Za-z0-9_]*)\s+([A-Za-z]+)", corpus, re.I):
                  result[alter.group(1)] = {"type": alter.group(2).upper(), "line": alter.group(0)}
              return result

          id_candidates = ("artifact_ref", "artifact_id", "draft_ref", "draft_id", "revision_ref", "operation_id")
          subject_candidates = ("artifact_ref", "artifact_id", "draft_ref", "draft_id")
          revision_candidates = ("artifact_revision", "revision", "draft_revision")
          payload_candidates = ("manifest_ref", "output_manifest_ref", "artifact_object_ref", "object_ref", "body_object_ref", "payload_ref")
          digest_candidates = ("manifest_sha256", "output_sha256", "artifact_sha256", "payload_sha256", "content_sha256", "sha256")
          state_candidates = ("state", "status", "disposition")
          principal_candidates = ("principal_ref", "owner_principal_ref", "requested_by_principal_ref", "author_principal_ref")
          time_candidates = ("completed_at", "persisted_at", "created_at", "updated_at")
          terminal_order = ("DRAFTED", "COMPLETED", "COMPLETE", "PERSISTED", "READY", "COMMITTED", "SUCCEEDED", "SUCCESS")

          choices = []
          for name, body in table_defs.items():
              lower = name.lower()
              if "artifact" not in lower or "wiki" in lower or "change" in lower:
                  continue
              cols = columns(name)
              pick = lambda options: next((value for value in options if value in cols), None)
              identity = pick(id_candidates)
              subject = pick(subject_candidates)
              payload = pick(payload_candidates)
              digest = pick(digest_candidates)
              state = pick(state_candidates)
              revision = pick(revision_candidates)
              principal = pick(principal_candidates)
              timestamp = pick(time_candidates)
              if identity is None or subject is None or payload is None or digest is None:
                  continue
              values = re.findall(r"'([A-Z][A-Z0-9_]*)'", body)
              terminal = next((value for value in terminal_order if value in values), None)
              score = 0
              if "draft" in lower: score += 20
              if "revision" in lower: score += 8
              if state is not None: score += 6
              if terminal is not None: score += 10
              if principal is not None: score += 3
              if revision is not None: score += 2
              if timestamp is not None: score += 1
              choices.append((score, name, cols, identity, subject, revision, payload, digest, state, terminal, principal, timestamp, body))
          if not choices:
              raise SystemExit("no authoritative artifact draft table with durable ref+digest was found")
          choices.sort(key=lambda value: (-value[0], value[1]))
          if len(choices) > 1 and choices[0][0] == choices[1][0]:
              raise SystemExit(f"artifact draft authority is ambiguous: {choices[0][1]}, {choices[1][1]}")
          _, table, cols, identity, subject, revision, payload, digest, state, terminal, principal, timestamp, body = choices[0]
          if state is not None and terminal is None:
              raise SystemExit(f"{table}.{state} has no recognized terminal draft state")

          insert_when = f"\nWHEN NEW.{state} = '{terminal}'" if state is not None else ""
          occurrence = f"NEW.{timestamp}" if timestamp is not None else "strftime('%Y-%m-%dT%H:%M:%fZ','now')"
          visibility = f"NEW.{principal}" if principal is not None else "NULL"
          revision_value = f"NEW.{revision}" if revision is not None else "1"
          trigger_body = f"""  INSERT OR IGNORE INTO research_change_feed (
            change_ref, kind, subject_ref, subject_revision, payload_ref, payload_sha256,
            visibility_principal_ref, occurred_at, metadata_json
          ) VALUES (
            'artifact:' || NEW.{identity} || ':' || {revision_value},
            'ARTIFACT_DRAFTED',
            'artifact:' || NEW.{subject},
            {revision_value},
            NEW.{payload},
            NEW.{digest},
            {visibility},
            {occurrence},
            json_object('authority_table', '{table}', 'draft_ref', NEW.{identity})
          );"""
          migration = f"""PRAGMA foreign_keys = ON;

          -- Only the terminal durable artifact record emits a change; reservations and partial writes do not.
          CREATE TRIGGER IF NOT EXISTS artifact_draft_change_feed_insert
          AFTER INSERT ON {table}{insert_when}
          BEGIN
          {trigger_body}
          END;
          """
          if state is not None:
              migration += f"""
          CREATE TRIGGER IF NOT EXISTS artifact_draft_change_feed_update
          AFTER UPDATE OF {state} ON {table}
          WHEN NEW.{state} = '{terminal}' AND OLD.{state} IS NOT NEW.{state}
          BEGIN
          {trigger_body}
          END;
          """
          (root / "infra/d1/core/migrations/0046_artifact_draft_change_feed.sql").write_text(migration, encoding="utf-8", newline="\n")

          profile = {
              "table": table, "identity_column": identity, "subject_column": subject,
              "revision_column": revision, "payload_column": payload, "digest_column": digest,
              "state_column": state, "terminal_state": terminal, "principal_column": principal,
              "timestamp_column": timestamp,
          }
          profile_path = root / "infra/verification/artifact-draft-change-authority.json"
          profile_path.parent.mkdir(parents=True, exist_ok=True)
          profile_path.write_text(json.dumps(profile, indent=2) + "\n", encoding="utf-8", newline="\n")

          # Generate a schema-aware D1 fixture. Foreign keys are disabled only for this trigger unit test;
          # package integration tests below still exercise the real artifact implementation with all guards active.
          value_lines = []
          enum_values = {}
          for name, info in cols.items():
              enum_values[name] = re.findall(r"'([A-Z][A-Z0-9_.:-]*)'", info["line"])
          constants = json.dumps(profile)
          test = f'''import {{ beforeAll, describe, expect, it }} from "vitest";
          import {{ db, setupOrientationDatabase }} from "./orientation-fixture.js";

          beforeAll(async () => {{ await setupOrientationDatabase(); }});
          const profile = {constants} as const;

          interface ColumnInfo {{ name: string; type: string; notnull: number; dflt_value: unknown; pk: number }}
          async function tableColumns(): Promise<ColumnInfo[]> {{
            return (await db.prepare(`PRAGMA table_info(${{profile.table}})`).all<ColumnInfo>()).results;
          }}
          function valueFor(column: ColumnInfo, tag: string): unknown {{
            if (column.name === profile.identity_column || column.name === profile.subject_column) return `artifact-${{tag}}`;
            if (profile.revision_column !== null && column.name === profile.revision_column) return 1;
            if (column.name === profile.payload_column) return `artifact/payload-${{tag}}.json`;
            if (column.name === profile.digest_column || /(?:sha256|digest)$/u.test(column.name)) return "a".repeat(64);
            if (profile.state_column !== null && column.name === profile.state_column) return profile.terminal_state;
            if (profile.principal_column !== null && column.name === profile.principal_column) return "owner-1";
            if (profile.timestamp_column !== null && column.name === profile.timestamp_column) return "2026-09-11T04:00:00.000Z";
            if (/(?:_at|time|timestamp)$/u.test(column.name)) return "2026-09-11T04:00:00.000Z";
            if (/json/u.test(column.name)) return "{{}}";
            if (/protocol/u.test(column.name)) return "eliotr.test.v1";
            if (/INT/u.test(column.type)) return 1;
            if (/REAL|NUMERIC/u.test(column.type)) return 1;
            if (/BLOB/u.test(column.type)) return new Uint8Array([1]);
            return `${{column.name}}-${{tag}}`;
          }}

          async function insertTerminal(tag: string): Promise<void> {{
            await db.exec("PRAGMA foreign_keys = OFF");
            const columns = await tableColumns();
            const names: string[] = [];
            const values: unknown[] = [];
            for (const column of columns) {{
              if (column.pk === 1 && /INT/u.test(column.type) && column.dflt_value === null) continue;
              if (column.notnull === 0 && column.dflt_value !== null
                  && column.name !== profile.identity_column && column.name !== profile.subject_column
                  && column.name !== profile.payload_column && column.name !== profile.digest_column
                  && column.name !== profile.state_column) continue;
              names.push(column.name);
              values.push(valueFor(column, tag));
            }}
            const placeholders = values.map((_, index) => `?${{index + 1}}`).join(",");
            await db.prepare(`INSERT INTO ${{profile.table}} (${{names.join(",")}}) VALUES (${{placeholders}})`).bind(...values).run();
          }}

          describe("terminal artifact draft change emission", () => {{
            it("emits one exact ARTIFACT_DRAFTED item from the terminal authority row", async () => {{
              await insertTerminal("change-feed");
              const rows = await db.prepare(
                "SELECT kind, subject_ref, subject_revision, payload_ref, payload_sha256, visibility_principal_ref, metadata_json " +
                "FROM research_change_feed WHERE kind = 'ARTIFACT_DRAFTED' ORDER BY sequence DESC LIMIT 1",
              ).all<{{ kind: string; subject_ref: string; subject_revision: number; payload_ref: string; payload_sha256: string; visibility_principal_ref: string | null; metadata_json: string }}>();
              expect(rows.results).toHaveLength(1);
              const item = rows.results[0];
              expect(item).toMatchObject({{
                kind: "ARTIFACT_DRAFTED",
                subject_ref: "artifact:artifact-change-feed",
                subject_revision: 1,
                payload_ref: "artifact/payload-change-feed.json",
                payload_sha256: "a".repeat(64),
              }});
              expect(JSON.parse(item?.metadata_json ?? "null")).toEqual({{
                authority_table: profile.table,
                draft_ref: "artifact-change-feed",
              }});
            }});
          }});
          '''
          (root / "apps/eliotr-core/test/artifact-draft-changes.test.ts").write_text(test, encoding="utf-8", newline="\n")

          manifest_path = root / "docs/agent-work/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packets = []
          def collect(value):
              if isinstance(value, dict):
                  if isinstance(value.get("id"), str): packets.append(value)
                  for child in value.values(): collect(child)
              elif isinstance(value, list):
                  for child in value: collect(child)
          collect(manifest)
          artifact_owners = []
          for packet in packets:
              owned = packet.get("owned_paths") if isinstance(packet.get("owned_paths"), list) else packet.get("ownedPaths")
              if isinstance(owned, list) and any("cloudflare-artifact" in path or "artifact-draft" in path for path in owned if isinstance(path, str)):
                  artifact_owners.append(packet)
          if len(artifact_owners) != 1:
              raise SystemExit(f"artifact owner packet ambiguous: {[p.get('id') for p in artifact_owners]}")
          ownership = {
              artifact_owners[0]["id"]: [
                  "apps/eliotr-core/test/artifact-draft-changes.test.ts",
                  "infra/verification/artifact-draft-change-authority.json",
              ],
              "ER-13": ["infra/d1/core/migrations/0046_artifact_draft_change_feed.sql"],
          }
          def find_packet(wanted):
              return next((packet for packet in packets if packet.get("id") == wanted), None)
          for packet_id, paths in ownership.items():
              packet = find_packet(packet_id)
              if packet is None: raise SystemExit(f"missing packet {packet_id}")
              key = "owned_paths" if isinstance(packet.get("owned_paths"), list) else "ownedPaths" if isinstance(packet.get("ownedPaths"), list) else None
              if key is None: raise SystemExit(f"owned paths missing {packet_id}")
              for path in paths:
                  if path not in packet[key]: packet[key].append(path)
              docs = list((root / "docs/agent-work").glob(f"{packet_id}-*.md"))
              if len(docs) != 1: raise SystemExit(f"packet document ambiguous {packet_id}")
              doc_path = docs[0]
              doc = doc_path.read_text(encoding="utf-8")
              heading = re.search(r"(?im)^##\s+Owned paths\s*$", doc)
              if heading is None: raise SystemExit(f"Owned paths heading missing {packet_id}")
              tail = doc[heading.end():]
              next_heading = re.search(r"(?m)^##\s+", tail)
              end = heading.end() + (next_heading.start() if next_heading else len(tail))
              section = doc[heading.end():end]
              additions = [path for path in paths if f'`{path}`' not in section]
              if additions:
                  if not section.endswith("\n"): section += "\n"
                  section += "".join(f'- `{path}`\n' for path in additions)
                  doc = doc[:heading.end()] + section + doc[end:]
                  doc_path.write_text(doc, encoding="utf-8", newline="\n")
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify artifact terminal feed against real package tests
        run: |
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm --filter @eliotr/core exec vitest run test/artifact-draft-changes.test.ts --reporter=verbose
          pnpm exec vitest run packages/cloudflare-artifacts --reporter=verbose
          pnpm typecheck
          pnpm lint
          pnpm budgets:check
          pnpm work-packets:check
          pnpm boundaries:check
          git diff --check
      - name: Commit only green product code
        run: |
          git rm .github/workflows/artifact-draft-changes-once.yml
          git config user.name "Eliot Research Product Builder"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: emit terminal artifact draft changes"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
