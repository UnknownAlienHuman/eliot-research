          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path.cwd()
          ownership = {
              "ER-12": [
                  "apps/eliotr-core/src/wiki-publication-store.ts",
                  "apps/eliotr-core/test/wiki-publication-store.test.ts",
              ],
              "ER-13": ["infra/d1/core/migrations/0042_wiki_publication.sql"],
          }
          manifest_path = root / "docs/agent-work/manifest.json"
          data = json.loads(manifest_path.read_text(encoding="utf-8"))

          def find_packet(value, packet_id):
              if isinstance(value, dict):
                  if value.get("id") == packet_id:
                      return value
                  for child in value.values():
                      found = find_packet(child, packet_id)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_packet(child, packet_id)
                      if found is not None:
                          return found
              return None

          def add_doc_paths(packet_id, paths):
              docs = list((root / "docs/agent-work").glob(f"{packet_id}-*.md"))
              if len(docs) != 1:
                  raise SystemExit(f"{packet_id}: expected one packet document, found {len(docs)}")
              path = docs[0]
              text = path.read_text(encoding="utf-8")
              match = re.search(r"(?im)^##\s+Owned paths\s*$", text)
              if match is None:
                  raise SystemExit(f"{packet_id}: Owned paths heading is absent")
              tail = text[match.end():]
              next_heading = re.search(r"(?m)^##\s+", tail)
              end = match.end() + (next_heading.start() if next_heading else len(tail))
              section = text[match.end():end]
              additions = "".join(f"- `{item}`\n" for item in paths if f"`{item}`" not in section)
              if additions:
                  if not section.endswith("\n"):
                      section += "\n"
                  section += additions
                  text = text[:match.end()] + section + text[end:]
                  path.write_text(text, encoding="utf-8", newline="\n")

          for packet_id, paths in ownership.items():
              packet = find_packet(data, packet_id)
              if packet is None:
                  raise SystemExit(f"missing packet {packet_id}")
              key = "owned_paths" if "owned_paths" in packet else "ownedPaths" if "ownedPaths" in packet else None
              if key is None or not isinstance(packet[key], list):
                  raise SystemExit(f"{packet_id}: owned path list is absent")
              for item in paths:
                  if item not in packet[key]:
                      packet[key].append(item)
              add_doc_paths(packet_id, paths)

          manifest_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
