name: temp-share-owner-client
on:
  push:
    branches:
      - refactor/380-share-owner-client
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply one-client refactor
        shell: bash
        run: |
          set -euo pipefail
          python .github/refactor-380-share-owner-client.py
          rm .github/refactor-380-share-owner-client.py \
            .github/workflows/temp-share-owner-client.yml
          if git grep -n 'LegacyHttpPorts' -- '*.ts' '*.tsx'; then
            echo 'LegacyHttpPorts remains' >&2
            exit 1
          fi
          git diff --check
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck changed owners
        run: |
          pnpm --filter @eliotr/owner-api-client typecheck
          pnpm --filter @eliotr/web typecheck
      - name: Owner client regressions
        run: >-
          pnpm exec vitest run
          packages/owner-api-client/src/legacy/http.test.ts
          packages/owner-api-client/src/evidence/citations/reauthorization.test.ts
          packages/owner-api-client/src/sources/import/raw.test.ts
          --reporter=verbose
      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "refactor: share one owner transport client (#380)"
          git push origin HEAD:refactor/380-share-owner-client
