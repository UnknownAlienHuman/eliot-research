name: verify-docs-index
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-docs-index.yml]
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Apply exact reviewed documentation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 40bfc7a7d11698fd6a94b36885154af9e96f4091
          mkdir -p "$RUNNER_TEMP/docs-result"
          git rm .github/workflows/verify-docs-index.yml
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          sha = '452c9f3752a27a8947f5881d05ab9402e702920e'
          req = urllib.request.Request(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}", headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == sha
          patch = gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '4123cbd26d9aa1229374876044392a5fc91bb533babd8db36785aea0e28678e4'
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'docs.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == 'bb30d8940a4f3a9e24c129432e2474bbe0d046c6'
          PY
      - name: Prove indexing and ownership without changing any gate
        run: |
          set -euo pipefail
          node scripts/check-docs-index.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const path = 'docs/implementation/README.md';
          const bytes = readFileSync(path);
          try {
            const lines = bytes.toString('utf8').split('\n');
            assert.equal(lines.filter(line => line.startsWith('| [owner-workspace-setup.md]')).length, 1);
            writeFileSync(path, lines.filter(line => !line.startsWith('| [owner-workspace-setup.md]')).join('\n'));
            const result = spawnSync(process.execPath, ['scripts/check-docs-index.mjs'], { encoding: 'utf8' });
            assert.equal(result.status, 1);
            assert.match(result.stdout + result.stderr, /owner-workspace-setup\.md/);
          } finally { writeFileSync(path, bytes); }
          console.log('Required-link removal rejected; exact document restored.');
          JS
          node scripts/check-docs-index.mjs
          git diff --exit-code
          git diff --cached --check
      - name: Store verified blobs without publishing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const tree = text('write-tree');
          if (tree !== 'bb30d8940a4f3a9e24c129432e2474bbe0d046c6') throw new Error('Tree changed');
          const entries = [];
          for (const path of git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean)) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode,sha] = index.split(/\s+/);
            const data = git('cat-file','blob',sha);
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({content:data.toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Blob creation failed: ${response.status}`);
            if ((await response.json()).sha !== sha) throw new Error('Blob changed');
            entries.push({path,mode,type:'blob',sha});
          }
          writeFileSync(join(process.env.RUNNER_TEMP,'docs-result','verified-tree.json'),JSON.stringify({base_sha:process.env.GITHUB_SHA,base_tree_sha:text('rev-parse','HEAD^{tree}'),tree_sha:tree,ref_updated:false,entries},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-index-${{ matrix.os }}
          path: ${{ runner.temp }}/docs-result/
          retention-days: 3
          if-no-files-found: error
