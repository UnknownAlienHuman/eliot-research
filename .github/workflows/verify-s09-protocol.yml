name: verify-s09-protocol-sem
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-s09-protocol.yml]
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Restore reviewed protocol fix and bounded native fixture phases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/s09-protocol"
          git rm .github/workflows/verify-s09-protocol.yml
          git restore --source=5c36fc87eda8e2183f0b4c672c7c8bb155098127 --staged --worktree .github/workflows/export-current-source.yml
          test "$(git write-tree)" = 1245625a74f0ae266f7d2b02b0d5d7e7e5c21519
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          patches = [
              ('b88ed5dc66f4e985fbfe512d68a167ab3bc73450', 'e4bb00b003791f55f0ff4dde011486b5ec6fe54b30bffa03529a67255f646715', '1461bfbac025ddcd7cbe0628a2e733f609bc15cc'),
              ('e048b5e5e7af71b5f079ff204e01d669795a24b0', '2b8aeb442198a3f74c2dacd4de9a3da0984a1e23648b24dfd241db108ffa12a6', '002b9ac403d43bc0ab3b115da3832e54acc6cab4'),
              ('731d4e57aa6de0c8387fabd2967fa338a9fb8323', '0a7825394d67ae3cd3be21f8dd9aab4a742eabc5cd8d4fd9262978e90a74a6d5', '1e96d7c0e028494e9344cea88b9d53c76cdff763'),
          ]
          for sha, patch_hash, tree in patches:
              request = urllib.request.Request(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}", headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == sha
              patch = gzip.decompress(base64.b64decode(data))
              assert hashlib.sha256(patch).hexdigest() == patch_hash
              path = pathlib.Path(os.environ['RUNNER_TEMP'], 's09-protocol.patch')
              path.write_bytes(patch)
              subprocess.run(['git','apply','--check',str(path)],check=True)
              subprocess.run(['git','apply','--index',str(path)],check=True)
              assert subprocess.check_output(['git','write-tree'],text=True).strip() == tree
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Install frozen toolchain
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
          node --version > "$RUNNER_TEMP/s09-protocol/versions.txt"
          pnpm --version >> "$RUNNER_TEMP/s09-protocol/versions.txt"
      - name: Strict types lint boundaries ownership and contracts
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          mapfile -t files < <(git diff --cached --name-only -- '*.ts')
          pnpm exec eslint "${files[@]}"
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          node scripts/check-docs-index.mjs
          git diff --cached --check
          git diff --exit-code
      - name: Unfiltered factory semantic admission and materialized-history acceptance
        run: |
          set -euo pipefail
          result=0
          for file in research-retrieve-branches research-retrieve-semantic research-input research-run-status; do
            if ! pnpm --dir apps/eliotr-core exec vitest run "test/$file.test.ts" --no-file-parallelism 2>&1 | tee "$RUNNER_TEMP/s09-protocol/$file.log"; then
              result=1
            fi
          done
          exit "$result"
      - name: Store verified Git blobs without publishing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const tree = text('write-tree');
          if (tree !== '1e96d7c0e028494e9344cea88b9d53c76cdff763') throw new Error('Tree identity changed');
          git('diff','--exit-code');
          const entries = [];
          for (const path of git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean)) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode,sha] = index.split(/\s+/);
            const data = git('cat-file','blob',sha);
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({content:data.toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Git blob creation failed: ${response.status}`);
            if ((await response.json()).sha !== sha) throw new Error('Blob identity changed');
            entries.push({path,mode,type:'blob',sha});
          }
          writeFileSync(join(process.env.RUNNER_TEMP,'s09-protocol','verified-tree.json'),JSON.stringify({base_sha:process.env.GITHUB_SHA,base_tree_sha:text('rev-parse','HEAD^{tree}'),tree_sha:tree,ref_updated:false,entries},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s09-protocol-${{ matrix.os }}
          path: ${{ runner.temp }}/s09-protocol/
          retention-days: 3
          if-no-files-found: error
