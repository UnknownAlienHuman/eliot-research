name: er00-one-shot-format

on:
  pull_request:
    paths:
      - ".github/workflows/er00-one-shot-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ER-00-rust-m1-foundation-20260901'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply pinned formatter and lint repair
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          python <<'PY'
          from pathlib import Path

          path = Path("scripts/check-rust-boundaries.mjs")
          source = path.read_text()
          old = '.filter(([_name, pattern]) => pattern.test(source))'
          new = '.filter((entry) => entry[1].test(source))'
          if source.count(old) != 1:
              raise SystemExit("unexpected Rust boundary checker source")
          path.write_text(source.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          rm .github/workflows/er00-one-shot-format.yml
          node --check scripts/check-rust-boundaries.mjs
          node scripts/check-rust-boundaries.mjs
          git diff --check
      - name: Commit formatter output
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(rust): apply pinned formatter"
          git push origin "HEAD:${HEAD_REF}"
