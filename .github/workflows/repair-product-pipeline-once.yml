name: repair-product-pipeline-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-product-pipeline-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Cancel superseded product runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.path == ".github/workflows/research-changes-product-once.yml" or .path == ".github/workflows/federation-product-once.yml")) | .id' \
            | while read -r run_id; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
              done
      - name: Repair checkpoint base fencing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updates = {
              Path('.github/workflows/research-changes-product-once.yml'): (
                  'group: research-changes-product',
                  'git reset --hard origin/main\n              echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"',
              ),
              Path('.github/workflows/federation-product-once.yml'): (
                  'group: federation-product',
                  'git reset --hard origin/main\n                echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"',
              ),
          }
          for path, (group, reset) in updates.items():
              source = path.read_text(encoding='utf-8')
              source = source.replace('group: research-product-serialization', group, 1)
              source = source.replace('cancel-in-progress: false', 'cancel-in-progress: false', 1)
              plain = 'git reset --hard origin/main'
              if 'PRODUCT_BASE_SHA=' not in source:
                  if plain not in source:
                      raise SystemExit(f'{path}: reset anchor missing')
                  source = source.replace(plain, reset, 1)
              source = source.replace('test "$remote_head" = "$GITHUB_SHA"', 'test "$remote_head" = "$PRODUCT_BASE_SHA"', 1)
              path.write_text(source, encoding='utf-8', newline='\n')
          PY
      - name: Commit the repaired serialization
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-product-pipeline-once.yml
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "ci: fence serialized product integrations to refreshed main"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
