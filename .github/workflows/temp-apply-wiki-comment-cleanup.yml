name: temp-apply-wiki-comment-cleanup
on:
  push:
    branches:
      - refactor/380-remove-wiki-fake-outbox
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply comment cleanup and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --whitespace=error-all .github/refactor-380-comments.patch
          git apply --whitespace=error-all .github/refactor-380-comments.patch
          rm .github/refactor-380-comments.patch .github/workflows/temp-apply-wiki-comment-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "docs: align Wiki mutation comments with direct commit (#380)"
          git push origin HEAD:refactor/380-remove-wiki-fake-outbox
