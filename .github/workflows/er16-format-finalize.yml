name: er16-format-finalize

on:
  push:
    branches:
      - agent/ER-16-model-gateway-policy-boundary-20260902
    paths:
      - .github/workflows/er16-format-finalize.yml

permissions:
  contents: write

concurrency:
  group: er16-format-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-model-gateway-policy-boundary-20260902
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Format maintained TypeScript and JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import ts from "typescript";

          const files = [
            ["packages/platform-cloudflare/src/model-gateway.ts", ts.ScriptKind.TS],
            ["infra/ai-search/model-gateway.test.mjs", ts.ScriptKind.JS],
          ];
          const printer = ts.createPrinter({
            newLine: ts.NewLineKind.LineFeed,
            removeComments: false,
          });
          for (const [path, scriptKind] of files) {
            const source = await readFile(path, "utf8");
            const sourceFile = ts.createSourceFile(
              path,
              source,
              ts.ScriptTarget.Latest,
              true,
              scriptKind,
            );
            const diagnostics = sourceFile.parseDiagnostics;
            if (diagnostics.length > 0) {
              throw new Error(`${path} contains parse diagnostics`);
            }
            const formatted = printer.printFile(sourceFile).trimEnd() + "\n";
            await writeFile(path, formatted, "utf8");
          }
          NODE
          git rm -- .github/workflows/er16-format-finalize.yml
          git diff --check

      - name: Verify exact ER-16 boundary before commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm work-packets:check
          pnpm boundaries:check
          pnpm budgets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/platform-cloudflare/src/ai-search.test.ts
          git diff --check

      - name: Commit maintainable verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: format verified model-gateway policy [er16-formatted]"
          git push origin HEAD:agent/ER-16-model-gateway-policy-boundary-20260902
