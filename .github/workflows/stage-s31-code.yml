name: stage-s31-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-s31-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Stage exact code blobs without changing refs or running tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          const digest = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const blobHash = (bytes) => digest('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, { method,
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`Git API ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          const head = process.env.GITHUB_SHA;
          const transporter = '.github/workflows/stage-s31-code.yml';
          const expectedTree = '834a5360b3987939f1e0e751a543a5bcbd6c7fbd';
          assert(text('branch', '--show-current') === 'main', 'Not on main');
          assert(text('rev-parse', 'HEAD') === head, 'Main advanced before checkout');
          const baseTree = text('rev-parse', 'HEAD^{tree}');
          git('rm', '--', transporter);
          assert(text('write-tree') === 'c695e5acbde1d04437ef3bd515122898867d8b9c', 'Unexpected base contents');
          const chunks = [];
          for (const sha of ['54c22d82458a88955a5eae8dfa4d9382151ee9d3', '3a6a5c8651340fc11661ebdb0bf761373ab3f556', '215bf945e44eb55bbd12416ae53c8143e4025959', 'e5607fa8d8a197f947ba4adecbc93ed588b6553a', '938aab8b93c40600c6fcbf5732acb110fd34c140']) {
            const blob = await api(`git/blobs/${sha}`);
            assert(blob.encoding === 'base64', 'Unexpected blob encoding');
            const chunk = Buffer.from(blob.content, 'base64');
            assert(blobHash(chunk) === sha, 'Transfer chunk mismatch');
            chunks.push(chunk);
          }
          const encoded = Buffer.concat(chunks);
          assert(blobHash(encoded) === '479685e69a3320f3ecb9112d8bf5d59417345d85', 'Full transfer mismatch');
          const patch = gunzipSync(Buffer.from(encoded.toString('utf8'), 'base64'));
          assert(digest('sha256', patch) === 'bbdf55745800dec6d15e0ca6a697a519f00cab0ca4206b01708652242d2b2daf', 'Patch mismatch');
          const folder = join(process.env.RUNNER_TEMP, 's31-code');
          mkdirSync(folder, { recursive: true });
          const patchPath = join(process.env.RUNNER_TEMP, 's31-code.patch');
          writeFileSync(patchPath, patch);
          git('apply', '--unidiff-zero', '--check', patchPath);
          git('apply', '--unidiff-zero', '--index', patchPath);
          git('diff', '--cached', '--check');
          git('diff', '--exit-code');
          assert(text('write-tree') === expectedTree, 'Reviewed tree mismatch');
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          assert(paths.length === 11, 'Unexpected changed path count');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files', '--stage', '--', path);
            if (!index) {
              assert(path === transporter, 'Unexpected deletion');
              entries.push({ path, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const [mode, sha] = index.split(/\s+/);
            const data = git('cat-file', 'blob', sha);
            const created = await api('git/blobs', 'POST', { content: data.toString('base64'), encoding: 'base64' });
            assert(created.sha === sha, `Source blob mismatch: ${path}`);
            entries.push({ path, mode, type: 'blob', sha });
          }
          writeFileSync(join(folder, 'verified-tree.json'), JSON.stringify({ base_sha: head, base_tree_sha: baseTree, tree_sha: expectedTree, ref_updated: false, entries }, null, 2));
          console.log(`STAGED_TREE=${expectedTree}; refs unchanged; no tests executed`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s31-code-manifest
          path: ${{ runner.temp }}/s31-code/
          retention-days: 3
          if-no-files-found: error
