name: er22-scope-cast-fix

on:
  push:
    branches:
      - agent/ER-22-scope-depth-preflight-20260904

permissions:
  contents: write

concurrency:
  group: er22-scope-cast-fix
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[er22-scope-cast-fixed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-22-scope-depth-preflight-20260904
          fetch-depth: 0
      - name: Keep the hostile payload outside the trusted request type
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("apps/eliotr-core/src/federation-service.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    const malicious = {
              ...request(),
              scope_expression: deeplyNestedScope(10_000),
            } as FederationRequest;'''
          new = '''    const malicious = {
              ...request(),
              scope_expression: deeplyNestedScope(10_000),
            } as unknown as FederationRequest;'''
          if text.count(old) != 1:
              raise SystemExit("hostile federation payload anchor missing or ambiguous")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git rm -- .github/workflows/er22-scope-cast-fix.yml
          git diff --check
      - name: Commit test-boundary correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-22: keep hostile scope outside trusted type [er22-scope-cast-fixed]"
          git push origin HEAD:agent/ER-22-scope-depth-preflight-20260904
