name: stage-s19-reconnect
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-s19-reconnect.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'UnknownAlienHuman/eliot-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Stage reviewed sources without publishing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'UnknownAlienHuman/eliot-research'
          base = '06ef8c64ad80433dab700e33d6bd606112ece583'
          tree = '8ecc98fb744492d898a6b7f963b6441bac1029b9'
          patch_sha = '5209219ec09ca5a8ffa2ce55f77758e3a2662c50f233f192fbfb39cb9b69484e'
          workflow = '.github/workflows/stage-s19-reconnect.yml'
          chunks = [
            'c24e7c0d5ce48190c4af4cfddb78612162e7ea86',
            'f8efcb6f7431b0efe8d35e95fb21da5d77ba431d',
            'b876c15b8206d62bcc87460ee7040f0b23f8a75a',
            '46f40e8dc196f204a01102ed9091962c9e8e0ca4',
            'e7762179df82cebb046a6aa18f44ff32278562ff',
            '9acefda1dbf96cded51560f9b0adbd3f2e693992',
            '053892261f17de819dd06d13771484200185b4cf',
            '56d13181477a34d445fb2de674de4ad8c8d61bcc',
            '6c17ac0d1e86d3feee75b02ce4d14b18ccf502e9',
            'ecb1b2f245d7bda5253f9b0cdc31408b4d8743fc',
            'e105e8f89b0c60a8e918f657a252e80d186ea806',
            '454797d68bb4cecfe7a7d24aedea0fd5c5de4634',
            '589f8579602a5a99e5dd1122f3da0032c5f1753f',
            '0af89853c4eeec49ff2e39f369a69643b5b4b60b',
            '2b05b90a2e7b80933e99df93999723ea5cafb074',
          ]
          paths = [
            '.github/workflows/export-current-source.yml',
            'apps/eliotr-pwa/src/api.ts',
            'apps/eliotr-pwa/src/main.ts',
            'apps/eliotr-pwa/src/owner-session-api.ts',
            'apps/eliotr-pwa/src/owner-session-panel.ts',
            'apps/eliotr-pwa/src/research-run-connection.ts',
            'apps/eliotr-pwa/src/research-run-controls.ts',
            'apps/eliotr-pwa/src/research-run-panel.ts',
            'apps/eliotr-pwa/src/research-run-report.ts',
            'docs/agent-work/ER-25-owner-pwa.md',
            'docs/implementation/gap-register.md',
            'docs/implementation/implementation-status.json',
          ]
          def git(*args):
            return subprocess.check_output(['git', *args], text=True).strip()
          def blob_sha(data):
            return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          def api(path, data=None):
            request = urllib.request.Request('https://api.github.com/repos/'+repo+path,
              data=None if data is None else json.dumps(data).encode(),
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
              method='GET' if data is None else 'POST')
            with urllib.request.urlopen(request, timeout=30) as response:
              return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert git('branch', '--show-current') == 'main'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == base
          parts = []
          for sha in chunks:
            stored = api('/git/blobs/'+sha)
            assert stored['encoding'] == 'base64'
            part = base64.b64decode(stored['content'])
            assert blob_sha(part) == sha
            parts.append(part)
          patch = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == patch_sha
          subprocess.run(['git','apply','--check'], input=patch, check=True)
          subprocess.run(['git','apply','--index'], input=patch, check=True)
          assert sorted(git('diff','--cached','--name-only').splitlines()) == paths
          subprocess.run(['git','rm','--cached','--',workflow],check=True)
          assert git('write-tree') == tree
          entries = []
          for path in paths:
            data = pathlib.Path(path).read_bytes()
            expected = blob_sha(data)
            result = api('/git/blobs', {'encoding':'base64','content':base64.b64encode(data).decode()})
            assert result['sha'] == expected
            entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          out = pathlib.Path('/tmp/s19-manifest')
          out.mkdir(parents=True,exist_ok=True)
          (out/'manifest.json').write_text(json.dumps({'base':base,'transport_parent':os.environ['GITHUB_SHA'],
            'tree':tree,'patch_sha256':patch_sha,'entries':entries},indent=2)+'\n')
          print('Staged 12 exact reviewed source blobs; no ref, deployment or database changed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s19-reconnect-manifest
          path: /tmp/s19-manifest/
          retention-days: 3
          if-no-files-found: error
