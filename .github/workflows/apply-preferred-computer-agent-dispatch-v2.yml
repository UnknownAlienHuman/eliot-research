name: Apply preferred computer-agent dispatch v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: restage preferred computer-agent dispatch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply reviewed product patch and depth fix
        run: |
          python -m py_compile \
            .github/scripts/apply-preferred-computer-agent-dispatch.py \
            .github/scripts/fix-preferred-computer-agent-dispatch.py \
            .github/scripts/verify-preferred-computer-agent-dispatch.py
          python .github/scripts/apply-preferred-computer-agent-dispatch.py
          python .github/scripts/fix-preferred-computer-agent-dispatch.py
      - name: Static, SQL and focused compile checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python .github/scripts/verify-preferred-computer-agent-dispatch.py
          python infra/d1/check-expression-depth.py
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/contracts --filter @eliotr/interfaces --filter @eliotr/core typecheck
          node --input-type=module <<'JS'
          import { ComputerAgentPreferredDispatchCreateSchema } from './packages/contracts/dist/computer-agent-dispatch.js';
          const request = {
            transport: 'WEB_INBOX', expected_route_revision: 4,
            client_grant_id: 'grant-1', client_grant_revision: 2,
            expires_in_seconds: 900,
            run_request: {
              query: 'Compare the admitted evidence.', product: 'RESEARCH',
              scope_expression: { kind: 'PROJECT', project_id: 'project-1' },
              literals: [], evidence_grade: 'E1', budget_ref: 'research-budget-v1',
              max_results: 8, request_version: 'eliotr.research-run-request.v2',
              inquiry_protocol_ref: { id: 'protocol-1', revision: 1 },
            },
          };
          ComputerAgentPreferredDispatchCreateSchema.parse(request);
          let rejected = false;
          try { ComputerAgentPreferredDispatchCreateSchema.parse({ ...request, connection_id: 'muse' }); }
          catch { rejected = true; }
          if (!rejected) throw new Error('preferred input accepted a caller-selected connection');
          console.log('PREFERRED_DISPATCH_CONTRACT_OK');
          JS
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/preferred-budget-report.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/preferred-budget-report.txt"
          BUDGET_REPORT="$RUNNER_TEMP/preferred-budget-report.txt" python - <<'PY'
          from pathlib import Path
          import os
          report = Path(os.environ['BUDGET_REPORT']).read_text()
          if 'Source budgets: PASS' in report:
              print('PREFERRED_DISPATCH_GLOBAL_BUDGETS_PASS')
              raise SystemExit(0)
          known = {
              'packages/cloudflare-ai/src/dynamic-route-qualification.ts',
              'packages/cloudflare-ai/src/dynamic-route-rest-codec.ts',
              'packages/cloudflare-ai/src/model-gateway-response.ts',
              'packages/cloudflare-ai',
              'packages/cloudflare-artifacts/src/artifact-draft-reader-core.ts',
              'packages/cloudflare-research/src/research-owner-qualification-renewal.ts',
              'packages/cloudflare-research/src/research-report-admission.ts',
              'packages/cloudflare-research',
              'packages/cloudflare-research-stages/src/research-claim-audit-input.ts',
              'apps/eliotr-core/src/http.ts',
              'apps/eliotr-core/src/research-semantic-composition.ts',
              'apps/eliotr-core/src/wiki-publication-store.ts',
              'apps/eliotr-core',
              'Worker source',
              'apps/eliotr-pwa',
          }
          observed = set()
          for line in report.splitlines():
              if ' has ' in line and (' lines (max ' in line or ' source lines (max ' in line):
                  observed.add(line.split(' has ', 1)[0])
              elif line.startswith('Worker source is '):
                  observed.add('Worker source')
          unknown = observed - known
          if unknown:
              raise SystemExit(f'preferred dispatch introduced new source-budget violations: {sorted(unknown)}')
          if not observed:
              raise SystemExit('unrecognized source-budget report')
          print(f'PREFERRED_DISPATCH_SCOPED_BUDGET_OK known_debt={len(observed)} new_violations=0')
          PY
      - name: Publish verified product commit
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-preferred-computer-agent-dispatch.yml \
            .github/workflows/apply-preferred-computer-agent-dispatch-v2.yml \
            .github/scripts/apply-preferred-computer-agent-dispatch.py \
            .github/scripts/fix-preferred-computer-agent-dispatch.py \
            .github/scripts/verify-preferred-computer-agent-dispatch.py
          git diff --check
          git add \
            infra/d1/core/migrations/0094_computer_agent_preferred_dispatch.sql \
            packages/contracts/src/computer-agent-dispatch.ts \
            apps/eliotr-core/src/computer-agent-preferred-dispatch.ts \
            apps/eliotr-core/src/computer-agent-dispatch-store.ts \
            apps/eliotr-core/src/computer-agent-dispatch-http.ts \
            apps/eliotr-core/src/http-special-routes.ts \
            packages/interfaces/src/routes.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/implementation/computer-agent-web-inbox.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: create dispatch for first ready computer agent' \
            -m 'Record an immutable owner-authorized FIRST_READY selection before creating the ordinary exact Spark, Muse, Dot or other dispatch. Replays retain the selected actor, and the reserved internal dispatch key cannot be occupied through explicit creation. Refs #301.'
          git push origin HEAD:main
