name: temp-apply-wiki-cursor
on:
  push:
    branches:
      - refactor/380-wiki-proposal-cursor
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply verified cursor patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/wiki-cursor-gz/part* | base64 --decode > /tmp/wiki-cursor.patch.gz
          printf '%s  %s\n' '5be53094ee23e35ead2f391028acd8f7d11cfba921894c5f0c9438e4d95777ae' '/tmp/wiki-cursor.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/wiki-cursor.patch.gz > /tmp/wiki-cursor.patch
          printf '%s  %s\n' '3d07580bed8802b9b821c37f9d2bd683c3e4f4c5b26982f76de09c1699b4d511' '/tmp/wiki-cursor.patch' | sha256sum --check
          git apply --check --whitespace=error-all /tmp/wiki-cursor.patch
          git apply --whitespace=error-all /tmp/wiki-cursor.patch
          rm -rf .github/wiki-cursor-gz .github/wiki-cursor-stage
          rm .github/workflows/temp-apply-wiki-cursor.yml
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/temp-export-wiki-cursor-source.yml',
              'apps/eliotr-core/src/http-api-dispatch.ts',
              'apps/eliotr-core/src/wiki-service.ts',
              'apps/eliotr-core/test/wiki-service.test.ts',
              'apps/eliotr-pwa/src/wiki-api.ts',
              'apps/eliotr-web/src/app/FiniteTruthDisclosurePreview.tsx',
              'apps/eliotr-web/src/app/InboxPanel.tsx',
              'apps/eliotr-web/src/app/InboxStudioSelectionRegression.stories.tsx',
              'apps/eliotr-web/src/app/ResearchPreview.tsx',
              'apps/eliotr-web/src/app/StudioPanel.tsx',
              'apps/eliotr-web/src/app/StudioPreview.tsx',
              'apps/eliotr-web/src/app/StudioPublishReadbackRegression.stories.tsx',
              'apps/eliotr-web/src/app/inboxStudioSelection.test.ts',
              'apps/eliotr-web/src/query/studio.ts',
              'docs/implementation/wiki-inbox.md',
              'packages/cloudflare-wiki/src/wiki-publication-store-support.ts',
              'packages/cloudflare-wiki/src/wiki-service.ts',
              'packages/interfaces/src/semantic-api.ts',
              'packages/owner-api-client/src/studio/wiki-read.test.ts',
              'packages/owner-api-client/src/studio/wiki-read.ts',
              'packages/owner-api-client/src/studio/wiki-types.ts',
              'packages/ui/src/features/studio/StudioFeature.tsx',
              'packages/ui/src/stories/studio/live/StudioFeature.stories.tsx',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected changed paths: {sorted(actual ^ expected)}')
          PY
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "refactor: add Wiki proposal keyset continuation (#380)"
          git push origin HEAD:refactor/380-wiki-proposal-cursor
