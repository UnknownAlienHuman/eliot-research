name: erasure-completion-changes-once

on:
  push:
    branches: [main]
    paths: [.github/workflows/erasure-completion-changes-once.yml]

permissions:
  contents: write

concurrency:
  group: erasure-completion-changes-once
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.head_commit.message == 'ci: emit terminal erasure completion changes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Bind exact erasure terminal authority to research changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path.cwd()
          sql_files = sorted((root / "infra/d1/core/migrations").glob("*.sql"))
          corpus = "\n".join(path.read_text(encoding="utf-8") for path in sql_files)

          def table_definitions():
              result = {}
              pattern = re.compile(r"CREATE\s+TABLE(?:\s+IF\s+NOT\s+EXISTS)?\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", re.I)
              for match in pattern.finditer(corpus):
                  name = match.group(1)
                  start = match.end()
                  depth = 1
                  quote = None
                  escaped = False
                  for index in range(start, len(corpus)):
                      char = corpus[index]
                      if quote is not None:
                          if escaped: escaped = False
                          elif char == "\\": escaped = True
                          elif char == quote: quote = None
                          continue
                      if char in ("'", '"'): quote = char
                      elif char == "(": depth += 1
                      elif char == ")":
                          depth -= 1
                          if depth == 0:
                              result[name] = corpus[start:index]
                              break
              return result

          definitions = table_definitions()
          def columns(name):
              output = {}
              for raw in definitions[name].splitlines():
                  line = raw.strip().rstrip(",")
                  if not line or re.match(r"^(PRIMARY|UNIQUE|FOREIGN|CHECK|CONSTRAINT)\b", line, re.I): continue
                  match = re.match(r'^(?:"([^"]+)"|`([^`]+)`|\[([^\]]+)\]|([A-Za-z_][A-Za-z0-9_]*))\s+([A-Za-z]+)', line)
                  if match:
                      column = next(value for value in match.groups()[:4] if value is not None)
                      output[column] = {"type": match.group(5).upper(), "line": line}
              for alter in re.finditer(rf"ALTER\s+TABLE\s+{re.escape(name)}\s+ADD\s+COLUMN\s+([A-Za-z_][A-Za-z0-9_]*)\s+([A-Za-z]+)", corpus, re.I):
                  output[alter.group(1)] = {"type": alter.group(2).upper(), "line": alter.group(0)}
              return output

          id_options = ("erasure_id", "operation_id", "request_id")
          revision_options = ("revision", "erasure_revision", "request_revision")
          state_options = ("state", "status", "disposition")
          digest_options = ("receipt_digest", "closure_digest", "request_digest", "payload_sha256", "sha256")
          payload_options = ("purge_ledger_entry_ref", "receipt_ref", "closure_ref", "ledger_entry_ref")
          principal_options = ("requested_by_principal_ref", "principal_ref", "owner_principal_ref")
          time_options = ("completed_at", "updated_at", "issued_at", "created_at")
          terminal_options = ("COMPLETE", "COMPLETED")

          candidates = []
          for table, body in definitions.items():
              if "erasure" not in table.lower() or "change" in table.lower(): continue
              cols = columns(table)
              pick = lambda options: next((value for value in options if value in cols), None)
              identity = pick(id_options)
              revision = pick(revision_options)
              state = pick(state_options)
              digest = pick(digest_options)
              payload = pick(payload_options)
              principal = pick(principal_options)
              timestamp = pick(time_options)
              values = re.findall(r"'([A-Z][A-Z0-9_]*)'", body)
              terminal = next((value for value in terminal_options if value in values), None)
              if identity is None or state is None or digest is None or terminal is None: continue
              score = 0
              if "receipt" in table.lower(): score += 20
              if "request" in table.lower(): score += 8
              if "operation" in table.lower(): score += 6
              if payload is not None: score += 5
              if principal is not None: score += 3
              if revision is not None: score += 2
              if timestamp is not None: score += 1
              candidates.append((score, table, cols, identity, revision, state, digest, payload, principal, timestamp, terminal))
          if not candidates:
              raise SystemExit("no exact erasure terminal authority with a durable digest was found")
          candidates.sort(key=lambda value: (-value[0], value[1]))
          if len(candidates) > 1 and candidates[0][0] == candidates[1][0]:
              raise SystemExit(f"erasure terminal authority is ambiguous: {candidates[0][1]}, {candidates[1][1]}")
          _, table, cols, identity, revision, state, digest, payload, principal, timestamp, terminal = candidates[0]

          revision_value = f"NEW.{revision}" if revision is not None else "1"
          payload_value = f"NEW.{payload}" if payload is not None else f"'erasure-receipt:' || NEW.{identity} || ':' || {revision_value}"
          visibility = f"NEW.{principal}" if principal is not None else "NULL"
          occurrence = f"NEW.{timestamp}" if timestamp is not None else "strftime('%Y-%m-%dT%H:%M:%fZ','now')"
          body = f"""  INSERT OR IGNORE INTO research_change_feed (
            change_ref, kind, subject_ref, subject_revision, payload_ref, payload_sha256,
            visibility_principal_ref, occurred_at, metadata_json
          ) VALUES (
            'erasure:' || NEW.{identity} || ':' || {revision_value},
            'ERASURE_COMPLETED',
            'erasure:' || NEW.{identity},
            {revision_value},
            {payload_value},
            NEW.{digest},
            {visibility},
            {occurrence},
            json_object('authority_table', '{table}', 'erasure_id', NEW.{identity})
          );"""
          migration = f"""PRAGMA foreign_keys = ON;

          -- Delete acceptance is not completion. Emit only from the durable COMPLETE authority state.
          CREATE TRIGGER IF NOT EXISTS erasure_completion_change_feed_insert
          AFTER INSERT ON {table}
          WHEN NEW.{state} = '{terminal}'
          BEGIN
          {body}
          END;

          CREATE TRIGGER IF NOT EXISTS erasure_completion_change_feed_update
          AFTER UPDATE OF {state} ON {table}
          WHEN NEW.{state} = '{terminal}' AND OLD.{state} IS NOT NEW.{state}
          BEGIN
          {body}
          END;
          """
          (root / "infra/d1/core/migrations/0047_erasure_completion_change_feed.sql").write_text(migration, encoding="utf-8", newline="\n")

          profile = {
              "table": table, "identity_column": identity, "revision_column": revision,
              "state_column": state, "terminal_state": terminal, "digest_column": digest,
              "payload_column": payload, "principal_column": principal, "timestamp_column": timestamp,
          }
          verification = root / "infra/verification/erasure-completion-change-authority.json"
          verification.write_text(json.dumps(profile, indent=2) + "\n", encoding="utf-8", newline="\n")

          constants = json.dumps(profile)
          test = f'''import {{ beforeAll, describe, expect, it }} from "vitest";
          import {{ db, setupOrientationDatabase }} from "./orientation-fixture.js";

          beforeAll(async () => {{ await setupOrientationDatabase(); }});
          const profile = {constants} as const;
          interface ColumnInfo {{ name: string; type: string; notnull: number; dflt_value: unknown; pk: number }}

          async function columns(): Promise<ColumnInfo[]> {{
            return (await db.prepare(`PRAGMA table_info(${{profile.table}})`).all<ColumnInfo>()).results;
          }}

          function valueFor(column: ColumnInfo, tag: string, terminal: boolean): unknown {{
            if (column.name === profile.identity_column) return `erasure-${{tag}}`;
            if (profile.revision_column !== null && column.name === profile.revision_column) return 1;
            if (column.name === profile.state_column) return terminal ? profile.terminal_state : "ACTIVE";
            if (column.name === profile.digest_column || /(?:sha256|digest)$/u.test(column.name)) return "b".repeat(64);
            if (profile.payload_column !== null && column.name === profile.payload_column) return `purge-ledger-${{tag}}`;
            if (profile.principal_column !== null && column.name === profile.principal_column) return "owner-1";
            if (profile.timestamp_column !== null && column.name === profile.timestamp_column) return "2026-09-11T05:00:00.000Z";
            if (/(?:_at|time|timestamp|deadline)$/u.test(column.name)) return "2026-09-11T05:00:00.000Z";
            if (/json/u.test(column.name)) return "{{}}";
            if (/protocol/u.test(column.name)) return "erc.privacy.erasure.v1";
            if (/INT/u.test(column.type)) return 1;
            if (/REAL|NUMERIC/u.test(column.type)) return 1;
            if (/BLOB/u.test(column.type)) return new Uint8Array([1]);
            return `${{column.name}}-${{tag}}`;
          }}

          async function insertRow(tag: string, terminal = true): Promise<void> {{
            await db.exec("PRAGMA foreign_keys = OFF");
            const info = await columns();
            const names: string[] = [];
            const values: unknown[] = [];
            for (const column of info) {{
              if (column.pk === 1 && /INT/u.test(column.type) && column.dflt_value === null) continue;
              if (column.notnull === 0 && column.dflt_value !== null
                  && column.name !== profile.identity_column && column.name !== profile.revision_column
                  && column.name !== profile.state_column && column.name !== profile.digest_column
                  && column.name !== profile.payload_column) continue;
              names.push(column.name);
              values.push(valueFor(column, tag, terminal));
            }}
            await db.prepare(`INSERT INTO ${{profile.table}} (${{names.join(",")}}) VALUES (${{values.map((_, index) => `?${{index + 1}}`).join(",")}})`)
              .bind(...values).run();
          }}

          describe("exact erasure completion change emission", () => {{
            it("emits ERASURE_COMPLETED only for the durable terminal state", async () => {{
              await insertRow("complete", true);
              const event = await db.prepare(
                "SELECT kind, subject_ref, subject_revision, payload_ref, payload_sha256, visibility_principal_ref, metadata_json " +
                "FROM research_change_feed WHERE kind = 'ERASURE_COMPLETED' ORDER BY sequence DESC LIMIT 1",
              ).first<{{ kind: string; subject_ref: string; subject_revision: number; payload_ref: string; payload_sha256: string; visibility_principal_ref: string | null; metadata_json: string }}>();
              expect(event).toMatchObject({{
                kind: "ERASURE_COMPLETED",
                subject_ref: "erasure:erasure-complete",
                subject_revision: 1,
                payload_sha256: "b".repeat(64),
              }});
              expect(JSON.parse(event?.metadata_json ?? "null")).toEqual({{
                authority_table: profile.table,
                erasure_id: "erasure-complete",
              }});
            }});
          }});
          '''
          (root / "apps/eliotr-core/test/erasure-completion-changes.test.ts").write_text(test, encoding="utf-8", newline="\n")

          manifest_path = root / "docs/agent-work/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packets = []
          def collect(value):
              if isinstance(value, dict):
                  if isinstance(value.get("id"), str): packets.append(value)
                  for child in value.values(): collect(child)
              elif isinstance(value, list):
                  for child in value: collect(child)
          collect(manifest)
          erasure_owners = []
          for packet in packets:
              owned = packet.get("owned_paths") if isinstance(packet.get("owned_paths"), list) else packet.get("ownedPaths")
              if isinstance(owned, list) and any("cloudflare-erasure" in path or "erasure-coordinator" in path for path in owned if isinstance(path, str)):
                  erasure_owners.append(packet)
          if len(erasure_owners) != 1:
              raise SystemExit(f"erasure owner packet ambiguous: {[p.get('id') for p in erasure_owners]}")
          ownership = {
              erasure_owners[0]["id"]: [
                  "apps/eliotr-core/test/erasure-completion-changes.test.ts",
                  "infra/verification/erasure-completion-change-authority.json",
              ],
              "ER-13": ["infra/d1/core/migrations/0047_erasure_completion_change_feed.sql"],
          }
          def packet_by_id(wanted): return next((packet for packet in packets if packet.get("id") == wanted), None)
          for packet_id, paths in ownership.items():
              packet = packet_by_id(packet_id)
              if packet is None: raise SystemExit(f"missing packet {packet_id}")
              key = "owned_paths" if isinstance(packet.get("owned_paths"), list) else "ownedPaths" if isinstance(packet.get("ownedPaths"), list) else None
              if key is None: raise SystemExit(f"owned paths missing {packet_id}")
              for path in paths:
                  if path not in packet[key]: packet[key].append(path)
              docs = list((root / "docs/agent-work").glob(f"{packet_id}-*.md"))
              if len(docs) != 1: raise SystemExit(f"packet document ambiguous {packet_id}")
              doc_path = docs[0]
              doc = doc_path.read_text(encoding="utf-8")
              heading = re.search(r"(?im)^##\s+Owned paths\s*$", doc)
              if heading is None: raise SystemExit(f"Owned paths heading missing {packet_id}")
              tail = doc[heading.end():]
              next_heading = re.search(r"(?m)^##\s+", tail)
              end = heading.end() + (next_heading.start() if next_heading else len(tail))
              section = doc[heading.end():end]
              additions = [path for path in paths if f'`{path}`' not in section]
              if additions:
                  if not section.endswith("\n"): section += "\n"
                  section += "".join(f'- `{path}`\n' for path in additions)
                  doc = doc[:heading.end()] + section + doc[end:]
                  doc_path.write_text(doc, encoding="utf-8", newline="\n")
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify exact erasure completion locally
        run: |
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm --filter @eliotr/core exec vitest run test/erasure-completion-changes.test.ts src/erasure-coordinator.test.ts src/erasure-runtime.test.ts --reporter=verbose
          pnpm exec vitest run packages/cloudflare-erasure --reporter=verbose
          pnpm typecheck
          pnpm lint
          pnpm budgets:check
          pnpm work-packets:check
          pnpm boundaries:check
          git diff --check
      - name: Commit only green product code
        run: |
          git rm .github/workflows/erasure-completion-changes-once.yml
          git config user.name "Eliot Research Product Builder"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: emit terminal erasure completion changes"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
