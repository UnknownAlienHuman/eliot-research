name: er16-dynamic-route-provisioning-finalize

on:
  push:
    branches:
      - agent/ER-16-dynamic-route-provisioning-20260903
    paths:
      - .github/workflows/er16-dynamic-route-provisioning-finalize.yml

permissions:
  contents: write

concurrency:
  group: er16-dynamic-route-provisioning-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-dynamic-route-provisioning-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          check-latest: false

      - name: Materialize versioned Dynamic Route provisioning
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-er16-dynamic-route-contract.py
          python3 scripts/tmp-er16-dynamic-route-provisioner.py
          python3 scripts/tmp-er16-dynamic-route-tests.py
          git rm -- scripts/tmp-er16-dynamic-route-contract.py
          git rm -- scripts/tmp-er16-dynamic-route-provisioner.py
          git rm -- scripts/tmp-er16-dynamic-route-tests.py
          git rm -- .github/workflows/er16-dynamic-route-provisioning-finalize.yml
          node -e 'JSON.parse(require("node:fs").readFileSync("infra/ai-search/dynamic-route-provisioning-capability.json", "utf8"))'
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify contracts and boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm contracts:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm work-packets:check

      - name: Lint and typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck

      - name: Verify Dynamic Route provisioning corpus
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/cloudflare-ai packages/platform-cloudflare --reporter=verbose

      - name: Worker deployment dry-run
        shell: bash
        run: |
          set -euo pipefail
          pnpm cf:dry-run
          git diff --check

      - name: Commit verified Dynamic Route provisioning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: implement versioned Dynamic Route provisioning"
          git push origin HEAD:agent/ER-16-dynamic-route-provisioning-20260903
