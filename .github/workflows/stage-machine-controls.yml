name: stage-machine-controls
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-machine-controls.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Stage reviewed source blobs without publishing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          repo = 'UnknownAlienHuman/eliot-research'
          base = 'b66298ee95d89cb2c29d97863e4c949a86ccece1'
          tree = '9e3792c6ddea427b7ab3098c015211489fc617e7'
          chunks = ['687ddb1861264d2c9fc0ff59c1ccf195a06ec69c', 'ddfda86aed02413ba109780e90630157b76e01dc', '255de0e8ef8b49c1ced6e9e6ba6add05628a3b79', '18933c900e760fae02752e9d7390c395f2757d2c']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def api(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'reviewed-source-transport'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert git('branch', '--show-current') == 'main'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == base
          assert git('rev-parse', 'HEAD^{tree}') != tree
          assert git('rev-parse', 'HEAD^:') == '4f8ebc4d4edc36c072ce324296b36b87c9ac188d'
          payload = bytearray()
          for sha in chunks:
              obj = api('/git/blobs/' + sha)
              assert obj['encoding'] == 'base64'
              data = base64.b64decode(obj['content'])
              assert blob_sha(data) == sha
              payload.extend(data)
          assert hashlib.sha256(payload).hexdigest() == '65eb61c987e130d3c22f36d7b6b1da981987b8420ce07738a074d9d12c1f1887'
          patch = zlib.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == 'add8df5cd31485a3bd26803120a8121369b36ec31a077d13ff27c71ef4f487ae'
          subprocess.run(['git', 'rm', '.github/workflows/stage-machine-controls.yml'], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert git('write-tree') == tree
          paths = git('diff', '--cached', '--name-only', base).splitlines()
          assert len(paths) == 13
          entries = []
          for path in paths:
              assert not path.startswith('.github/') and '..' not in pathlib.PurePosixPath(path).parts
              assert not any(piece in path for piece in ['.test.', '.spec.', '__tests__'])
              data = pathlib.Path(path).read_bytes()
              sha = blob_sha(data)
              obj = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert obj['sha'] == sha
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          output = pathlib.Path('/tmp/machine-controls-manifest')
          output.mkdir()
          manifest = {'base_commit': base, 'expected_tree': tree, 'patch_sha256': hashlib.sha256(patch).hexdigest(), 'files': entries}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Staged', len(entries), 'source blobs for exact tree', tree, '; no ref updated and no tests executed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: machine-controls-manifest
          path: /tmp/machine-controls-manifest/
          retention-days: 3
          if-no-files-found: error
