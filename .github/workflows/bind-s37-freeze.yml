name: Bind S37 branch reconciliation into EvidenceFreeze

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bind-s37-freeze.yml
      - .github/scripts/bind-s37-freeze.py
      - .github/scripts/split-s37-freeze-lineage.py
      - .github/scripts/type-s37-app-reader.py

permissions:
  contents: write

concurrency:
  group: bind-s37-freeze
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Record canonical source-budget baseline debt
        run: |
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/s37-budget-before.txt" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/s37-budget-before.status"
          set -e
      - name: Apply reviewed S37 freeze binding
        run: |
          python .github/scripts/bind-s37-freeze.py
          python .github/scripts/split-s37-freeze-lineage.py
          python .github/scripts/type-s37-app-reader.py
          git rm \
            .github/workflows/bind-s37-freeze.yml \
            .github/scripts/bind-s37-freeze.py \
            .github/scripts/split-s37-freeze-lineage.py \
            .github/scripts/type-s37-app-reader.py
      - name: Static and scoped compile checks
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          paths = [
              "packages/cloudflare-research/src/research-branch-execution.ts",
              "packages/cloudflare-research/src/research-evidence-freeze-branch-lineage.ts",
              "packages/cloudflare-research/src/research-evidence-freeze-composition.ts",
              "packages/cloudflare-research/src/research-evidence-freeze-preparation.ts",
              "packages/cloudflare-research/src/research-evidence-freeze.ts",
              "apps/eliotr-core/src/research-evidence-freeze-composition.ts",
              "apps/eliotr-core/src/research-semantic-composition.ts",
          ]
          source = {path: Path(path).read_text(encoding="utf-8") for path in paths}
          line_counts = {path: len(text.splitlines()) for path, text in source.items()}
          print("S37_SOURCE_LINES", line_counts)
          assert "readCommittedResearchBranchReconciliationLineage" in source[paths[0]]
          assert "branch_reconciliation: branch" in source[paths[1]]
          assert "derivedManifestRef" in source[paths[3]]
          assert "Object.keys(raw).length !== 15" in source[paths[4]]
          assert 'const INPUT_PROTOCOL = "eliotr.evidence-freeze-input.v2"' in source[paths[4]]
          assert "freeze_ref: authority.freeze_ref" in source[paths[4]]
          assert "input: EvidenceFreezeCommittedReaderInput" in source[paths[5]]
          assert "requires_branch_reconciliation" in source[paths[6]]
          assert "SERVER_OWNED_EXTERNAL_AGENT_HANDLER_GENERATION" in source[paths[6]]
          assert line_counts[paths[1]] <= 200
          assert all(line_counts[path] <= 600 for path in paths[:-1])
          print("S37_BRANCH_FREEZE_STATIC_OK")
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/cloudflare-research --filter @eliotr/core typecheck
          pnpm exec eslint \
            packages/cloudflare-research/src/research-branch-execution.ts \
            packages/cloudflare-research/src/research-evidence-freeze-branch-lineage.ts \
            packages/cloudflare-research/src/research-evidence-freeze-composition.ts \
            packages/cloudflare-research/src/research-evidence-freeze-preparation.ts \
            packages/cloudflare-research/src/research-evidence-freeze.ts \
            apps/eliotr-core/src/research-evidence-freeze-composition.ts \
            apps/eliotr-core/src/research-semantic-composition.ts
          pnpm boundaries:check
          pnpm work-packets:check
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/s37-budget-after.txt" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/s37-budget-after.status"
          set -e
          cat "$RUNNER_TEMP/s37-budget-after.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["RUNNER_TEMP"])
          before = (root / "s37-budget-before.txt").read_text(encoding="utf-8")
          after = (root / "s37-budget-after.txt").read_text(encoding="utf-8")
          before_status = int((root / "s37-budget-before.status").read_text().strip())
          after_status = int((root / "s37-budget-after.status").read_text().strip())

          def violation_keys(text: str) -> list[str]:
              keys: list[str] = []
              for raw in text.splitlines():
                  line = raw.strip()
                  match = re.fullmatch(r"(.+?) has \d+ source lines \(max \d+\)", line)
                  if match:
                      keys.append(f"{match.group(1)}|source-lines")
                      continue
                  match = re.fullmatch(r"(.+?) has \d+ lines \(max \d+\)", line)
                  if match:
                      keys.append(f"{match.group(1)}|lines")
                      continue
                  if re.fullmatch(r"Worker source is \d+ bytes \(max \d+\)", line):
                      keys.append("Worker source|bytes")
              return keys

          before_keys = violation_keys(before)
          after_keys = violation_keys(after)
          if before_status == 0:
              assert after_status == 0, "S37 introduced source-budget debt into a green baseline"
          else:
              assert before_keys, "red baseline had no parseable source-budget violations"
              assert after_status != 0, "source-budget baseline unexpectedly changed classification"
              assert len(after_keys) <= len(before_keys), (
                  f"source-budget violation count increased: {len(before_keys)} -> {len(after_keys)}"
              )
              new_keys = sorted(set(after_keys) - set(before_keys))
              assert not new_keys, f"S37 introduced new source-budget violation keys: {new_keys}"
              print(
                  "SOURCE_BUDGET_BASELINE_DEBT_UNCHANGED",
                  {"before": len(before_keys), "after": len(after_keys), "keys": sorted(set(after_keys))},
              )
          PY
          pnpm d1:depth
      - name: Commit S37 freeze binding
        run: |
          git add \
            packages/cloudflare-research/src/research-branch-execution.ts \
            packages/cloudflare-research/src/research-evidence-freeze-branch-lineage.ts \
            packages/cloudflare-research/src/research-evidence-freeze-composition.ts \
            packages/cloudflare-research/src/research-evidence-freeze-preparation.ts \
            packages/cloudflare-research/src/research-evidence-freeze.ts \
            apps/eliotr-core/src/research-evidence-freeze-composition.ts \
            apps/eliotr-core/src/research-semantic-composition.ts
          git diff --cached --check
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: bind research branches into evidence freeze' \
            -m 'Require exact committed v7/v8 branch reconciliation before freeze. Bind its checkpoint, W2 attempt and request identity into manifest/freeze refs, derive unresolved contradictions and open ResearchDebt server-side, and keep legacy v2 freeze bytes unchanged. Refs #229.'
          git push origin HEAD:main
