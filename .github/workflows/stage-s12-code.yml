name: stage-s12-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-s12-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Stage checksum-bound source blobs without updating refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const blobHash = bytes => hash('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, {
              method, headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git API ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          const head = process.env.GITHUB_SHA;
          const expectedTree = '5d7bd28a121fda8b318a0ef7b3c6b6036359744c';
          const transporter = '.github/workflows/stage-s12-code.yml';
          assert(text('branch', '--show-current') === 'main', 'Not on main');
          assert(text('rev-parse', 'HEAD') === head, 'Main advanced before checkout');
          const parentTree = text('rev-parse', 'HEAD^{tree}');
          git('rm', '--', transporter);
          assert(text('write-tree') === 'a1dcf2e0d0692bcdd3cf75b7d7833db076fdeaa2', 'Unexpected base contents');
          const chunks = [];
          for (const sha of ['9cdacd30793f6b3f7d7cf62dcba056843f28f2eb','ca89159af1f37670c731ba27a748f7791029c624','c79d015e5c0b2d3c3e47b5790552d6cf7028a187','4a5ea90899f3e43d1e817d1e83a37611e301d20f']) {
            const blob = await api(`git/blobs/${sha}`);
            assert(blob.encoding === 'base64', 'Unexpected blob encoding');
            const bytes = Buffer.from(blob.content, 'base64');
            assert(blobHash(bytes) === sha, 'Chunk identity mismatch');
            chunks.push(bytes);
          }
          const wire = Buffer.concat(chunks);
          assert(blobHash(wire) === 'ef57697bdf455b0943a0ff2b658206738fd2e593', 'Wire identity mismatch');
          const patch = gunzipSync(Buffer.from(wire.toString('utf8'), 'base64'));
          assert(hash('sha256', patch) === 'a5f3b58c04a6911fb26575c60b0e9d25b1631b79512486b3a6f65cc2f9d690e1', 'Patch checksum mismatch');
          const patchPath = join(process.env.RUNNER_TEMP, 's12-code.patch');
          writeFileSync(patchPath, patch);
          git('apply', '--unidiff-zero', '--check', patchPath);
          git('apply', '--unidiff-zero', '--index', patchPath);
          git('diff', '--cached', '--check');
          git('diff', '--exit-code');
          assert(text('write-tree') === expectedTree, 'Reviewed tree mismatch');
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          assert(paths.length === 22, 'Unexpected changed path count');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files', '--stage', '--', path);
            if (!index) {
              assert(path === transporter, 'Unexpected deletion');
              entries.push({path, mode:'100644', type:'blob', sha:null});
              continue;
            }
            const [mode, sha] = index.split(/\s+/);
            const data = git('cat-file', 'blob', sha);
            const created = await api('git/blobs', 'POST', {content:data.toString('base64'), encoding:'base64'});
            assert(created.sha === sha, `Blob identity mismatch: ${path}`);
            entries.push({path, mode, type:'blob', sha});
          }
          const dir = join(process.env.RUNNER_TEMP, 's12-code');
          mkdirSync(dir, {recursive:true});
          writeFileSync(join(dir, 'manifest.json'), JSON.stringify({base_sha:head, base_tree_sha:parentTree, tree_sha:expectedTree, ref_updated:false, entries}, null, 2));
          console.log('Reviewed source blobs staged; no ref was changed.');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s12-code-manifest
          path: ${{ runner.temp }}/s12-code/
          retention-days: 3
          if-no-files-found: error
