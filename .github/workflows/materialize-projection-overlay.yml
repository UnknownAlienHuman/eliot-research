name: materialize-projection-overlay

on:
  push:
    branches:
      - agent/p0-projection-executor-20260831

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-projection-executor-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Verify and extract audited overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .eliotr-projection-overlay.part*.b64 | base64 --decode > /tmp/projection-overlay.tgz
          echo '9ff4b8f1f60bcaf5e618bf61d0176093a357f77eedf4717adb5875b80b22a8d8  /tmp/projection-overlay.tgz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/projection-overlay.tgz
      - name: Regenerate workspace-only lockfile metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(er38): wire governed projection execution generations'
          git push origin HEAD:agent/p0-projection-executor-20260831
