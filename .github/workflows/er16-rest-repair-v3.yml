name: er16-rest-repair-v3

on:
  push:
    branches:
      - agent/ER-16-dynamic-route-rest-control-plane-20260903
    paths:
      - .github/workflows/er16-rest-repair-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-dynamic-route-rest-control-plane-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Reproduce the audited split and extract response decoding
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          first_workflow = Path(".github/workflows/er16-rest-repair.yml")
          workflow = first_workflow.read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end_marker = "\n          PY\n\n          rm -f .github/workflows/er16-rest-finalize.yml"
          end = workflow.index(end_marker, start)
          exec(
              compile(
                  textwrap.dedent(workflow[start:end]),
                  "er16-rest-first-split.py",
                  "exec",
              ),
              {},
          )

          packet_path = Path(
              "docs/agent-work/ER-16-ai-search-and-model-gateway-adapters.md"
          )
          packet_path.write_text(
              packet_path.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )

          codec_path = Path("packages/cloudflare-ai/src/dynamic-route-rest-codec.ts")
          source = codec_path.read_text(encoding="utf-8")
          response_start = source.index("export async function readDynamicRouteRestJson(")
          response_end = source.index(
              "\nexport function decodeCloudflareRoute(",
              response_start,
          )
          response_functions = source[response_start:response_end].rstrip()
          source = source[:response_start] + source[response_end:]

          helper_start = source.index("\nfunction decodeMessageArray(")
          helper_end = source.index("\nfunction decodeTimestamp(", helper_start)
          message_helper = source[helper_start:helper_end].strip()
          source = source[:helper_start] + source[helper_end:]

          exact_replacements = {
              "  DYNAMIC_ROUTE_REST_RESPONSE_MAX_BYTES,\n": "",
              "  type DynamicRouteRestResponse,\n": "",
              "const decoder = new TextDecoder(\"utf-8\", { fatal: true });\n": "",
              "const MAX_API_MESSAGES = 100;\n": "",
              "const MAX_API_MESSAGE_BYTES = 4 * 1024;\n": "",
              "function boundedStatus(status: number): number {":
                  "export function boundedStatus(status: number): number {",
              "function responseInvalid(\n": "export function responseInvalid(\n",
          }
          for old, new in exact_replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected REST codec token: {old!r}")
              source = source.replace(old, new, 1)

          envelope_start = source.index("const ENVELOPE_KEYS = new Set([")
          envelope_end = source.index("const ROUTE_KEYS = new Set([", envelope_start)
          source = source[:envelope_start] + source[envelope_end:]
          codec_path.write_text(source.rstrip() + "\n", encoding="utf-8")

          response_path = Path(
              "packages/cloudflare-ai/src/dynamic-route-rest-response-codec.ts"
          )
          response_path.write_text(
              '''import {
            DYNAMIC_ROUTE_REST_RESPONSE_MAX_BYTES,
            type DynamicRouteRestAmbiguousEffect,
            type DynamicRouteRestResponse,
          } from "./dynamic-route-rest-contract.js";
          import {
            boundedStatus,
            dynamicRouteRestFailure,
            exactObject,
            responseInvalid,
          } from "./dynamic-route-rest-codec.js";

          const MAX_API_MESSAGES = 100;
          const MAX_API_MESSAGE_BYTES = 4 * 1024;
          const ENVELOPE_KEYS = new Set([
            "errors",
            "messages",
            "result",
            "result_info",
            "success",
          ]);
          const encoder = new TextEncoder();
          const decoder = new TextDecoder("utf-8", { fatal: true });

          '''.replace("          ", "")
              + response_functions
              + "\n\n"
              + message_helper
              + "\n",
              encoding="utf-8",
          )

          control_path = Path(
              "packages/cloudflare-ai/src/dynamic-route-rest-control-plane.ts"
          )
          control = control_path.read_text(encoding="utf-8")
          for item in [
              "  decodeCloudflareApiEnvelope,\n",
              "  readDynamicRouteRestJson,\n",
          ]:
              if control.count(item) != 1:
                  raise SystemExit(f"unexpected response import: {item!r}")
              control = control.replace(item, "", 1)
          import_anchor = '} from "./dynamic-route-rest-codec.js";\n'
          response_import = '''import {
            decodeCloudflareApiEnvelope,
            readDynamicRouteRestJson,
          } from "./dynamic-route-rest-response-codec.js";
          '''.replace("          ", "")
          if control.count(import_anchor) != 1:
              raise SystemExit("REST codec import anchor drifted")
          control_path.write_text(
              control.replace(import_anchor, import_anchor + response_import, 1),
              encoding="utf-8",
          )
          PY

          rm -f .github/workflows/er16-rest-finalize.yml
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify repository and ER-16 boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm work-packets:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/cloudflare-ai/src/dynamic-route-rest-control-plane.test.ts
          pnpm exec vitest run packages/cloudflare-ai
          git diff --check

      - name: Commit the clean verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/er16-rest-repair.yml \
            .github/workflows/er16-rest-repair-v2.yml \
            .github/workflows/er16-rest-repair-v3.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: implement strict Dynamic Route REST control plane"
          git push origin HEAD:agent/ER-16-dynamic-route-rest-control-plane-20260903
