name: er22-scope-depth-preflight-sync

on:
  push:
    branches:
      - agent/ER-22-scope-depth-preflight-20260904

permissions:
  contents: write

concurrency:
  group: er22-scope-depth-preflight-sync
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[er22-scope-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-22-scope-depth-preflight-20260904
          fetch-depth: 0

      - name: Reject recursive scope payloads before Zod descent
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path("apps/eliotr-core/src/federation-service.ts")
          service = service_path.read_text(encoding="utf-8")
          helper_anchor = '''function scopeDepth(scope: FederationRequest["scope_expression"]): number {
            if (scope.kind !== "UNION" && scope.kind !== "INTERSECT" && scope.kind !== "EXCEPT") return 1;
            return 1 + Math.max(scopeDepth(scope.left), scopeDepth(scope.right));
          }'''
          helper_replacement = '''function preflightScopeDepth(value: unknown): void {
            if (!isRecord(value)) return;
            const stack: Array<{ value: unknown; depth: number }> = [
              { value: value.scope_expression, depth: 1 },
            ];
            while (stack.length > 0) {
              const current = stack.pop();
              if (current === undefined) break;
              if (current.depth > MAX_SCOPE_DEPTH) {
                fail(
                  "FEDERATION_SCOPE_TOO_DEEP",
                  `scope expression exceeds depth ${MAX_SCOPE_DEPTH}`,
                );
              }
              if (!isRecord(current.value)) continue;
              const kind = current.value.kind;
              if (kind === "UNION" || kind === "INTERSECT" || kind === "EXCEPT") {
                stack.push(
                  { value: current.value.left, depth: current.depth + 1 },
                  { value: current.value.right, depth: current.depth + 1 },
                );
              }
            }
          }
          function scopeDepth(scope: FederationRequest["scope_expression"]): number {
            if (scope.kind !== "UNION" && scope.kind !== "INTERSECT" && scope.kind !== "EXCEPT") return 1;
            return 1 + Math.max(scopeDepth(scope.left), scopeDepth(scope.right));
          }'''
          if service.count(helper_anchor) != 1:
              raise SystemExit("scope-depth helper anchor missing or ambiguous")
          service = service.replace(helper_anchor, helper_replacement)

          parse_anchor = '''function parseRequest(value: unknown, now: number): FederationRequest {
            const parsed = FederationRequestSchema.safeParse(value);'''
          parse_replacement = '''function parseRequest(value: unknown, now: number): FederationRequest {
            preflightScopeDepth(value);
            const parsed = FederationRequestSchema.safeParse(value);'''
          if service.count(parse_anchor) != 1:
              raise SystemExit("federation parse anchor missing or ambiguous")
          service_path.write_text(service.replace(parse_anchor, parse_replacement), encoding="utf-8")

          test_path = Path("apps/eliotr-core/src/federation-service.test.ts")
          test = test_path.read_text(encoding="utf-8")
          helper_test_anchor = '''function request(overrides: Partial<FederationRequest> = {}): FederationRequest {
            return {'''
          helper_test_replacement = '''function deeplyNestedScope(depth: number): unknown {
            let scope: unknown = { kind: "PROJECT", project_id: "project-1" };
            for (let index = 1; index < depth; index += 1) {
              scope = {
                kind: "UNION",
                left: scope,
                right: { kind: "TAG", tag: `tag-${index}` },
              };
            }
            return scope;
          }

          function request(overrides: Partial<FederationRequest> = {}): FederationRequest {
            return {'''
          if test.count(helper_test_anchor) != 1:
              raise SystemExit("federation request helper anchor missing or ambiguous")
          test = test.replace(helper_test_anchor, helper_test_replacement)

          test_anchor = '''  it("fails closed on unknown request, scope, security and budget fields", async () => {'''
          test_replacement = '''  it("rejects excessive scope depth before recursive schema parsing", async () => {
            const input = dependencies();
            const service = createFederationService(input);
            const malicious = {
              ...request(),
              scope_expression: deeplyNestedScope(10_000),
            } as FederationRequest;

            await expectCode(
              service.submit(context(), malicious),
              "FEDERATION_SCOPE_TOO_DEEP",
            );
            expect(input.jobs.reserve).not.toHaveBeenCalled();
          });

          it("fails closed on unknown request, scope, security and budget fields", async () => {'''
          if test.count(test_anchor) != 1:
              raise SystemExit("federation scope-negative insertion anchor missing or ambiguous")
          test_path.write_text(test.replace(test_anchor, test_replacement), encoding="utf-8")
          PY
          git rm -- .github/workflows/er22-scope-depth-preflight-sync.yml
          git diff --check

      - name: Commit bounded parser preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-22: preflight federation scope depth [er22-scope-synced]"
          git push origin HEAD:agent/ER-22-scope-depth-preflight-20260904
