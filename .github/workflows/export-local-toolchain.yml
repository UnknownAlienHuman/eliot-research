name: export-local-toolchain
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-local-toolchain.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COREPACK_HOME: /tmp/eliotr-public-corepack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Export public tools and committed main only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          corepack prepare pnpm@11.23.0 --activate
          mkdir -p /tmp/eliotr-public-tools
          tar -C "$COREPACK_HOME" -czf /tmp/eliotr-public-tools/corepack.tar.gz .
          cp "$(command -v node)" /tmp/eliotr-public-tools/node
          git bundle create /tmp/eliotr-public-tools/main.bundle main
          git rev-parse HEAD > /tmp/eliotr-public-tools/SOURCE_SHA
          node --version > /tmp/eliotr-public-tools/VERSIONS
          corepack pnpm --version >> /tmp/eliotr-public-tools/VERSIONS
          (cd /tmp/eliotr-public-tools && sha256sum corepack.tar.gz node main.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eliotr-public-tools
          path: /tmp/eliotr-public-tools/
          retention-days: 1
          if-no-files-found: error
