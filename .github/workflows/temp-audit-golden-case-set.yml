name: temp-audit-golden-case-set
on:
  push:
    branches:
      - audit/380-golden-case-set
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply repair and run scoped checks
        shell: bash
        run: |
          set -euo pipefail
          python .github/audit-380-golden-case-set.py
          rm .github/audit-380-golden-case-set.py \
            .github/workflows/temp-audit-golden-case-set.yml
          git diff --check
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @eliotr/testkit typecheck
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files = [
            'packages/testkit/src/golden.test.ts',
            'tests/golden-corpus/golden-harness.test.ts',
          ];
          for (const file of files) {
            const source = ts.createSourceFile(file, fs.readFileSync(file, 'utf8'), ts.ScriptTarget.ESNext, true, ts.ScriptKind.TS);
            if (source.parseDiagnostics.length > 0) throw new Error(`${file}: TypeScript parse failed`);
            const visit = node => {
              if (ts.isCallExpression(node) && ts.isIdentifier(node.expression) &&
                  node.expression.text === 'assertGoldenPromotionGate' && node.arguments.length !== 2) {
                throw new Error(`${file}: Golden gate call is not bound to an expected case set`);
              }
              ts.forEachChild(node, visit);
            };
            visit(source);
          }
          NODE
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "fix: bind Golden promotion to exact case set (#380)"
          git push origin HEAD:audit/380-golden-case-set
