name: er00-work-packet-manifest-sync

on:
  push:
    branches:
      - agent/ER-00-work-packet-manifest-sync-20260903

permissions:
  contents: write

concurrency:
  group: er00-work-packet-manifest-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[er00-manifest-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-00-work-packet-manifest-sync-20260903
          fetch-depth: 0

      - name: Synchronize ER-17 ownership and manifest generation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/agent-work/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("protocol") != "eliotr.agent-work.v1":
              raise SystemExit("unexpected work-packet protocol")
          if manifest.get("baseline_commit") != "c5bce4ce9baffe8542e85e7f37ba2fddc6670e01":
              raise SystemExit("unexpected work-packet baseline")

          packet = next(
              (entry for entry in manifest.get("packets", []) if entry.get("id") == "ER-17"),
              None,
          )
          if packet is None:
              raise SystemExit("ER-17 packet is missing")
          expected = [
              "packages/platform-cloudflare/src/access.ts",
              "packages/platform-cloudflare/src/observability.ts",
              "packages/platform-cloudflare/src/runtime-limits.ts",
          ]
          desired = [
              "packages/platform-cloudflare/src/access.ts",
              "packages/platform-cloudflare/src/access.test.ts",
              "packages/platform-cloudflare/src/observability.ts",
              "packages/platform-cloudflare/src/observability.test.ts",
              "packages/platform-cloudflare/src/runtime-limits.ts",
              "packages/platform-cloudflare/src/runtime-limits.test.ts",
          ]
          if packet.get("owned_paths") != expected:
              raise SystemExit("unexpected ER-17 ownership state")

          packet["owned_paths"] = desired
          manifest["baseline_commit"] = "413f843de32082535559b0a10fa2ba4c56f70fdc"
          manifest["generated_at"] = "2026-09-04T02:00:00Z"
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git rm -- .github/workflows/er00-work-packet-manifest-sync.yml
          node scripts/check-work-packets.mjs
          git diff --check

      - name: Commit synchronized manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-00: synchronize ER-17 work-packet ownership [er00-manifest-synced]"
          git push origin HEAD:agent/ER-00-work-packet-manifest-sync-20260903
