name: er16-fingerprint-classification-finalize

on:
  push:
    branches:
      - agent/ER-16-model-gateway-fetch-adapter-20260903
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: er16-fingerprint-classification-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-model-gateway-fetch-adapter-20260903
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Apply typed-error correction
        run: |
          set -euo pipefail
          python3 scripts/tmp-er16-fingerprint-error-classification.py
          git rm -- scripts/tmp-er16-fingerprint-error-classification.py
          git rm -- .github/workflows/er16-fingerprint-classification-finalize.yml
          git diff --check
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify corrected boundary
        run: |
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/cloudflare-ai packages/platform-cloudflare --reporter=verbose
          git diff --check
      - name: Commit verified correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ER-16: classify persisted fingerprint failures exactly [fingerprint-finalized]"
          git push origin HEAD:agent/ER-16-model-gateway-fetch-adapter-20260903
