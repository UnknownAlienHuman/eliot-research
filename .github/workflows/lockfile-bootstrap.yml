name: lockfile-bootstrap

on:
  push:
    branches:
      - agent/gemini-spark-mcp-20260830

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-spark-mcp-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Generate exact workspace lockfile
        run: pnpm install --lockfile-only
      - name: Commit lockfile
        shell: bash
        run: |
          test -f pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: commit reproducible pnpm lockfile"
          git push origin HEAD:agent/gemini-spark-mcp-20260830
