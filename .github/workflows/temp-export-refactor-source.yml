name: temp-apply-wiki-outbox-removal
on:
  push:
    branches:
      - refactor/380-remove-wiki-fake-outbox
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply the checked patch and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/refactor-380-00.patch .github/refactor-380-01.patch \
            .github/refactor-380-02.patch .github/refactor-380-03.patch > /tmp/refactor.patch
          git apply --check --whitespace=error-all /tmp/refactor.patch
          git apply --whitespace=error-all /tmp/refactor.patch
          rm .github/refactor-380-00.patch .github/refactor-380-01.patch \
            .github/refactor-380-02.patch .github/refactor-380-03.patch \
            .github/workflows/temp-export-refactor-source.yml
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "refactor: remove Wiki pseudo-outbox (#380)"
          git push origin HEAD:refactor/380-remove-wiki-fake-outbox
