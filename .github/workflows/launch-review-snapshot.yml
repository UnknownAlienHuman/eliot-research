name: launch-review-snapshot
on:
  push:
    branches: [agent/launch-01-library-20260905]
    paths: [.github/workflows/launch-review-snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify exact reviewed source and upload blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          const repo = 'UnknownAlienHuman/eliot-research';
          const tree = 'a7ad018d5dc3146c810947d912ae53a427b3424b';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 15000 }).trim();
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/agent/launch-01-library-20260905');
          assert.equal(git('rev-parse', 'HEAD^'), 'cd84d713df462b223c930db2c2c4506d5ab27e91');
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git blob API returned ${response.status}`);
            return response.json();
          };
          const pieces = [];
          for (const sha of ['662b46bad857e6a02f08de221b2564591b06ca41',
            '1343cb32768ad44af646dd5e851f9082ab53731d', '06f78500868f12094fc2cf79104d21281989ced5']) {
            const blob = await api(`/git/blobs/${sha}`);
            assert.equal(blob.sha, sha); assert.equal(blob.encoding, 'base64');
            pieces.push(Buffer.from(blob.content, 'base64').toString('utf8'));
          }
          const patch = brotliDecompressSync(Buffer.from(pieces.join(''), 'base64'), { maxOutputLength: 200000 });
          assert.equal(createHash('sha256').update(patch).digest('hex'),
            'e74776cfe8576fca9574688bb0baa31ffc8406554f3050ad6801f17c3c496ef3');
          writeFileSync('/tmp/reviewed.patch', patch, { mode: 0o600 });
          git('apply', '--index', '--whitespace=error', '/tmp/reviewed.patch');
          git('rm', '.github/workflows/launch-review-snapshot.yml');
          git('diff', '--cached', '--check');
          assert.equal(git('write-tree'), tree);
          for (const gate of ['check-work-packets', 'check-implementation-status', 'check-budgets', 'check-boundaries']) {
            execFileSync(process.execPath, [`scripts/${gate}.mjs`], { stdio: 'inherit', timeout: 20000 });
          }
          const changes = execFileSync('git', ['diff', '--cached', '--no-renames', '--name-status', '-z'], { encoding: 'utf8' }).split('\0');
          if (changes.at(-1) === '') changes.pop();
          assert.equal(changes.length % 2, 0);
          let count = 0;
          for (let i = 0; i < changes.length; i += 2) {
            const [status, path] = changes.slice(i, i + 2);
            assert.ok(['A', 'M', 'D'].includes(status));
            if (status === 'D') continue;
            const bytes = execFileSync('git', ['show', `:${path}`], { timeout: 15000 });
            const expected = git('rev-parse', `:${path}`);
            const blob = await api('/git/blobs', { encoding: 'base64', content: bytes.toString('base64') });
            assert.equal(blob.sha, expected); count += 1;
          }
          console.log(`VERIFIED_SOURCE_TREE=${tree}; UPLOADED_BLOBS=${count}`);
          // The caller attaches this exact tree. No tree, commit, PR, branch or ref mutation here.
          JS
