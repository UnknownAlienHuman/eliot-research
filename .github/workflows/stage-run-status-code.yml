name: stage-run-status-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-run-status-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Transfer reviewed source blobs without publishing a ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { brotliDecompressSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const check = (ok, message) => { if (!ok) throw new Error(message); };
          const digest = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const blobHash = bytes => digest('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          check(process.env.GITHUB_REPOSITORY === 'UnknownAlienHuman/eliot-research', 'Wrong repository');
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, {
              method, headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git API ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          const head = process.env.GITHUB_SHA;
          const baseTree = '35c99a4450db8d045f5d1e608cd10aecf66a51de';
          const expectedTree = '03831d061f80b0b292960db1e4b89cea2bd6087d';
          const transporter = '.github/workflows/stage-run-status-code.yml';
          check(text('branch', '--show-current') === 'main', 'Not on main');
          check(text('rev-parse', 'HEAD') === head, 'Concurrent checkout');
          const parentTree = text('rev-parse', 'HEAD^{tree}');
          git('rm', '--', transporter);
          check(text('write-tree') === baseTree, 'Unexpected base contents');
          const chunks = [
            ['e42f067d39e1a55fb65fa86a0d97c007ba7b21d5', 5000],
            ['09f967c37e43b14984ae23e6950bdc68797cbf47', 5000],
            ['2827ab8e9701bfd0c6e7602deef4fbe0301d8b94', 3884],
          ];
          let wire = '';
          for (const [sha, size] of chunks) {
            const blob = await api(`git/blobs/${sha}`);
            check(blob.encoding === 'base64', 'Unexpected encoding');
            const bytes = Buffer.from(blob.content, 'base64');
            check(bytes.length === size && blobHash(bytes) === sha, 'Transfer chunk mismatch');
            wire += bytes.toString('utf8');
          }
          const patch = brotliDecompressSync(Buffer.from(wire, 'base64'), { maxOutputLength: 131072 });
          check(patch.length === 49903 && digest('sha256', patch) === '244af0340bf1b450089c55f6b1f1889f180a978edbf207ade834fad0c22f83a7', 'Patch mismatch');
          const patchPath = join(process.env.RUNNER_TEMP, 'run-status.patch');
          writeFileSync(patchPath, patch);
          git('apply', '--unidiff-zero', '--check', patchPath);
          git('apply', '--unidiff-zero', '--index', patchPath);
          git('diff', '--cached', '--check');
          git('diff', '--exit-code');
          check(text('write-tree') === expectedTree, 'Reviewed tree mismatch');
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          check(paths.length === 20, 'Unexpected path count');
          check(!paths.some(path => /\/(?:test|tests)\//u.test(path) || /\.(?:test|spec)\.ts$/u.test(path)), 'Unexpected test edit');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files', '--stage', '--', path);
            if (!index) {
              check(path === transporter, 'Unexpected deletion');
              entries.push({ path, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const [mode, sha] = index.split(/\s+/);
            const bytes = git('cat-file', 'blob', sha);
            const published = await api('git/blobs', 'POST', { content: bytes.toString('base64'), encoding: 'base64' });
            check(published.sha === sha, `Published blob mismatch: ${path}`);
            entries.push({ path, mode, type: 'blob', sha });
          }
          const output = join(process.env.RUNNER_TEMP, 'run-status-code');
          mkdirSync(output, { recursive: true });
          writeFileSync(join(output, 'manifest.json'), JSON.stringify({ head, parent_tree: parentTree, base_tree: baseTree, expected_tree: expectedTree, entries }, null, 2));
          console.log(`STAGED_TREE=${expectedTree}\nBLOB_ENTRIES=${entries.length}\nNo ref or commit published by this transport.`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run-status-code-manifest
          path: ${{ runner.temp }}/run-status-code/
          retention-days: 3
          if-no-files-found: error
