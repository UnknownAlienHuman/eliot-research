name: stage-0-lockfile

on:
  push:
    branches: [impl/stage-0-shell]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: impl/stage-0-shell
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Regenerate the single-package lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate stage-0 lockfile"
          git push origin HEAD:impl/stage-0-shell
