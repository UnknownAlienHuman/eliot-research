name: ER-26 exact submission verification
on:
  push:
    branches: [agent/ER-26-local-release-audit-20260904]
    paths: [.github/workflows/er26-verify-submission.yml]
permissions:
  contents: write
jobs:
  verify-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply reviewed metadata to the exact code parent
        env:
          METADATA_PATCH: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "14b990030ae399d55b587a4034c299b3bece2675"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['METADATA_PATCH']))
          assert hashlib.sha256(patch).hexdigest() == '8755a0ca8dc1807624ec6753c1b127bf757243c8f4e462998847e0b5e20795c2'
          pathlib.Path('/tmp/er26-metadata.patch').write_bytes(patch)
          p = pathlib.Path('scripts/test-deployment-orchestration.mjs')
          s = p.read_text().replace('import { readFile } from "node:fs/promises";', 'import { readFile } from "node:fs/promises";\nimport { resolve } from "node:path";\nimport { fileURLToPath } from "node:url";')
          s = s.replace('assert.ok(cwd.endsWith(args.includes("--config") ? "apps/eliotr-core" : "eliot-research"));', 'assert.equal(resolve(cwd), resolve(fileURLToPath(new URL("../", import.meta.url)),\n        args.includes("--config") ? "apps/eliotr-core" : "."));')
          p.write_text(s)
          PY
          git apply --index /tmp/er26-metadata.patch
          git add scripts/test-deployment-orchestration.mjs
          git rm .github/workflows/er26-verify-submission.yml
          git diff --cached --check
          test "$(git write-tree)" = "c8817f2c71c62f26badcdfe71a1a8693bcaf82c1"
          node scripts/test-deployment-verification.mjs
          node scripts/test-deployment-orchestration.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ER-26: synchronize audit and owned paths; verify exact offline-tested source tree'
          test "$(git ls-remote origin refs/heads/agent/ER-26-local-release-audit-20260904 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/ER-26-local-release-audit-20260904
