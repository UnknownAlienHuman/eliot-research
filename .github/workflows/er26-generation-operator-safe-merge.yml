name: er26-generation-operator-safe-merge

on:
  push:
    branches:
      - agent/ER-26-ai-search-generation-operator-20260904

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: er26-generation-operator-safe-merge
  cancel-in-progress: true

jobs:
  merge-final-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: UnknownAlienHuman/eliot-research
      BRANCH: agent/ER-26-ai-search-generation-operator-20260904
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-generation-operator-20260904
          fetch-depth: 0

      - name: Require the finalized content tree
        id: final
        shell: bash
        run: |
          set -euo pipefail
          final=true
          grep -q 'const documentSha256 = createHash' scripts/manage-ai-search-generation.mjs || final=false
          grep -q 'managed_ai_search_mutation: false' scripts/manage-ai-search-generation.mjs || final=false
          grep -q 'test-ai-search-generation-operator.mjs' scripts/run-provisioner-tests.mjs || final=false
          for path in \
            .github/workflows/er26-generation-operator-finalize.yml \
            .github/workflows/er26-provisioner-ownership-complete.yml \
            .github/workflows/er26-generation-operator-recovery.yml; do
            [[ ! -e "${path}" ]] || final=false
          done
          node <<'NODE' || final=false
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('docs/agent-work/manifest.json', 'utf8'));
          const packet = manifest.packets.find((entry) => entry.id === 'ER-26');
          const required = [
            'scripts/lib/cloudflare-d1-http.mjs',
            'scripts/manage-ai-search-generation.mjs',
            'scripts/run-provisioner-tests.mjs',
            'scripts/test-ai-search-generation-operator.mjs',
          ].filter((path) => fs.existsSync(path));
          if (!packet || required.some((path) => !packet.owned_paths.includes(path))) process.exit(1);
          const document = fs.readFileSync('docs/agent-work/ER-26-cloudflare-provisioning-and-deployment.md', 'utf8');
          if (required.some((path) => !document.includes(`- \`${path}\``))) process.exit(1);
          NODE
          echo "ready=${final}" >> "${GITHUB_OUTPUT}"

      - name: Stop until the recovery finalizer has committed
        if: ${{ steps.final.outputs.ready != 'true' }}
        shell: bash
        run: echo "Final content gate is not yet satisfied; leaving the draft PR open."

      - name: Wait for ci.yml on the exact finalized head
        if: ${{ steps.final.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          workflow_id="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml" --jq '.id')"
          passed=0
          for _ in $(seq 1 100); do
            payload="$(gh api "repos/${REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=${BRANCH}&per_page=50")"
            row="$(jq -c --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"${payload}")"
            if [[ -z "${row}" || "$(jq -r '.status' <<<"${row}")" != "completed" ]]; then
              sleep 30
              continue
            fi
            conclusion="$(jq -r '.conclusion // ""' <<<"${row}")"
            if [[ "${conclusion}" != "success" ]]; then
              echo "ci.yml failed on ${head_sha}: ${conclusion}" >&2
              exit 1
            fi
            passed=1
            break
          done
          [[ "${passed}" == "1" ]] || { echo "timed out waiting for ci.yml on ${head_sha}" >&2; exit 1; }

      - name: Remove merge machinery and merge the tested code tree
        if: ${{ steps.final.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch -- \
            .github/workflows/er26-generation-operator-verified-merge.yml \
            .github/workflows/er26-generation-operator-safe-merge.yml
          git commit -m "ER-26: remove temporary merge machinery [er26-safe-merge]"
          git push origin HEAD:"${BRANCH}"
          final_sha="$(git rev-parse HEAD)"
          pr_number="$(gh api "repos/${REPOSITORY}/pulls?state=open&head=UnknownAlienHuman:${BRANCH}" --jq '.[0].number // empty')"
          [[ -n "${pr_number}" ]] || { echo "open PR not found" >&2; exit 1; }
          if [[ "$(gh pr view "${pr_number}" --repo "${REPOSITORY}" --json isDraft --jq '.isDraft')" == "true" ]]; then
            gh pr ready "${pr_number}" --repo "${REPOSITORY}"
          fi
          gh api \
            --method PUT \
            "repos/${REPOSITORY}/pulls/${pr_number}/merge" \
            -f merge_method=squash \
            -f sha="${final_sha}" \
            -f commit_title="ER-26: operate AI Search generations through the durable registry (#${pr_number})" \
            -f commit_message="Add the guarded SEARCH_DB generation operator, exact lifecycle receipts, complete ownership, lost-acknowledgement reconciliation and no-retry uncertain-write evidence. The exact code tree passed ci.yml; the final SHA only removes temporary workflow files. Live Cloudflare operations were not executed."
