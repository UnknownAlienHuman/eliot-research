name: er40-recompute-projection-fixture

on:
  push:
    branches:
      - "agent/ER-40-projection-identities-v1-20260902"
    paths:
      - ".github/workflows/er40-recompute-projection-fixture.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Recompute exact SHA-256 oracles from committed preimages
        run: |
          python3 <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path("crates/eliotr-test-vectors/fixtures/projection-identities.v1.txt")
          lines = path.read_text(encoding="utf-8").splitlines()
          if lines[:3] != [
              "# protocol=eliotr.test-vectors.stable-id.v1",
              "# schema_generation=1",
              "# columns=case_id|operation|input_hex|expected|output_hex|error_code",
          ]:
              raise SystemExit("unexpected projection identity fixture headers")

          repaired = lines[:3]
          case_count = 0
          for line in lines[3:]:
              columns = line.split("|")
              if len(columns) != 6:
                  raise SystemExit(f"invalid fixture row: {line[:80]}")
              case_id, operation, input_hex, expected, output_hex, error_code = columns
              input_bytes = b"" if input_hex == "-" else bytes.fromhex(input_hex)
              if operation == "derive_stable_id" and expected == "ok":
                  prefix = input_bytes.split(b"\0", 1)[0]
                  output = prefix + b"-" + sha256(input_bytes).hexdigest()[:48].encode("ascii")
                  output_hex = output.hex()
              elif operation == "validate_stable_id" and expected == "ok":
                  output_hex = input_hex
              repaired.append("|".join([
                  case_id,
                  operation,
                  input_hex,
                  expected,
                  output_hex,
                  error_code,
              ]))
              case_count += 1

          if case_count != 36:
              raise SystemExit(f"expected 36 cases, found {case_count}")
          path.write_text("\n".join(repaired) + "\n", encoding="utf-8")
          PY
          node scripts/check-rust-vectors.mjs
          rm .github/workflows/er40-recompute-projection-fixture.yml
          git diff --check
      - name: Commit repaired corpus and remove helper
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(rust): recompute projection identity SHA oracles"
          git push origin "HEAD:${HEAD_REF}"
