name: er22-cancel-proof-verified-merge

on:
  push:
    branches:
      - agent/ER-22-cancelled-authority-proof-20260904

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: er22-cancel-proof-verified-merge
  cancel-in-progress: false

jobs:
  finalize-verify-merge:
    if: ${{ !contains(github.event.head_commit.message, '[er22-cancel-merge-gate]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: "72"
      BRANCH: agent/ER-22-cancelled-authority-proof-20260904
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-22-cancelled-authority-proof-20260904
          fetch-depth: 0
      - name: Finalize the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rm -f \
            .github/workflows/er22-cancelled-authority-proof-sync.yml \
            .github/workflows/er22-cancelled-authority-proof-typefix.yml \
            .github/workflows/er22-cancel-proof-verified-merge.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          else
            git commit -m "ER-22: finalize cancellation proof [er22-cancel-merge-gate]"
            git push origin HEAD:"$BRANCH"
            echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Require verify and rust on the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 110); do
            head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            if [[ "$head_sha" != "$CANDIDATE_SHA" ]]; then
              echo "PR head moved from $CANDIDATE_SHA to $head_sha" >&2
              exit 1
            fi
            checks="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/check-runs?per_page=100")"
            verify="$(jq -r '[.check_runs[] | select(.name == "verify")][-1].conclusion // "PENDING"' <<<"$checks")"
            rust="$(jq -r '[.check_runs[] | select(.name == "rust")][-1].conclusion // "PENDING"' <<<"$checks")"
            if [[ "$verify" == "success" && "$rust" == "success" ]]; then
              exit 0
            fi
            for conclusion in "$verify" "$rust"; do
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "required check failed: verify=$verify rust=$rust" >&2
                  exit 1
                  ;;
              esac
            done
            sleep 8
          done
          echo "required checks did not complete" >&2
          exit 1
      - name: Squash-merge the exact green head
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$CANDIDATE_SHA" \
            --subject "ER-22: require exact cancellation authority before normalization (#72)" \
            --body "Reject cancelled federation records unless declared and observed dispositions plus a cancellation receipt are exact. Exact candidate passed verify and rust."
