name: fix-projection-fixture

on:
  push:
    branches:
      - agent/p0-projection-executor-20260831

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-projection-executor-20260831
          fetch-depth: 0
      - name: Correct exact content fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/cloudflare-projection/src/executor.test.ts')
          text = path.read_text(encoding='utf-8')
          edits = [
              ('const A = "a".repeat(64);', 'const A = "3f468ef0dde323a1504435da3aa02d387fc1e9f4f1475b5b3323112017806714";'),
              ('              size_bytes: 18,', '              size_bytes: 17,'),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one fixture match: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit source-only fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/cloudflare-projection/src/executor.test.ts
          git commit -m 'test(er38): use exact projection content digest'
          git push origin HEAD:agent/p0-projection-executor-20260831
