name: temp-remove-unused-ai-chat
on:
  push:
    branches:
      - refactor/380-remove-unused-ai-chat
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Remove the uncalled dependency and regenerate the lockfile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'apps/eliotr-core/package.json',
              '    "@cloudflare/ai-chat": "0.12.1",\n',
              '',
          )
          replace_once(
              'docs/implementation/cloudflare-native-path.md',
              'Core already lists `agents 0.27.0`, `@cloudflare/ai-chat 0.12.1`, `ai 7.0.136` and Wrangler `4.143.1` at this\nsource baseline. Use the installed suitable adapter before writing new provider parsers or upgrading the stack.\n',
              'Core lists `agents 0.27.0`, `ai 7.0.136` and Wrangler `4.143.1` at this source baseline.\n`@cloudflare/ai-chat` was removed after no production caller was found; do not restore it for hypothetical replay.\nUse the installed suitable adapter before writing new provider parsers or upgrading the stack.\n',
          )
          replace_once(
              'docs/implementation/research-session-projection-protocol.md',
              'If `@cloudflare/ai-chat` has no other real caller after the audit, remove that dependency rather than keeping it for\nhypothetical reuse.\n',
              'No production caller remained, so `@cloudflare/ai-chat` was removed instead of being retained for hypothetical reuse.\n',
          )
          PY
          npm install --global corepack@0.34.7
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --lockfile-only
          if grep -Fq '@cloudflare/ai-chat' apps/eliotr-core/package.json pnpm-lock.yaml; then
            echo 'unused AI chat dependency remains in the active package graph' >&2
            exit 1
          fi
          rm .github/workflows/temp-remove-unused-ai-chat.yml
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "refactor: remove unused AI chat dependency (#380)"
          git push origin HEAD:refactor/380-remove-unused-ai-chat
