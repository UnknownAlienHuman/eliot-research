name: frontend-owner

on:
  push:
    branches: [main]
    paths:
      - 'apps/eliotr-web/**'
      - 'packages/ui/**'
      - 'packages/owner-api-client/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-owner.yml'
  pull_request:
    paths:
      - 'apps/eliotr-web/**'
      - 'packages/ui/**'
      - 'packages/owner-api-client/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-owner.yml'

permissions:
  contents: read

concurrency:
  group: frontend-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Frontend owner checkpoint mechanics
        run: node scripts/check-frontend-owner-checkpoints.mjs --history-base c37e56e0ebdfc7f6d294879008a4036d1b95b985 --head "$GITHUB_SHA"
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck owner web
        run: pnpm exec tsc -b apps/eliotr-web/tsconfig.json --pretty false
      - name: Lint owner frontend
        run: pnpm exec eslint apps/eliotr-web/src packages/owner-api-client/src packages/ui/src
      - name: Research admission authority
        run: pnpm exec vitest run --config vitest.config.ts packages/owner-api-client/src/research/runs/authority.test.ts --reporter=verbose
      - name: Install UI browser
        run: pnpm --dir packages/ui exec playwright install --with-deps chromium
      - name: Focused Storybook integration
        run: pnpm --dir packages/ui exec vitest run --config .storybook/vitest.config.ts --reporter=verbose --testNamePattern 'Operation Announcement|Readiness And Versions Failed|Sources Readiness Announcement|Sources Versions Announcement|Sources Announcement Privacy|Studio Operation Announcements|Research Operation Announcements|Connections Operation Announcements|Cross Page Selection Recovery|Replaced Selected Page Refused|Sections Unsupported|Optional Failure Facts|Targeted Retry Hierarchy|Readiness Renewal Is Not Blocked|Readiness Blocked|Google Transport Is Routing Only|Diagnostic Issued|Diagnostic Expired|Details Journey'
      - name: Owner web production build
        run: pnpm --dir apps/eliotr-web exec vite build --manifest
      - name: Upload owner web static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-web-build-${{ github.sha }}
          path: apps/eliotr-web/dist
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true