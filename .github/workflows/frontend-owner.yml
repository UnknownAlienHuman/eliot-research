name: frontend-owner

on:
  workflow_dispatch:
  push:
    branches: [main, impl/stage-0-shell]
    paths:
      - 'src/web/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-owner.yml'
  pull_request:
    paths:
      - 'src/web/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-owner.yml'

permissions:
  contents: read

concurrency:
  group: frontend-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-owner:
    name: Replacement React shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint client
        run: pnpm exec eslint src/web
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Upload client build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replacement-client-${{ github.sha }}
          path: dist/client
          if-no-files-found: error
          retention-days: 7
