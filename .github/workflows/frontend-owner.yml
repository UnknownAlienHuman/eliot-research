name: frontend-owner

on:
  push:
    branches: [main]
    paths:
      - 'apps/eliotr-web/**'
      - 'packages/ui/**'
      - 'packages/owner-api-client/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-owner.yml'
  pull_request:
    paths:
      - 'apps/eliotr-web/**'
      - 'packages/ui/**'
      - 'packages/owner-api-client/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-owner.yml'

permissions:
  contents: read

concurrency:
  group: frontend-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-owner-provenance:
    name: Frontend owner provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Frontend owner checkpoint mechanics
        run: node scripts/check-frontend-owner-checkpoints.mjs --history-base c37e56e0ebdfc7f6d294879008a4036d1b95b985 --head "$GITHUB_SHA"

  frontend-owner:
    name: Frontend owner product
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck owner web
        run: pnpm exec tsc -b apps/eliotr-web/tsconfig.json --pretty false
      - name: Lint owner frontend
        run: pnpm exec eslint apps/eliotr-web/src packages/owner-api-client/src packages/ui/src
      - name: Research client regressions
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          apps/eliotr-web/src/query/research.test.ts
          packages/owner-api-client/src/research/runs/authority.test.ts
          packages/owner-api-client/src/research/session-projection/adapter.test.ts
          packages/owner-api-client/src/research/session-projection/projection.test.ts
          packages/owner-api-client/src/research/session-projection/session.test.ts
          --reporter=verbose
      - name: Install UI browser
        run: pnpm --dir packages/ui exec playwright install --with-deps chromium
      - name: Focused Storybook integration
        run: >-
          pnpm --dir packages/ui exec vitest run
          --config .storybook/vitest.config.ts
          --reporter=verbose
          --testNamePattern
          'Operation Announcement|Readiness And Versions Failed|Sources Readiness Announcement|Sources Versions Announcement|Sources Announcement Privacy|Studio Operation Announcements|Research Operation Announcements|Connections Operation Announcements|Cross Page Selection Recovery|Replaced Selected Page Refused|Sections Unsupported|Optional Failure Facts|Targeted Retry Hierarchy|Readiness Renewal Is Not Blocked|Readiness Blocked|Google Transport Is Routing Only|Diagnostic Issued|Diagnostic Expired|Details Journey|Evidence Operation Announcements|Erasure Operation Announcements|Report Static Facts Quiet|Nested Import Operation|Nested Erasure Operation|Nested Bundle Operation|Nested Artifact Operation|Nested Evidence Operation|Live Research Journey|History Completed Research Return|History Cancelled Research Return|Material Preferences Journey|Material Reading Journey|Strict Mode Journey|Live Failed Required Section No Export|Live Capability Connection Truth|Degraded$'
      - name: Owner web production build
        run: pnpm --dir apps/eliotr-web exec vite build --manifest
      - name: Upload owner web static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-web-build-${{ github.sha }}
          path: apps/eliotr-web/dist
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  frontend-owner-visual:
    name: Frontend owner visual evidence
    needs: frontend-owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Prepare visual evidence path
        run: mkdir -p ".eliotr-state/ui-owner/material-redesign-$GITHUB_SHA"
      - name: Install current package-manager signing keys
        run: npm install --global corepack@0.34.7
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned branded browser
        run: pnpm --dir packages/ui exec playwright install --with-deps chrome
      - name: Build current Storybook
        run: pnpm --dir packages/ui build:storybook
      - name: Qualify Material redesign in browser
        shell: bash
        run: |
          set -euo pipefail
          output=".eliotr-state/ui-owner/material-redesign-$GITHUB_SHA"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome" ]]; then
            printf '%s\n' 'Branded Chrome executable not found' | tee "$output/browser-version.txt"
            exit 1
          fi
          "$chrome" --version | tee "$output/browser-version.txt"
          python3 -m http.server 6006 --bind 127.0.0.1 --directory .eliotr-state/frontend-storybook >"$output/storybook-http.log" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:6006/index.json >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            printf '%s\n' 'Storybook index did not become ready' | tee "$output/qualification-error.txt"
            exit 1
          fi
          node scripts/ui-owner/verify.mjs browser \
            --base-url http://127.0.0.1:6006 \
            --scenario material-redesign \
            --output "$output" \
            --browser "$chrome"
      - name: Upload Material visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-ui-material-review-${{ github.sha }}
          path: .eliotr-state/ui-owner/material-redesign-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
