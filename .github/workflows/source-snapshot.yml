name: source-snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify reviewed source and upload blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          const repo = 'UnknownAlienHuman/eliot-research';
          const tree = '060343b0f0aa45920d504433328c2b942faef8b0';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', timeout: 15000 }).trim();
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(git('rev-parse', 'HEAD^'), '951dbcc2467434154a86c7b1e2644781d043f14c');
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git object API ${path} returned ${response.status}`);
            return response.json();
          };
          const pieces = [];
          for (const sha of ['2b5b0da3eb1410a2ff374de6e8cad50125cfe40b',
            'd276a49aefd9cdfaf71edc98f29a205ecca57e7d', '28786ee05656625016993ecc3ff66f4a1c654b82',
            'a0bd837caf0f6660c303461b9733a6cec61f2bd5']) {
            const blob = await api(`/git/blobs/${sha}`);
            assert.equal(blob.sha, sha); assert.equal(blob.encoding, 'base64');
            pieces.push(Buffer.from(blob.content, 'base64').toString('utf8'));
          }
          const patch = brotliDecompressSync(Buffer.from(pieces.join(''), 'base64'), { maxOutputLength: 150000 });
          assert.equal(createHash('sha256').update(patch).digest('hex'),
            '9a3ba702124873ba66b91370172adb3dcf4da6b233d7fb913b0e2b35c4c75db0');
          writeFileSync('/tmp/owner-reviewed.patch', patch, { mode: 0o600 });
          git('apply', '--index', '--whitespace=error', '/tmp/owner-reviewed.patch');
          git('rm', '.github/workflows/source-snapshot.yml');
          git('diff', '--cached', '--check');
          assert.equal(git('write-tree'), tree);
          for (const gate of ['check-work-packets', 'check-implementation-status', 'check-budgets', 'check-boundaries']) {
            execFileSync(process.execPath, [`scripts/${gate}.mjs`], { stdio: 'inherit', timeout: 20000 });
          }
          const changes = execFileSync('git', ['diff', '--cached', '--no-renames', '--name-status', '-z'], { encoding: 'utf8' }).split('\0');
          if (changes.at(-1) === '') changes.pop();
          assert.equal(changes.length % 2, 0);
          for (let i = 0; i < changes.length; i += 2) {
            const [status, path] = changes.slice(i, i + 2);
            assert.ok(['A', 'M', 'D'].includes(status));
            if (status === 'D') continue;
            const bytes = execFileSync('git', ['show', `:${path}`], { timeout: 15000 });
            const expected = git('rev-parse', `:${path}`);
            const blob = await api('/git/blobs', { encoding: 'base64', content: bytes.toString('base64') });
            assert.equal(blob.sha, expected);
          }
          console.log(`VERIFIED_BLOBS_FOR_TREE=${tree}`);
          // No commit, tree, branch, pull request or ref mutation. Caller attaches the verified blobs.
          JS
