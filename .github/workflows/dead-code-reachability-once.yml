name: dead-code-reachability-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dead-code-reachability-once.yml

permissions:
  contents: write

concurrency:
  group: dead-code-reachability
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Refresh after governed public v3
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            git fetch origin main
            if ! git cat-file -e origin/main:.github/workflows/public-research-v3-once.yml 2>/dev/null; then
              git reset --hard origin/main
              echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo 'public v3 checkpoint did not settle within 30 minutes' >&2
          exit 1
      - name: Add an implementation-status-aware reachability gate
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/check-production-reachability.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import process from "node:process";
          import ts from "typescript";

          const root = process.cwd();
          const codeExtensions = [".ts", ".tsx", ".mts", ".cts", ".js", ".mjs", ".cjs"];
          const excludedSegments = new Set(["node_modules", "dist", "target", ".git", "coverage"]);
          const productionRoots = [path.join(root, "packages"), path.join(root, "apps", "eliotr-core", "src")];

          function walk(directory) {
            if (!fs.existsSync(directory)) return [];
            const output = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (excludedSegments.has(entry.name)) continue;
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) output.push(...walk(absolute));
              else if (codeExtensions.includes(path.extname(entry.name))) output.push(absolute);
            }
            return output;
          }

          function isTest(file) {
            return /(?:^|\/)(?:test|tests|fixtures?)(?:\/|$)/u.test(file.replaceAll("\\", "/"))
              || /\.(?:test|spec)\.[cm]?[jt]sx?$/u.test(file);
          }

          function resolveFile(candidate) {
            const attempts = [candidate];
            const extension = path.extname(candidate);
            if (extension === ".js" || extension === ".mjs" || extension === ".cjs") {
              attempts.push(candidate.slice(0, -extension.length) + ".ts");
              attempts.push(candidate.slice(0, -extension.length) + ".tsx");
            }
            if (extension === "") {
              for (const suffix of codeExtensions) attempts.push(candidate + suffix);
              for (const suffix of codeExtensions) attempts.push(path.join(candidate, "index" + suffix));
            }
            return attempts.find((attempt) => files.has(path.normalize(attempt))) ?? null;
          }

          function packageTargets(packageDirectory) {
            const packagePath = path.join(packageDirectory, "package.json");
            if (!fs.existsSync(packagePath)) return [];
            const manifest = JSON.parse(fs.readFileSync(packagePath, "utf8"));
            const raw = [];
            function collect(value) {
              if (typeof value === "string") raw.push(value);
              else if (Array.isArray(value)) value.forEach(collect);
              else if (value && typeof value === "object") Object.values(value).forEach(collect);
            }
            collect(manifest.exports);
            collect(manifest.main);
            collect(manifest.module);
            collect(manifest.types);
            const targets = raw
              .filter((value) => value.startsWith("."))
              .map((value) => resolveFile(path.resolve(packageDirectory, value)))
              .filter(Boolean);
            const conventional = resolveFile(path.join(packageDirectory, "src", "index"));
            if (conventional) targets.push(conventional);
            return [...new Set(targets)];
          }

          const all = productionRoots.flatMap(walk).filter((file) => !isTest(file));
          const files = new Set(all.map((file) => path.normalize(file)));
          const workspacePackages = new Map();
          const packageDirectory = path.join(root, "packages");
          if (fs.existsSync(packageDirectory)) {
            for (const entry of fs.readdirSync(packageDirectory, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const directory = path.join(packageDirectory, entry.name);
              const manifestPath = path.join(directory, "package.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              if (typeof manifest.name === "string") workspacePackages.set(manifest.name, directory);
            }
          }

          function resolveSpecifier(owner, specifier) {
            if (specifier.startsWith(".")) return resolveFile(path.resolve(path.dirname(owner), specifier));
            const matched = [...workspacePackages.keys()]
              .sort((left, right) => right.length - left.length)
              .find((name) => specifier === name || specifier.startsWith(name + "/"));
            if (!matched) return null;
            const directory = workspacePackages.get(matched);
            const suffix = specifier.slice(matched.length).replace(/^\//u, "");
            if (suffix) {
              const subpath = resolveFile(path.join(directory, "src", suffix));
              if (subpath) return subpath;
            }
            return packageTargets(directory)[0] ?? null;
          }

          function dependencies(file) {
            const sourceText = fs.readFileSync(file, "utf8");
            const source = ts.createSourceFile(file, sourceText, ts.ScriptTarget.Latest, true);
            const specs = [];
            function add(node) {
              if (node && ts.isStringLiteralLike(node)) specs.push(node.text);
            }
            function visit(node) {
              if (ts.isImportDeclaration(node) || ts.isExportDeclaration(node)) add(node.moduleSpecifier);
              if (ts.isCallExpression(node) && node.arguments.length === 1) {
                if (node.expression.kind === ts.SyntaxKind.ImportKeyword
                    || (ts.isIdentifier(node.expression) && node.expression.text === "require")) {
                  add(node.arguments[0]);
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            return specs.map((specifier) => resolveSpecifier(file, specifier)).filter(Boolean);
          }

          const graph = new Map([...files].map((file) => [file, dependencies(file)]));
          const roots = new Set();
          for (const directory of workspacePackages.values()) packageTargets(directory).forEach((file) => roots.add(file));
          for (const candidate of [
            path.join(root, "apps", "eliotr-core", "src", "index.ts"),
            path.join(root, "apps", "eliotr-core", "src", "worker.ts"),
          ]) {
            const resolved = resolveFile(candidate);
            if (resolved) roots.add(resolved);
          }
          for (const configName of ["wrangler.toml", "wrangler.json", "wrangler.jsonc"]) {
            const configPath = path.join(root, "apps", "eliotr-core", configName);
            if (!fs.existsSync(configPath)) continue;
            const text = fs.readFileSync(configPath, "utf8");
            const match = text.match(/(?:^|\n)\s*(?:"main"|main)\s*[:=]\s*["']([^"']+)["']/u);
            if (match) {
              const resolved = resolveFile(path.resolve(path.dirname(configPath), match[1]));
              if (resolved) roots.add(resolved);
            }
          }

          const reachable = new Set();
          const queue = [...roots];
          while (queue.length > 0) {
            const file = queue.pop();
            if (!file || reachable.has(file)) continue;
            reachable.add(file);
            for (const dependency of graph.get(file) ?? []) queue.push(dependency);
          }

          const statusPath = path.join(root, "docs", "implementation", "implementation-status.json");
          const registered = new Set();
          if (fs.existsSync(statusPath)) {
            const status = JSON.parse(fs.readFileSync(statusPath, "utf8"));
            for (const entry of status.entries ?? []) {
              if (typeof entry.path === "string") registered.add(path.normalize(path.join(root, entry.path)));
            }
          }

          const unreachable = [...files]
            .filter((file) => !reachable.has(file))
            .map((file) => ({
              path: path.relative(root, file).replaceAll("\\", "/"),
              registered: registered.has(file),
            }))
            .sort((left, right) => left.path.localeCompare(right.path, "en"));
          const unexplained = unreachable.filter((entry) => !entry.registered);
          const report = {
            protocol: "eliotr.production-reachability.v1",
            roots: [...roots].map((file) => path.relative(root, file).replaceAll("\\", "/")).sort(),
            production_modules: files.size,
            reachable_modules: reachable.size,
            intentional_unreachable: unreachable.filter((entry) => entry.registered).map((entry) => entry.path),
            unexplained_unreachable: unexplained.map((entry) => entry.path),
          };
          const reportPath = path.join(root, "infra", "verification", "production-reachability.json");
          fs.mkdirSync(path.dirname(reportPath), { recursive: true });
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2) + "\n");
          if (unexplained.length > 0) {
            console.error(`Unexplained unreachable production modules:\n${unexplained.map((entry) => `- ${entry.path}`).join("\n")}`);
            process.exitCode = 1;
          } else {
            console.log(`Production reachability: ${reachable.size}/${files.size}; intentional unfinished modules: ${report.intentional_unreachable.length}`);
          }
          EOF
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts ??= {};
          pkg.scripts['dead-code:check'] = 'node scripts/check-production-reachability.mjs';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          source = path.read_text(encoding='utf-8')
          if 'pnpm dead-code:check' not in source:
              anchors = ['pnpm boundaries:check', 'pnpm budgets:check']
              for anchor in anchors:
                  if anchor in source:
                      source = source.replace(anchor, anchor + '\n          pnpm dead-code:check', 1)
                      break
              else:
                  raise SystemExit('CI static-check anchor missing')
              path.write_text(source, encoding='utf-8', newline='\n')
          PY
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run reachability and static gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm dead-code:check
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Register generated verification ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          root = Path.cwd()
          values = [
              'scripts/check-production-reachability.mjs',
              'infra/verification/production-reachability.json',
          ]
          manifest_path = root / 'docs/agent-work/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          def find(value):
              if isinstance(value, dict):
                  if value.get('id') == 'ER-00': return value
                  for child in value.values():
                      found = find(child)
                      if found is not None: return found
              elif isinstance(value, list):
                  for child in value:
                      found = find(child)
                      if found is not None: return found
              return None
          packet = find(manifest)
          if packet is None: raise SystemExit('ER-00 packet missing')
          key = 'owned_paths' if 'owned_paths' in packet else 'ownedPaths'
          for value in values:
              if value not in packet[key]: packet[key].append(value)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          docs = list((root / 'docs/agent-work').glob('ER-00-*.md'))
          if len(docs) != 1: raise SystemExit(f'expected one ER-00 doc, found {len(docs)}')
          path = docs[0]
          text = path.read_text(encoding='utf-8')
          heading = re.search(r'(?im)^##\s+Owned paths\s*$', text)
          if heading is None: raise SystemExit('ER-00 Owned paths missing')
          additions = ''.join(f'\n- `{value}`' for value in values if f'`{value}`' not in text[heading.end():])
          path.write_text(text[:heading.end()] + additions + text[heading.end():], encoding='utf-8', newline='\n')
          PY
          pnpm work-packets:check
      - name: Commit the reachability gate to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dead-code-reachability-once.yml
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "ci: enforce implementation-aware production reachability"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$PRODUCT_BASE_SHA"
          git push origin HEAD:main
