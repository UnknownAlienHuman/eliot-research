name: rust-deep-verification

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-deep-verification
  cancel-in-progress: false

jobs:
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Miri toolchain
        run: |
          rustup toolchain install nightly-2026-08-31 \
            --profile minimal \
            --component miri
      - name: Run Miri on pure crates
        run: |
          cargo +nightly-2026-08-31 miri test --package eliotr-canonical
          cargo +nightly-2026-08-31 miri test --package eliotr-test-vectors

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-31 --profile minimal
          cargo +nightly-2026-08-31 install cargo-fuzz --version 0.13.2 --locked
      - name: Run the bounded M1 fuzz corpus
        run: |
          cargo +nightly-2026-08-31 fuzz run m1_kernel \
            -- -max_total_time=90 -rss_limit_mb=2048

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned mutation toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutate bounded transport validation
        run: cargo mutants --package eliotr-canonical --timeout 120 --jobs 2
      - name: Mutate strict vector parsing and evaluation
        run: cargo mutants --package eliotr-test-vectors --timeout 120 --jobs 2
