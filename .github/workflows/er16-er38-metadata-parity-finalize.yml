name: er16-er38-metadata-parity-finalize

on:
  push:
    branches:
      - agent/ER-38-ER-16-managed-metadata-parity-20260903
    paths:
      - .github/workflows/er16-er38-metadata-parity-finalize.yml

permissions:
  contents: write

concurrency:
  group: er16-er38-metadata-parity-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-38-ER-16-managed-metadata-parity-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Align the managed-index writer and strict locator decoder
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          managed_path = Path("packages/cloudflare-projection/src/managed-index.ts")
          managed = managed_path.read_text(encoding="utf-8")
          managed = replace_once(
              managed,
              'import type { ProjectionItem } from "@eliotr/contracts";\n',
              'import type { ProjectionItem } from "@eliotr/contracts";\n'
              'import { projectionMetadata } from "@eliotr/platform-cloudflare";\n',
              "managed runtime import",
          )
          managed = replace_once(
              managed,
              '''  const record = value as Readonly<Record<string, unknown>>;
  for (const [key, expectedValue] of Object.entries(expected)) {
    if (record[key] !== expectedValue) {
      throw new Error(`${label}.metadata.${key} differs from the uploaded generation`);
    }
  }
  return record;
''',
              '''  const record = value as Readonly<Record<string, unknown>>;
  const expectedKeys = Object.keys(expected).sort();
  const observedKeys = Object.keys(record).sort();
  if (
    observedKeys.length !== expectedKeys.length ||
    observedKeys.some((key, index) => key !== expectedKeys[index])
  ) {
    throw new Error(`${label}.metadata fields differ from the uploaded generation`);
  }
  for (const [key, expectedValue] of Object.entries(expected)) {
    if (record[key] !== expectedValue) {
      throw new Error(`${label}.metadata.${key} differs from the uploaded generation`);
    }
  }
  return record;
''',
              "exact metadata readback",
          )
          managed = replace_once(
              managed,
              '''function managedDocument(item: ProjectionItem): string {
  const header = item.document_context_header.trim();
  return header.length === 0 ? item.section_text : `${header}\n\n${item.section_text}`;
}

''',
              '''function managedDocument(item: ProjectionItem): string {
  const header = item.document_context_header.trim();
  return header.length === 0 ? item.section_text : `${header}\n\n${item.section_text}`;
}

function managedItemFilename(itemKey: string): string {
  const key = assertProjectionIdentifier(itemKey, "projection item key");
  if (key.includes("/") || key.length > 253) {
    throw new Error("projection item key cannot form a bounded canonical AI Search filename");
  }
  return `${key}.md`;
}

''',
              "canonical managed filename helper",
          )
          managed = replace_once(
              managed,
              '''  const sourceToken = (await stableProjectionId(
    "source",
    context.source_revision.source_revision_ref,
  )).slice("source-".length, "source-".length + 24);
  const key = `${sourceToken}-${item.item_key}.md`;
  const document = managedDocument(item);
  const size = utf8ProjectionLength(document);
  if (size < 1 || size > 4 * 1024 * 1024) {
    throw new Error("managed projection item exceeds the AI Search Items API file envelope");
  }
  const metadata = {
    source_token: sourceToken,
    item_key: item.item_key,
    projection_generation: projectionGeneration,
    instruction_taint: item.instruction_taint,
    content_sha256: item.content_sha256,
  } as const;
''',
              '''  if (item.source_revision_ref !== context.source_revision.source_revision_ref) {
    throw new Error("projection item source revision differs from the execution context");
  }
  if (item.projection_generation !== projectionGeneration) {
    throw new Error("projection item generation differs from the requested managed generation");
  }
  const key = managedItemFilename(item.item_key);
  const document = managedDocument(item);
  const size = utf8ProjectionLength(document);
  if (size < 1 || size > 4 * 1024 * 1024) {
    throw new Error("managed projection item exceeds the AI Search Items API file envelope");
  }
  const metadata = projectionMetadata(item);
''',
              "managed upload identity",
          )
          managed = replace_once(
              managed,
              '''      chunks_count: readback.chunks_count,
    })),
''',
              '''      chunks_count: readback.chunks_count,
      metadata: readback.metadata,
    })),
''',
              "readback digest metadata binding",
          )
          managed_path.write_text(managed, encoding="utf-8")

          managed_test_path = Path("packages/cloudflare-projection/src/managed-index.test.ts")
          managed_test = managed_test_path.read_text(encoding="utf-8")
          managed_test = replace_once(
              managed_test,
              '''    expect(uploadAndPoll).toHaveBeenCalledOnce();
    expect(info).toHaveBeenCalledOnce();
''',
              '''    expect(uploadAndPoll).toHaveBeenCalledOnce();
    expect(info).toHaveBeenCalledOnce();
    expect(key).toBe("projection-item-1.md");
    expect(metadata).toEqual({
      canonical_section_id: "section-1",
      content_sha256: A,
      instruction_taint: "DATA_ONLY",
      projection_generation: "projection-g1",
      source_revision_ref: "revision-1",
    });
    expect(Object.keys(metadata)).toHaveLength(5);
''',
              "managed writer assertions",
          )
          managed_test = replace_once(
              managed_test,
              '''
});
''',
              '''
  it("rejects a legacy sixth metadata field during exact item readback", async () => {
    let key = "";
    let size = 0;
    let metadata: Readonly<Record<string, string>> = {};
    const port = createManagedProjectionPort({
      profile,
      namespace: {
        get() {
          return {
            items: {
              async uploadAndPoll(
                uploadedKey: string,
                content: string,
                options?: { readonly metadata?: Readonly<Record<string, string>> },
              ) {
                key = uploadedKey;
                size = new TextEncoder().encode(content).byteLength;
                metadata = options?.metadata ?? {};
                return {
                  id: "provider-item-1",
                  key,
                  status: "completed",
                  chunks_count: 1,
                  file_size: size,
                  metadata,
                };
              },
              get() {
                return {
                  async info() {
                    return {
                      id: "provider-item-1",
                      key,
                      status: "completed",
                      chunks_count: 1,
                      file_size: size,
                      metadata: { ...metadata, item_key: item.item_key },
                    };
                  },
                };
              },
            },
          };
        },
      },
    });
    await expect(port.index(context, "projection-g1", [item])).resolves.toMatchObject({
      state: "DEGRADED",
      reason_codes: ["MANAGED_INDEX_READBACK_FAILED"],
    });
  });

  it("rejects projection-generation drift before upload", async () => {
    const uploadAndPoll = vi.fn();
    const port = createManagedProjectionPort({
      profile,
      namespace: {
        get() {
          return {
            items: {
              uploadAndPoll,
              get() {
                throw new Error("readback must not run");
              },
            },
          };
        },
      },
    });
    await expect(port.index(context, "projection-g2", [item])).resolves.toMatchObject({
      state: "DEGRADED",
      reason_codes: ["MANAGED_INDEX_READBACK_FAILED"],
    });
    expect(uploadAndPoll).not.toHaveBeenCalled();
  });

});
''',
              "managed negative corpus",
          )
          managed_test_path.write_text(managed_test, encoding="utf-8")

          decoder_path = Path("packages/platform-cloudflare/src/ai-search.ts")
          decoder = decoder_path.read_text(encoding="utf-8")
          decoder = replace_once(
              decoder,
              'const METADATA_KEYS = new Set(["canonical_section_id", "content_sha256", "instruction_taint", "item_key", "projection_generation", "source_revision_ref"]),',
              'const METADATA_KEYS = new Set(["canonical_section_id", "content_sha256", "instruction_taint", "projection_generation", "source_revision_ref"]),',
              "decoder five-field metadata allowlist",
          )
          decoder = replace_once(
              decoder,
              'interface Metadata { readonly canonical_section_id: string; readonly content_sha256: string; readonly instruction_taint: "CLEARED" | "DATA_ONLY" | "UNTRUSTED" | "COMMAND_LIKE"; readonly item_key: string; readonly projection_generation: string; readonly source_revision_ref: string; }',
              'interface Metadata { readonly canonical_section_id: string; readonly content_sha256: string; readonly instruction_taint: "CLEARED" | "DATA_ONLY" | "UNTRUSTED" | "COMMAND_LIKE"; readonly projection_generation: string; readonly source_revision_ref: string; }',
              "decoder metadata type",
          )
          decoder = replace_once(
              decoder,
              'interface Chunk { readonly id: string; readonly item_key: string; readonly item_timestamp?: number;',
              'interface Chunk { readonly id: string; readonly item_key: string; readonly provider_item_key: string; readonly item_timestamp?: number;',
              "decoder chunk identity type",
          )
          decoder = replace_once(
              decoder,
              'export function projectionMetadata(item: ProjectionItem): Readonly<Record<string, string>> { return Object.freeze({ canonical_section_id: item.canonical_section_id, content_sha256: item.content_sha256, instruction_taint: item.instruction_taint, item_key: item.item_key, projection_generation: item.projection_generation, source_revision_ref: item.source_revision_ref }); }',
              'export function projectionMetadata(item: ProjectionItem): Readonly<Record<string, string>> { return Object.freeze({ canonical_section_id: item.canonical_section_id, content_sha256: item.content_sha256, instruction_taint: item.instruction_taint, projection_generation: item.projection_generation, source_revision_ref: item.source_revision_ref }); }',
              "shared projection metadata",
          )
          decoder = replace_once(
              decoder,
              'item_key: chunk.metadata.item_key, projection_generation: chunk.metadata.projection_generation, provider: "cloudflare_ai_search", provider_chunk_type: chunk.type, provider_item_key: chunk.item_key,',
              'item_key: chunk.item_key, projection_generation: chunk.metadata.projection_generation, provider: "cloudflare_ai_search", provider_chunk_type: chunk.type, provider_item_key: chunk.provider_item_key,',
              "locator identity metadata",
          )
          decoder = replace_once(
              decoder,
              'const item = exactObject(chunk.item, ITEM_KEYS, "AI Search chunk.item"), itemKey = nonemptyString(item.key, "AI Search chunk.item.key", MAX_KEY_CHARS), itemTimestamp = item.timestamp === undefined ? undefined : nonnegativeInteger(item.timestamp, "AI Search chunk.item.timestamp"), metadata = parseMetadata(item.metadata); if (metadata.item_key !== itemKey) fail("AI Search chunk.item.key does not match metadata.item_key"); const scoring = chunk.scoring_details === undefined ? undefined : parseScoring(chunk.scoring_details);\n  return { id, item_key: itemKey, ...(itemTimestamp === undefined ? {} : { item_timestamp: itemTimestamp }), metadata, score, ...(scoring === undefined ? {} : { scoring_details: scoring }), text: chunk.text, type };',
              'const item = exactObject(chunk.item, ITEM_KEYS, "AI Search chunk.item"), providerItemKey = nonemptyString(item.key, "AI Search chunk.item.key", MAX_KEY_CHARS), itemKey = projectionItemKeyFromProviderKey(providerItemKey), itemTimestamp = item.timestamp === undefined ? undefined : nonnegativeInteger(item.timestamp, "AI Search chunk.item.timestamp"), metadata = parseMetadata(item.metadata); const scoring = chunk.scoring_details === undefined ? undefined : parseScoring(chunk.scoring_details);\n  return { id, item_key: itemKey, provider_item_key: providerItemKey, ...(itemTimestamp === undefined ? {} : { item_timestamp: itemTimestamp }), metadata, score, ...(scoring === undefined ? {} : { scoring_details: scoring }), text: chunk.text, type };',
              "decoder provider filename derivation",
          )
          decoder = replace_once(
              decoder,
              'function parseMetadata(raw: unknown): Metadata {',
              'function projectionItemKeyFromProviderKey(value: string): string { if (!value.endsWith(".md")) fail("AI Search chunk.item.key must use the canonical .md suffix"); const itemKey = value.slice(0, -3); if (!/^[A-Za-z0-9][A-Za-z0-9._:@-]{0,252}$/u.test(itemKey)) fail("AI Search chunk.item.key is not a canonical projection item filename"); return itemKey; }\nfunction parseMetadata(raw: unknown): Metadata {',
              "decoder canonical filename helper",
          )
          decoder = replace_once(
              decoder,
              'instruction_taint: taint, item_key: nonemptyString(value.item_key, "AI Search metadata.item_key", MAX_KEY_CHARS), projection_generation:',
              'instruction_taint: taint, projection_generation:',
              "decoder legacy metadata removal",
          )
          decoder_path.write_text(decoder, encoding="utf-8")

          locator_test_path = Path("infra/ai-search/ai-search-locator.test.mjs")
          locator_test = locator_test_path.read_text(encoding="utf-8")
          locator_test = replace_once(
              locator_test,
              '    key: "projection-item-1",',
              '    key: "projection-item-1.md",',
              "locator fixture provider key",
          )
          locator_test = replace_once(
              locator_test,
              '      item_key: "projection-item-1",\n      projection_generation:',
              '      projection_generation:',
              "locator five-field metadata assertion",
          )
          locator_test = replace_once(
              locator_test,
              '        provider_item_key: "projection-item-1",',
              '        item_key: "projection-item-1",\n        provider_item_key: "projection-item-1.md",',
              "locator derived/provider key assertions",
          )
          locator_test = replace_once(
              locator_test,
              '  it("rejects stale generations, out-of-scope sources, mismatched item keys, and duplicates", () => {',
              '  it("rejects stale generations, out-of-scope sources, noncanonical item keys, and duplicates", () => {',
              "locator negative test title",
          )
          locator_test = replace_once(
              locator_test,
              '    expect(() => decodeAiSearchSearchResult(request(), result([chunk({ item: nestedItem({}, { key: "different-item-key" }) })]), options())).toThrow(/does not match metadata.item_key/u);',
              '    expect(() => decodeAiSearchSearchResult(request(), result([chunk({ item: nestedItem({}, { key: "different-item-key" }) })]), options())).toThrow(/canonical \\.md suffix/u);\n    expect(() => decodeAiSearchSearchResult(request(), result([chunk({ item: nestedItem({}, { key: "nested/projection-item-1.md" }) })]), options())).toThrow(/canonical projection item filename/u);',
              "locator canonical key negatives",
          )
          locator_test = replace_once(
              locator_test,
              '      result([chunk({ item: nestedItem({ evidence_handle_ref: "forged-handle" }) })]),',
              '      result([chunk({ item: nestedItem({ item_key: "legacy-sixth-field" }) })]),\n      result([chunk({ item: nestedItem({ evidence_handle_ref: "forged-handle" }) })]),',
              "legacy sixth metadata negative",
          )
          locator_test_path.write_text(locator_test, encoding="utf-8")

          er16_path = Path("docs/agent-work/ER-16-ai-search-and-model-gateway-adapters.md")
          er16 = er16_path.read_text(encoding="utf-8")
          er16 = replace_once(
              er16,
              '- requires the stored `item.key`, metadata `item_key`, and promoted `projection_generation` to agree;\n',
              '- requires the stored `item.key` to use the canonical `<ProjectionItem.item_key>.md` filename,\n  derives the item identity from that filename, and requires the promoted `projection_generation`;\n- admits exactly five shared custom metadata fields: `source_revision_ref`, `canonical_section_id`,\n  `projection_generation`, `instruction_taint`, and `content_sha256`;\n',
              "ER-16 managed wire documentation",
          )
          er16 += '''\n## Coordinated ER-38/ER-16 correction — managed item wire parity\n\nThe managed-index writer and search-result decoder now share one five-field metadata constructor.\n`ProjectionItem.item_key` is carried by the canonical provider filename `<item_key>.md`, while source,\nsection, generation, taint and digest remain in the five custom metadata slots. Upload admission rejects\nsource-revision or projection-generation drift before the provider call; readback rejects missing,\naltered or additional metadata and binds the exact metadata map into the item receipt digest.\n\nThis correction is fixture-qualified only. No AI Search upload, item readback, namespace mutation or\nproduction generation promotion was executed.\n'''
          er16_path.write_text(er16, encoding="utf-8")

          er38_path = Path("docs/agent-work/ER-38-governed-projection-generation-execution.md")
          er38 = er38_path.read_text(encoding="utf-8")
          er38 = replace_once(
              er38,
              '- AI Search metadata contains only five bounded generation-scoped fields.\n',
              '- AI Search uses the canonical `<ProjectionItem.item_key>.md` provider key and exactly five\n  bounded metadata fields: `source_revision_ref`, `canonical_section_id`, `projection_generation`,\n  `instruction_taint`, and `content_sha256`.\n',
              "ER-38 managed wire acceptance",
          )
          er38 += '''\n## Coordinated managed-index wire correction\n\nER-38 now consumes ER-16's shared `projectionMetadata` constructor instead of maintaining a divergent\nprovider shape. The writer rejects source/generation drift before upload, requires exact five-field\nmetadata on item-info readback, and includes the read-back metadata in the immutable managed receipt\ndigest. This remains `IMPLEMENTED_NOT_LIVE`; provider calls in tests are fixtures.\n'''
          er38_path.write_text(er38, encoding="utf-8")
          PY
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify coordinated ER-38 and ER-16 boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm contracts:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm work-packets:check
          pnpm lint
          pnpm typecheck
          pnpm projection:check
          pnpm exec vitest run packages/platform-cloudflare packages/cloudflare-projection --reporter=verbose
          pnpm cf:dry-run
          git diff --check

      - name: Commit verified managed-index metadata parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-38/ER-16: align managed item metadata and identity [metadata-parity-finalized]"
          git push origin HEAD:agent/ER-38-ER-16-managed-metadata-parity-20260903
