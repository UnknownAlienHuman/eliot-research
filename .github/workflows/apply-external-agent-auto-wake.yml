name: Apply external-agent automatic workflow wake

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: stage external-agent automatic wake' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply reviewed product patch
        run: |
          python -m py_compile \
            .github/scripts/apply-external-agent-auto-wake.py \
            .github/scripts/fix-external-agent-auto-wake.py
          python .github/scripts/apply-external-agent-auto-wake.py
          python .github/scripts/fix-external-agent-auto-wake.py
      - name: Static and focused compile checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          required = {
              'apps/eliotr-core/src/external-agent-result-wake.ts': [
                  'readonly [key: string]: unknown;',
                  'agent-recover-${requestSha256.slice(0, 24)}',
                  'recoverResearchRun(env, wakeContext, receipt.operation_id, {})',
                  'workflow_wake:',
              ],
              'apps/eliotr-core/src/research-run-control.ts': [
                  'SERVER_OWNED_EXTERNAL_AGENT_HANDLER_GENERATION',
                  'stage === "ANALYZE_BRANCHES"',
                  'isRecoverableStartedResearchStage',
              ],
              'packages/cloudflare-workflows/src/external-agent-task-store.ts': [
                  '#workflowSettlement',
                  'workflow_next_stage_index',
                  'settled: status.state === "ENGINE_COMPLETED"',
              ],
              'packages/cloudflare-research/src/research-external-branch-analysis.ts': [
                  'Core attempts the existing recover operation automatically',
              ],
          }
          for name, markers in required.items():
              text = Path(name).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'{name}: missing marker {marker!r}')
          helper = Path('apps/eliotr-core/src/external-agent-result-wake.ts').read_text()
          if 'Client-Secret' in helper or 'client_secret' in helper.lower():
              raise SystemExit('wake helper must not read or expose client secrets')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=AM'], text=True,
          ).splitlines()
          for name in changed:
              path = Path(name)
              if path.suffix not in {'.ts', '.tsx', '.js', '.mjs'} or '/src/' not in f'/{name}':
                  continue
              current = len(path.read_text(encoding='utf-8').splitlines())
              old = subprocess.run(['git', 'show', f'HEAD:{name}'], text=True, capture_output=True)
              if old.returncode != 0:
                  assert current <= 600, f'new source exceeds 600 lines: {name} ({current})'
              elif len(old.stdout.splitlines()) <= 600:
                  assert current <= 600, f'changed source created a new violation: {name} ({current})'
          print('EXTERNAL_AGENT_AUTO_WAKE_STATIC_OK')
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/cloudflare-workflows \
            --filter @eliotr/cloudflare-research \
            --filter @eliotr/cloudflare-workspace-mcp \
            --filter @eliotr/core \
            --filter @eliotr/pwa typecheck
          pnpm --filter @eliotr/pwa check
          pnpm --filter @eliotr/pwa build:agent-inbox
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/auto-wake-budget-report.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/auto-wake-budget-report.txt"
          BUDGET_REPORT="$RUNNER_TEMP/auto-wake-budget-report.txt" python - <<'PY'
          from pathlib import Path
          import os

          report = Path(os.environ['BUDGET_REPORT']).read_text()
          if 'Source budgets: PASS' in report:
              print('EXTERNAL_AGENT_AUTO_WAKE_GLOBAL_BUDGETS_PASS')
              raise SystemExit(0)
          known = {
              'packages/cloudflare-ai/src/dynamic-route-qualification.ts',
              'packages/cloudflare-ai/src/dynamic-route-rest-codec.ts',
              'packages/cloudflare-ai/src/model-gateway-response.ts',
              'packages/cloudflare-ai',
              'packages/cloudflare-artifacts/src/artifact-draft-reader-core.ts',
              'packages/cloudflare-research/src/research-owner-qualification-renewal.ts',
              'packages/cloudflare-research/src/research-report-admission.ts',
              'packages/cloudflare-research',
              'packages/cloudflare-research-stages/src/research-claim-audit-input.ts',
              'apps/eliotr-core/src/http.ts',
              'apps/eliotr-core/src/research-semantic-composition.ts',
              'apps/eliotr-core/src/wiki-publication-store.ts',
              'apps/eliotr-core',
              'Worker source',
              'apps/eliotr-pwa',
          }
          observed = set()
          for line in report.splitlines():
              if ' has ' in line and (' lines (max ' in line or ' source lines (max ' in line):
                  observed.add(line.split(' has ', 1)[0])
              elif line.startswith('Worker source is '):
                  observed.add('Worker source')
          unknown = observed - known
          if unknown:
              raise SystemExit(f'auto-wake introduced new source-budget violations: {sorted(unknown)}')
          if not observed:
              raise SystemExit('unrecognized source-budget report')
          print(f'EXTERNAL_AGENT_AUTO_WAKE_SCOPED_BUDGET_OK known_debt={len(observed)} new_violations=0')
          PY
      - name: Publish verified product commit
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-external-agent-auto-wake.yml \
            .github/scripts/apply-external-agent-auto-wake.py \
            .github/scripts/fix-external-agent-auto-wake.py
          git diff --check
          git add \
            apps/eliotr-core/src/external-agent-result-wake.ts \
            apps/eliotr-core/src/mcp-external-agent-task.ts \
            apps/eliotr-core/src/research-run-control.ts \
            packages/cloudflare-workflows/src/external-agent-task-store.ts \
            packages/cloudflare-research/src/research-external-branch-analysis.ts \
            packages/cloudflare-workspace-mcp/src/gemini-mcp-research-tools.ts \
            apps/eliotr-pwa/src/pages/agent-inbox.astro \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/implementation/computer-agent-web-inbox.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: wake research after computer-agent result' \
            -m 'After exact callback readback, invoke the existing digest-keyed recovery path for the same v8 Research run. Report canonical settlement, allow only the dedicated v8 ANALYZE_BRANCHES started-attempt recovery, and retain the identical manual fallback key. Refs #301.'
          git push origin HEAD:main
