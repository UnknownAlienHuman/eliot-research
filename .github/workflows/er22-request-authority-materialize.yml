name: er22-request-authority-materialize

on:
  push:
    branches:
      - agent/ER-22-request-authority-fence-clean-20260904

permissions:
  contents: write

concurrency:
  group: er22-request-authority-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[request-authority-materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-22-request-authority-fence-clean-20260904
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Materialize and verify product files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/er22-request-authority-materialize.py
          git rm -- \
            .github/er22-request-authority-materialize.py \
            .github/workflows/er22-request-authority-materialize.yml
          pnpm install --frozen-lockfile
          pnpm budgets:check
          pnpm work-packets:check
          pnpm lint
          pnpm typecheck
          pnpm --filter @eliotr/core test
          git diff --check
      - name: Commit the product-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-22: bind every request authority to the signed manifest [request-authority-materialized]"
          git push origin HEAD:agent/ER-22-request-authority-fence-clean-20260904
