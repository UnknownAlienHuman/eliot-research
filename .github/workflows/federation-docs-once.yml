name: federation-docs-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/federation-docs-once.yml

permissions:
  contents: write

concurrency:
  group: federation-docs-once
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Reconcile federation documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {source.count(old)}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          gap = "docs/implementation/gap-register.md"
          replace_once(
              gap,
              "Generic federation boundary is implemented but not wired into the Worker composition root or live-qualified",
              "Generic federation boundary is wired into the Worker composition root through authenticated D1/R2 authorities; independent-peer deployment and live qualification remain open",
              "gap federation state",
          )
          replace_once(
              gap,
              "compose authenticated D1/R2 authority ports, expose routes, and retain mutual-auth/idempotency/range/cursor receipts",
              "retain the local seven-operation D1/R2/HTTP receipts and complete independent-peer mutual-auth, credential-rotation, idempotency, range, cursor, withdrawal and purge receipts",
              "gap federation evidence",
          )
          replace_once(
              gap,
              "full research/federation integration and live qualification remain open",
              "full research integration and federation live qualification remain open",
              "gap scope integration",
          )
          replace_once(
              gap,
              "4. Close the other named launch blockers: RETRIEVAL, ERASURE, FEDERATION and WIKI remain disabled; federation manifest/read/cancel/changes/result/status/submit, research.changes, research.wiki.propose and selected gemini-mcp Workspace candidate byte admission/action readback remain unfinished. Use Google Drive/selected Spark or Antigravity MCP; no Google Cloud project or Gemini CLI detour.",
              "4. Close the remaining named launch blockers: RETRIEVAL, ERASURE and WIKI remain disabled; federation is locally composed but still requires an independent mutually authenticated deployed peer and live range/cursor/replay/withdrawal receipts. research.changes, research.wiki.propose and selected gemini-mcp Workspace candidate byte admission/action readback remain unfinished. Use Google Drive/selected Spark or Antigravity MCP; no Google Cloud project or Gemini CLI detour.",
              "gap execution order federation",
          )
          replace_once(
              gap,
              "5. Resolve the source-package limit by extracting an actual capability boundary before the next accepted code batch. The final local source-limit check reports packages/cloudflare-research10073lines, limit10000. This known failure is retained, not hidden by a raised limit or line minification. Consequently the current checkpoint is not claimed fully CI-green.",
              "5. Keep each source package below its configured limit while implementing stages 14–16. The current budget gate passes; do not raise thresholds or minify code to hide new growth. Extract a real capability boundary before a package crosses its limit.",
              "gap source budget state",
          )

          replace_once(
              "docs/implementation/implementation-status.json",
              '        "ER-24 composition wiring and retained mutually authenticated boundary receipt NOT EXECUTED",',
              '        "ER-24 Worker composition and local D1/R2/HTTP seven-operation receipts are complete; independent mutually authenticated deployed-peer receipt remains NOT_EXECUTED",',
              "implementation status federation evidence",
          )
          replace_once(
              "docs/agent-work/ER-22-generic-federation-boundary.md",
              "Live receipts: `NOT EXECUTED`. ER-24 still owns Worker composition and route exposure for these durable\njob, manifest, bundle and change-authority ports.",
              "Independent deployed-peer mutual-authentication, restart, range, cursor, withdrawal and purge receipts\nremain `NOT EXECUTED`.",
              "ER-22 handoff state",
          )
          replace_once(
              "docs/agent-work/ER-30-global-library-projects-and-scope-snapshots.md",
              "Wider retrieval/federation integration and deployed readback remain\nopen. The scope service lives in `packages/cloudflare-navigation`; the core file only re-exports it.",
              "Wider retrieval integration and deployed federation readback remain open. The local authenticated\nfederation composition reuses the same current scope/grant authority. The scope service lives in\n`packages/cloudflare-navigation`; the core file only re-exports it.",
              "ER-30 federation integration state",
          )
          replace_once(
              "docs/implementation/local-launch.md",
              "Full Atlas/section expansion, query/research, federation,\nWiki/reports and Rust authority promotion remain mandatory unfinished launch work.",
              "Full Atlas/section expansion, query/research, independent-peer federation qualification,\nWiki/reports and Rust authority promotion remain mandatory unfinished launch work.",
              "local launch federation state",
          )
          PY
          git rm .github/workflows/federation-docs-once.yml
          git diff --check
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify normative registries and gates
        run: |
          pnpm work-packets:check
          pnpm check:implementation-status
          pnpm budgets:check
          pnpm lint
          output="$(node scripts/check-launch-code.mjs 2>&1)" || status=$?
          status="${status:-0}"
          printf '%s\n' "$output"
          test "$status" -eq 1
          ! grep -Eqi 'disabled required slice: FEDERATION|federation\.(submit|status|result|cancel|bundle|changes)' <<<"$output"
          git diff --check
      - name: Commit reconciled status to main
        run: |
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "docs: reconcile federation implementation status"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
