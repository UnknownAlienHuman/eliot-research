name: publish-reviewed-s35-inquiry-protocol

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-s35.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true

      - name: Reconstruct and apply the reviewed S35 patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 6a692e536ea1a15fc4d5717bc8ec0078194806c5
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request

          blob_sha = "921c5dcb31447bfb07be7ce6361e9a4036096162"
          request = urllib.request.Request(
              f"https://api.github.com/repos/UnknownAlienHuman/eliot-research/git/blobs/{blob_sha}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              item = json.load(response)
          transported = base64.b64decode(item["content"])
          observed_blob = hashlib.sha1(
              b"blob " + str(len(transported)).encode() + b"\0" + transported
          ).hexdigest()
          if observed_blob != blob_sha:
              raise SystemExit(f"blob mismatch: {blob_sha} != {observed_blob}")
          encoded = b"".join(transported.split())
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != "3ce214b76d8130b0de7733dc7d4fbaed6c4ac75cbb0bfb62807ac552e3044415":
              raise SystemExit("gzip digest mismatch")
          pathlib.Path("/tmp/s35.patch.gz").write_bytes(compressed)
          PY
          gzip -dc /tmp/s35.patch.gz > /tmp/s35.patch
          test "$(wc -c < /tmp/s35.patch)" = 84937
          test "$(sha256sum /tmp/s35.patch | cut -d' ' -f1)" = 9f53bb2dd97f7a3c79032a437a9e600cc2aa0c754068bab3d180cf1afa0e0241
          git apply --check /tmp/s35.patch
          git apply --index /tmp/s35.patch
          git rm .github/workflows/publish-s35.yml
          test "$(git write-tree)" = cd2e5e03988e6529b4e9d5d8686a88228cb9c9a9
          git diff --cached --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile

      - name: Validate the critical S35 boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s35-validation
          pnpm exec tsc -b \
            packages/contracts/tsconfig.json \
            packages/research/tsconfig.json \
            packages/cloudflare-research/tsconfig.json \
            packages/interfaces/tsconfig.json \
            apps/eliotr-pwa/tsconfig.json \
            apps/eliotr-core/tsconfig.json \
            --pretty false 2>&1 | tee /tmp/s35-validation/typecheck-product.log
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false \
            2>&1 | tee /tmp/s35-validation/typecheck-tests.log
          pnpm exec vitest run \
            packages/cloudflare-research/src/research-inquiry-protocol.test.ts \
            packages/contracts/src/schema-registry.test.ts \
            --reporter=dot 2>&1 | tee /tmp/s35-validation/unit.log
          pnpm --dir apps/eliotr-core exec vitest run \
            test/research-session.test.ts \
            -t 'parses the explicit v2 protocol contract strictly' \
            --reporter=dot 2>&1 | tee /tmp/s35-validation/parser.log
          pnpm --dir apps/eliotr-core exec vitest run \
            test/research-protocol-freeze.test.ts \
            -t 'persists an explicit installed evidence-review profile' \
            --reporter=dot 2>&1 | tee /tmp/s35-validation/protocol-freeze.log
          node docs/contracts/generate.mjs --check \
            2>&1 | tee /tmp/s35-validation/contracts.log
          changed_ts="$(git diff --cached --name-only -- '*.ts')"
          test -n "$changed_ts"
          pnpm exec eslint $changed_ts \
            2>&1 | tee /tmp/s35-validation/eslint.log
          node scripts/check-boundaries.mjs \
            2>&1 | tee /tmp/s35-validation/boundaries.log
          node scripts/test-boundary-negative.mjs \
            2>&1 | tee /tmp/s35-validation/boundary-negative.log
          node scripts/check-work-packets.mjs \
            2>&1 | tee /tmp/s35-validation/work-packets.log
          test "$(git write-tree)" = cd2e5e03988e6529b4e9d5d8686a88228cb9c9a9
          git diff --cached --check

      - name: Publish the exact tested tree to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = cd2e5e03988e6529b4e9d5d8686a88228cb9c9a9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: persist installed inquiry protocols and obligations (S35)'
          test "$(git rev-parse 'HEAD^{tree}')" = cd2e5e03988e6529b4e9d5d8686a88228cb9c9a9
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s35-inquiry-protocol-validation
          path: /tmp/s35-validation/
          if-no-files-found: warn
          retention-days: 7
