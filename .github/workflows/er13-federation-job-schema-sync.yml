name: er13-federation-job-schema-sync

on:
  push:
    branches:
      - agent/ER-13-federation-job-schema-20260904

permissions:
  contents: write

concurrency:
  group: er13-federation-job-schema-sync
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[er13-federation-schema-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-13-federation-job-schema-20260904
          fetch-depth: 0

      - name: Synchronize schema generation and executable evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path

          migration_path = Path("infra/d1/core/migrations/0009_federation_job_authority.sql")
          migration = migration_path.read_text(encoding="utf-8")
          completion_old = '''  completion_disposition TEXT CHECK (
              completion_disposition IS NULL OR completion_disposition IN (
                'ANSWERED_WITH_SUPPORTED_RESULT',
                'ANSWERED_WITH_LIMITATIONS',
                'INCONCLUSIVE',
                'NO_QUALIFIED_EVIDENCE',
                'POLICY_BLOCKED',
                'BUDGET_EXHAUSTED',
                'DEADLINE_EXCEEDED',
                'CANCELLED',
                'FAILED'
              )
            ),'''
          completion_new = '''  completion_disposition TEXT CHECK (
              completion_disposition IS NULL OR (
                length(completion_disposition) BETWEEN 1 AND 64
                AND completion_disposition NOT GLOB '*[^A-Z0-9_]*'
              )
            ),'''
          observed_old = '''  observed_completion_disposition TEXT CHECK (
              observed_completion_disposition IS NULL OR observed_completion_disposition IN (
                'ANSWERED_WITH_SUPPORTED_RESULT',
                'ANSWERED_WITH_LIMITATIONS',
                'INCONCLUSIVE',
                'NO_QUALIFIED_EVIDENCE',
                'POLICY_BLOCKED',
                'BUDGET_EXHAUSTED',
                'DEADLINE_EXCEEDED',
                'CANCELLED',
                'FAILED'
              )
            ),'''
          observed_new = '''  observed_completion_disposition TEXT CHECK (
              observed_completion_disposition IS NULL OR (
                length(observed_completion_disposition) BETWEEN 1 AND 64
                AND observed_completion_disposition NOT GLOB '*[^A-Z0-9_]*'
              )
            ),'''
          if migration.count(completion_old) != 1 or migration.count(observed_old) != 1:
              raise SystemExit("federation disposition schema anchors missing or ambiguous")
          migration = migration.replace(completion_old, completion_new).replace(observed_old, observed_new)
          migration_path.write_text(migration, encoding="utf-8")

          old_generation = "core-v8-erasure-closure"
          new_generation = "core-v9-federation-job-authority"
          result = subprocess.run(
              ["git", "grep", "-Il", old_generation, "--", ":(exclude)infra/d1/core/migrations/**"],
              check=False,
              text=True,
              capture_output=True,
          )
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr)
          paths = [Path(line) for line in result.stdout.splitlines() if line]
          if not paths:
              raise SystemExit("no current core schema generation references found")
          for path in paths:
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace(old_generation, new_generation), encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          command = package.get("scripts", {}).get("delivery:check")
          evidence = "node infra/d1/core/federation-job-authority.test.mjs"
          if not isinstance(command, str) or "scripts/check-delivery-authority.mjs" not in command:
              raise SystemExit("unexpected delivery:check command")
          if evidence not in command:
              package["scripts"]["delivery:check"] = f"{command} && {evidence}"
          package_path.write_text(
              json.dumps(package, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git rm -- .github/workflows/er13-federation-job-schema-sync.yml
          node infra/d1/core/federation-job-authority.test.mjs
          git diff --check

      - name: Commit synchronized federation schema
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-13: synchronize federation job authority generation [er13-federation-schema-synced]"
          git push origin HEAD:agent/ER-13-federation-job-schema-20260904
