name: stage-s17-runtime-errors
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-s17-runtime-errors.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'UnknownAlienHuman/eliot-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Stage exact reviewed source blobs without publishing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'UnknownAlienHuman/eliot-research'
          base = '82766f3ed93614cdeba8e615316dc75db1663237'
          tree = '1151f6238b252b1c7ba1ea8f5b9e9895c7b64afb'
          patch_sha = 'a5ad007069447d4e76438936b09618b048764194c54f57d7046e603d509a18a9'
          workflow = '.github/workflows/stage-s17-runtime-errors.yml'
          chunks = [
            '0d33e3062ad00c1f2427c3819da478e9bbeef3d7',
            '7c87bfb686512b0f1cf064c9f4de826d877d5ed5',
            '4b1806b9414ebe0c480cee3a8a1a76ba8e7110d2',
            'ea25ecd9ba2a84821f21c821eb7e67cf83f673dd',
            '83c30da0bc7870f29dec4ce643a2ba23d0c8c830',
            '24d954a9e2eaaaa53e949e507c7df6fec30c9b40',
            '221cd7720fd99181b993b5e3b6483f724841a28b',
            '25e6deb74e09f3960d677bdb152db5d403a6ff40',
            '104fd7caba631e2b54f7f7e2b6dc4fea90d2f836',
            'b332bcff3d37d3f69240a210ef490254caa80f96',
            'c3c23eeaca65b3225aaaf07481a0dc8ec6498c55',
            '14379ce1bac377b4eb4e0f5ebb8dac49979f8219',
            'e261b77c14ed018fd9b59b19adf361e89c368307',
            'c6e791d5a4b0cd071ef01949cc60e812d7589fd5',
            '3aa7c1bb977eea1962decb01c870aa9b81a6bdeb',
            'a8075fc13d0c8677df5309403e36874a22e0a0fb',
            '17d99c7cdbc24cd5643656c6533e58837c038e9b',
          ]
          paths = [
            'apps/eliotr-core/src/research-deployment-compatibility.ts',
            'apps/eliotr-core/src/research-owner-spend-policy.ts',
            'apps/eliotr-core/src/research-qualification-renewal.ts',
            'apps/eliotr-core/src/research-run-failure.ts',
            'apps/eliotr-core/src/research-semantic-server.ts',
            'apps/eliotr-core/src/research-session.ts',
            'apps/eliotr-core/src/research-workflow.ts',
            'apps/eliotr-pwa/src/research-run-api.ts',
            'apps/eliotr-pwa/src/research-run-failure-api.ts',
            'apps/eliotr-pwa/src/research-run-view.ts',
            'apps/eliotr-pwa/src/research-run-wire.ts',
            'docs/agent-work/ER-24-worker-composition-do-queue-and-schedules.md',
            'docs/agent-work/manifest.json',
            'docs/implementation/gap-register.md',
            'docs/implementation/implementation-status.json',
            'docs/implementation/workflow-checkpoints.md',
            'infra/d1/core/migrations/0083_research_runtime_failures.sql',
            'packages/cloudflare-workflows/src/executor.ts',
            'packages/cloudflare-workflows/src/failures.ts',
            'packages/cloudflare-workflows/src/index.ts',
            'packages/cloudflare-workflows/src/store.ts',
            'packages/cloudflare-workflows/src/types.ts',
            'packages/interfaces/src/semantic-api.ts',
          ]
          def git(*args):
            return subprocess.check_output(['git', *args], text=True).strip()
          def blob_sha(data):
            return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          def api(path, data=None):
            payload = None if data is None else json.dumps(data).encode()
            request = urllib.request.Request('https://api.github.com/repos/'+repo+path, data=payload,
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
              method='GET' if data is None else 'POST')
            with urllib.request.urlopen(request, timeout=30) as response:
              return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert git('branch', '--show-current') == 'main'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == base
          parts = []
          for sha in chunks:
            stored = api('/git/blobs/'+sha)
            assert stored['encoding'] == 'base64'
            part = base64.b64decode(stored['content'])
            assert blob_sha(part) == sha
            parts.append(part)
          patch = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == patch_sha
          subprocess.run(['git','apply','--unidiff-zero','--check'], input=patch, check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index'], input=patch, check=True)
          assert sorted(git('diff','--cached','--name-only').splitlines()) == paths
          subprocess.run(['git','rm','--cached','--',workflow],check=True)
          assert git('write-tree') == tree
          entries = []
          for path in paths:
            data = pathlib.Path(path).read_bytes()
            expected = blob_sha(data)
            result = api('/git/blobs', {'encoding':'base64','content':base64.b64encode(data).decode()})
            assert result['sha'] == expected
            entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          out = pathlib.Path('/tmp/s17-runtime-manifest')
          out.mkdir(parents=True,exist_ok=True)
          (out/'manifest.json').write_text(json.dumps({'base':base,'transport_parent':os.environ['GITHUB_SHA'],
            'tree':tree,'patch_sha256':patch_sha,'entries':entries},indent=2)+'\n')
          print('Staged 23 exact reviewed source blobs. No ref, deployment or database changed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s17-runtime-manifest
          path: /tmp/s17-runtime-manifest/
          retention-days: 3
          if-no-files-found: error
