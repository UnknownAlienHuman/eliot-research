name: Apply project computer-agent routes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-computer-agent-routes.yml
      - .github/scripts/apply-computer-agent-routes.py

permissions:
  contents: write

concurrency:
  group: apply-computer-agent-routes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply reviewed project-route source
        run: |
          python -m py_compile .github/scripts/apply-computer-agent-routes.py
          python .github/scripts/apply-computer-agent-routes.py
      - name: Static, compile and D1 checks
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          routes = Path("packages/interfaces/src/routes.ts").read_text()
          pairs = re.findall(r'\{ method: "([A-Z]+)", path: "([^"]+)"', routes)
          assert len(pairs) == len(set(pairs))
          assert routes.count("research.computer-agent-routes.") == 3

          migration = Path("infra/d1/core/migrations/0088_project_computer_agent_routes.sql").read_text()
          assert "project-computer-agent-route-v1" in migration
          assert "ORIGINATING_MATCH" in migration
          assert "research_computer_agent_route_binding_valid" in migration
          store = Path("apps/eliotr-core/src/computer-agent-route-store.ts").read_text()
          assert "bindComputerAgentRunRoute" in store
          assert "requireComputerAgentRunRouteBinding" in store
          session = Path("apps/eliotr-core/src/research-session.ts").read_text()
          assert 'task_kind: "RESEARCH_BRANCH_ANALYSIS"' in session
          stage = Path("packages/cloudflare-research/src/research-external-branch-analysis.ts").read_text()
          assert "await dependencies.require_route_binding(request.operation_id, grant)" in stage

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=AM"], text=True,
          ).splitlines()
          for name in changed:
              path = Path(name)
              if path.suffix not in {".ts", ".tsx", ".js", ".mjs"} or "/src/" not in f"/{name}":
                  continue
              current = len(path.read_text(encoding="utf-8").splitlines())
              old = subprocess.run(["git", "show", f"HEAD:{name}"], text=True, capture_output=True)
              if old.returncode != 0:
                  assert current <= 600, f"new source exceeds 600 lines: {name} ({current})"
              elif len(old.stdout.splitlines()) <= 600:
                  assert current <= 600, f"changed source created a new violation: {name} ({current})"
          print("COMPUTER_AGENT_ROUTE_STATIC_OK")
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/contracts --filter @eliotr/interfaces --filter @eliotr/cloudflare-research --filter @eliotr/core typecheck
          pnpm d1:depth
          python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          def canonical(value):
              return json.dumps(value, separators=(",", ":"), sort_keys=True)
          def digest(value):
              return hashlib.sha256(value.encode()).hexdigest()

          db = sqlite3.connect(":memory:")
          db.executescript("""
            PRAGMA foreign_keys=ON;
            CREATE TABLE schema_state(key TEXT PRIMARY KEY,value TEXT NOT NULL,updated_at TEXT NOT NULL) STRICT;
            CREATE TABLE project(project_id TEXT PRIMARY KEY) STRICT;
            CREATE TABLE project_owner(project_id TEXT PRIMARY KEY REFERENCES project(project_id),principal_ref TEXT NOT NULL) STRICT;
            CREATE TABLE project_client_grant(
              grant_id TEXT NOT NULL, revision INTEGER NOT NULL, project_id TEXT NOT NULL,
              grantor_principal_ref TEXT NOT NULL, grantee_issuer TEXT NOT NULL,
              grantee_method TEXT NOT NULL, grantee_subject TEXT NOT NULL,
              state TEXT NOT NULL, record_json TEXT NOT NULL, expires_at TEXT NOT NULL,
              PRIMARY KEY(grant_id,revision)
            ) STRICT;
            CREATE VIEW project_client_grant_current AS
            SELECT g.* FROM project_client_grant g WHERE NOT EXISTS (
              SELECT 1 FROM project_client_grant n WHERE n.grant_id=g.grant_id AND n.revision>g.revision
            );
          """)
          db.executescript(Path("infra/d1/core/migrations/0087_computer_agent_connections.sql").read_text())
          db.executescript(Path("infra/d1/core/migrations/0088_project_computer_agent_routes.sql").read_text())
          db.execute("INSERT INTO project VALUES ('project-1')")
          db.execute("INSERT INTO project_owner VALUES ('project-1','owner-1')")

          actor = {"issuer":"https://team.cloudflareaccess.com","authentication_method":"service_token",
                   "subject":"dot-client.access"}
          connection = {"protocol":"eliotr.computer-agent-connection.v1","connection_id":"dot-primary",
                        "revision":1,"owner_principal_ref":"owner-1","state":"ENABLED",
                        "display_name":"Dot primary","contour":"OPENAI_DOT","actor":actor,
                        "transport_capabilities":["WEB_INBOX"],"computer_capabilities":["CLOUD_BROWSER"],
                        "task_kinds":["RESEARCH_BRANCH_ANALYSIS"],
                        "created_at":"2026-09-30T20:00:00.000Z","updated_at":"2026-09-30T20:00:00.000Z"}
          connection_text = canonical(connection)
          db.execute("INSERT INTO computer_agent_connection VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (
              "dot-primary",1,"owner-1",actor["issuer"],"service_token",actor["subject"],"ENABLED",
              "Dot primary","OPENAI_DOT",canonical(["WEB_INBOX"]),canonical(["CLOUD_BROWSER"]),
              canonical(["RESEARCH_BRANCH_ANALYSIS"]),"connection-put","0"*64,
              connection_text,digest(connection_text),connection["created_at"],connection["updated_at"]))

          grant_record = canonical({"allowed_operations":["run","recover","evidence"]})
          db.execute("INSERT INTO project_client_grant VALUES (?,?,?,?,?,?,?,?,?,?)", (
              "grant-1",1,"project-1","owner-1",actor["issuer"],"service_token",actor["subject"],
              "ACTIVE",grant_record,"2026-10-01T20:00:00.000Z"))

          route = {"protocol":"eliotr.project-computer-agent-route.v1","project_id":"project-1",
                   "task_kind":"RESEARCH_BRANCH_ANALYSIS","revision":1,"owner_principal_ref":"owner-1",
                   "state":"ACTIVE","strategy":"ORIGINATING_MATCH",
                   "connections":[{"connection_id":"dot-primary","connection_revision":1}],
                   "created_at":"2026-09-30T20:01:00.000Z","updated_at":"2026-09-30T20:01:00.000Z"}
          route_text = canonical(route)
          db.execute("INSERT INTO project_computer_agent_route VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)", (
              "project-1","RESEARCH_BRANCH_ANALYSIS",1,"owner-1","ACTIVE","ORIGINATING_MATCH",
              canonical(route["connections"]),"route-put","1"*64,route_text,digest(route_text),
              route["created_at"],route["updated_at"]))
          db.execute("INSERT INTO project_computer_agent_route_entry VALUES (?,?,?,?,?,?)", (
              "project-1","RESEARCH_BRANCH_ANALYSIS",1,0,"dot-primary",1))
          assert db.execute("SELECT state,revision FROM project_computer_agent_route_current").fetchone() == ("ACTIVE",1)

          binding = {"protocol":"eliotr.research-computer-agent-route-binding.v1",
                     "operation_id":"run-1","project_id":"project-1","task_kind":"RESEARCH_BRANCH_ANALYSIS",
                     "route_revision":1,"priority":0,"connection_id":"dot-primary","connection_revision":1,
                     "client_grant_id":"grant-1","client_grant_revision":1,"actor":actor,
                     "created_at":"2026-09-30T20:02:00.000Z"}
          binding_text = canonical(binding)
          db.execute("INSERT INTO research_computer_agent_route_binding VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (
              "run-1","project-1","RESEARCH_BRANCH_ANALYSIS",1,0,"dot-primary",1,
              "grant-1",1,actor["issuer"],actor["subject"],binding_text,digest(binding_text),binding["created_at"]))
          assert db.execute("SELECT connection_id,route_revision FROM research_computer_agent_route_binding_valid").fetchone() == ("dot-primary",1)

          duplicate = dict(route); duplicate.update(revision=2,updated_at="2026-09-30T20:03:00.000Z",
              connections=[{"connection_id":"dot-primary","connection_revision":1},
                           {"connection_id":"dot-primary","connection_revision":1}])
          duplicate_text = canonical(duplicate)
          try:
              db.execute("INSERT INTO project_computer_agent_route VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)", (
                  "project-1","RESEARCH_BRANCH_ANALYSIS",2,"owner-1","ACTIVE","ORIGINATING_MATCH",
                  canonical(duplicate["connections"]),"route-duplicate","2"*64,duplicate_text,
                  digest(duplicate_text),route["created_at"],duplicate["updated_at"]))
              raise AssertionError("duplicate route connection was accepted")
          except sqlite3.IntegrityError as error:
              assert "COMPUTER_AGENT_ROUTE_CONNECTION_INVALID" in str(error)

          disabled = dict(route); disabled.update(revision=2,state="DISABLED",updated_at="2026-09-30T20:04:00.000Z")
          disabled_text = canonical(disabled)
          db.execute("INSERT INTO project_computer_agent_route VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)", (
              "project-1","RESEARCH_BRANCH_ANALYSIS",2,"owner-1","DISABLED","ORIGINATING_MATCH",
              canonical(disabled["connections"]),"route-disable","3"*64,disabled_text,digest(disabled_text),
              route["created_at"],disabled["updated_at"]))
          db.execute("INSERT INTO project_computer_agent_route_entry VALUES (?,?,?,?,?,?)", (
              "project-1","RESEARCH_BRANCH_ANALYSIS",2,0,"dot-primary",1))
          assert db.execute("SELECT state,revision FROM project_computer_agent_route_current").fetchone() == ("DISABLED",2)
          assert db.execute("SELECT value FROM schema_state WHERE key='project_computer_agent_route_generation'").fetchone()[0] == "project-computer-agent-route-v1"
          print("COMPUTER_AGENT_ROUTE_SQL_OK")
          PY
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/route-budget-report.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/route-budget-report.txt"
          BUDGET_REPORT="$RUNNER_TEMP/route-budget-report.txt" python - <<'PY'
          from pathlib import Path
          import os

          report = Path(os.environ["BUDGET_REPORT"]).read_text()
          if "Source budgets: PASS" in report:
              print("COMPUTER_AGENT_ROUTE_GLOBAL_BUDGETS_PASS")
              raise SystemExit(0)
          known = {
              "packages/cloudflare-ai/src/dynamic-route-qualification.ts",
              "packages/cloudflare-ai/src/dynamic-route-rest-codec.ts",
              "packages/cloudflare-ai/src/model-gateway-response.ts",
              "packages/cloudflare-ai",
              "packages/cloudflare-artifacts/src/artifact-draft-reader-core.ts",
              "packages/cloudflare-research/src/research-owner-qualification-renewal.ts",
              "packages/cloudflare-research/src/research-report-admission.ts",
              "packages/cloudflare-research",
              "packages/cloudflare-research-stages/src/research-claim-audit-input.ts",
              "apps/eliotr-core/src/http.ts",
              "apps/eliotr-core/src/research-semantic-composition.ts",
              "apps/eliotr-core/src/wiki-publication-store.ts",
              "apps/eliotr-core",
              "Worker source",
              "apps/eliotr-pwa",
          }
          observed = set()
          for line in report.splitlines():
              if " has " in line and (" lines (max " in line or " source lines (max " in line):
                  observed.add(line.split(" has ", 1)[0])
              elif line.startswith("Worker source is "):
                  observed.add("Worker source")
          unknown = observed - known
          if unknown:
              raise SystemExit(f"route checkpoint introduced new source-budget violations: {sorted(unknown)}")
          if not observed:
              raise SystemExit("unrecognized source-budget report")
          print(f"COMPUTER_AGENT_ROUTE_SCOPED_BUDGET_OK known_debt={len(observed)} new_violations=0")
          PY
      - name: Commit verified project routes
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-computer-agent-routes.yml \
            .github/scripts/apply-computer-agent-routes.py
          git diff --check
          git add \
            infra/d1/core/migrations/0088_project_computer_agent_routes.sql \
            packages/contracts/src/computer-agent-route.ts \
            packages/contracts/src/computer-agent-connection.ts \
            packages/contracts/src/index.ts \
            apps/eliotr-core/src/computer-agent-route-store.ts \
            apps/eliotr-core/src/computer-agent-route-http.ts \
            apps/eliotr-core/src/computer-agent-connection-store.ts \
            apps/eliotr-core/src/research-session.ts \
            apps/eliotr-core/src/research-external-agent-routing.ts \
            apps/eliotr-core/src/http-special-routes.ts \
            packages/interfaces/src/routes.ts \
            packages/cloudflare-research/src/research-external-branch-analysis.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/adr/0008-computer-agent-web-inbox.md \
            docs/implementation/computer-agent-web-inbox.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: bind project computer-agent routes' \
            -m 'Let owners order exact Spark, Muse, Dot or other connection revisions for RESEARCH_BRANCH_ANALYSIS. Admit a delegated v8 run only when its originating verified actor is present, persist the exact route/connection/grant binding, and require that immutable origin before Stage 8 task publication or settlement. Do not transfer leases or dispatch another actor. Refs #301.'
          git push origin HEAD:main
