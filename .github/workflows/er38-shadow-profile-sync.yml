name: er38-shadow-profile-sync

on:
  push:
    branches:
      - agent/ER-38-shadow-generation-g2-20260903

permissions:
  contents: write

concurrency:
  group: er38-shadow-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[er38-profile-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-38-shadow-generation-g2-20260903
          fetch-depth: 0

      - name: Bind projection fixture to managed desired state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/check-projection-execution.mjs")
          text = path.read_text(encoding="utf-8")
          anchor = '''search.exec("PRAGMA foreign_keys = ON");

          for (const name of [
          '''
          insertion = '''search.exec("PRAGMA foreign_keys = ON");

          const desiredSearch = JSON.parse(readFileSync(
            resolve(root, "infra/ai-search/instances.json"),
            "utf8",
          ));
          const runtimeSource = readFileSync(
            resolve(root, "apps/eliotr-core/src/projection-execution-handler.ts"),
            "utf8",
          );
          const profileMatch =
            /export const PROJECTION_EXECUTION_PROFILE:[^=]+=\\s*\\{([\\s\\S]*?)\\n\\};/u.exec(
              runtimeSource,
            );
          assert(profileMatch, "projection execution profile block is missing");
          const profileBody = profileMatch[1];
          function profileString(key) {
            const matches = [...profileBody.matchAll(
              new RegExp(`${key}:\\\\s*"([^"]+)"`, "gu"),
            )];
            assert.equal(matches.length, 1, `${key} must have one string literal`);
            return matches[0][1];
          }
          const privateProse = desiredSearch.instances.filter(
            (instance) => instance?.purpose === "private natural-language source sections",
          );
          assert.equal(privateProse.length, 1, "desired state must contain one private-prose instance");
          const desiredPrivateProse = privateProse[0];
          assert.equal(desiredPrivateProse.create.id, desiredPrivateProse.id);
          assert.equal(
            profileString("managed_instance_id"),
            desiredPrivateProse.id,
            "Worker managed instance must match desired shadow state",
          );
          assert.equal(
            profileString("managed_generation"),
            desiredSearch.generation,
            "Worker managed generation must match desired shadow state",
          );
          assert.match(
            profileBody,
            /managed_generation_active:\\s*false/u,
            "desired shadow generation must remain inactive by default",
          );
          assert.match(
            runtimeSource,
            /env\\.AI_SEARCH_ACTIVE_GENERATION ===\\s*PROJECTION_EXECUTION_PROFILE\\.managed_generation/u,
            "managed readiness must require the exact promoted environment generation",
          );

          for (const name of [
          '''
          if text.count(anchor) != 1:
              raise SystemExit("projection-check insertion anchor missing or ambiguous")
          text = text.replace(anchor, insertion)
          if text.count("private-prose-g1") != 1:
              raise SystemExit("unexpected private-prose-g1 fixture count")
          if text.count("g1-qwen3-2026-08-28") != 2:
              raise SystemExit("unexpected g1 managed-generation fixture count")
          text = text.replace("private-prose-g1", "private-prose-g2")
          text = text.replace("g1-qwen3-2026-08-28", "g2-qwen3-2026-09-03")
          path.write_text(text, encoding="utf-8")
          PY
          git rm -- .github/workflows/er38-shadow-profile-sync.yml
          node scripts/check-projection-execution.mjs
          git diff --check

      - name: Commit synchronized shadow profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-38: enforce managed shadow profile parity [er38-profile-synced]"
          git push origin HEAD:agent/ER-38-shadow-generation-g2-20260903
