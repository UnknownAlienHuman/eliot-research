name: Harden S37 branch freeze lineage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-s37-freeze-lineage.yml
      - .github/scripts/harden-s37-freeze-lineage.py

permissions:
  contents: write

concurrency:
  group: harden-s37-freeze-lineage
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Record source-budget baseline debt
        run: |
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/s37-budget-before.txt" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/s37-budget-before.status"
          set -e
      - name: Apply reviewed lineage hardening
        run: |
          python .github/scripts/harden-s37-freeze-lineage.py
          git rm \
            .github/workflows/harden-s37-freeze-lineage.yml \
            .github/scripts/harden-s37-freeze-lineage.py
      - name: Static and scoped compile checks
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          execution = Path("packages/cloudflare-research/src/research-branch-execution.ts").read_text(encoding="utf-8")
          lineage = Path("packages/cloudflare-research/src/research-evidence-freeze-branch-lineage.ts").read_text(encoding="utf-8")
          assert "read_extract_attempt_ref" in execution
          assert "branch_analysis_request_sha256" in execution
          assert "canonicalEvidenceJson(analysisResults)" in execution
          assert "branchIdentities.some" in lineage
          assert "canonicalEvidenceJson(actualDebts)" in lineage
          assert "expectedContradictions" in lineage
          assert "!sameStrings(resultRoles, requiredRoles)" in lineage
          assert len(execution.splitlines()) <= 600
          assert len(lineage.splitlines()) <= 240
          print("S37_LINEAGE_HARDENING_STATIC_OK")
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/cloudflare-research --filter @eliotr/core typecheck
          pnpm exec eslint \
            packages/cloudflare-research/src/research-branch-execution.ts \
            packages/cloudflare-research/src/research-evidence-freeze-branch-lineage.ts
          pnpm boundaries:check
          pnpm work-packets:check
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/s37-budget-after.txt" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/s37-budget-after.status"
          set -e
          cat "$RUNNER_TEMP/s37-budget-after.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["RUNNER_TEMP"])
          before = (root / "s37-budget-before.txt").read_text(encoding="utf-8")
          after = (root / "s37-budget-after.txt").read_text(encoding="utf-8")
          before_status = int((root / "s37-budget-before.status").read_text().strip())
          after_status = int((root / "s37-budget-after.status").read_text().strip())

          def keys(text: str) -> list[str]:
              result: list[str] = []
              for raw in text.splitlines():
                  line = raw.strip()
                  match = re.fullmatch(r"(.+?) has \d+ source lines \(max \d+\)", line)
                  if match:
                      result.append(f"{match.group(1)}|source-lines")
                      continue
                  match = re.fullmatch(r"(.+?) has \d+ lines \(max \d+\)", line)
                  if match:
                      result.append(f"{match.group(1)}|lines")
                      continue
                  if re.fullmatch(r"Worker source is \d+ bytes \(max \d+\)", line):
                      result.append("Worker source|bytes")
              return result

          before_keys = keys(before)
          after_keys = keys(after)
          if before_status == 0:
              assert after_status == 0
          else:
              assert before_keys and after_status != 0
              assert len(after_keys) <= len(before_keys)
              assert not sorted(set(after_keys) - set(before_keys))
              print("SOURCE_BUDGET_BASELINE_DEBT_UNCHANGED", len(before_keys), len(after_keys))
          PY
          pnpm d1:depth
      - name: Commit lineage hardening
        run: |
          git add \
            packages/cloudflare-research/src/research-branch-execution.ts \
            packages/cloudflare-research/src/research-evidence-freeze-branch-lineage.ts
          git diff --cached --check
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'fix: prove complete branch freeze lineage' \
            -m 'Reopen the exact committed Stage7 and Stage8 outputs before accepting Stage9 reconciliation. Require exact required-role coverage, nested branch identities, canonical contradiction derivation, and a one-to-one canonical OPEN debt for every blocked role. Refs #229.'
          git push origin HEAD:main
