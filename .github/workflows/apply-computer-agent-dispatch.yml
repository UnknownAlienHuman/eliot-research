name: Apply computer-agent dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          check-latest: false
      - name: Apply, verify, and publish exact dispatch protocol
        run: |
          set -euo pipefail
          mkdir -p \
            .github/scripts \
            infra/d1/core/migrations \
            packages/contracts/src \
            apps/eliotr-core/src \
            apps/eliotr-pwa/src
          touch \
            infra/d1/core/migrations/0090_computer_agent_dispatch.sql \
            packages/contracts/src/computer-agent-dispatch.ts \
            apps/eliotr-core/src/computer-agent-dispatch-error.ts \
            apps/eliotr-core/src/computer-agent-dispatch-record.ts \
            apps/eliotr-core/src/computer-agent-dispatch-store.ts \
            apps/eliotr-core/src/computer-agent-dispatch-http.ts \
            apps/eliotr-pwa/src/agent-inbox-dispatch.ts
          git add -N \
            infra/d1/core/migrations/0090_computer_agent_dispatch.sql \
            packages/contracts/src/computer-agent-dispatch.ts \
            apps/eliotr-core/src/computer-agent-dispatch-error.ts \
            apps/eliotr-core/src/computer-agent-dispatch-record.ts \
            apps/eliotr-core/src/computer-agent-dispatch-store.ts \
            apps/eliotr-core/src/computer-agent-dispatch-http.ts \
            apps/eliotr-pwa/src/agent-inbox-dispatch.ts
          ln -s "$GITHUB_WORKSPACE/.github/scripts/apply-computer-agent-dispatch.py" /tmp/apply-computer-agent-dispatch.py
          cat .github/dispatch-payload/runner-*.b64 | base64 -d | gzip -d > /tmp/apply-computer-agent-dispatch.sh
          chmod +x /tmp/apply-computer-agent-dispatch.sh
          /tmp/apply-computer-agent-dispatch.sh
