name: research-changes-authority-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-changes-authority-once.yml

permissions:
  contents: write

concurrency:
  group: eliot-main-product-write
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Recover internal changes feed when an earlier gate stayed fail-closed
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if grep -q 'changes: () => unavailable("research.changes")' apps/eliotr-core/src/composition-root.ts; then
            for file in scripts/recover-research-changes-once.py scripts/repair-research-changes-contour-once.py; do
              if test ! -f "$file"; then
                commit="$(git log --all --format=%H -- "$file" | head -n1)"
                test -n "$commit"
                mkdir -p "$(dirname "$file")"
                git show "$commit:$file" > "$file"
              fi
            done
            python3 scripts/recover-research-changes-once.py
            python3 scripts/repair-research-changes-contour-once.py
          fi
      - name: Generate signed authority facade
        run: python3 scripts/harden-research-changes-authority-once.py
      - name: Register local secret examples and capability state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (".env.example", "apps/eliotr-core/.dev.vars.example"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "CHANGES_CURSOR_HMAC_SECRET=" not in text:
                  if text and not text.endswith("\n"):
                      text += "\n"
                  text += "CHANGES_CURSOR_HMAC_SECRET=replace-with-at-least-32-random-bytes\n"
                  path.write_text(text, encoding="utf-8", newline="\n")

          composition_path = Path("apps/eliotr-core/src/composition-root.ts")
          composition = composition_path.read_text(encoding="utf-8")
          anchor = "    ingest_live_qualified: false,\n"
          field = "    research_changes_cursor_signing_configured: Boolean(env.CHANGES_CURSOR_HMAC_SECRET),\n"
          if field not in composition:
              if anchor not in composition:
                  raise SystemExit("capability field anchor missing")
              composition = composition.replace(anchor, field + anchor, 1)
          composition_path.write_text(composition, encoding="utf-8", newline="\n")

          fixture_path = Path("apps/eliotr-core/test/orientation-fixture.ts")
          if fixture_path.exists():
              fixture = fixture_path.read_text(encoding="utf-8")
              if "CHANGES_CURSOR_HMAC_SECRET:" not in fixture:
                  anchor = "  DEPLOYMENT_GENERATION:"
                  index = fixture.find(anchor)
                  if index >= 0:
                      line_end = fixture.find("\n", index)
                      fixture = (
                          fixture[:line_end + 1]
                          + '  CHANGES_CURSOR_HMAC_SECRET: "orientation-test-research-changes-secret-32-bytes",\n'
                          + fixture[line_end + 1:]
                      )
                      fixture_path.write_text(fixture, encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify signed cursor and complete local backend
        run: |
          pnpm --filter @eliotr/core exec vitest run test/research-changes-authority.test.ts
          pnpm --filter @eliotr/interfaces typecheck
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit verified authority checkpoint to main
        run: |
          git rm .github/workflows/research-changes-authority-once.yml
          rm -f .github/workflows/research-changes-authority-gate-once.yml
          rm -f .github/workflows/research-changes-recovery-once.yml
          rm -f scripts/recover-research-changes-once.py
          rm -f scripts/repair-research-changes-contour-once.py
          git rm scripts/harden-research-changes-authority-once.py
          rm -f infra/verification/research-changes-authority-audit.json
          git add -A
          git diff --cached --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git commit -m "feat: bind research changes cursor to current authority"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
