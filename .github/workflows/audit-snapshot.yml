name: audit-source-snapshot

on:
  push:
    branches: [agent/ER-26-local-release-audit-20260904]
    paths: [.github/workflows/audit-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive tracked source only
        run: |
          git rev-parse HEAD > /tmp/SNAPSHOT_HEAD_SHA
          git archive --format=tar.gz --output=/tmp/eliotr-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: eliotr-audit-source
          path: |
            /tmp/eliotr-source.tar.gz
            /tmp/SNAPSHOT_HEAD_SHA
          retention-days: 1
          if-no-files-found: error
