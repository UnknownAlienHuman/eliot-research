name: admin-er30-apply-scope-snapshots

on:
  push:
    branches:
      - agent/ER-30-scope-snapshots-20260901

permissions:
  contents: write

concurrency:
  group: admin-er30-apply-scope-snapshots
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Materialize the reviewed ER-30 delta over current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d8854dedafb9142c63ce1fbf7d331da5212f93bc"

          cat .github/admin-er30-payload/part-* | tr -d '\r\n' \
            | base64 --decode > "$RUNNER_TEMP/er30-scope-snapshots.tar.gz"
          echo "0f59a1224168972a627e7c5a2c00ddd655f7c044e2d4269a1a4cb10753b9f343  $RUNNER_TEMP/er30-scope-snapshots.tar.gz" \
            | sha256sum --check

          cat > "$RUNNER_TEMP/expected-payload-paths" <<'PATHS'
          apps/eliotr-core/src/scope-service.test.ts
          apps/eliotr-core/src/scope-service.ts
          docs/agent-work/ER-30-global-library-projects-and-scope-snapshots.md
          packages/domain/src/project-membership.test.ts
          packages/domain/src/project-membership.ts
          packages/domain/src/scope.ts
          PATHS
          tar -tzf "$RUNNER_TEMP/er30-scope-snapshots.tar.gz" | sort > "$RUNNER_TEMP/actual-payload-paths"
          sort "$RUNNER_TEMP/expected-payload-paths" -o "$RUNNER_TEMP/expected-payload-paths"
          diff -u "$RUNNER_TEMP/expected-payload-paths" "$RUNNER_TEMP/actual-payload-paths"

          git reset --hard origin/main
          tar -xzf "$RUNNNER_TEMP/er30-scope-snapshots.tar.gz" -C "$GITHUB_WORKSPACE"

          python3 <<'PY'
          import json
          from pathlib import Path

          scope_test_path = Path("apps/eliotr-core/src/scope-service.test.ts")
          scope_test = scope_test_path.read_text(encoding="utf-8")
          old_expectation = "      \"SCOPE_IDENTIFIER_INVALID\",\n    );\n\n    const malformedAuthority"
          new_expectation = "      \"SCOPE_RESOLUTION_FAILED\",\n    );\n\n    const malformedAuthority"
          if scope_test.count(old_expectation) != 1:
              raise SystemExit("expected one malformed atom error expectation")
          scope_test_path.write_text(
              scope_test.replace(old_expectation, new_expectation),
              encoding="utf-8",
          )

          scope_path = Path("packages/domain/src/scope.ts")
          scope = scope_path.read_text(encoding="utf-8")
          old_interface = "export interface ScopeUniverse {\n  readonly global: ReadonlySet<string>;\n  readonly projects: ReadonlyMap<string, ReadonlySet<string>>;\n  readonly sourceClasses: ReadonlyMap<string, ReadonlySet<string>>;\n  readonly tags: ReadonlyMap<string, ReadonlySet<string>>;\n}\n"
          new_interface = "export interface ScopeUniverse {\n  readonly globalSourceRevisionRefs: ReadonlySet<string>;\n  readonly projects: ReadonlyMap<string, ReadonlySet<string>>;\n  readonly sourceClasses: ReadonlyMap<string, ReadonlySet<string>>;\n  readonly tags: ReadonlyMap<string, ReadonlySet<string>>;\n  readonly selectedSourceHeads: ReadonlyMap<string, string>;\n}\n"
          old_global = "    case \"GLOBAL_LIBRARY\":\n      return ok(new Set(universe.global));\n"
          new_global = "    case \"GLOBAL_LIBRARY\":\n      return ok(new Set(universe.globalSourceRevisionRefs));\n"
          old_selected = "    case \"SELECTED_SOURCES\": {\n      const missing = expression.source_ids.find((sourceId) => !universe.global.has(sourceId));\n      return missing === undefined\n        ? ok(new Set(expression.source_ids))\n        : err(domainError(\"SCOPE_REFERENCE_UNKNOWN\", `source:${missing}`));\n    }\n"
          new_selected = "    case \"SELECTED_SOURCES\": {\n      const revisions = new Set<string>();\n      for (const sourceId of expression.source_ids) {\n        const revision = universe.selectedSourceHeads.get(sourceId);\n        if (revision === undefined) {\n          return err(domainError(\"SCOPE_REFERENCE_UNKNOWN\", `source:${sourceId}`));\n        }\n        revisions.add(revision);\n      }\n      return ok(revisions);\n    }\n"
          for old, new in [(old_interface, new_interface), (old_global, new_global), (old_selected, new_selected)]:
              if scope.count(old) != 1:
                  raise SystemExit("expected one ScopeUniverse compatibility target")
              scope = scope.replace(old, new)
          scope_path.write_text(scope, encoding="utf-8")

          registry_path = Path("docs/implementation/implementation-status.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          entry = next(item for item in registry["entries"] if item["id"] == "pending-008")
          entry.update({
              "sentinel": "IMPLEMENTED_NOT_LIVE: ER-30 scope snapshot persistence requires ER-24 D1 composition and retained live receipts.",
              "state": "IMPLEMENTED_NOT_LIVE",
              "behavior": (
                  "strict temporal memberships and deterministic scope algebra produce immutable digest-bound "
                  "snapshots; persistence accepts created or exact replay with strict readback, and currentness "
                  "fails closed on expiry, persistence drift, participant, membership, owner, member-policy, "
                  "policy, disclosure, purge, fence or deny changes"
              ),
              "completion_evidence": [
                  "packages/domain/src/project-membership.test.ts temporal many-to-many, half-open interval, offset-order and collision-negative cases",
                  "apps/eliotr-core/src/scope-service.test.ts deterministic persistence/readback, strict resource and authority-output negative cases",
                  "mandatory purge-after-freeze case proves an old snapshot cannot pass requireCurrent",
                  "ER-24 remote D1 composition, principal grants and deployed invalidation receipts NOT EXECUTED",
              ],
          })
          registry_path.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")

          gap_path = Path("docs/implementation/gap-register.md")
          gap = gap_path.read_text(encoding="utf-8")
          old_gap = "| P1 | Scope algebra persistence is not wired to the deterministic evaluator | ER-10, ER-30 | immutable snapshot digest, purge-ledger binding and invalidation fixtures |"
          new_gap = "| P1 | ScopeSnapshot authority is implemented but not composed into remote D1, principal grants or retrieval and is not live-qualified | ER-10, ER-24, ER-30 | compose the D1 repository, grants and retrieval gate; retain remote persistence/readback plus purge, deny and expiry invalidation receipts |"
          if gap.count(old_gap) != 1:
              raise SystemExit("expected one ER-30 gap row")
          gap_path.write_text(gap.replace(old_gap, new_gap), encoding="utf-8")

          status_path = Path("docs/implementation/implementation-status.md")
          status = status_path.read_text(encoding="utf-8")
          old_scaffold = """```text
          ER-30 ScopeSnapshot persistence
          ER-31 Corpus Lens navigation/orientation
          ```"""
          new_scaffold = """```text
          ER-31 Corpus Lens navigation/orientation
          ```"""
          if status.count(old_scaffold) != 1:
              raise SystemExit("expected one scaffold summary block")
          status = status.replace(old_scaffold, new_scaffold)
          implemented_anchor = """```text
          generic federation boundary with strict auth/fence/reference and conservative disposition mapping"""
          implemented_replacement = """```text
          deterministic immutable ScopeSnapshot persistence/currentness with purge, deny, owner, policy, disclosure, fence and expiry invalidation
          generic federation boundary with strict auth/fence/reference and conservative disposition mapping"""
          if status.count(implemented_anchor) != 1:
              raise SystemExit("expected one implemented summary anchor")
          status_path.write_text(status.replace(implemented_anchor, implemented_replacement), encoding="utf-8")

          readiness_path = Path("docs/implementation/production-readiness-plan.md")
          readiness = readiness_path.read_text(encoding="utf-8")
          implemented_anchor = "- Cloudflare Access-protected HTTP dispatch and owner catalog;\n"
          implemented_line = "- deterministic immutable ScopeSnapshot persistence and currentness authority;\n"
          if readiness.count(implemented_anchor) != 1:
              raise SystemExit("expected one readiness implemented anchor")
          readiness = readiness.replace(implemented_anchor, implemented_anchor + implemented_line)
          fail_closed_line = "- ER-30 persisted ScopeSnapshot service;\n"
          if readiness.count(fail_closed_line) != 1:
              raise SystemExit("expected one ER-30 fail-closed line")
          readiness = readiness.replace(fail_closed_line, "")
          old_phase = """- [ ] Wire deterministic `UNION`, `INTERSECT` and `EXCEPT` evaluation to immutable ScopeSnapshot
                persistence.
          - [ ] Bind snapshot digest to exact revisions, owner generations, policy closure, purge-ledger revision,
                disclosure closure, client fence and expiry.
          - [ ] Implement principal grants, currentness checks and exact invalidation.
          - [ ] Prevent retrieval, evidence resolution and research execution from using an unfrozen scope."""
          new_phase = """- [x] Wire deterministic `UNION`, `INTERSECT` and `EXCEPT` evaluation to an immutable
                ScopeSnapshot repository contract with created/exact-replay/readback semantics.
          - [x] Bind snapshot digest to exact revisions, owner generations, member-policy closure, purge-ledger
                revision, disclosure closure, client fence and expiry.
          - [x] Implement deterministic currentness checks and exact invalidation.
          - [ ] Compose principal grants and the remote D1 ScopeSnapshot repository.
          - [ ] Prevent retrieval, evidence resolution and research execution from using an unfrozen scope."""
          if readiness.count(old_phase) != 1:
              raise SystemExit("expected one ER-30 readiness phase block")
          readiness_path.write_text(readiness.replace(old_phase, new_phase), encoding="utf-8")
          PY

          test ! -e .github/workflows/admin-er30-apply-scope-snapshots.yml
          test ! -e .github/admin-er30-payload
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify the complete TypeScript and Cloudflare contour
        shell: bash
        run: |
          set -euo pipefail
          pnpm contracts:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm work-packets:check
          pnpm branch-hygiene:check
          pnpm delivery:check
          pnpm ingest:check
          pnpm projection:check
          pnpm evidence:check
          pnpm erasure:check
          pnpm gemini:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:implementation-status
      - name: Publish one clean ER-30 commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 <<'PY'
          import subprocess
          expected = {
              "apps/eliotr-core/src/scope-service.test.ts",
              "apps/eliotr-core/src/scope-service.ts",
              "docs/agent-work/ER-30-global-library-projects-and-scope-snapshots.md",
              "docs/implementation/gap-register.md",
              "docs/implementation/implementation-status.json",
              "docs/implementation/implementation-status.md",
              "docs/implementation/production-readiness-plan.md",
              "packages/domain/src/project-membership.test.ts",
              "packages/domain/src/project-membership.ts",
              "packages/domain/src/scope.ts",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected staged paths: {sorted(actual ^ expected)}")
          PY
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "feat(scope): persist deterministic snapshots"
          git push \
            --force-with-lease="refs/heads/$GITHUB_REF_NAME:$GITHUB_SHA" \
            origin "HEAD:refs/heads/$GITHUB_REF_NAME"
