name: wiki-evidence-adjudication-once

on:
  push:
    branches: [main]
    paths: [.github/workflows/wiki-evidence-adjudication-once.yml]

permissions:
  contents: write

concurrency:
  group: wiki-evidence-adjudication-once
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.head_commit.message == 'ci: enforce Wiki evidence adjudication'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Write strict evidence-map adjudicator and compose it into publication
        run: |
          cat > apps/eliotr-core/src/wiki-evidence-map.ts <<'EOF'
          import type { WikiPageRevision } from "@eliotr/contracts";
          import { WikiPublicationError } from "@eliotr/research";

          export const WIKI_EVIDENCE_MAP_PROTOCOL = "eliotr.wiki-evidence-map.v1";
          const DIGEST = /^[a-f0-9]{64}$/u;
          const SAFE_REF = /^[A-Za-z0-9][A-Za-z0-9:._/@%+-]{0,511}$/u;
          const MAX_STATEMENTS = 512;
          const MAX_EVIDENCE_PER_STATEMENT = 32;
          const MAX_TOTAL_EVIDENCE = 4096;

          export interface WikiEvidenceObservation {
            readonly evidence_ref: string;
            readonly source_revision_ref: string;
            readonly excerpt_sha256: string;
            readonly relation: "SUPPORTS" | "CONTRADICTS";
            readonly assurance: "EXACT" | "EXCERPT" | "LOCATOR";
            readonly current: boolean;
          }

          export interface WikiStatementEvidence {
            readonly statement_ref: string;
            readonly label: string;
            readonly current_state: boolean;
            readonly evidence: readonly WikiEvidenceObservation[];
          }

          export interface WikiEvidenceMapV1 {
            readonly protocol: typeof WIKI_EVIDENCE_MAP_PROTOCOL;
            readonly page_ref: { readonly id: string; readonly revision: number };
            readonly dependency_refs: readonly string[];
            readonly coverage: {
              readonly denominator_ref: string;
              readonly complete: boolean;
              readonly required_statement_refs: readonly string[];
              readonly settled_statement_refs: readonly string[];
            };
            readonly statements: readonly WikiStatementEvidence[];
          }

          export interface WikiEvidenceMapSummary {
            readonly statement_count: number;
            readonly evidence_count: number;
            readonly coverage_complete: boolean;
            readonly dependency_closure_complete: boolean;
            readonly conflict_count: number;
            readonly changes_current_state: boolean;
          }

          function fail(message: string): never {
            throw new WikiPublicationError("WIKI_PUBLICATION_INCOMPLETE", message);
          }

          function record(value: unknown, expected: readonly string[], label: string): Record<string, unknown> {
            if (value === null || typeof value !== "object" || Array.isArray(value)) fail(`${label} must be an object`);
            const input = value as Record<string, unknown>;
            if (Object.keys(input).length !== expected.length || expected.some((key) => !Object.hasOwn(input, key))) {
              fail(`${label} has unknown or missing fields`);
            }
            return input;
          }

          function ref(value: unknown, label: string): string {
            if (typeof value !== "string" || !SAFE_REF.test(value) || value.includes("..") || value.includes("\\")) {
              fail(`${label} is invalid`);
            }
            return value;
          }

          function sortedUnique(values: readonly string[], label: string): readonly string[] {
            if (new Set(values).size !== values.length) fail(`${label} contains duplicates`);
            const sorted = [...values].sort((left, right) => left < right ? -1 : left > right ? 1 : 0);
            if (sorted.some((value, index) => value !== values[index])) fail(`${label} is not canonical`);
            return sorted;
          }

          function exactSet(left: readonly string[], right: readonly string[]): boolean {
            return left.length === right.length && left.every((value, index) => value === right[index]);
          }

          function decodeUtf8(bytes: Uint8Array): unknown {
            let text: string;
            try { text = new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
            catch { fail("Wiki evidence map is not valid UTF-8"); }
            try { return JSON.parse(text); }
            catch { fail("Wiki evidence map is not valid JSON"); }
          }

          export function evaluateWikiEvidenceMap(page: WikiPageRevision, bytes: Uint8Array): WikiEvidenceMapSummary {
            const root = record(decodeUtf8(bytes), ["protocol", "page_ref", "dependency_refs", "coverage", "statements"], "Wiki evidence map");
            if (root.protocol !== WIKI_EVIDENCE_MAP_PROTOCOL) fail("Wiki evidence map protocol is unsupported");
            const pageRef = record(root.page_ref, ["id", "revision"], "Wiki evidence page reference");
            if (pageRef.id !== page.page_ref.id || pageRef.revision !== page.page_ref.revision) fail("Wiki evidence map is bound to a different page");
            if (!Array.isArray(root.dependency_refs) || root.dependency_refs.some((value) => typeof value !== "string")) {
              fail("Wiki evidence dependencies are invalid");
            }
            const dependencies = sortedUnique((root.dependency_refs as string[]).map((value) => ref(value, "Wiki evidence dependency")), "Wiki evidence dependencies");
            const expectedDependencies = [...page.dependency_refs].sort((left, right) => left < right ? -1 : left > right ? 1 : 0);
            const dependencyClosureComplete = exactSet(dependencies, expectedDependencies);
            if (!dependencyClosureComplete) fail("Wiki evidence dependencies do not close the page dependency set");

            const statementRefs = Object.keys(page.statement_labels).sort((left, right) => left < right ? -1 : left > right ? 1 : 0);
            if (statementRefs.length < 1 || statementRefs.length > MAX_STATEMENTS) fail("Wiki statement set is empty or over its bound");
            const coverage = record(root.coverage, ["denominator_ref", "complete", "required_statement_refs", "settled_statement_refs"], "Wiki evidence coverage");
            ref(coverage.denominator_ref, "Wiki coverage denominator");
            if (coverage.complete !== true) fail("Wiki evidence coverage is not complete");
            if (!Array.isArray(coverage.required_statement_refs) || !Array.isArray(coverage.settled_statement_refs)
                || coverage.required_statement_refs.some((value) => typeof value !== "string")
                || coverage.settled_statement_refs.some((value) => typeof value !== "string")) {
              fail("Wiki evidence coverage sets are invalid");
            }
            const required = sortedUnique((coverage.required_statement_refs as string[]).map((value) => ref(value, "required statement reference")), "required statement references");
            const settled = sortedUnique((coverage.settled_statement_refs as string[]).map((value) => ref(value, "settled statement reference")), "settled statement references");
            const coverageComplete = exactSet(required, statementRefs) && exactSet(settled, statementRefs);
            if (!coverageComplete) fail("Wiki evidence coverage denominator is incomplete");

            if (!Array.isArray(root.statements) || root.statements.length !== statementRefs.length) {
              fail("Wiki evidence statements do not match the page statement set");
            }
            let evidenceCount = 0;
            let conflictCount = 0;
            let changesCurrentState = false;
            const seenStatements = new Set<string>();
            const seenEvidence = new Set<string>();
            let previousStatement = "";
            for (const rawStatement of root.statements) {
              const statement = record(rawStatement, ["statement_ref", "label", "current_state", "evidence"], "Wiki statement evidence");
              const statementRef = ref(statement.statement_ref, "Wiki statement reference");
              if (seenStatements.has(statementRef) || (previousStatement !== "" && previousStatement >= statementRef)) {
                fail("Wiki statements are duplicate or noncanonical");
              }
              seenStatements.add(statementRef);
              previousStatement = statementRef;
              if (typeof statement.label !== "string" || page.statement_labels[statementRef] !== statement.label) {
                fail("Wiki statement label is not bound to the page");
              }
              if (typeof statement.current_state !== "boolean") fail("Wiki current-state marker is invalid");
              changesCurrentState ||= statement.current_state;
              if (!Array.isArray(statement.evidence) || statement.evidence.length < 1 || statement.evidence.length > MAX_EVIDENCE_PER_STATEMENT) {
                fail("Wiki statement evidence is empty or over its bound");
              }
              let support = 0;
              let contradiction = 0;
              let previousEvidence = "";
              for (const rawEvidence of statement.evidence) {
                const evidence = record(rawEvidence, ["evidence_ref", "source_revision_ref", "excerpt_sha256", "relation", "assurance", "current"], "Wiki evidence observation");
                const evidenceRef = ref(evidence.evidence_ref, "Wiki evidence reference");
                const sourceRevisionRef = ref(evidence.source_revision_ref, "Wiki evidence source revision");
                if (!dependencies.includes(sourceRevisionRef)) fail("Wiki evidence source is outside the dependency closure");
                if (seenEvidence.has(evidenceRef) || (previousEvidence !== "" && previousEvidence >= evidenceRef)) {
                  fail("Wiki evidence observations are duplicate or noncanonical");
                }
                seenEvidence.add(evidenceRef);
                previousEvidence = evidenceRef;
                if (typeof evidence.excerpt_sha256 !== "string" || !DIGEST.test(evidence.excerpt_sha256)) fail("Wiki evidence digest is invalid");
                if (evidence.relation !== "SUPPORTS" && evidence.relation !== "CONTRADICTS") fail("Wiki evidence relation is invalid");
                if (evidence.assurance !== "EXACT" && evidence.assurance !== "EXCERPT" && evidence.assurance !== "LOCATOR") fail("Wiki evidence assurance is invalid");
                if (typeof evidence.current !== "boolean") fail("Wiki evidence currentness is invalid");
                if (statement.current_state && !evidence.current) fail("a current-state statement depends on stale evidence");
                if (evidence.relation === "SUPPORTS") {
                  support += 1;
                  if (statement.label === "SOURCE_SUPPORTED" && evidence.assurance !== "EXACT") {
                    fail("a source-supported statement lacks exact evidence");
                  }
                } else contradiction += 1;
              }
              evidenceCount += statement.evidence.length;
              if (evidenceCount > MAX_TOTAL_EVIDENCE) fail("Wiki evidence map exceeds its total observation bound");
              if (support < 1) fail("Wiki statement has no supporting evidence");
              if (contradiction > 0) conflictCount += contradiction;
            }
            if (!exactSet([...seenStatements], statementRefs)) fail("Wiki evidence statements do not close the page statement set");
            if (conflictCount > 0) fail("Wiki evidence map contains unresolved contradictions");
            return Object.freeze({
              statement_count: statementRefs.length,
              evidence_count: evidenceCount,
              coverage_complete: coverageComplete,
              dependency_closure_complete: dependencyClosureComplete,
              conflict_count: conflictCount,
              changes_current_state: changesCurrentState,
            });
          }
          EOF

          cat > apps/eliotr-core/test/wiki-evidence-fixture.ts <<'EOF'
          import type { WikiPageRevision } from "@eliotr/contracts";
          import { WIKI_EVIDENCE_MAP_PROTOCOL } from "../src/wiki-evidence-map.js";

          export function createWikiEvidenceMap(page: WikiPageRevision, options: {
            readonly contradiction?: boolean;
            readonly current_state?: boolean;
            readonly stale?: boolean;
          } = {}): string {
            const dependencies = [...page.dependency_refs].sort();
            const source = dependencies[0];
            if (source === undefined) throw new Error("Wiki evidence fixture requires one dependency");
            const statements = Object.keys(page.statement_labels).sort().map((statementRef) => ({
              statement_ref: statementRef,
              label: page.statement_labels[statementRef],
              current_state: options.current_state ?? false,
              evidence: [
                {
                  evidence_ref: `evidence:${statementRef}:support`,
                  source_revision_ref: source,
                  excerpt_sha256: "e".repeat(64),
                  relation: "SUPPORTS",
                  assurance: "EXACT",
                  current: !(options.stale ?? false),
                },
                ...(options.contradiction ? [{
                  evidence_ref: `evidence:${statementRef}:z-contradiction`,
                  source_revision_ref: source,
                  excerpt_sha256: "f".repeat(64),
                  relation: "CONTRADICTS" as const,
                  assurance: "EXACT" as const,
                  current: true,
                }] : []),
              ],
            }));
            const refs = statements.map((statement) => statement.statement_ref);
            return JSON.stringify({
              protocol: WIKI_EVIDENCE_MAP_PROTOCOL,
              page_ref: page.page_ref,
              dependency_refs: dependencies,
              coverage: {
                denominator_ref: `wiki-coverage:${page.page_ref.id}:${page.page_ref.revision}`,
                complete: true,
                required_statement_refs: refs,
                settled_statement_refs: refs,
              },
              statements,
            });
          }
          EOF

          cat > apps/eliotr-core/test/wiki-evidence-map.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import type { WikiPageRevision } from "@eliotr/contracts";
          import { evaluateWikiEvidenceMap } from "../src/wiki-evidence-map.js";
          import { createWikiEvidenceMap } from "./wiki-evidence-fixture.js";

          const page: WikiPageRevision = {
            page_ref: { id: "evidence-page", revision: 1 }, page_type: "Source", title: "Evidence page",
            scope_snapshot_ref: { id: "scope-1", revision: 1 }, body_object_ref: "body-1", body_sha256: "a".repeat(64),
            statement_labels: { "claim-a": "SOURCE_SUPPORTED", "claim-b": "INFERENCE" }, evidence_map_ref: "map-1",
            counterposition_refs: [], coverage_receipt_ref: { id: "coverage-1", revision: 1 }, limitations: [],
            dependency_refs: ["source-revision-1"], generator_generation: "wiki-generator-v1", status: "DRAFT",
            publication_metadata: {}, created_at: "2026-09-11T00:00:00.000Z",
          };
          const bytes = (value: string) => new TextEncoder().encode(value);

          describe("Wiki evidence-map adjudication", () => {
            it("earns coverage and dependency closure only from the exact statement set", () => {
              expect(evaluateWikiEvidenceMap(page, bytes(createWikiEvidenceMap(page)))).toEqual({
                statement_count: 2, evidence_count: 2, coverage_complete: true,
                dependency_closure_complete: true, conflict_count: 0, changes_current_state: false,
              });
            });
            it("does not let majority support erase one contradiction", () => {
              expect(() => evaluateWikiEvidenceMap(page, bytes(createWikiEvidenceMap(page, { contradiction: true }))))
                .toThrow("unresolved contradictions");
            });
            it("rejects stale evidence for a current-state statement", () => {
              expect(() => evaluateWikiEvidenceMap(page, bytes(createWikiEvidenceMap(page, { current_state: true, stale: true }))))
                .toThrow("stale evidence");
            });
            it("rejects a shrunken denominator and a foreign dependency", () => {
              const map = JSON.parse(createWikiEvidenceMap(page)) as Record<string, unknown>;
              const coverage = map.coverage as { settled_statement_refs: string[] };
              coverage.settled_statement_refs.pop();
              expect(() => evaluateWikiEvidenceMap(page, bytes(JSON.stringify(map)))).toThrow("denominator is incomplete");
              const foreign = JSON.parse(createWikiEvidenceMap(page)) as { dependency_refs: string[] };
              foreign.dependency_refs = ["source-revision-foreign"];
              expect(() => evaluateWikiEvidenceMap(page, bytes(JSON.stringify(foreign)))).toThrow("dependency set");
            });
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path.cwd()

          store_path = root / "apps/eliotr-core/src/wiki-publication-store.ts"
          store = store_path.read_text(encoding="utf-8")
          import_line = 'import { evaluateWikiEvidenceMap } from "./wiki-evidence-map.js";\n'
          if import_line not in store: store = import_line + store
          old_signature = '''          export async function recordWikiPublicationAuthority(
            database: D1Database,
            input: WikiAuthorityAdmission,
          ): Promise<void> {
'''
          new_signature = '''          export async function recordWikiPublicationAuthority(
            database: D1Database,
            bucket: R2Bucket,
            input: WikiAuthorityAdmission,
          ): Promise<void> {
'''
          if old_signature in store: store = store.replace(old_signature, new_signature, 1)
          elif "bucket: R2Bucket" not in store[store.find("recordWikiPublicationAuthority"):store.find("recordWikiPublicationAuthority") + 300]:
              raise SystemExit("Wiki authority signature anchor missing")

          authority_anchor = "            const page = decodeProposal(proposal).page;\n            const encodedCoverage = JSON.stringify(page.coverage_receipt_ref);"
          authority_replacement = '''            const page = decodeProposal(proposal).page;
            const evidence = await readObject(bucket, page.evidence_map_ref, MAX_EVIDENCE_MAP_BYTES);
            const summary = evaluateWikiEvidenceMap(page, evidence.bytes);
            if (input.coverage_complete !== summary.coverage_complete
                || input.dependency_closure_complete !== summary.dependency_closure_complete
                || input.conflict_count !== summary.conflict_count
                || input.changes_current_state !== summary.changes_current_state) {
              fail("WIKI_PUBLICATION_INCOMPLETE", "Wiki publication authority does not match evidence adjudication");
            }
            const encodedCoverage = JSON.stringify(page.coverage_receipt_ref);'''
          if authority_anchor in store: store = store.replace(authority_anchor, authority_replacement, 1)
          elif "evaluateWikiEvidenceMap(page, evidence.bytes)" not in store:
              raise SystemExit("Wiki authority evidence anchor missing")

          save_anchor = "                const evidence = await readObject(bucket, page.evidence_map_ref, MAX_EVIDENCE_MAP_BYTES);\n                const dependenciesSha = await dependencyDigest(page);"
          save_replacement = '''                const evidence = await readObject(bucket, page.evidence_map_ref, MAX_EVIDENCE_MAP_BYTES);
                evaluateWikiEvidenceMap(page, evidence.bytes);
                const dependenciesSha = await dependencyDigest(page);'''
          if save_anchor in store: store = store.replace(save_anchor, save_replacement, 1)
          elif store.count("evaluateWikiEvidenceMap(page, evidence.bytes)") < 2:
              raise SystemExit("Wiki proposal evidence anchor missing")

          validate_anchor = "                const evidence = await readObject(bucket, page.evidence_map_ref, MAX_EVIDENCE_MAP_BYTES);\n                return evidence.sha256 === proposal.evidence_map_sha256 && evidence.bytes.byteLength === proposal.evidence_map_size;"
          validate_replacement = '''                const evidence = await readObject(bucket, page.evidence_map_ref, MAX_EVIDENCE_MAP_BYTES);
                evaluateWikiEvidenceMap(page, evidence.bytes);
                return evidence.sha256 === proposal.evidence_map_sha256 && evidence.bytes.byteLength === proposal.evidence_map_size;'''
          if validate_anchor in store: store = store.replace(validate_anchor, validate_replacement, 1)
          elif store.count("evaluateWikiEvidenceMap(page, evidence.bytes)") < 3:
              raise SystemExit("Wiki validation evidence anchor missing")
          store_path.write_text(store, encoding="utf-8", newline="\n")

          # Add the R2 bucket to every exact authority admission call.
          for path in list((root / "apps/eliotr-core").rglob("*.ts")):
              text = path.read_text(encoding="utf-8")
              if "recordWikiPublicationAuthority(" not in text: continue
              text = re.sub(r"recordWikiPublicationAuthority\(db,\s*\{", "recordWikiPublicationAuthority(db, runtime.WORK_BUCKET, {", text)
              text = re.sub(r"recordWikiPublicationAuthority\(env\.CORE_DB,\s*\{", "recordWikiPublicationAuthority(env.CORE_DB, env.WORK_BUCKET, {", text)
              path.write_text(text, encoding="utf-8", newline="\n")

          # Upgrade all Wiki page fixtures to the strict evidence-map protocol after each page is constructed.
          for path in (root / "apps/eliotr-core/test").glob("*.test.ts"):
              text = path.read_text(encoding="utf-8")
              if "WikiPageRevision" not in text or "evidence_map_ref" not in text: continue
              fixture_import = 'import { createWikiEvidenceMap } from "./wiki-evidence-fixture.js";\n'
              if fixture_import not in text: text = fixture_import + text
              offset = 0
              inserts = []
              pattern = re.compile(r"const\s+([A-Za-z_][A-Za-z0-9_]*)\s*:\s*WikiPageRevision\s*=\s*\{")
              while True:
                  match = pattern.search(text, offset)
                  if match is None: break
                  variable = match.group(1)
                  start = match.end() - 1
                  depth = 0
                  quote = None
                  escaped = False
                  end = None
                  for index in range(start, len(text)):
                      char = text[index]
                      if quote is not None:
                          if escaped: escaped = False
                          elif char == "\\": escaped = True
                          elif char == quote: quote = None
                          continue
                      if char in ('"', "'", "`"): quote = char
                      elif char == "{": depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              semi = text.find(";", index)
                              if semi < 0: raise SystemExit(f"unterminated Wiki fixture in {path}")
                              end = semi + 1
                              break
                  if end is None: raise SystemExit(f"unbalanced Wiki fixture in {path}")
                  probe = text[end:end + 180]
                  if f"createWikiEvidenceMap({variable})" not in probe:
                      line_start = text.rfind("\n", 0, match.start()) + 1
                      indent = text[line_start:match.start()]
                      inserts.append((end, f'\n{indent}await runtime.WORK_BUCKET.put({variable}.evidence_map_ref, createWikiEvidenceMap({variable}));'))
                  offset = end
              for position, value in reversed(inserts): text = text[:position] + value + text[position:]
              path.write_text(text, encoding="utf-8", newline="\n")

          manifest_path = root / "docs/agent-work/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          def find(value, wanted):
              if isinstance(value, dict):
                  if value.get("id") == wanted: return value
                  for child in value.values():
                      result = find(child, wanted)
                      if result is not None: return result
              elif isinstance(value, list):
                  for child in value:
                      result = find(child, wanted)
                      if result is not None: return result
              return None
          ownership = {
              "ER-12": [
                  "apps/eliotr-core/src/wiki-evidence-map.ts",
                  "apps/eliotr-core/test/wiki-evidence-map.test.ts",
                  "apps/eliotr-core/test/wiki-evidence-fixture.ts",
              ],
          }
          for packet_id, paths in ownership.items():
              packet = find(manifest, packet_id)
              if packet is None: raise SystemExit(f"missing packet {packet_id}")
              key = "owned_paths" if isinstance(packet.get("owned_paths"), list) else "ownedPaths" if isinstance(packet.get("ownedPaths"), list) else None
              if key is None: raise SystemExit(f"owned paths missing {packet_id}")
              for item in paths:
                  if item not in packet[key]: packet[key].append(item)
              docs = list((root / "docs/agent-work").glob(f"{packet_id}-*.md"))
              if len(docs) != 1: raise SystemExit(f"packet doc ambiguous {packet_id}")
              doc_path = docs[0]
              doc = doc_path.read_text(encoding="utf-8")
              heading = re.search(r"(?im)^##\s+Owned paths\s*$", doc)
              if heading is None: raise SystemExit(f"Owned paths heading missing {packet_id}")
              tail = doc[heading.end():]
              next_heading = re.search(r"(?m)^##\s+", tail)
              end = heading.end() + (next_heading.start() if next_heading else len(tail))
              section = doc[heading.end():end]
              additions = [item for item in paths if f'`{item}`' not in section]
              if additions:
                  if not section.endswith("\n"): section += "\n"
                  section += "".join(f'- `{item}`\n' for item in additions)
                  doc = doc[:heading.end()] + section + doc[end:]
                  doc_path.write_text(doc, encoding="utf-8", newline="\n")
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify evidence adjudication through the complete Wiki product
        run: |
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm --filter @eliotr/core exec vitest run test/wiki-evidence-map.test.ts test/wiki-publication-store.test.ts test/wiki-service.test.ts test/wiki-review-service.test.ts test/research-changes.test.ts --reporter=verbose
          pnpm typecheck
          pnpm lint
          pnpm budgets:check
          pnpm work-packets:check
          pnpm boundaries:check
          git diff --check
      - name: Commit only green cognitive product code
        run: |
          git rm .github/workflows/wiki-evidence-adjudication-once.yml
          git config user.name "Eliot Research Product Builder"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce Wiki evidence adjudication"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
