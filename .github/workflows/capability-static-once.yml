name: capability-static-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capability-static-once.yml

permissions:
  contents: write

concurrency:
  group: capability-static-once
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Repair static capability declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"{label} anchor missing")
              file.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")

          old_capabilities = (
              '    partial_slices: ["WIKI", ...(federationConfigured ? ["FEDERATION"] : [])],\n'
              '    disabled_slices: [\n'
              '      "RETRIEVAL",\n'
              '      ...(federationConfigured ? [] : ["FEDERATION"]),\n'
              '      "DRIVE_EXCHANGE",\n'
              '      "ERASURE",\n'
              '    ],'
          )
          new_capabilities = (
              '    partial_slices: ["WIKI", "FEDERATION"],\n'
              '    disabled_slices: ["RETRIEVAL", "DRIVE_EXCHANGE", "ERASURE"],\n'
              '    federation_configured: federationConfigured,'
          )
          replace_once(
              "apps/eliotr-core/src/composition-root.ts",
              old_capabilities,
              new_capabilities,
              "static federation capability declaration",
          )

          old_fixture = (
              '    expect(capabilities.disabled_slices).toEqual(\n'
              '      expect.arrayContaining(["FEDERATION"]),\n'
              '    );\n'
              '    expect(capabilities.google_external_transport).toBe("gemini-mcp");'
          )
          new_fixture = (
              '    expect(capabilities.partial_slices).toEqual(\n'
              '      expect.arrayContaining(["FEDERATION"]),\n'
              '    );\n'
              '    expect(capabilities.disabled_slices).not.toEqual(\n'
              '      expect.arrayContaining(["FEDERATION"]),\n'
              '    );\n'
              '    expect(capabilities.federation_configured).toBe(false);\n'
              '    expect(capabilities.google_external_transport).toBe("gemini-mcp");'
          )
          replace_once(
              "apps/eliotr-core/test/index.test.ts",
              old_fixture,
              new_fixture,
              "federation capability contract fixture",
          )
          PY
          git rm .github/workflows/capability-static-once.yml
          git diff --check
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify launch and provisioner gates
        run: |
          node scripts/test-launch-code.mjs
          pnpm test:provisioners
      - name: Verify product typing and runtime
        run: |
          pnpm lint
          pnpm typecheck
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm --filter @eliotr/core test
      - name: Commit verified repair to main
        run: |
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep capability slices statically auditable"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
