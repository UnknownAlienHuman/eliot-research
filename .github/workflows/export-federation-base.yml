name: export-current-main

# Temporary read-only source snapshot for the offline implementation environment.
# No dependency execution, deployment, repository mutation, or cloud credentials.
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-federation-base.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot the actual main history and tracked sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          mkdir -p /tmp/eliotr-main-snapshot
          git bundle create /tmp/eliotr-main-snapshot/main.bundle main
          git rev-parse HEAD > /tmp/eliotr-main-snapshot/SOURCE_SHA
          (cd /tmp/eliotr-main-snapshot && sha256sum main.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: current-main-backend-inputs
          path: /tmp/eliotr-main-snapshot/
          if-no-files-found: error
          retention-days: 1
