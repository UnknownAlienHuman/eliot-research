name: export-federation-base

on:
  push:
    branches:
      - agent/er-09-workflow-checkpoints-20260907
    paths:
      - .github/workflows/export-federation-base.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact validation dependencies
        run: |
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile
      - name: Archive isolated validation checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SNAPSHOT_HEAD_SHA
          tar --exclude=.git --exclude=.wrangler -czf /tmp/eliot-validation-checkout.tgz .
          tar -C "$(npm root -g)" -czf /tmp/eliot-pnpm.tgz pnpm
      - uses: actions/upload-artifact@v4
        with:
          name: eliot-validation-checkout
          path: |
            /tmp/eliot-validation-checkout.tgz
            /tmp/eliot-pnpm.tgz
          if-no-files-found: error
          retention-days: 1
