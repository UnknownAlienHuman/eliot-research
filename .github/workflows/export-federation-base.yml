name: export-audit-inputs

on:
  push:
    branches: [main]
    paths: [.github/workflows/export-federation-base.yml]

permissions:
  contents: read
  pull-requests: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Archive pinned source and planning documents without executing PR code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, urllib.request
          base = 'a2aca1277b0edbbed04de66e0d44e383e1b815ef'
          repo = 'UnknownAlienHuman/eliot-research'
          out = pathlib.Path('/tmp/audit-inputs')
          out.mkdir()
          subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], check=True)
          subprocess.run(['git', 'archive', '--format=tar', '--output=' + str(out / 'baseline.tar'), base], check=True)
          prs = []
          for page in range(1, 5):
              url = f'https://api.github.com/repos/{repo}/pulls?state=open&per_page=100&sort=created&direction=desc&page={page}'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)
              prs.extend(p for p in batch if 193 <= p['number'] <= 292)
              if len(batch) < 100:
                  break
          assert sorted(p['number'] for p in prs) == list(range(193, 293)), 'Planning PR set changed; do not guess'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin'] + [f"refs/pull/{p['number']}/head" for p in prs], check=True)
          metadata = []
          planning = out / 'planning'
          planning.mkdir()
          for pr in sorted(prs, key=lambda p: p['number']):
              sha = pr['head']['sha']
              paths = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', sha, '--', '.github/audits/2026-09-14/'], text=True).splitlines()
              if pr['number'] == 292:
                  selected = [p for p in paths if pathlib.PurePosixPath(p).name in {'EXECUTION-INDEX.md', 'EXECUTION-STEPS-01.md', 'EXECUTION-STEPS-02.md', 'EXECUTION-STEPS-03.md'}]
                  assert len(selected) == 4
              else:
                  task = pr['number'] - 192
                  selected = [p for p in paths if re.fullmatch(rf'S{task:02d}-[a-z0-9-]+\.md', pathlib.PurePosixPath(p).name)]
                  assert len(selected) == 1, (pr['number'], selected)
              for path in selected:
                  content = subprocess.check_output(['git', 'show', sha + ':' + path])
                  content.decode('utf-8')
                  (planning / pathlib.PurePosixPath(path).name).write_bytes(content)
              metadata.append({'number': pr['number'], 'title': pr['title'], 'body': pr['body'], 'head_sha': sha, 'head_ref': pr['head']['ref'], 'paths': selected})
          assert subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip() == 'main'
          (out / 'pr-metadata.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          (out / 'BASELINE_SHA').write_text(base + '\n', encoding='utf-8')
          print('Read-only export:', len(prs), 'planning PRs;', len(list(planning.glob('*.md'))), 'documents; baseline', base)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: assignment-correction-inputs
          path: /tmp/audit-inputs/
          if-no-files-found: error
          retention-days: 1
