name: publish-reviewed-backend-checkpoint

# One-shot transport for the owner's explicit direct-main implementation request.
# Exact reviewed plaintext patch only; no deployment. The connector removes this
# temporary bootstrap workflow after verifying the resulting application commit.
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-federation-base.yml]
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source files and apply the reviewed plaintext patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = c74d1375e518ee196aac3ea6ec684495491ba992
          cat > /tmp/verify-backend.py <<'PY'
          import hashlib, pathlib, subprocess, sys
          hashes = {
            'apps/eliotr-core/src/research-retrieve-branches.ts': ('f48fabcb6fb5f0e826a6ea6eb2eed8062b7c70f024d6fd396baa510dfa4a288a','aedb6d23b76bab9f55481d9581f51d43841903c4f12c7b2051d9886b6b72e63b'),
            'apps/eliotr-core/src/research-semantic-composition.ts': ('a2176bec33dd082d112c67a8addacaba9b13c1f1709386016da20efbbda22e27','988bbeada047e23c43b57d7aa21b361a979cf8c244914bf904d04741c3cb9f3f'),
            'apps/eliotr-core/src/research-semantic-server.ts': ('e1baf9d2ff8150d9cb6d76b9df4e1f1a61b82f41b867d9c850e8f628053b0412','f73177e408d0674134d08d04f825c982fa04a378123848034871d18d44be0f33'),
            'apps/eliotr-core/src/research-session.ts': ('7be585d686b8b7de7cb5a49ef11c052efe49132ef221f75038b70860d6666c38','55b75fd3ba29cad78867a1085f06ccb3bef53f833c601b72352e941deb7ded82'),
            'apps/eliotr-core/src/research-stage-handlers.ts': ('6e0a21fd1b57efffb1753b0006f2b54a6e050e3e8122ed3b2a4a0ab40129c521','275b9761f1c99db818772c98aa7bde57a2d92ae01d7aec934cb3e9b74fc26288'),
            'apps/eliotr-core/src/research-workflow.ts': ('46d7db2c9c5d6adcd81ed757a380fa4c929ac7f10ad07f1a128ee5ed5fa112bd','c2d5ed85f411a53c229b9363714e59d3c156e671a66f99b5cf71df5a88d46e8f'),
            'apps/eliotr-core/test/research-claim-audit-fixture.ts': ('e63bb90c31a41d966c8917e970dad3acfb3eed115a40d6507858ca5b8fb03c0c','574511b8b252ae2bd4f7c6784cce8c38d0f95553d70335f23e8d466ac20f0454'),
            'apps/eliotr-core/test/research-evidence-freeze-fixture.ts': ('d906ad099d1a5fab3ea3169ca4701bcdc88f237176cef3530f2bfb6037a6508f','86d2475852fbe6ef43a6a22c023e42ef01fb56b24decf2897801734c1b15ee37'),
            'apps/eliotr-core/test/research-query-retrieval.test.ts': ('8d6e4f6927ff3b793bffd02dbdeab633315bf9a7fb301d6a13e1d06df312d394','cbf68f5bdd4f71f1d14a0a93cc8c2ff7e777236f801a2dce04aae89cc7c486c6'),
            'apps/eliotr-core/test/research-retrieve-branches.test.ts': ('8815ae12a73950dc92093e89d499a48eb392518c3cdc6c987e767c31245df3e6','620b1722755e01cf0122eaf31c101d1eb0bf2aa94961081699031a4611e0d037'),
            'apps/eliotr-core/test/research-run-status.test.ts': ('fbb4a322f226b4d5757e3b3febc126d59db284e55e5b173aa5e286e7c1a6eb0f','b18758e4611c8708685016cb365451a540ec73a6cc31a4b98d9e7a3bc1641f5d'),
            'apps/eliotr-core/test/research-synthesis-fixture.ts': ('504acc6a19b4c722569907642398059db93d40a7d202c917cb57261093b3f1cb','dc1d91d9fd79c4fc6e92965ddaace9d95ab871b2deb85cddedbd214355a1f3bb'),
            'apps/eliotr-core/test/research-workflow-recovery.test.ts': ('9f86cb6f23fe7dc3c66261f513ff83259a7cac7c680171a922dd71269f57d49f','02e104041aedd1e0dfb684e174e812389bc25ece691d0d4030792fc69970a2be'),
            'docs/implementation/README.md': ('809ea5a3652301a09cf2313cc3021c3f68f521dbe8d8834c25aed0061e4ba6be','bda8f476015945e6646bc6777586925d8905ed53ee9d23d320ca69228cda6c1c'),
          }
          after = sys.argv[1] != 'before'
          for name, pair in hashes.items():
            assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == pair[int(after)], name
          actual = set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())
          assert actual == (set(hashes) if after else set()), actual
          print('Exact reviewed files verified:', len(hashes), sys.argv[1])
          PY
          python3 /tmp/verify-backend.py before
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          blobs = ['a34e7ce778d6616f3d9f7812eeae436672c4d86c','3931e713870c948a4dd32fad17748e1fae677e4c','414e1e776fa52f4fda28266f7082d41b821af9e7','594c45e685110413a6108cb76c3a70bff581d497','90936713ce6f64d098fba8f60b7f9c31ce0975d3','51e3f08a58e586831d849b5141029226c6fa48b3']
          parts = []
          for sha in blobs:
            url = 'https://api.github.com/repos/UnknownAlienHuman/eliot-research/git/blobs/' + sha
            req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req, timeout=30) as response: item = json.load(response)
            raw = base64.b64decode(item['content'])
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
            raw.decode('utf-8')
            parts.append(raw)
          patch = b''.join(parts)
          assert len(patch) == 55421
          assert hashlib.sha256(patch).hexdigest() == 'a484c6a70b1b7582bf1e1d9805359c7f0937a9b768b098ca1314a6776249ee95'
          path = pathlib.Path('/tmp/reviewed-backend.patch'); path.write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          PY
          python3 /tmp/verify-backend.py after
          git diff --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Check only the critical implementation boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/backend-validation
          pnpm exec tsc -b apps/eliotr-core/tsconfig.json apps/eliotr-pwa/tsconfig.json --pretty false
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm exec eslint $(git diff --name-only -- '*.ts')
          node scripts/check-boundaries.mjs
          node scripts/check-work-packets.mjs
          pnpm --dir apps/eliotr-core exec vitest run test/research-retrieve-branches.test.ts test/research-workflow-recovery.test.ts test/research-run-status.test.ts 2>&1 | tee /tmp/backend-validation/core.log
          pnpm --dir apps/eliotr-core exec vitest run test/research-query-retrieval.test.ts -t 'binds replay to the normalized requested expression' 2>&1 | tee /tmp/backend-validation/replay.log
          python3 /tmp/verify-backend.py after
      - name: Publish the exact tested application patch to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          python3 /tmp/verify-backend.py after
          git diff --check
          git add --update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind query replay, settle cancellation, and enable versioned SEM Research (S08 S09 S16)'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
          git rev-parse HEAD | tee /tmp/backend-validation/IMPLEMENTATION_SHA
          git diff --stat HEAD^ HEAD > /tmp/backend-validation/CHANGES
          printf 'Focused implementation checks passed; broad and live acceptance remain delegated.\n' > /tmp/backend-validation/SCOPE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checkpoint-validation
          path: /tmp/backend-validation/
          if-no-files-found: warn
          retention-days: 7
