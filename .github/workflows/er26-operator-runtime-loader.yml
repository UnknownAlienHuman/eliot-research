name: er26-operator-runtime-loader

on:
  push:
    branches:
      - agent/ER-26-ai-search-generation-operator-clean-20260904

permissions:
  contents: write

concurrency:
  group: er26-operator-runtime-loader
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[er26-runtime-loader]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-generation-operator-clean-20260904
          fetch-depth: 0

      - name: Narrow runtime imports and build the operator target
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          operator = Path("scripts/manage-ai-search-generation.mjs")
          text = operator.read_text(encoding="utf-8")
          old = '''async function loadCloudflareAiModule() {
            try {
              return await import(
                new URL("../packages/cloudflare-ai/dist/index.js", import.meta.url)
              );
            } catch (cause) {
              throw new OperatorInputError(
                "@eliotr/cloudflare-ai is not built; run `pnpm exec tsc -b packages/cloudflare-ai/tsconfig.json --pretty false` first",
                { cause },
              );
            }
          }
          '''
          new = '''async function loadCloudflareAiModule() {
            const moduleUrl = (name) =>
              new URL(`../packages/cloudflare-ai/dist/${name}.js`, import.meta.url);
            try {
              const [profile, generation, registry, store, primary] = await Promise.all([
                import(moduleUrl("ai-search-profile")),
                import(moduleUrl("ai-search-generation")),
                import(moduleUrl("ai-search-generation-registry")),
                import(moduleUrl("ai-search-generation-registry-d1")),
                import(moduleUrl("ai-search-primary-profile")),
              ]);
              return Object.freeze({
                ...profile,
                ...generation,
                ...registry,
                ...store,
                ...primary,
              });
            } catch (cause) {
              throw new OperatorInputError(
                `@eliotr/cloudflare-ai operator modules are unavailable; run ` +
                  "`pnpm exec tsc -b packages/cloudflare-ai/tsconfig.json --pretty false --force` first. " +
                  `Runtime import failed: ${errorMessage(cause)}`,
                { cause },
              );
            }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("loadCloudflareAiModule anchor missing or ambiguous")
          operator.write_text(text.replace(old, new), encoding="utf-8")

          runner = Path("scripts/run-provisioner-tests.mjs")
          runner.write_text('''import { spawnSync } from "node:child_process";

          process.env.ELIOTR_ACCESS_TEAM_DOMAIN ??= "https://mock-team.cloudflareaccess.com";
          process.env.ELIOTR_ACCESS_AUDIENCE ??= "mock-access-audience";
          process.env.ELIOTR_ACCESS_SERVICE_PRINCIPALS ??= "eliotr-federation,eliotr-agent";
          await import("./test-cloudflare-provisioners.mjs");
          await import("./test-ai-search-provisioning-readback.mjs");
          await import("./test-ai-search-provisioning-reconciliation.mjs");

          const build = spawnSync(
            "pnpm",
            [
              "exec",
              "tsc",
              "-b",
              "packages/cloudflare-ai/tsconfig.json",
              "--pretty",
              "false",
              "--force",
            ],
            {
              cwd: process.cwd(),
              stdio: "inherit",
              shell: process.platform === "win32",
            },
          );
          if (build.error !== undefined) throw build.error;
          if (build.status !== 0) process.exit(build.status ?? 1);

          await import("./test-ai-search-generation-operator.mjs");
          ''', encoding="utf-8")
          PY
          git rm -- .github/workflows/er26-operator-runtime-loader.yml
          node --check scripts/manage-ai-search-generation.mjs
          node --check scripts/run-provisioner-tests.mjs
          git diff --check

      - name: Commit runtime-loader correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-26: narrow operator runtime loading [er26-runtime-loader]"
          git push origin HEAD:agent/ER-26-ai-search-generation-operator-clean-20260904
