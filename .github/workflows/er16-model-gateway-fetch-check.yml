name: er16-model-gateway-fetch-check

on:
  push:
    branches:
      - agent/ER-16-model-gateway-fetch-adapter-20260903
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: er16-model-gateway-fetch-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-model-gateway-fetch-adapter-20260903
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Apply corpus and documentation corrections
        run: |
          set -euo pipefail
          python3 scripts/tmp-er16-model-gateway-finalize.py
          git rm -- scripts/tmp-er16-model-gateway-finalize.py
          git rm -- .github/workflows/er16-model-gateway-fetch-check.yml
          git diff --check
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify contracts and boundaries
        run: |
          pnpm contracts:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm work-packets:check
      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
      - name: Targeted Cloudflare AI tests
        run: pnpm exec vitest run packages/cloudflare-ai packages/platform-cloudflare --reporter=verbose
      - name: Worker deployment dry-run
        run: pnpm cf:dry-run
      - name: Commit verified fetch boundary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ER-16: qualify reasoning gateway fetch execution [fetch-finalized]"
          git push origin HEAD:agent/ER-16-model-gateway-fetch-adapter-20260903
