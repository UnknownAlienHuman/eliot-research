name: er26-generation-operator-finalize

on:
  push:
    branches:
      - agent/ER-26-ai-search-generation-operator-20260904

permissions:
  contents: write

concurrency:
  group: er26-generation-operator-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[er26-generation-operator-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-26-ai-search-generation-operator-20260904
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Finalize operator receipts, tests and work-packet ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          cli_path = Path("scripts/manage-ai-search-generation.mjs")
          cli = cli_path.read_text(encoding="utf-8")
          old_receipt = '''  const suffix = `${receipt.revision}-${receipt.artifact_sha256.slice(0, 16)}`;
            const path = resolve(
              stateDirectory,
              `ai-search-generation-${document.operation.toLowerCase()}-${suffix}.json`,
            );
            const bytes = `${JSON.stringify(document, null, 2)}\\n`;
          '''
          new_receipt = '''  const bytes = `${JSON.stringify(document, null, 2)}\\n`;
            const documentSha256 = createHash("sha256").update(bytes).digest("hex");
            const suffix =
              `${receipt.revision}-${receipt.artifact_sha256.slice(0, 16)}-${documentSha256.slice(0, 16)}`;
            const path = resolve(
              stateDirectory,
              `ai-search-generation-${document.operation.toLowerCase()}-${suffix}.json`,
            );
          '''
          if old_receipt in cli:
              cli = cli.replace(old_receipt, new_receipt)
          elif "const documentSha256 = createHash" not in cli:
              raise SystemExit("operator receipt anchor missing")

          old_live = '''    live_provider_mutation: false,
          '''
          new_live = '''    registry_d1_operation:
              command === "status" ? "READ_ONLY" : "MUTATING",
            managed_ai_search_mutation: false,
          '''
          if old_live in cli:
              cli = cli.replace(old_live, new_live)
          elif "managed_ai_search_mutation" not in cli:
              raise SystemExit("operator mutation-classification anchor missing")
          cli_path.write_text(cli, encoding="utf-8")

          runner_path = Path("scripts/run-provisioner-tests.mjs")
          runner = runner_path.read_text(encoding="utf-8")
          operator_import = 'await import("./test-ai-search-generation-operator.mjs");\n'
          if operator_import not in runner:
              runner += operator_import
          runner_path.write_text(runner, encoding="utf-8")

          packet_id = "ER-26"
          packet_path = Path("docs/agent-work/ER-26-cloudflare-provisioning-and-deployment.md")
          packet = packet_path.read_text(encoding="utf-8")
          lines = packet.splitlines()
          headings = [index for index, line in enumerate(lines) if line == "## Owned paths"]
          if len(headings) != 1:
              raise SystemExit("ER-26 must have exactly one Owned paths heading")
          start = headings[0] + 1
          end = next(
              (index for index in range(start, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          existing = []
          for line in lines[start:end]:
              if line.startswith("- `") and line.endswith("`"):
                  existing.append(line[3:-1])
          additions = [
              "scripts/lib/cloudflare-d1-http.mjs",
              "scripts/manage-ai-search-generation.mjs",
              "scripts/run-provisioner-tests.mjs",
              "scripts/test-ai-search-generation-operator.mjs",
          ]
          desired_paths = list(existing)
          insertion_after = "scripts/provision-ai-search.mjs"
          insert_at = (
              desired_paths.index(insertion_after) + 1
              if insertion_after in desired_paths
              else len(desired_paths)
          )
          for candidate in additions:
              if candidate not in desired_paths:
                  desired_paths.insert(insert_at, candidate)
                  insert_at += 1

          manifest_path = Path("docs/agent-work/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          packets = {entry["id"]: entry for entry in manifest["packets"]}
          if packet_id not in packets:
              raise SystemExit("ER-26 is missing from work-packet manifest")

          def kind(pattern):
              if pattern.endswith("/**"):
                  return True, pattern[:-3].rstrip("/")
              if "*" in pattern:
                  return True, pattern[:pattern.index("*")].rstrip("/")
              return False, pattern

          def overlaps(left, right):
              left_broad, left_prefix = kind(left)
              right_broad, right_prefix = kind(right)
              if not left_broad and not right_broad:
                  return left_prefix == right_prefix
              if left_broad and right_broad:
                  return (
                      left_prefix == right_prefix
                      or left_prefix.startswith(right_prefix + "/")
                      or right_prefix.startswith(left_prefix + "/")
                  )
              broad_prefix = left_prefix if left_broad else right_prefix
              exact_prefix = right_prefix if left_broad else left_prefix
              return exact_prefix == broad_prefix or exact_prefix.startswith(broad_prefix + "/")

          for candidate in additions:
              for other_id, other in packets.items():
                  if other_id == packet_id:
                      continue
                  for claim in other.get("owned_paths", []):
                      if overlaps(candidate, claim):
                          raise SystemExit(
                              f"{candidate} overlaps {other_id}:{claim}"
                          )

          replacement = [""] + [f"- `{path}`" for path in desired_paths] + [""]
          lines[start:end] = replacement
          packet = "\n".join(lines).rstrip() + "\n"
          section = "## Active implementation slice — AI Search generation operator"
          if section not in packet:
              packet += f'''\n{section}\n\nThe operator uses the compiled generation lifecycle plus the SEARCH_DB D1 adapter over the\nCloudflare D1 HTTP query endpoint. `status` is read-only. `declare`, `observe`, and `promote`\nrequire `--confirm-live`; promotion also requires the exact desired generation as a second\nconfirmation and an expected active head. Provider credentials are accepted only through the\nenvironment. Every D1 mutation remains revision-and-digest fenced, requires exact readback, and\nis never retried while its effect is unknown.\n\nBuild and inspect status:\n\n```text\npnpm exec tsc -b packages/cloudflare-ai/tsconfig.json --pretty false\nnode scripts/manage-ai-search-generation.mjs status\n```\n\nMutating commands write deterministic local receipts under `.eliotr-state` but do not mutate an\nAI Search instance. Remote D1 execution, shadow indexing, T2/T3 adjudication, promotion and rollback\nreceipts remain `NOT_EXECUTED`.\n'''
          packet_path.write_text(packet, encoding="utf-8")

          packets[packet_id]["owned_paths"] = desired_paths
          baseline = subprocess.check_output(
              ["git", "rev-parse", "origin/main"],
              text=True,
          ).strip()
          manifest["baseline_commit"] = baseline
          manifest["generated_at"] = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git rm -- .github/workflows/er26-generation-operator-finalize.yml
          git diff --check

      - name: Install frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify generation operator and repository gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc -b packages/cloudflare-ai/tsconfig.json --pretty false
          node scripts/test-ai-search-generation-operator.mjs
          node scripts/run-provisioner-tests.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-budgets.mjs
          pnpm lint
          pnpm typecheck

      - name: Commit verified operator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-26: finalize AI Search generation operator [er26-generation-operator-finalized]"
          git push origin HEAD:agent/ER-26-ai-search-generation-operator-20260904
