name: research-changes-authority-gate-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-changes-authority-gate-once.yml

permissions:
  contents: write

concurrency:
  group: eliot-main-product-write
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Complete interrupted recovery if required
        shell: bash
        run: |
          if test -f scripts/recover-research-changes-once.py; then
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
            python3 scripts/recover-research-changes-once.py
            python3 scripts/repair-research-changes-contour-once.py
          fi
      - name: Enforce fail-closed authority state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd()
          semantic_path = root / "packages/interfaces/src/semantic-api.ts"
          composition_path = root / "apps/eliotr-core/src/composition-root.ts"
          http_path = root / "apps/eliotr-core/src/http.ts"
          routes_path = root / "packages/interfaces/src/routes.ts"

          semantic = semantic_path.read_text(encoding="utf-8")
          composition = composition_path.read_text(encoding="utf-8")
          http = http_path.read_text(encoding="utf-8")
          routes = routes_path.read_text(encoding="utf-8")

          relevant: list[tuple[Path, str]] = []
          for base in (root / "apps", root / "packages"):
              if not base.exists():
                  continue
              for path in base.rglob("*.ts"):
                  if any(part in {"node_modules", "dist"} for part in path.parts):
                      continue
                  text = path.read_text(encoding="utf-8")
                  if (
                      "research.changes" in text
                      or "research_change" in text
                      or "ResearchChange" in text
                  ):
                      relevant.append((path, text))

          joined = "\n".join(text for _, text in relevant)
          signature = re.search(r"changes\(([^\n]+)", semantic)
          signature_text = "" if signature is None else signature.group(0)
          authority = {
              "no_caller_scope_authority": not bool(
                  re.search(r"allowedScopes|allowed_scopes", signature_text)
              ),
              "hmac": bool(
                  re.search(r"\bHMAC\b|subtle\.sign|subtle\.verify", joined)
              ),
              "principal": "principal_ref" in joined,
              "client_class": "client_class" in joined,
              "credential_generation": "credential_generation" in joined,
              "deployment_generation": "deployment_generation" in joined,
              "expiry": bool(re.search(r"expires_at|expiresAt", joined)),
              "route": 'operation: "research.changes"' in routes,
              "http": "research.changes" in http,
          }
          safe = all(authority.values())

          placeholder = 'changes: () => unavailable("research.changes")'
          if not safe and placeholder not in composition:
              # Replace only the SemanticApi property in the composition object.
              lines = composition.splitlines()
              candidates = [
                  index
                  for index, line in enumerate(lines)
                  if re.match(r"^\s*changes:\s*", line)
              ]
              if len(candidates) != 1:
                  raise SystemExit(
                      f"cannot safely disable research.changes; candidates={candidates}"
                  )
              indent = re.match(r"^\s*", lines[candidates[0]]).group(0)
              lines[candidates[0]] = (
                  indent + 'changes: () => unavailable("research.changes"),'
              )
              composition = "\n".join(lines) + "\n"

          # Capabilities must not advertise an authority-incomplete endpoint.
          if not safe and '"RESEARCH_CHANGES"' not in composition:
              anchor = '      "ERASURE",\n'
              if anchor in composition:
                  composition = composition.replace(
                      anchor,
                      anchor + '      "RESEARCH_CHANGES",\n',
                      1,
                  )

          composition_path.write_text(
              composition,
              encoding="utf-8",
              newline="\n",
          )

          report = {
              "protocol": "eliotr.research-changes-authority-gate.v1",
              "safe_for_public_composition": safe,
              "checks": authority,
              "implementation_files": sorted(
                  path.relative_to(root).as_posix() for path, _ in relevant
              ),
          }
          Path("/tmp/research-changes-authority.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2))
          PY
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify local backend and authority gate
        run: |
          pnpm --filter @eliotr/interfaces typecheck
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit gated checkpoint to main
        shell: bash
        run: |
          safe="$(node -e "const r=require('/tmp/research-changes-authority.json');process.stdout.write(String(r.safe_for_public_composition))")"
          git rm .github/workflows/research-changes-authority-gate-once.yml
          rm -f .github/workflows/research-changes-recovery-once.yml
          rm -f scripts/recover-research-changes-once.py scripts/repair-research-changes-contour-once.py
          rm -f infra/verification/research-changes-authority-audit.json
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes remain after authority gate"
            exit 0
          fi
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          if test "$safe" = true; then
            message="feat: expose authority-bound research changes feed"
          else
            message="feat: recover research changes internals fail-closed"
          fi
          git commit -m "$message"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
