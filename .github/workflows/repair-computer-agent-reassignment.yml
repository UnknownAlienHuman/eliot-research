name: Repair computer-agent reassignment verifier

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Repair exact fixture and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-computer-agent-reassignment.yml')
          text = path.read_text(encoding='utf-8')
          old = "authentication_method: 'service_token', subject: 'agent-1',"
          new = "authentication_method: 'service_token', subject: 'agent-1.access',"
          if text.count(old) != 1 or new in text:
              raise SystemExit('reassignment fixture subject marker changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm -f .github/workflows/repair-computer-agent-reassignment.yml
          git diff --check
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            echo "origin/main moved during fixture repair" >&2
            exit 1
          fi
          git add .github/workflows/apply-computer-agent-reassignment.yml
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'chore: repair reassignment contract fixture'
          git push origin HEAD:main
