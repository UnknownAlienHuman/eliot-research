          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path.cwd()

          composition_path = root / "apps/eliotr-core/src/composition-root.ts"
          composition = composition_path.read_text(encoding="utf-8")
          import_line = 'import { createResearchChangesService } from "./research-changes.js";\n'
          if import_line not in composition: composition = import_line + composition
          if 'changes: createResearchChangesService(env)' not in composition:
              candidates = [
                  'changes: () => unavailable("research.changes")',
                  'changes: unavailable("research.changes")',
              ]
              for candidate in candidates:
                  if candidate in composition:
                      composition = composition.replace(candidate, 'changes: createResearchChangesService(env)', 1)
                      break
              else: raise SystemExit("research.changes composition seam missing")
          composition_path.write_text(composition, encoding="utf-8", newline="\n")

          http_path = root / "apps/eliotr-core/src/http.ts"
          http = http_path.read_text(encoding="utf-8")
          helper_import = 'import { readResearchChangesHttpRequest } from "./research-changes.js";\n'
          if helper_import not in http: http = helper_import + http
          pattern = re.compile(
              r'^[ \t]*if \(match\.route\.operation_id === "research\.changes"\) \{\n[\s\S]*?^[ \t]*\}\n',
              re.MULTILINE,
          )
          http = pattern.sub("", http, count=1)
          anchor = re.search(r'^(?P<indent>[ \t]*)if \(match\.route\.operation_id === "research\.query"\)', http, re.MULTILINE)
          if anchor is None: raise SystemExit("research.query HTTP anchor missing")
          indent = anchor.group("indent")
          block = (
              f'{indent}if (match.route.operation_id === "research.changes") {{\n'
              f'{indent}  const invoke = application.services.semantic.changes as unknown as (\n'
              f'{indent}    context: typeof context, input: unknown,\n'
              f'{indent}  ) => Promise<unknown>;\n'
              f'{indent}  const data = await invoke(\n'
              f'{indent}    context,\n'
              f'{indent}    await readResearchChangesHttpRequest(request, match.route.maximum_request_bytes),\n'
              f'{indent}  );\n'
              f'{indent}  return apiResult(request, env, data);\n'
              f'{indent}}}\n'
          )
          http = http[:anchor.start()] + block + http[anchor.start():]
          http_path.write_text(http, encoding="utf-8", newline="\n")

          routes = (root / "packages/interfaces/src/routes.ts").read_text(encoding="utf-8")
          if 'research.changes' not in routes: raise SystemExit("canonical research.changes route is absent")

          manifest_path = root / "docs/agent-work/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          def find_packet(value, wanted):
              if isinstance(value, dict):
                  if value.get("id") == wanted: return value
                  for child in value.values():
                      found = find_packet(child, wanted)
                      if found is not None: return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_packet(child, wanted)
                      if found is not None: return found
              return None
          docs = [path for path in (root / "docs/agent-work").glob("ER-*.md") if "research.changes" in path.read_text(encoding="utf-8")]
          preferred = [path for path in docs if path.name.startswith("ER-24-")]
          owner_doc = preferred[0] if len(preferred) == 1 else docs[0] if len(docs) == 1 else None
          if owner_doc is None: raise SystemExit(f"research.changes owner packet ambiguous: {[p.name for p in docs]}")
          owner_id = owner_doc.name.split("-", 2)[0] + "-" + owner_doc.name.split("-", 2)[1]
          ownership = {
              owner_id: ["apps/eliotr-core/src/research-changes.ts", "apps/eliotr-core/test/research-changes.test.ts"],
              "ER-13": ["infra/d1/core/migrations/0043_research_change_feed.sql"],
          }
          for packet_id, paths in ownership.items():
              packet = find_packet(manifest, packet_id)
              if packet is None: raise SystemExit(f"packet missing: {packet_id}")
              key = "owned_paths" if isinstance(packet.get("owned_paths"), list) else "ownedPaths" if isinstance(packet.get("ownedPaths"), list) else None
              if key is None: raise SystemExit(f"owned paths missing: {packet_id}")
              for item in paths:
                  if item not in packet[key]: packet[key].append(item)
              packet_docs = list((root / "docs/agent-work").glob(f"{packet_id}-*.md"))
              if len(packet_docs) != 1: raise SystemExit(f"packet doc ambiguous: {packet_id}")
              doc_path = packet_docs[0]
              doc = doc_path.read_text(encoding="utf-8")
              heading = re.search(r"(?im)^##\s+Owned paths\s*$", doc)
              if heading is None: raise SystemExit(f"Owned paths heading missing: {packet_id}")
              tail = doc[heading.end():]
              next_heading = re.search(r"(?m)^##\s+", tail)
              end = heading.end() + (next_heading.start() if next_heading else len(tail))
              section = doc[heading.end():end]
              additions = [item for item in paths if f'`{item}`' not in section]
              if additions:
                  if not section.endswith("\n"): section += "\n"
                  section += "".join(f'- `{item}`\n' for item in additions)
                  doc = doc[:heading.end()] + section + doc[end:]
                  doc_path.write_text(doc, encoding="utf-8", newline="\n")
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
