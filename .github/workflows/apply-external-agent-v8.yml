name: Apply external-agent v8 checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-external-agent-v8.yml

permissions:
  contents: write

concurrency:
  group: apply-external-agent-v8
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          shas = [
              "6dc440fb7ff1aa07e65bc37badbd8b7a59cfaa17",
              "ca26ae988cf04810354103ec55739a0717e67343",
              "72d0528523fac14708d93d1f27fc58c0e4a5c84a",
              "a6892c500d7f971d68842d1817328977a00aa851",
              "96b9edf362fb22ede0fc042788cdc8fae8598cfb",
              "540df5d7f0a730d3447c7455e5f4554228e23410",
              "5144fa7460ecf5f7818caf8611a1438944af7321",
              "dc21b603c1091f772480f52ddde7671d641680bc",
              "59fd3a936a1a4b4f86fa186667a1fbdad117c369",
              "b1926e15ebaa12d4d256953161ecac81546db355",
          ]
          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          chunks = bytearray()
          for sha in shas:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              if blob.get("sha") != sha or blob.get("encoding") != "base64":
                  raise SystemExit(f"unexpected blob response for {sha}")
              chunks.extend(base64.b64decode(blob["content"], validate=False))
          with open("/tmp/eliot-v8-payload.b64", "wb") as target:
              target.write(chunks)
          PY
          base64 --decode /tmp/eliot-v8-payload.b64 > /tmp/eliot-v8-payload.tar.gz
          echo '33c8bb026f58ace9f463aaf4ce5f1d19f4c003ca71326d2e459a934ea9dc1d60  /tmp/eliot-v8-payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/eliot-v8-payload.tar.gz
      - name: Commit checkpoint
        run: |
          git rm .github/workflows/apply-external-agent-v8.yml
          git diff --check
          git add \
            infra/d1/core/migrations/0086_external_agent_task_payload.sql \
            packages/cloudflare-workflows/src/external-agent-task-payload.ts \
            packages/cloudflare-workflows/src/index.ts \
            packages/cloudflare-research/src/research-external-branch-analysis.ts \
            packages/cloudflare-research/src/index.ts \
            apps/eliotr-core/src/mcp-external-agent-task.ts \
            apps/eliotr-core/src/research-external-agent-routing.ts \
            apps/eliotr-core/src/research-retrieve-branches.ts \
            apps/eliotr-core/src/research-stage-handlers.ts \
            apps/eliotr-core/src/research-semantic-server.ts \
            apps/eliotr-core/src/research-session.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: route delegated research through computer agents' \
            -m 'Add provider-neutral Spark/Muse/Dot branch analysis over the existing external task contour. Bind immutable task payloads and deadlines to the exact delegated run, historical grant revision, scope authority and W2 attempt. Only already-admitted frozen-scope handles can enter the canonical checkpoint; new browser/app/local findings remain NOT_ADMITTED candidates. Recover validated callbacks through the existing W2/W1 settlement path. Refs #301.'
          git push origin HEAD:main
