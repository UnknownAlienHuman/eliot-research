name: er00-one-shot-hardening

on:
  pull_request:
    paths:
      - ".github/workflows/er00-one-shot-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ER-00-rust-m1-foundation-20260901'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify and apply the staged hardening payload
        run: |
          cat .github/er00-hardening-payload/part-*.b64 > /tmp/eliot-m1-hardening.b64
          base64 --decode /tmp/eliot-m1-hardening.b64 > /tmp/eliot-m1-hardening.tar.gz
          echo "2270dccbbe041320ec4e437fb29966ed9163a232393f2a105641057f19d1139b  /tmp/eliot-m1-hardening.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/eliot-m1-hardening.tar.gz -C .
          rm -rf .github/er00-hardening-payload
          rm .github/workflows/er00-one-shot-hardening.yml
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default 1.98.0
      - name: Validate bounded cross-runtime conformance
        run: |
          node --check scripts/check-rust-vectors.mjs
          node --check scripts/check-rust-wasm.mjs
          node scripts/check-rust-vectors.mjs
          node scripts/check-rust-boundaries.mjs
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo test --doc --workspace --all-features --locked
          cargo generate-lockfile --manifest-path fuzz/Cargo.toml
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          cargo build --workspace --target wasm32-unknown-unknown --release --locked
          node scripts/check-rust-wasm.mjs --mode default
          cargo build \
            --package eliotr-kernel-wasm \
            --target wasm32-unknown-unknown \
            --release \
            --features m1-self-test-export \
            --locked
          node scripts/check-rust-wasm.mjs --mode self-test
          git diff --check
      - name: Commit the validated hardening change
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(rust): harden bounded M1 conformance"
          git push origin "HEAD:${HEAD_REF}"
