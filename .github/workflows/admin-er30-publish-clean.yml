name: admin-er30-publish-clean

on:
  push:
    branches:
      - agent/ER-30-scope-snapshots-20260901

permissions:
  contents: write

concurrency:
  group: admin-er30-publish-clean
  cancel-in-progress: false

jobs:
  verify-and-publish-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Materialize reviewed ER-30 files on current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d8854dedafb9142c63ce1fbf7d331da5212f93bc"

          cp .github/workflows/admin-er30-apply-scope-snapshots.yml "$RUNNER_TEMP/admin-source.yml"
          python3 <<'PY'
          from pathlib import Path

          source = Path("/tmp/admin-source-placeholder")
          source = Path(__import__("os").environ["RUNNER_TEMP"]) / "admin-source.yml"
          text = source.read_text(encoding="utf-8")
          marker = "          python3 <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = []
          for line in text[start:end].splitlines():
              if line == "":
                  lines.append("")
              elif line.startswith("          "):
                  lines.append(line[10:])
              else:
                  raise SystemExit("unexpected admin patch indentation")
          target = Path(__import__("os").environ["RUNNER_TEMP"]) / "apply-er30.py"
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          compile(target.read_text(encoding="utf-8"), str(target), "exec")
          PY

          cat .github/admin-er30-payload/part-* | tr -d '\r\n' \
            | base64 --decode > "$RUNNER_TEMP/er30-scope-snapshots.tar.gz"
          echo "0f59a1224168972a627e7c5a2c00ddd655f7c044e2d4269a1a4cb10753b9f343  $RUNNER_TEMP/er30-scope-snapshots.tar.gz" \
            | sha256sum --check
          tar -tzf "$RUNNER_TEMP/er30-scope-snapshots.tar.gz" | sort > "$RUNNER_TEMP/actual-payload-paths"
          cat > "$RUNNER_TEMP/expected-payload-paths" <<'PATHS'
          apps/eliotr-core/src/scope-service.test.ts
          apps/eliotr-core/src/scope-service.ts
          docs/agent-work/ER-30-global-library-projects-and-scope-snapshots.md
          packages/domain/src/project-membership.test.ts
          packages/domain/src/project-membership.ts
          packages/domain/src/scope.ts
          PATHS
          sort "$RUNNER_TEMP/expected-payload-paths" -o "$RUNNER_TEMP/expected-payload-paths"
          diff -u "$RUNNER_TEMP/expected-payload-paths" "$RUNNER_TEMP/actual-payload-paths"

          git reset --hard origin/main
          tar -xzf "$RUNNER_TEMP/er30-scope-snapshots.tar.gz" -C "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/apply-er30.py"
          test ! -e .github/admin-er30-payload
          test ! -e .github/workflows/admin-er30-apply-scope-snapshots.yml
          test ! -e .github/workflows/admin-er30-publish-clean.yml
          git diff --check
      - name: Install frozen dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify complete TypeScript and Cloudflare contour
        shell: bash
        run: |
          set -euo pipefail
          pnpm contracts:check
          pnpm boundaries:check
          pnpm boundaries:negative
          pnpm budgets:check
          pnpm work-packets:check
          pnpm branch-hygiene:check
          pnpm delivery:check
          pnpm ingest:check
          pnpm projection:check
          pnpm evidence:check
          pnpm erasure:check
          pnpm gemini:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:implementation-status
      - name: Publish clean commit as an immutable transfer tag
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 <<'PY'
          import subprocess
          expected = {
              "apps/eliotr-core/src/scope-service.test.ts",
              "apps/eliotr-core/src/scope-service.ts",
              "docs/agent-work/ER-30-global-library-projects-and-scope-snapshots.md",
              "docs/implementation/gap-register.md",
              "docs/implementation/implementation-status.json",
              "docs/implementation/implementation-status.md",
              "docs/implementation/production-readiness-plan.md",
              "packages/domain/src/project-membership.test.ts",
              "packages/domain/src/project-membership.ts",
              "packages/domain/src/scope.ts",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected staged paths: {sorted(actual ^ expected)}")
          PY
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "feat(scope): persist deterministic snapshots"
          transfer_tag="admin-er30-clean-$GITHUB_RUN_ID"
          git tag "$transfer_tag"
          git push origin "refs/tags/$transfer_tag"
          echo "ER30_CLEAN_COMMIT=$(git rev-parse HEAD)"
          echo "ER30_TRANSFER_TAG=$transfer_tag"
