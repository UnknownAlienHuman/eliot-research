name: er38-registry-authority-finalize

on:
  push:
    branches:
      - agent/ER-38-registry-authoritative-managed-generation-20260904

permissions:
  contents: write

concurrency:
  group: er38-registry-authority-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[er38-registry-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-38-registry-authoritative-managed-generation-20260904
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Compose projection execution with the authoritative registry
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/eliotr-core/src/projection-execution-handler.ts <<'TS'
          import {
            AI_SEARCH_PRIMARY_GENERATION,
            AI_SEARCH_PRIMARY_INSTANCE_ID,
            AI_SEARCH_PRIMARY_NAMESPACE,
            AI_SEARCH_PRIMARY_PROJECTION_PROFILE,
            assertImmutableAiSearchProfile,
            createAiSearchGenerationRegistryService,
            createD1AiSearchGenerationRegistryStore,
            type AiSearchGenerationRegistrySnapshot,
          } from "@eliotr/cloudflare-ai";
          import {
            createD1ProjectionAuthority,
            createD1ProjectionSearchPort,
            createManagedProjectionPort,
            createProjectionExecutionHandler as createExecutor,
            createR2ProjectionContentPort,
            createR2ProjectionWorkPort,
            type ProjectionAiSearchNamespace,
            type ProjectionExecutionProfile,
          } from "@eliotr/cloudflare-projection";
          import {
            createD1ExecutionLeaseStore,
            type DeliveryHandler,
          } from "@eliotr/platform-cloudflare";
          import type { Env } from "./env.js";

          export const PROJECTION_EXECUTION_PROFILE: ProjectionExecutionProfile =
            Object.freeze({
              projector_profile: "structural-markdown-v1",
              managed_instance_id: AI_SEARCH_PRIMARY_INSTANCE_ID,
              managed_generation: AI_SEARCH_PRIMARY_GENERATION,
              managed_generation_active: false,
              maximum_markdown_bytes: 4 * 1024 * 1024,
              maximum_synchronous_items: 64,
              target_item_utf8_bytes: 32 * 1024,
              maximum_item_utf8_bytes: 64 * 1024,
              managed_poll_interval_ms: 1_000,
              managed_timeout_ms: 30_000,
            });

          export function projectionManagedGenerationIsActive(
            snapshot: AiSearchGenerationRegistrySnapshot | null,
          ): boolean {
            if (snapshot === null) return false;
            const registry = snapshot.artifact.registry;
            if (
              registry.active_head_generation !==
              AI_SEARCH_PRIMARY_GENERATION
            ) {
              return false;
            }
            const active = registry.generations.find(
              (record) =>
                record.generation === AI_SEARCH_PRIMARY_GENERATION,
            );
            if (active?.state !== "ACTIVE") {
              throw new Error(
                "AI Search registry active head lacks its ACTIVE generation record",
              );
            }
            assertImmutableAiSearchProfile(
              active.profile,
              AI_SEARCH_PRIMARY_PROJECTION_PROFILE,
            );
            return true;
          }

          function projectionExecutor(
            env: Env,
            profile: ProjectionExecutionProfile,
          ) {
            return createExecutor({
              authority: createD1ProjectionAuthority({ database: env.CORE_DB }),
              content: createR2ProjectionContentPort({
                evidence_bucket: env.EVIDENCE_BUCKET,
              }),
              work: createR2ProjectionWorkPort({
                work_bucket: env.WORK_BUCKET,
              }),
              search: createD1ProjectionSearchPort(env.SEARCH_DB),
              managed: createManagedProjectionPort({
                namespace:
                  env.AI_SEARCH as unknown as ProjectionAiSearchNamespace,
                profile,
              }),
              leases: createD1ExecutionLeaseStore(env.CORE_DB),
              profile,
            });
          }

          // IMPLEMENTED_NOT_LIVE: ER-38 projection execution requires remote R2/D1 Search/AI Search receipts.
          export function createProjectionExecutionDeliveryHandler(
            env: Env,
          ): DeliveryHandler {
            const registry = createAiSearchGenerationRegistryService(
              createD1AiSearchGenerationRegistryStore(env.SEARCH_DB),
            );
            return async (message) => {
              const snapshot = await registry.read(
                AI_SEARCH_PRIMARY_NAMESPACE,
              );
              const profile: ProjectionExecutionProfile = Object.freeze({
                ...PROJECTION_EXECUTION_PROFILE,
                managed_generation_active:
                  projectionManagedGenerationIsActive(snapshot),
              });
              return projectionExecutor(env, profile).execute(message);
            };
          }
          TS

          python3 <<'PY'
          import json
          from pathlib import Path

          index = Path("packages/cloudflare-ai/src/index.ts")
          text = index.read_text(encoding="utf-8")
          export = 'export * from "./ai-search-primary-profile.js";\n'
          if export not in text:
              anchor = 'export * from "./ai-search-profile.js";\n'
              if text.count(anchor) != 1:
                  raise SystemExit("cloudflare-ai export anchor missing or ambiguous")
              text = text.replace(anchor, anchor + export)
              index.write_text(text, encoding="utf-8")

          package_path = Path("apps/eliotr-core/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          dependencies = package.setdefault("dependencies", {})
          dependencies["@eliotr/cloudflare-ai"] = "workspace:*"
          package["dependencies"] = dict(sorted(dependencies.items()))
          package_path.write_text(
              json.dumps(package, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          tsconfig_path = Path("apps/eliotr-core/tsconfig.json")
          tsconfig = json.loads(tsconfig_path.read_text(encoding="utf-8"))
          references = tsconfig.setdefault("references", [])
          cloudflare_ai = {"path": "../../packages/cloudflare-ai"}
          if cloudflare_ai not in references:
              references.append(cloudflare_ai)
              references.sort(key=lambda value: value["path"])
          tsconfig_path.write_text(
              json.dumps(tsconfig, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          env_path = Path("apps/eliotr-core/src/env.ts")
          env = env_path.read_text(encoding="utf-8")
          env = "\n".join(
              line for line in env.splitlines()
              if "AI_SEARCH_ACTIVE_GENERATION" not in line
          ) + "\n"
          env_path.write_text(env, encoding="utf-8")

          vars_path = Path("apps/eliotr-core/.dev.vars.example")
          if vars_path.exists():
              lines = vars_path.read_text(encoding="utf-8").splitlines()
              lines = [
                  line for line in lines
                  if "AI_SEARCH_ACTIVE_GENERATION" not in line
                  and "Keep UNQUALIFIED until T2/T3" not in line
              ]
              vars_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          test_path = Path("apps/eliotr-core/src/index.test.ts")
          test = test_path.read_text(encoding="utf-8")
          cloudflare_import = '''import {
            AI_SEARCH_PRIMARY_GENERATION,
            AI_SEARCH_PRIMARY_PROJECTION_PROFILE,
          } from "@eliotr/cloudflare-ai";
          '''
          handler_import = '''import {
            PROJECTION_EXECUTION_PROFILE,
            projectionManagedGenerationIsActive,
          } from "./projection-execution-handler.js";
          '''
          if cloudflare_import not in test:
              anchor = 'import { describe, expect, it } from "vitest";\n'
              if test.count(anchor) != 1:
                  raise SystemExit("index.test import anchor missing or ambiguous")
              test = test.replace(anchor, anchor + cloudflare_import)
          if handler_import not in test:
              anchor = 'import { handleHttp } from "./http.js";\n'
              if test.count(anchor) != 1:
                  raise SystemExit("projection handler import anchor missing or ambiguous")
              test = test.replace(anchor, anchor + handler_import)

          marker = 'describe("managed projection generation authority"'
          if marker not in test:
              test += '''

          describe("managed projection generation authority", () => {
            it("targets the primary g2 instance but keeps it shadow by default", () => {
              expect(PROJECTION_EXECUTION_PROFILE).toMatchObject({
                managed_instance_id: "private-prose-g2",
                managed_generation: AI_SEARCH_PRIMARY_GENERATION,
                managed_generation_active: false,
              });
            });

            it("requires the exact ACTIVE registry record before semantic readiness", () => {
              expect(projectionManagedGenerationIsActive(null)).toBe(false);
              expect(projectionManagedGenerationIsActive({
                artifact: {
                  registry: {
                    active_head_generation: "another-generation",
                    generations: [],
                  },
                },
              } as never)).toBe(false);
              expect(projectionManagedGenerationIsActive({
                artifact: {
                  registry: {
                    active_head_generation: AI_SEARCH_PRIMARY_GENERATION,
                    generations: [{
                      generation: AI_SEARCH_PRIMARY_GENERATION,
                      state: "ACTIVE",
                      profile: AI_SEARCH_PRIMARY_PROJECTION_PROFILE,
                    }],
                  },
                },
              } as never)).toBe(true);
            });

            it("rejects an active-head record with a different immutable profile", () => {
              expect(() => projectionManagedGenerationIsActive({
                artifact: {
                  registry: {
                    active_head_generation: AI_SEARCH_PRIMARY_GENERATION,
                    generations: [{
                      generation: AI_SEARCH_PRIMARY_GENERATION,
                      state: "ACTIVE",
                      profile: {
                        ...AI_SEARCH_PRIMARY_PROJECTION_PROFILE,
                        embedding_model: "@cf/incompatible/model",
                      },
                    }],
                  },
                },
              } as never)).toThrow(/immutable desired profile/u);
            });
          });
          '''
          test_path.write_text(test, encoding="utf-8")

          status_path = Path("docs/implementation/implementation-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          entry = next(
              item for item in status["entries"]
              if item["path"] == "apps/eliotr-core/src/projection-execution-handler.ts"
          )
          entry["behavior"] = (
              "pinned LIVE SourceRevision bytes are deterministically projected, immutably "
              "materialized, activated in guarded D1 Search generations and uploaded to managed "
              "AI Search; semantic readiness requires exact item readback plus an exact ACTIVE "
              "primary-generation record from the SEARCH_DB generation registry, never an "
              "environment-variable promotion"
          )
          evidence = entry.setdefault("completion_evidence", [])
          proof = "SEARCH_DB active-head, absent-head and immutable-profile negative tests"
          if proof not in evidence:
              evidence.insert(1, proof)
          status_path.write_text(
              json.dumps(status, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          document_path = Path(
              "docs/agent-work/ER-38-governed-projection-generation-execution.md"
          )
          document = document_path.read_text(encoding="utf-8")
          heading = "## Active managed-generation authority"
          if heading not in document:
              document += '''

          ## Active managed-generation authority

          Projection execution targets the immutable primary g2 AI Search instance. The managed
          channel becomes `READY` only when the canonical SEARCH_DB generation registry names that
          exact generation as its active head and the retained ACTIVE record has the exact immutable
          profile. An absent registry, another active generation, or an unpromoted g2 record keeps the
          managed channel in shadow/degraded state. Environment variables cannot promote a generation.

          Registry composition is deterministic and `IMPLEMENTED_NOT_LIVE`. Remote D1 migration,
          AI Search indexing/readback, T2/T3 golden-set promotion and rollback receipts remain
          `NOT_EXECUTED`.
          '''
              document_path.write_text(document, encoding="utf-8")
          PY

          if grep -R "AI_SEARCH_ACTIVE_GENERATION" apps/eliotr-core --exclude-dir=dist --exclude-dir=.wrangler; then
            echo "environment promotion authority remains" >&2
            exit 1
          fi

          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --lockfile-only --ignore-scripts
          git rm -- .github/workflows/er38-registry-authority-finalize.yml
          git diff --check

      - name: Commit registry-authoritative composition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-38: make SEARCH_DB registry authoritative [er38-registry-finalized]"
          git push origin HEAD:agent/ER-38-registry-authoritative-managed-generation-20260904
