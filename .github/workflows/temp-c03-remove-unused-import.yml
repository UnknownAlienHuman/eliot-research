name: temp-c03-remove-unused-import
on:
  push:
    branches:
      - refactor/380-separate-workflow-object-bound
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Remove obsolete import and temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/eliotr-core/test/research-protocol-freeze.test.ts")
          text = path.read_text(encoding="utf-8")
          old = 'import { canonicalEvidenceJson, createNavigationReadAuthority, evidenceSha256 } from "@eliotr/cloudflare-evidence";'
          new = 'import { createNavigationReadAuthority, evidenceSha256 } from "@eliotr/cloudflare-evidence";'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one obsolete import")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/temp-c03-remove-unused-import.yml
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "test: remove obsolete C03 fixture import (#380)"
          git push origin HEAD:refactor/380-separate-workflow-object-bound
