name: apply-s99-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-s99-code.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Publish the reviewed production patch and remove this transporter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const blobHash = (bytes) => hash('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, {
              method,
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git API ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          const head = process.env.GITHUB_SHA;
          const baseTree = '93023b106d9c4b5ad743a80d6eaa75f70b75d601';
          const expectedTree = 'a721f491897d124159527391e62db61cdcf751c3';
          const transporter = '.github/workflows/apply-s99-code.yml';
          assert(text('branch', '--show-current') === 'main', 'Not on main');
          assert(text('rev-parse', 'HEAD') === head, 'Main advanced before checkout');
          const parentTree = text('rev-parse', 'HEAD^{tree}');
          git('rm', '--', transporter);
          assert(text('write-tree') === baseTree, 'Unexpected base contents');
          const blobSha = '9bd552807ce8e5bde3bfc99cf54dddfd555687bf';
          const blob = await api(`git/blobs/${blobSha}`);
          assert(blob.encoding === 'base64', 'Unexpected blob encoding');
          const wire = Buffer.from(blob.content, 'base64');
          assert(blobHash(wire) === blobSha, 'Transfer blob mismatch');
          // One identified transport typo; the intended blob and full patch hashes remain mandatory.
          const wireText = wire.toString('utf8');
          const typo = 'Gu6OrvOr5vPf5huwP6';
          assert(wireText.split(typo).length === 2, 'Unexpected wire repair target');
          const encoded = Buffer.from(wireText.replace(typo, 'Gu6OrvOr5vP5huwP6'), 'utf8');
          assert(blobHash(encoded) === '9079faa9fdb702d973bc8bbccdbaf8208a3fd7d2', 'Intended transfer blob mismatch');
          const patch = gunzipSync(Buffer.from(encoded.toString('utf8'), 'base64'));
          assert(hash('sha256', patch) === '76858c0f4d83a94c93b3f813c7e4af510c7edc02f269e7ce327b3dd0932dbcbc', 'Patch checksum mismatch');
          const patchPath = join(process.env.RUNNER_TEMP, 's99-code.patch');
          writeFileSync(patchPath, patch);
          git('apply', '--unidiff-zero', '--check', patchPath);
          git('apply', '--unidiff-zero', '--index', patchPath);
          git('diff', '--cached', '--check');
          git('diff', '--exit-code');
          assert(text('write-tree') === expectedTree, 'Reviewed code tree mismatch');
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          assert(paths.length === 18, 'Unexpected changed path count');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files', '--stage', '--', path);
            if (!index) {
              assert(path === transporter, 'Unexpected deletion');
              entries.push({ path, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const [mode, sha] = index.split(/\s+/);
            const data = git('cat-file', 'blob', sha);
            const created = await api('git/blobs', 'POST', { content: data.toString('base64'), encoding: 'base64' });
            assert(created.sha === sha, `Published blob mismatch: ${path}`);
            entries.push({ path, mode, type: 'blob', sha });
          }
          const tree = await api('git/trees', 'POST', { base_tree: parentTree, tree: entries });
          assert(tree.sha === expectedTree, 'Published tree mismatch');
          assert((await api('git/ref/heads/main')).object.sha === head, 'Concurrent main update; refusing publication');
          const message = 'feat: separate full Research scope from 64-source previews (S99)\n\nNew execution scopes use retrieval-scope-v2 with the existing 4096-member\nowner loader and the generic 1000-ID selection bound. Retain legacy v1\nprofiles, public ORIENT/query limits, 64 metadata previews and 16 results.\nBind/reconcile the profile before grants; replay preserves completed bytes.\n\nAdd forward migration 0071 with exact legacy-row copy and immutable guards.\nCarry recorded profiles through Workflow, trace, reports and Wiki readers.\nPage planning metadata and historical source witnesses in 64-member batches\nwith exact set/owner/purge checks; retain original historical revisions.\nReuse the existing exact-scope authorizer for Wiki proposals.\n\nPreserve S33 operation deadlines and all current byte envelopes. Large inline\nplanning manifests can still exceed the 64-KiB Workflow input; fail explicitly\nwith partition guidance, never truncate or claim full-scope evidence.\n\nProduction TypeScript, scoped lint, static boundaries/ownership/docs checks\nand the complete local SQL schema/view compilation pass. No behavioral\ntest runs or new test files; PR #291 remains open for later acceptance.\nNo deployment, remote database migration, paid calls or account changes.\nRestore the source exporter and remove this temporary code transporter.';
          const commit = await api('git/commits', 'POST', { message, tree: tree.sha, parents: [head] });
          await api('git/refs/heads/main', 'PATCH', { sha: commit.sha, force: false });
          assert((await api('git/ref/heads/main')).object.sha === commit.sha, 'Publication readback mismatch');
          console.log(`PUBLISHED_COMMIT=${commit.sha}\nPUBLISHED_TREE=${tree.sha}`);
          JS
