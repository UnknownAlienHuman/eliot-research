name: er00-work-packet-manifest-resync

on:
  push:
    branches:
      - agent/ER-00-work-packet-manifest-sync-20260903

permissions:
  contents: write

concurrency:
  group: er00-work-packet-manifest-resync
  cancel-in-progress: false

jobs:
  resync:
    if: ${{ !contains(github.event.head_commit.message, '[er00-manifest-resynced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-00-work-packet-manifest-sync-20260903
          fetch-depth: 0

      - name: Synchronize generated packet ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/agent-work/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("protocol") != "eliotr.agent-work.v1":
              raise SystemExit("unexpected work-packet protocol")
          if manifest.get("baseline_commit") != "413f843de32082535559b0a10fa2ba4c56f70fdc":
              raise SystemExit("unexpected work-packet baseline")

          desired = {
              "ER-13": [
                  "packages/platform-cloudflare/src/bindings.ts",
                  "packages/platform-cloudflare/src/d1.ts",
                  "packages/platform-cloudflare/src/d1-outbox-authority.ts",
                  "packages/platform-cloudflare/src/d1-outbox-authority.test.ts",
                  "packages/platform-cloudflare/src/d1-outbox-store.ts",
                  "packages/platform-cloudflare/src/d1-outbox-store.test.ts",
                  "packages/platform-cloudflare/src/d1-inbox-store.ts",
                  "packages/platform-cloudflare/src/d1-inbox-store.test.ts",
                  "packages/platform-cloudflare/src/execution-lease.ts",
                  "packages/platform-cloudflare/src/execution-lease.test.ts",
                  "packages/platform-cloudflare/src/index.ts",
                  "infra/d1/**",
                  "scripts/check-delivery-authority.mjs",
              ],
              "ER-14": [
                  "packages/platform-cloudflare/src/r2.ts",
                  "packages/platform-cloudflare/src/r2.test.ts",
                  "packages/platform-cloudflare/src/ingest.ts",
                  "packages/platform-cloudflare/src/ingest-types.ts",
                  "packages/platform-cloudflare/src/ingest-validation.ts",
                  "packages/platform-cloudflare/src/ingest-state.ts",
                  "packages/platform-cloudflare/src/ingest-storage.ts",
                  "packages/platform-cloudflare/src/ingest-multipart.ts",
                  "packages/platform-cloudflare/src/ingest-verification.ts",
                  "packages/platform-cloudflare/src/ingest-promotion.ts",
                  "packages/platform-cloudflare/src/ingest-test-fixture.ts",
                  "packages/platform-cloudflare/src/ingest.test.ts",
                  "packages/platform-cloudflare/src/ingest-resilience.test.ts",
                  "infra/r2/**",
              ],
              "ER-17": [
                  "packages/platform-cloudflare/src/access.ts",
                  "packages/platform-cloudflare/src/access.test.ts",
                  "packages/platform-cloudflare/src/observability.ts",
                  "packages/platform-cloudflare/src/observability.test.ts",
                  "packages/platform-cloudflare/src/runtime-limits.ts",
                  "packages/platform-cloudflare/src/runtime-limits.test.ts",
              ],
              "ER-24": [
                  "apps/eliotr-core/src/env.ts",
                  "apps/eliotr-core/src/index.ts",
                  "apps/eliotr-core/src/http.ts",
                  "apps/eliotr-core/src/composition-root.ts",
                  "apps/eliotr-core/src/queue.ts",
                  "apps/eliotr-core/src/scheduled.ts",
                  "apps/eliotr-core/src/projection-delivery-handler.ts",
                  "apps/eliotr-core/src/projection-delivery-handler.test.ts",
                  "apps/eliotr-core/src/readiness.ts",
                  "apps/eliotr-core/src/research-session.ts",
                  "apps/eliotr-core/src/index.test.ts",
                  "apps/eliotr-core/wrangler.jsonc",
              ],
              "ER-28": [
                  "packages/platform-cloudflare/src/erasure-backend.ts",
                  "packages/cloudflare-erasure/**",
                  "apps/eliotr-core/src/erasure-coordinator.ts",
                  "apps/eliotr-core/src/erasure-coordinator.test.ts",
                  "apps/eliotr-core/src/erasure-runtime.ts",
                  "apps/eliotr-core/src/erasure-runtime.test.ts",
                  "infra/erasure/**",
                  "scripts/check-erasure-closure.mjs",
              ],
              "ER-30": [
                  "packages/domain/src/scope.ts",
                  "packages/domain/src/project-membership.ts",
                  "packages/domain/src/project-membership.test.ts",
                  "apps/eliotr-core/src/scope-service.ts",
                  "apps/eliotr-core/src/scope-service.test.ts",
              ],
          }

          packets = {packet.get("id"): packet for packet in manifest.get("packets", [])}
          missing = sorted(set(desired) - set(packets))
          if missing:
              raise SystemExit(f"missing packets: {missing}")
          for packet_id, owned_paths in desired.items():
              packets[packet_id]["owned_paths"] = owned_paths

          manifest["baseline_commit"] = "d29265cd43394ac4d1a6237452bb92a7ed00d8b7"
          manifest["generated_at"] = "2026-09-04T02:08:00Z"
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git rm -- .github/workflows/er00-work-packet-manifest-resync.yml
          python3 -m json.tool docs/agent-work/manifest.json >/dev/null
          git diff --check

      - name: Commit synchronized scheduler metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-00: synchronize generated work-packet ownership [er00-manifest-resynced]"
          git push origin HEAD:agent/ER-00-work-packet-manifest-sync-20260903
