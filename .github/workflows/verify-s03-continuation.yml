name: verify-s03-continuation
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-s03-continuation.yml]
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - name: Restore exact reviewed tree and rotation regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/s03-result"
          python - <<'PY'
          import os, pathlib, subprocess, textwrap
          source = subprocess.check_output(['git','show','b654dfc154a6b5373e578699899367be76828e19:.github/workflows/verify-s03-continuation.yml'], text=True, encoding='utf-8')
          restore = source.split('      - name: Restore exact candidate and finite network contract correction\n',1)[1].split('        run: |\n',1)[1].split('      - name: Install frozen toolchain\n',1)[0]
          pathlib.Path(os.environ['RUNNER_TEMP'], 'restore-network.sh').write_text(textwrap.dedent(restore), encoding='utf-8', newline='\n')
          PY
          "$BASH" "$RUNNER_TEMP/restore-network.sh"
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == '74f8364d3f7f4e22a97f5da03f5f4aaa48ff8785'
          sha = '8669ecf92f7fdbdd0536c25a06603e19932bbb86'
          request = urllib.request.Request(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}", headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          data = base64.b64decode(result['content'])
          assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest() == sha
          patch = gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '356c374cd626b350a86f284bb8f15a5cceda6d643f6548f60395140e2174b334'
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 's03-rotation.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(path)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == 'cef0466ad1a982225eba1304c51259825134939b'
          PY
      - name: Install frozen toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
          node --version > "$RUNNER_TEMP/s03-result/versions.txt"
          pnpm --version >> "$RUNNER_TEMP/s03-result/versions.txt"
      - name: Strict regression and unchanged contract checks
        run: |
          set -euo pipefail
          node scripts/test-local-runtime.mjs | tee "$RUNNER_TEMP/s03-result/local-runtime.log"
          pnpm test:local-owner | tee "$RUNNER_TEMP/s03-result/local-owner.log"
          node --test tests/integration/browser/raw-file-browser.test.mjs | tee "$RUNNER_TEMP/s03-result/raw-tests.log"
          node --test --test-name-pattern 'L6 (?!real-browser)' tests/integration/browser/library.spec.ts | tee "$RUNNER_TEMP/s03-result/ledger-tests.log"
          node node_modules/eslint/bin/eslint.js scripts/lib/local-launch.mjs scripts/test-local-runtime.mjs apps/eliotr-pwa/src/research-run-panel.ts tests/integration/browser/assertion-diagnostic.mjs tests/integration/browser/raw-file-browser.mjs tests/integration/browser/raw-file-browser.test.mjs tests/integration/browser/owner-e2e.mjs tests/integration/browser/library.spec.ts
          node node_modules/typescript/bin/tsc -b --pretty false
          node node_modules/typescript/bin/tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          node scripts/check-boundaries.mjs
          node scripts/test-boundary-negative.mjs
          node scripts/check-work-packets.mjs
          node scripts/check-implementation-status.mjs
          node docs/contracts/generate.mjs --check
          git diff --cached --check
          git diff --exit-code
      - name: Actual browser and local Worker D1 R2 acceptance
        run: |
          set -euo pipefail
          pnpm test:owner-e2e | tee "$RUNNER_TEMP/s03-result/browser.log"
      - name: Store verified Git objects without publishing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const tree = text('write-tree');
          if (tree !== 'cef0466ad1a982225eba1304c51259825134939b') throw new Error('Tree identity changed');
          git('diff','--exit-code');
          const entries = [];
          for (const path of git('diff','--cached','--name-only','-z','HEAD').toString().split('\0').filter(Boolean)) {
            const index = text('ls-files','--stage','--',path);
            if (!index) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
            const [mode,sha] = index.split(/\s+/);
            const data = git('cat-file','blob',sha);
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json'},body:JSON.stringify({content:data.toString('base64'),encoding:'base64'})});
            if (!response.ok) throw new Error(`Git blob creation failed: ${response.status}`);
            if ((await response.json()).sha !== sha) throw new Error('Blob identity changed');
            entries.push({path,mode,type:'blob',sha});
          }
          writeFileSync(join(process.env.RUNNER_TEMP,'s03-result','verified-tree.json'),JSON.stringify({base_sha:process.env.GITHUB_SHA,base_tree_sha:text('rev-parse','HEAD^{tree}'),tree_sha:tree,ref_updated:false,entries},null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s03-final-${{ matrix.os }}
          path: ${{ runner.temp }}/s03-result/
          if-no-files-found: error
          retention-days: 3
