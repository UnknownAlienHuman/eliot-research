name: branch-repair

on:
  push:
    branches:
      - agent/gemini-spark-mcp-20260830

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-spark-mcp-20260830
      - name: Apply exact source repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_one(
              "apps/eliotr-core/src/gemini-mcp-tools.ts",
              "  type GeminiMcpToolDependencies,\n  type GoogleExternalTransport,\n",
              "  type GeminiMcpToolDependencies,\n",
          )
          replace_one(
              "integrations/gemini-spark/setup.mjs",
              "    throw new Error(`${path} is not valid JSON: ${error.message}`);",
              "    throw new Error(`${path} is not valid JSON: ${error.message}`, { cause: error });",
          )
          replace_one(
              "packages/contracts/src/library.ts",
              "  JsonObjectSchema,\n  PositiveIntegerSchema,\n  Sha256Schema,",
              "  JsonObjectSchema,\n  Sha256Schema,",
          )
          replace_one(
              "packages/platform-cloudflare/src/d1-outbox-store.ts",
              "  type OutboxLease,\n  type OutboxStore,\n  type QueueSendReceipt,\n",
              "  type OutboxLease,\n  type OutboxStore,\n",
          )
          replace_one(
              "packages/platform-cloudflare/src/ingest.ts",
              "  parseSession,\n  promotionKey,\n  publicSession,",
              "  parseSession,\n  publicSession,",
          )
          replace_one(
              "packages/retrieval/src/planner.ts",
              "export function rerankingMayAffectCoverage(plan: QueryPlan): false {",
              "export function rerankingMayAffectCoverage(_plan: QueryPlan): false {",
          )
          replace_one(
              "scripts/check-work-packets.mjs",
              "  let names = [];\n  try {",
              "  let names;\n  try {",
          )
          replace_one(
              "scripts/provision-ai-search.mjs",
              "let namespace = await request(\"GET\", namespacePath, undefined, true);",
              "const namespace = await request(\"GET\", namespacePath, undefined, true);",
          )
          replace_one(
              "scripts/provision-ai-search.mjs",
              "  namespace = await request(\"POST\", `/accounts/${enc(accountId)}/ai-search/namespaces`, {",
              "  await request(\"POST\", `/accounts/${enc(accountId)}/ai-search/namespaces`, {",
          )
          replace_one(
              "scripts/provision-ai-search.mjs",
              "    existing = await request(\"POST\", `${namespacePath}/instances`, spec.create);",
              "    await request(\"POST\", `${namespacePath}/instances`, spec.create);",
          )
          replace_one(
              "scripts/provision-cloudflare-core.mjs",
              "    throw new Error(`${label} must remain strict-JSON-compatible JSONC so the audited deploy generator can parse it without executing code: ${error.message}`);",
              "    throw new Error(`${label} must remain strict-JSON-compatible JSONC so the audited deploy generator can parse it without executing code: ${error.message}`, { cause: error });",
          )
          replace_one(
              "scripts/provision-cloudflare-core.mjs",
              '''function stable(value) {
            if (Array.isArray(value)) return value.map(stable);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.entries(value).sort(([a], [b]) => a.localeCompare(b)).map(([key, child]) => [key, stable(child)]));
            }
            return value;
          }

          function equal(left, right) {
            return JSON.stringify(stable(left)) === JSON.stringify(stable(right));
          }

          ''',
              "",
          )
          PY
      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: resolve repository lint blockers"
          git push origin HEAD:agent/gemini-spark-mcp-20260830
