name: Apply computer-agent connection registry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-computer-agent-registry.yml
      - .github/scripts/apply-computer-agent-registry.py

permissions:
  contents: write

concurrency:
  group: apply-computer-agent-registry
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply reviewed registry source
        run: |
          python -m py_compile .github/scripts/apply-computer-agent-registry.py
          python .github/scripts/apply-computer-agent-registry.py
      - name: Static, compile and D1 checks
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          routes = Path("packages/interfaces/src/routes.ts").read_text()
          pairs = re.findall(r'\{ method: "([A-Z]+)", path: "([^"]+)"', routes)
          assert len(pairs) == len(set(pairs))
          assert routes.count("system.computer-agents.") == 3
          for operation in ("pull", "progress", "result", "status"):
              line = next(value for value in routes.splitlines() if f'research.agent-task.{operation}' in value)
              assert 'auth: "service"' in line

          migration = Path("infra/d1/core/migrations/0087_computer_agent_connections.sql").read_text()
          assert "computer-agent-connection-v1" in migration
          assert "COMPUTER_AGENT_CONNECTION_IDENTITY_CONFLICT" in migration
          assert "MCP_WRITE','WEB_INBOX" in migration
          store = Path("apps/eliotr-core/src/computer-agent-connection-store.ts").read_text()
          assert "requireComputerAgentConnectionForTask" in store
          assert 'connection.actor.issuer !== grant.grantee.issuer' in Path(
              "apps/eliotr-core/src/mcp-external-agent-task.ts").read_text()
          assert '"WEB_INBOX"' in Path("apps/eliotr-core/src/agent-task-http.ts").read_text()
          assert '"MCP_WRITE"' in Path("apps/eliotr-core/src/mcp-research-service.ts").read_text()

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=AM"], text=True,
          ).splitlines()
          for name in changed:
              path = Path(name)
              if path.suffix not in {".ts", ".tsx", ".js", ".mjs"} or "/src/" not in f"/{name}":
                  continue
              current = len(path.read_text(encoding="utf-8").splitlines())
              old = subprocess.run(["git", "show", f"HEAD:{name}"], text=True, capture_output=True)
              if old.returncode != 0:
                  assert current <= 600, f"new source exceeds 600 lines: {name} ({current})"
              elif len(old.stdout.splitlines()) <= 600:
                  assert current <= 600, f"changed source created a new violation: {name} ({current})"
          print("COMPUTER_AGENT_REGISTRY_STATIC_OK")
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/contracts --filter @eliotr/interfaces --filter @eliotr/core typecheck
          pnpm d1:depth
          python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.executescript("CREATE TABLE schema_state(key TEXT PRIMARY KEY,value TEXT NOT NULL,updated_at TEXT NOT NULL) STRICT;")
          db.executescript(Path("infra/d1/core/migrations/0087_computer_agent_connections.sql").read_text())

          def canonical(value):
              return json.dumps(value, separators=(",", ":"), sort_keys=True)

          actor = {"issuer":"https://team.cloudflareaccess.com","authentication_method":"service_token",
                   "subject":"dot-client.access"}
          record = {"protocol":"eliotr.computer-agent-connection.v1","connection_id":"dot-primary",
                    "revision":1,"owner_principal_ref":"owner-1","state":"ENABLED",
                    "display_name":"Dot primary","contour":"OPENAI_DOT","actor":actor,
                    "transport_capabilities":["WEB_INBOX"],"computer_capabilities":["CLOUD_BROWSER"],
                    "task_kinds":["RESEARCH_BRANCH_ANALYSIS"],
                    "created_at":"2026-09-30T20:00:00.000Z","updated_at":"2026-09-30T20:00:00.000Z"}
          text = canonical(record); digest = hashlib.sha256(text.encode()).hexdigest()
          db.execute("INSERT INTO computer_agent_connection VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (
              "dot-primary",1,"owner-1",actor["issuer"],"service_token",actor["subject"],"ENABLED",
              "Dot primary","OPENAI_DOT",canonical(["WEB_INBOX"]),canonical(["CLOUD_BROWSER"]),
              canonical(["RESEARCH_BRANCH_ANALYSIS"]),"put-1","0"*64,text,digest,
              record["created_at"],record["updated_at"]))
          row = db.execute("SELECT state,contour FROM computer_agent_connection_current WHERE connection_id='dot-primary'").fetchone()
          assert row == ("ENABLED","OPENAI_DOT")

          duplicate = dict(record); duplicate["connection_id"] = "dot-other"
          duplicate_text = canonical(duplicate)
          try:
              db.execute("INSERT INTO computer_agent_connection VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (
                  "dot-other",1,"owner-1",actor["issuer"],"service_token",actor["subject"],"ENABLED",
                  "Dot other","OPENAI_DOT",canonical(["WEB_INBOX"]),canonical([]),
                  canonical(["RESEARCH_BRANCH_ANALYSIS"]),"put-2","1"*64,duplicate_text,
                  hashlib.sha256(duplicate_text.encode()).hexdigest(),record["created_at"],record["updated_at"]))
              raise AssertionError("duplicate actor was accepted")
          except sqlite3.IntegrityError as error:
              assert "COMPUTER_AGENT_CONNECTION_IDENTITY_CONFLICT" in str(error)

          disabled = dict(record); disabled.update(revision=2,state="DISABLED",updated_at="2026-09-30T20:01:00.000Z")
          disabled_text = canonical(disabled)
          db.execute("INSERT INTO computer_agent_connection VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (
              "dot-primary",2,"owner-1",actor["issuer"],"service_token",actor["subject"],"DISABLED",
              "Dot primary","OPENAI_DOT",canonical(["WEB_INBOX"]),canonical(["CLOUD_BROWSER"]),
              canonical(["RESEARCH_BRANCH_ANALYSIS"]),"disable-1","2"*64,disabled_text,
              hashlib.sha256(disabled_text.encode()).hexdigest(),record["created_at"],disabled["updated_at"]))
          assert db.execute("SELECT state,revision FROM computer_agent_connection_current WHERE connection_id='dot-primary'").fetchone() == ("DISABLED",2)
          assert db.execute("SELECT value FROM schema_state WHERE key='computer_agent_connection_generation'").fetchone()[0] == "computer-agent-connection-v1"
          print("COMPUTER_AGENT_REGISTRY_SQL_OK")
          PY
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/registry-budget-report.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/registry-budget-report.txt"
          BUDGET_REPORT="$RUNNER_TEMP/registry-budget-report.txt" python - <<'PY'
          from pathlib import Path
          import os

          report = Path(os.environ["BUDGET_REPORT"]).read_text()
          if "Source budgets: PASS" in report:
              print("COMPUTER_AGENT_REGISTRY_GLOBAL_BUDGETS_PASS")
              raise SystemExit(0)
          known = {
              "packages/cloudflare-ai/src/dynamic-route-qualification.ts",
              "packages/cloudflare-ai/src/dynamic-route-rest-codec.ts",
              "packages/cloudflare-ai/src/model-gateway-response.ts",
              "packages/cloudflare-ai",
              "packages/cloudflare-artifacts/src/artifact-draft-reader-core.ts",
              "packages/cloudflare-research/src/research-owner-qualification-renewal.ts",
              "packages/cloudflare-research/src/research-report-admission.ts",
              "packages/cloudflare-research",
              "packages/cloudflare-research-stages/src/research-claim-audit-input.ts",
              "apps/eliotr-core/src/http.ts",
              "apps/eliotr-core/src/research-semantic-composition.ts",
              "apps/eliotr-core/src/wiki-publication-store.ts",
              "apps/eliotr-core",
              "Worker source",
              "apps/eliotr-pwa",
          }
          observed = set()
          for line in report.splitlines():
              if " has " in line and (" lines (max " in line or " source lines (max " in line):
                  observed.add(line.split(" has ", 1)[0])
              elif line.startswith("Worker source is "):
                  observed.add("Worker source")
          unknown = observed - known
          if unknown:
              raise SystemExit(f"registry introduced new source-budget violations: {sorted(unknown)}")
          if not observed:
              raise SystemExit("unrecognized source-budget report")
          print(f"COMPUTER_AGENT_REGISTRY_SCOPED_BUDGET_OK known_debt={len(observed)} new_violations=0")
          PY
      - name: Commit verified registry
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-computer-agent-registry.yml \
            .github/scripts/apply-computer-agent-registry.py
          git diff --check
          git add \
            infra/d1/core/migrations/0087_computer_agent_connections.sql \
            packages/contracts/src/computer-agent-connection.ts \
            packages/contracts/src/index.ts \
            apps/eliotr-core/src/computer-agent-connection-store.ts \
            apps/eliotr-core/src/computer-agent-connection-http.ts \
            apps/eliotr-core/src/agent-task-http.ts \
            apps/eliotr-core/src/mcp-external-agent-task.ts \
            apps/eliotr-core/src/mcp-research-service.ts \
            apps/eliotr-core/src/http-special-routes.ts \
            packages/interfaces/src/routes.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/adr/0008-computer-agent-web-inbox.md \
            docs/implementation/computer-agent-web-inbox.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: register computer-agent connections' \
            -m 'Bind Spark, Muse, Dot and later computer agents to exact Access service actors and owner-declared transport, computer and task capabilities. Require an enabled matching registry revision before MCP-write or web-inbox task access. Keep v8 tasks on the originating exact grant; project routing and failover remain separate. Refs #301.'
          git push origin HEAD:main
