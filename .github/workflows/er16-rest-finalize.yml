name: er16-rest-finalize

on:
  push:
    branches:
      - agent/ER-16-dynamic-route-rest-control-plane-20260903

permissions:
  contents: write

concurrency:
  group: er16-rest-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[er16-rest-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-16-dynamic-route-rest-control-plane-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Bind public exports and packet documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          index_path = Path("packages/cloudflare-ai/src/index.ts")
          index = index_path.read_text(encoding="utf-8").rstrip()
          exports = [
              'export * from "./dynamic-route-rest-contract.js";',
              'export * from "./dynamic-route-rest-control-plane.js";',
          ]
          for statement in exports:
              if statement not in index:
                  index += "\n" + statement
          index_path.write_text(index + "\n", encoding="utf-8")

          packet_path = Path(
              "docs/agent-work/ER-16-ai-search-and-model-gateway-adapters.md"
          )
          packet = packet_path.read_text(encoding="utf-8").rstrip()
          heading = "## Active implementation slice — Cloudflare Dynamic Routing REST control plane"
          if heading not in packet:
              packet += """

## Active implementation slice — Cloudflare Dynamic Routing REST control plane

This slice binds the existing pure Dynamic Route provisioner to the current Cloudflare control-plane
API:

- `GET|POST /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/routes`;
- `GET /.../routes/{route_id}`;
- `POST /.../routes/{route_id}/deployments`;
- `GET /.../routes/{route_id}/deployments/{deployment_id}`.

The adapter fixes the API origin and the dedicated `eliotr-reasoning` gateway. Route creation sends the
complete immutable element array and receives its initial immutable version. A deployment is created only
when Cloudflare did not already activate that exact initial version. Success requires exact route,
version, deployment, definition-digest, immutable-binding, and binding-digest readback.

No mutation is retried after dispatch. Failures classify the possible effect as `NONE`, `ROUTE_CREATE`,
`DEPLOYMENT_CREATE`, or `BINDING_WRITE`. The adapter exposes no update or delete method and excludes API
credentials and provider response bodies from errors.

The binding store remains a port. Its authoritative D1 implementation, least-privilege API-token
qualification, operator reconciliation after partial provider mutation, promotion/rollback procedure,
and live route/version/deployment receipts remain open. Live Cloudflare operations are `NOT_EXECUTED`.
"""
          packet_path.write_text(packet + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify exact ER-16 REST boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm work-packets:check
          pnpm boundaries:check
          pnpm budgets:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run packages/cloudflare-ai/src/dynamic-route-rest-control-plane.test.ts
          pnpm exec vitest run packages/cloudflare-ai
          git diff --check

      - name: Commit verified adapter without workflow residue
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/er16-rest-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-16: implement Dynamic Route REST control plane [er16-rest-finalized]"
          git push origin HEAD:agent/ER-16-dynamic-route-rest-control-plane-20260903
