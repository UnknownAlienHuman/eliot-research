name: er00-branch-hygiene-materialize

on:
  push:
    branches:
      - agent/ER-00-branch-hygiene-closed-pr-cleanup-20260904

permissions:
  contents: write

concurrency:
  group: er00-branch-hygiene-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[branch-hygiene-materialized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-00-branch-hygiene-closed-pr-cleanup-20260904
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.23.0 --activate
      - name: Materialize and verify branch-hygiene repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/er00-branch-hygiene-materialize.py
          git restore --source=HEAD -- .github/workflows/branch-hygiene.yml
          git rm -- \
            .github/er00-branch-hygiene-materialize.py \
            .github/workflows/er00-branch-hygiene-materialize.yml
          pnpm install --frozen-lockfile
          node scripts/test-branch-hygiene.mjs
          pnpm work-packets:check
          pnpm lint
          pnpm typecheck
          git diff --check
      - name: Commit the product-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-00: delete closed PR branches before enforcing the ceiling [branch-hygiene-materialized]"
          git push origin HEAD:agent/ER-00-branch-hygiene-closed-pr-cleanup-20260904
