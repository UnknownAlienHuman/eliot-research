name: product-pipeline-finalizer-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-pipeline-finalizer-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: product-pipeline-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Cancel superseded product checkpoint runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths='[".github/workflows/wiki-product-once.yml",".github/workflows/research-changes-product-once.yml",".github/workflows/federation-product-once.yml",".github/workflows/lifecycle-reconcile-product-once.yml",".github/workflows/research-governed-stages-once.yml"]'
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\") and (.path as \$p | $paths | index(\$p))) | .id" \
            | while read -r run_id; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
              done
          sleep 15
          git fetch origin main '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard origin/main
          echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Recover executable checkpoint definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/product-workflows
          for name in \
            wiki-product-once.yml \
            research-changes-product-once.yml \
            federation-product-once.yml \
            lifecycle-reconcile-product-once.yml \
            research-governed-stages-once.yml; do
            path=".github/workflows/$name"
            if [ -f "$path" ]; then
              cp "$path" "/tmp/product-workflows/$name"
              continue
            fi
            commit="$(git rev-list --all -- "$path" | head -n1)"
            test -n "$commit"
            git show "$commit:$path" > "/tmp/product-workflows/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re

          def blocks(path: Path):
              lines = path.read_text(encoding='utf-8').splitlines()
              result = {}
              index = 0
              current_name = None
              while index < len(lines):
                  named = re.match(r'^\s*-\s+name:\s*(.+?)\s*$', lines[index])
                  if named:
                      current_name = named.group(1).strip('"\'')
                      index += 1
                      continue
                  run = re.match(r'^(\s*)run:\s*\|[-+]?\s*$', lines[index])
                  if run and current_name is not None:
                      base = len(run.group(1))
                      index += 1
                      body = []
                      while index < len(lines):
                          line = lines[index]
                          if line.strip() and len(line) - len(line.lstrip()) <= base:
                              break
                          body.append(line[base + 2:] if len(line) >= base + 2 else '')
                          index += 1
                      result[current_name] = '\n'.join(body).rstrip() + '\n'
                      continue
                  index += 1
              return result

          required = {
              'wiki-product-once.yml': ['Materialize and harden Wiki product slice'],
              'research-changes-product-once.yml': [
                  'Extract the retained changes implementation',
                  'Enforce changes-feed authority invariants',
              ],
              'federation-product-once.yml': [
                  'Select and extract a current-main-compatible federation checkpoint',
                  'Reject authority regressions before installing dependencies',
              ],
              'lifecycle-reconcile-product-once.yml': [
                  'Derive the exact outbox lease schema and implement reconciliation',
              ],
              'research-governed-stages-once.yml': [
                  'Fetch retained cognitive checkpoints',
                  'Extract only governed-stage implementation deltas',
                  'Enforce cognitive and evidence invariants',
              ],
          }
          output = Path('/tmp/product-steps')
          output.mkdir(exist_ok=True)
          for filename, names in required.items():
              available = blocks(Path('/tmp/product-workflows') / filename)
              for order, name in enumerate(names):
                  script = available.get(name)
                  if script is None:
                      raise SystemExit(f'{filename}: step not found: {name}')
                  if any(token in script.lower() for token in ('git push', 'git commit', 'astro build', 'qdrant')):
                      raise SystemExit(f'{filename}: forbidden effect in extracted step: {name}')
                  (output / f'{filename}-{order}.sh').write_text(
                      'set -euo pipefail\n' + script,
                      encoding='utf-8',
                  )
          PY
      - name: Finish Wiki only when still absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/eliotr-core/src/wiki-service.ts ] \
            || grep -q 'proposeWiki:.*unavailable' apps/eliotr-core/src/composition-root.ts; then
            bash /tmp/product-steps/wiki-product-once.yml-0.sh
          fi
      - name: Finish authenticated research changes only when still absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'changes:.*unavailable("research.changes")' apps/eliotr-core/src/composition-root.ts; then
            bash /tmp/product-steps/research-changes-product-once.yml-0.sh
            bash /tmp/product-steps/research-changes-product-once.yml-1.sh
          fi
      - name: Finish federation composition only when still absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'unavailable("federation.submit")' apps/eliotr-core/src/composition-root.ts; then
            git fetch origin '+refs/heads/*:refs/remotes/origin/*'
            bash /tmp/product-steps/federation-product-once.yml-0.sh
            bash /tmp/product-steps/federation-product-once.yml-1.sh
          fi
      - name: Finish bounded outbox reconciliation only when still fake
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'repaired: 0' apps/eliotr-core/src/composition-root.ts; then
            bash /tmp/product-steps/lifecycle-reconcile-product-once.yml-0.sh
          fi
      - name: Finish governed citation and coverage stages only when absent
        shell: bash
        run: |
          set -euo pipefail
          if ! git log --format=%s -n 200 | grep -qx 'feat: execute citation resolution and coverage stages'; then
            bash /tmp/product-steps/research-governed-stages-once.yml-0.sh
            bash /tmp/product-steps/research-governed-stages-once.yml-1.sh
            bash /tmp/product-steps/research-governed-stages-once.yml-2.sh
          fi
      - name: Remove all transient product generators
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/wiki-product-once.yml \
            .github/workflows/research-changes-product-once.yml \
            .github/workflows/federation-product-once.yml \
            .github/workflows/lifecycle-reconcile-product-once.yml \
            .github/workflows/research-governed-stages-once.yml \
            .github/workflows/repair-product-pipeline-once.yml \
            scripts/materialize-wiki-once.py \
            scripts/harden-wiki-once.py
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify the complete local backend product
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @eliotr/contracts test
          pnpm --filter @eliotr/domain test
          pnpm --filter @eliotr/policy test
          pnpm --filter @eliotr/retrieval test
          pnpm --filter @eliotr/research test
          if [ -d packages/cloudflare-research ]; then pnpm --filter @eliotr/cloudflare-research test; fi
          if [ -d packages/federation-api ]; then pnpm --filter @eliotr/federation-api test; fi
          if [ -d packages/cloudflare-federation ]; then pnpm --filter @eliotr/cloudflare-federation test; fi
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          pnpm docs:index:check
          pnpm rust:check
          git diff --check
      - name: Commit one verified backend checkpoint to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/product-pipeline-finalizer-once.yml
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No product delta remains after verification'
            exit 0
          fi
          git commit -m "feat: finalize locally verified research backend"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$PRODUCT_BASE_SHA"
          git push origin HEAD:main
