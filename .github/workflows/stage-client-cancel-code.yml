name: stage-client-cancel-code
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-client-cancel-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Stage reviewed source blobs without publishing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          const git = (...args) => execFileSync('git', args);
          const text = (...args) => git(...args).toString().trim();
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const blobHash = (bytes) => hash('sha1', Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]));
          const root = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${root}/${path}`, {
              method,
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git API ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          const baseTree = '03831d061f80b0b292960db1e4b89cea2bd6087d';
          const expectedTree = '04f71827bb15d6fd12e8684c884b70a667eeadef';
          const transporter = '.github/workflows/stage-client-cancel-code.yml';
          assert(text('branch', '--show-current') === 'main', 'Not on main');
          assert(text('rev-parse', 'HEAD') === process.env.GITHUB_SHA, 'Concurrent main change');
          const parentTree = text('rev-parse', 'HEAD^{tree}');
          git('rm', '--', transporter);
          assert(text('write-tree') === baseTree, 'Unexpected base contents');
          const shas = [
            'b2e8f470559d57228b8b7b69e5920be77d68290c',
            '6cb83d4d9b4b334e07fa4de3d48c54960363a02b',
            '6adbb4b18fd7a467a8ef33b30bb0c81f1354f483',
            'd47951bc774140a42217848b936706f3219db2bc',
            '172af91752ab575c028b1d59ee16ed0ce6538686',
            'bc5b5993516239ad27e03510f1b801d47816142f',
          ];
          const chunks = [];
          for (const sha of shas) {
            const blob = await api(`git/blobs/${sha}`);
            assert(blob.encoding === 'base64', 'Unexpected blob encoding');
            const bytes = Buffer.from(blob.content, 'base64');
            assert(blobHash(bytes) === sha, 'Transfer chunk mismatch');
            chunks.push(bytes.toString('utf8'));
          }
          const patch = gunzipSync(Buffer.from(chunks.join(''), 'base64'));
          assert(hash('sha256', patch) === '1d9919be175e1b7e361987df28a9e3e6e39b64a32c1b77f30f7f3ca35a8bbd42', 'Patch checksum mismatch');
          const patchPath = join(process.env.RUNNER_TEMP, 'client-cancel.patch');
          writeFileSync(patchPath, patch);
          git('apply', '--check', patchPath);
          git('apply', '--index', patchPath);
          git('diff', '--cached', '--check');
          git('diff', '--exit-code');
          assert(text('write-tree') === expectedTree, 'Reviewed tree mismatch');
          const paths = git('diff', '--cached', '--name-only', '-z', 'HEAD').toString().split('\0').filter(Boolean);
          assert(paths.length === 15, 'Unexpected changed path count');
          const entries = [];
          for (const path of paths) {
            const index = text('ls-files', '--stage', '--', path);
            if (!index) {
              assert(path === transporter, 'Unexpected deletion');
              entries.push({ path, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const [mode, sha] = index.split(/\s+/);
            assert(mode === '100644', 'Unexpected file mode');
            const bytes = git('cat-file', 'blob', sha);
            const created = await api('git/blobs', 'POST', { content: bytes.toString('base64'), encoding: 'base64' });
            assert(created.sha === sha, `Published blob mismatch: ${path}`);
            entries.push({ path, mode, type: 'blob', sha });
          }
          mkdirSync('publication-manifest');
          writeFileSync('publication-manifest/manifest.json', JSON.stringify({
            base_commit: process.env.GITHUB_SHA, parent_tree: parentTree, original_tree: baseTree,
            reviewed_tree: expectedTree, patch_sha256: hash('sha256', patch), entries,
          }, null, 2));
          console.log(`STAGED_TREE=${expectedTree}; source blobs only, no ref update`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-cancel-code-manifest
          path: publication-manifest/
          retention-days: 3
          if-no-files-found: error
