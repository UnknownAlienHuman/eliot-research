name: temp-apply-lightweight-wiki
on:
  push:
    branches:
      - refactor/380-lightweight-wiki-owner-reads
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply checked patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/temp-export-lightweight-wiki.yml
          git apply --check --whitespace=error-all .github/refactor-380-lightweight-wiki.patch
          git apply --whitespace=error-all .github/refactor-380-lightweight-wiki.patch
          rm .github/refactor-380-lightweight-wiki.patch
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "refactor: make Wiki owner reads direct (#380)"
          git push origin HEAD:refactor/380-lightweight-wiki-owner-reads
