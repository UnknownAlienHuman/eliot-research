name: temp-audit-freshness-response-bound
on:
  push:
    branches:
      - audit/380-freshness-response-bound
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply contract repair and compile repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/audit-380-freshness-response-bound.py')
          text = path.read_text(encoding='utf-8')
          old = '''# Typed fixtures most frequently reused by the current React path.
          for path in (
              "apps/eliotr-web/src/app/InboxStudioSelectionRegression.stories.tsx",
              "apps/eliotr-web/src/query/studio.test.ts",
          ):
              replace(path,
                  'source_freshness: { state: "CURRENT_REVISIONS", checked_at: stamp, changed_sources: [] },',
                  'source_freshness: { state: "CURRENT_REVISIONS", checked_at: stamp, changed_source_count: 0, changed_sources_truncated: false, changed_sources: [] },')
          '''
          new = '''# Typed fixtures most frequently reused by the current React path.
          replace(
              "apps/eliotr-web/src/app/InboxStudioSelectionRegression.stories.tsx",
              'source_freshness: { state: "CURRENT_REVISIONS", checked_at: stamp, changed_sources: [] },',
              'source_freshness: { state: "CURRENT_REVISIONS", checked_at: stamp, changed_source_count: 0, changed_sources_truncated: false, changed_sources: [] },',
          )
          replace(
              "apps/eliotr-web/src/query/studio.test.ts",
              "source_freshness: { state: 'UNKNOWN', changed_sources: [] },",
              "source_freshness: { state: 'UNKNOWN', changed_source_count: 0, changed_sources_truncated: false, changed_sources: [] },",
          )
          '''
          if text.count(old) != 1:
              raise SystemExit('typed fixture rewrite block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python .github/audit-380-freshness-response-bound.py
          rm .github/audit-380-freshness-response-bound.py \
            .github/workflows/temp-audit-freshness-response-bound.yml
          git diff --check
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "fix: bound source freshness detail responses (#380)"
          git push origin HEAD:audit/380-freshness-response-bound