name: er13-search-registry-schema-sync

on:
  push:
    branches:
      - agent/ER-13-search-registry-schema-20260903

permissions:
  contents: write

concurrency:
  group: er13-search-registry-schema-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[er13-schema-synced]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ER-13-search-registry-schema-20260903
          fetch-depth: 0

      - name: Synchronize readiness fixtures and migration evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          old = "search-v3-erasure-invalidation"
          new = "search-v4-ai-search-generation-registry"

          index_test = Path("apps/eliotr-core/src/index.test.ts")
          text = index_test.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("unexpected index.test search generation occurrences")
          index_test.write_text(text.replace(old, new), encoding="utf-8")

          check = Path("scripts/check-erasure-closure.mjs")
          text = check.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("unexpected erasure check search generation occurrences")
          text = text.replace(old, new)

          strict_anchor = """for (const table of [
            \"erasure_execution\", \"erasure_dependency_registry\", \"erasure_hold\", \"erasure_target\",
            \"erasure_stage_receipt\", \"erasure_dependent_invalidation\", \"backup_purge_obligation\",
            \"erasure_terminal_guard\",
          ]) assert.equal(strict.get(table), 1, `${table} must be STRICT`);

          const now = \"2026-09-01T02:00:00.000Z\";
          """
          strict_replacement = """for (const table of [
            \"erasure_execution\", \"erasure_dependency_registry\", \"erasure_hold\", \"erasure_target\",
            \"erasure_stage_receipt\", \"erasure_dependent_invalidation\", \"backup_purge_obligation\",
            \"erasure_terminal_guard\",
          ]) assert.equal(strict.get(table), 1, `${table} must be STRICT`);
          const searchStrict = new Map(
            search.prepare(\"PRAGMA table_list\").all().map((row) => [row.name, row.strict]),
          );
          assert.equal(searchStrict.get(\"ai_search_generation_registry\"), 1,
            \"AI Search generation registry must be STRICT\");

          const now = \"2026-09-01T02:00:00.000Z\";
          """
          if text.count(strict_anchor) != 1:
              raise SystemExit("strict-table insertion anchor missing or ambiguous")
          text = text.replace(strict_anchor, strict_replacement)

          sha_anchor = """const sha = (value) => value.repeat(64);
          const requestJson = JSON.stringify({
          """
          sha_replacement = """const sha = (value) => value.repeat(64);
          const registryArtifact = {
            schema: \"eliotr.ai-search-generation-registry.v1\",
            namespace: \"eliotr-managed-search\",
            revision: 1,
            registry: { active_head_generation: null, generations: [] },
          };
          const insertRegistry = search.prepare(
            \"INSERT INTO ai_search_generation_registry(namespace,revision,artifact_sha256,\" +
            \"artifact_json) VALUES (?,?,?,?)\",
          );
          insertRegistry.run(
            registryArtifact.namespace,
            registryArtifact.revision,
            sha(\"b\"),
            JSON.stringify(registryArtifact),
          );
          assert.equal(search.prepare(
            \"SELECT revision FROM ai_search_generation_registry WHERE namespace=?\",
          ).get(registryArtifact.namespace).revision, 1);
          assert.throws(() => insertRegistry.run(
            \"eliotr-foreign\", 1, sha(\"c\"),
            JSON.stringify({ ...registryArtifact, namespace: \"eliotr-other\" }),
          ), /CHECK constraint failed/u, \"registry row cannot bind another namespace\");
          assert.throws(() => insertRegistry.run(
            \"eliotr-revision-drift\", 2, sha(\"d\"),
            JSON.stringify({ ...registryArtifact, namespace: \"eliotr-revision-drift\" }),
          ), /CHECK constraint failed/u, \"registry row cannot bind another revision\");
          assert.throws(() => insertRegistry.run(
            \"eliotr-uppercase-digest\", 1, sha(\"A\"),
            JSON.stringify({ ...registryArtifact, namespace: \"eliotr-uppercase-digest\" }),
          ), /CHECK constraint failed/u, \"registry digest must be lowercase SHA-256\");
          const oversizedRegistry = {
            ...registryArtifact,
            namespace: \"eliotr-oversized\",
            padding: \"x\".repeat(262_144),
          };
          assert.throws(() => insertRegistry.run(
            oversizedRegistry.namespace, 1, sha(\"e\"), JSON.stringify(oversizedRegistry),
          ), /CHECK constraint failed/u, \"registry artifact must fit the 256 KiB envelope\");

          const requestJson = JSON.stringify({
          """
          if text.count(sha_anchor) != 1:
              raise SystemExit("registry-evidence insertion anchor missing or ambiguous")
          text = text.replace(sha_anchor, sha_replacement)
          check.write_text(text, encoding="utf-8")
          PY
          git rm -- .github/workflows/er13-search-registry-schema-sync.yml
          git diff --check

      - name: Commit synchronized schema consumers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ER-13: synchronize search registry schema consumers [er13-schema-synced]"
          git push origin HEAD:agent/ER-13-search-registry-schema-20260903
