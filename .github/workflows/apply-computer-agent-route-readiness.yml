name: Apply computer-agent route readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-computer-agent-route-readiness.yml
      - .github/scripts/apply-computer-agent-route-readiness.py

permissions:
  contents: write

concurrency:
  group: apply-computer-agent-route-readiness
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply reviewed readiness source
        run: |
          python -m py_compile .github/scripts/apply-computer-agent-route-readiness.py
          python .github/scripts/apply-computer-agent-route-readiness.py
      - name: Static, compile and focused contract checks
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          routes = Path('packages/interfaces/src/routes.ts').read_text()
          pairs = re.findall(r'\{ method: "([A-Z]+)", path: "([^"]+)"', routes)
          assert len(pairs) == len(set(pairs))
          assert routes.count('research.computer-agent-routes.readiness') == 1
          readiness = Path('apps/eliotr-core/src/computer-agent-route-readiness.ts').read_text()
          for marker in (
              'ProjectComputerAgentRouteReadinessSchema.parse',
              'readComputerAgentQualificationStatusForConnection',
              'qualification.deployment_generation !== input.deployment_generation',
              'entries.find((entry) => entry.eligible)',
          ):
              assert marker in readiness
          assert 'preferred_ready_connection' in readiness
          assert 'automatic' not in readiness.lower()
          contract = Path('packages/contracts/src/computer-agent-route.ts').read_text()
          assert 'ProjectComputerAgentRouteReadinessSchema' in contract
          assert 'UNQUALIFIED' in contract

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=AM'], text=True,
          ).splitlines()
          for name in changed:
              path = Path(name)
              if path.suffix not in {'.ts', '.tsx', '.js', '.mjs'} or '/src/' not in f'/{name}':
                  continue
              current = len(path.read_text(encoding='utf-8').splitlines())
              old = subprocess.run(['git', 'show', f'HEAD:{name}'], text=True, capture_output=True)
              if old.returncode != 0:
                  assert current <= 600, f'new source exceeds 600 lines: {name} ({current})'
              elif len(old.stdout.splitlines()) <= 600:
                  assert current <= 600, f'changed source created a new violation: {name} ({current})'
          print('COMPUTER_AGENT_ROUTE_READINESS_STATIC_OK')
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/contracts --filter @eliotr/interfaces --filter @eliotr/core typecheck
          node --input-type=module <<'JS'
          import {
            ProjectComputerAgentRouteReadinessSchema,
          } from './packages/contracts/dist/computer-agent-route.js';

          const qualification = (connection, status, deployment = 'deploy-1') => ({
            protocol: 'eliotr.computer-agent-qualification-status.v1',
            status,
            connection_id: connection,
            connection_revision: 1,
            transport: 'WEB_INBOX',
            challenge_id: `challenge-${connection}`,
            issued_at: '2026-09-30T20:00:00.000Z',
            expires_at: '2026-09-30T20:05:00.000Z',
            deployment_generation: deployment,
            ...(status === 'READY' ? {
              observation_ref: `observation-${connection}`,
              observed_at: '2026-09-30T20:01:00.000Z',
              ready_until: '2026-10-01T20:01:00.000Z',
              verified_credential_generation: `generation-${connection}`,
            } : {}),
          });
          const entries = [
            {
              priority: 0, connection_id: 'spark', connection_revision: 1,
              display_name: 'Spark', contour: 'GEMINI_SPARK', transport: 'WEB_INBOX',
              connection_state: 'CURRENT', capability_state: 'SUPPORTED',
              qualification_state: 'UNQUALIFIED', qualification: null, eligible: false,
            },
            {
              priority: 1, connection_id: 'muse', connection_revision: 1,
              display_name: 'Muse', contour: 'META_MUSE', transport: 'WEB_INBOX',
              connection_state: 'CURRENT', capability_state: 'SUPPORTED',
              qualification_state: 'READY', qualification: qualification('muse', 'READY'), eligible: true,
            },
            {
              priority: 2, connection_id: 'dot', connection_revision: 1,
              display_name: 'Dot', contour: 'OPENAI_DOT', transport: 'WEB_INBOX',
              connection_state: 'STALE', capability_state: 'SUPPORTED',
              qualification_state: 'STALE', qualification: qualification('dot', 'READY', 'deploy-old'), eligible: false,
            },
          ];
          const report = {
            protocol: 'eliotr.project-computer-agent-route-readiness.v1',
            project_id: 'project-1', task_kind: 'RESEARCH_BRANCH_ANALYSIS', route_revision: 4,
            route_state: 'ACTIVE', strategy: 'ORIGINATING_MATCH', transport: 'WEB_INBOX',
            deployment_generation: 'deploy-1', observed_at: '2026-09-30T20:02:00.000Z', entries,
            preferred_ready_connection: { priority: 1, connection_id: 'muse', connection_revision: 1 },
          };
          ProjectComputerAgentRouteReadinessSchema.parse(report);
          let rejected = false;
          try {
            ProjectComputerAgentRouteReadinessSchema.parse({
              ...report,
              preferred_ready_connection: { priority: 2, connection_id: 'dot', connection_revision: 1 },
            });
          } catch { rejected = true; }
          if (!rejected) throw new Error('non-ready preferred entry was accepted');
          ProjectComputerAgentRouteReadinessSchema.parse({
            ...report, route_state: 'DISABLED',
            preferred_ready_connection: null,
          });
          console.log('COMPUTER_AGENT_ROUTE_READINESS_CONTRACT_OK');
          JS
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/readiness-budget-report.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/readiness-budget-report.txt"
          BUDGET_REPORT="$RUNNER_TEMP/readiness-budget-report.txt" python - <<'PY'
          from pathlib import Path
          import os

          report = Path(os.environ['BUDGET_REPORT']).read_text()
          if 'Source budgets: PASS' in report:
              print('COMPUTER_AGENT_ROUTE_READINESS_GLOBAL_BUDGETS_PASS')
              raise SystemExit(0)
          known = {
              'packages/cloudflare-ai/src/dynamic-route-qualification.ts',
              'packages/cloudflare-ai/src/dynamic-route-rest-codec.ts',
              'packages/cloudflare-ai/src/model-gateway-response.ts',
              'packages/cloudflare-ai',
              'packages/cloudflare-artifacts/src/artifact-draft-reader-core.ts',
              'packages/cloudflare-research/src/research-owner-qualification-renewal.ts',
              'packages/cloudflare-research/src/research-report-admission.ts',
              'packages/cloudflare-research',
              'packages/cloudflare-research-stages/src/research-claim-audit-input.ts',
              'apps/eliotr-core/src/http.ts',
              'apps/eliotr-core/src/research-semantic-composition.ts',
              'apps/eliotr-core/src/wiki-publication-store.ts',
              'apps/eliotr-core',
              'Worker source',
              'apps/eliotr-pwa',
          }
          observed = set()
          for line in report.splitlines():
              if ' has ' in line and (' lines (max ' in line or ' source lines (max ' in line):
                  observed.add(line.split(' has ', 1)[0])
              elif line.startswith('Worker source is '):
                  observed.add('Worker source')
          unknown = observed - known
          if unknown:
              raise SystemExit(f'readiness introduced new source-budget violations: {sorted(unknown)}')
          if not observed:
              raise SystemExit('unrecognized source-budget report')
          print(f'COMPUTER_AGENT_ROUTE_READINESS_SCOPED_BUDGET_OK known_debt={len(observed)} new_violations=0')
          PY
      - name: Commit verified readiness preview
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-computer-agent-route-readiness.yml \
            .github/scripts/apply-computer-agent-route-readiness.py
          git diff --check
          git add \
            packages/contracts/src/computer-agent-route.ts \
            apps/eliotr-core/src/computer-agent-qualification-store.ts \
            apps/eliotr-core/src/computer-agent-route-readiness.ts \
            apps/eliotr-core/src/computer-agent-route-http.ts \
            apps/eliotr-core/src/http-special-routes.ts \
            packages/interfaces/src/routes.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/adr/0008-computer-agent-web-inbox.md \
            docs/implementation/computer-agent-web-inbox.md \
            docs/implementation/muse-operator-runbook.md
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: preview computer-agent route readiness' \
            -m 'Combine ordered exact project routes with current connection capability and exact transport qualification, exposing the first READY entry as an owner-only observation. Do not dispatch, mutate, transfer a lease or authorize failover. Refs #301.'
          git push origin HEAD:main
