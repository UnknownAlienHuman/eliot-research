name: research-changes-recovery-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-changes-recovery-once.yml

permissions:
  contents: write

concurrency:
  group: eliot-main-product-write
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Fetch retained history
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Finish an interrupted Wiki checkpoint when present
        shell: bash
        run: |
          if test -f scripts/materialize-wiki-once.py && test ! -f apps/eliotr-core/src/wiki-service.ts; then
            if test -f scripts/harden-wiki-once.py; then
              python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/harden-wiki-once.py")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'commit_end = store.index("        ];", commit_start) + len("        ];")',
                  'batch_start = store.index("try { await database.batch(statements);", commit_start)\ncommit_end = store.rfind("\\n", commit_start, batch_start) + 1',
              ),
              (
                  'store = store[:commit_start] + statements + store[commit_end:]',
                  'store = store[:commit_start] + statements + "\\n" + store[commit_end:]',
              ),
              ("race_anchor = '''      expect(", "race_anchor = '''    expect("),
              (
                  ')\n        .toMatchObject({ code: "WIKI_HEAD_CONFLICT" });',
                  ')\n      .toMatchObject({ code: "WIKI_HEAD_CONFLICT" });',
              ),
          ]
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8", newline="\n")
          PY
              python3 scripts/materialize-wiki-once.py
              python3 scripts/harden-wiki-once.py
            else
              echo 'Interrupted Wiki checkpoint has no hardener' >&2
              exit 1
            fi
          fi
      - name: Recover accepted changes-feed implementation and producers
        run: |
          python3 scripts/recover-research-changes-once.py
          python3 scripts/repair-research-changes-contour-once.py
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify recovered product locally
        run: |
          pnpm --filter @eliotr/interfaces typecheck
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Record cursor-authority audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd()
          semantic = (root / 'packages/interfaces/src/semantic-api.ts').read_text(encoding='utf-8')
          http = (root / 'apps/eliotr-core/src/http.ts').read_text(encoding='utf-8')
          composition = (root / 'apps/eliotr-core/src/composition-root.ts').read_text(encoding='utf-8')
          files = []
          for base in (root / 'apps', root / 'packages'):
              for path in base.rglob('*.ts'):
                  if any(part in {'node_modules', 'dist'} for part in path.parts):
                      continue
                  text = path.read_text(encoding='utf-8')
                  if 'research.changes' in text or 'research_change' in text or 'ResearchChange' in text:
                      files.append((path, text))
          joined = '\n'.join(text for _, text in files)
          signature = re.search(r'changes\(([^\n]+)', semantic)
          audit = {
              'protocol': 'eliotr.research-changes-authority-audit.v1',
              'public_signature': None if signature is None else signature.group(0),
              'caller_supplied_allowed_scopes': bool(signature and re.search(r'allowedScopes|allowed_scopes', signature.group(0))),
              'cursor_hmac_present': bool(re.search(r'\bHMAC\b|subtle\.sign|subtle\.verify', joined)),
              'principal_bound': 'principal_ref' in joined,
              'client_class_bound': 'client_class' in joined,
              'credential_generation_bound': 'credential_generation' in joined,
              'deployment_generation_bound': 'deployment_generation' in joined,
              'expiry_bound': bool(re.search(r'expires_at|expiresAt', joined)),
              'production_composed': 'changes: () => unavailable("research.changes")' not in composition,
              'http_routed': 'research.changes' in http,
              'implementation_files': sorted(path.relative_to(root).as_posix() for path, _ in files),
          }
          target = root / 'infra/verification/research-changes-authority-audit.json'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(audit, indent=2) + '\n', encoding='utf-8', newline='\n')
          print(json.dumps(audit, indent=2))
          PY
      - name: Commit verified recovery to main
        run: |
          git rm .github/workflows/research-changes-recovery-once.yml
          git rm scripts/recover-research-changes-once.py scripts/repair-research-changes-contour-once.py
          rm -f .github/workflows/wiki-product-once.yml scripts/materialize-wiki-once.py scripts/harden-wiki-once.py
          git add -A
          git diff --cached --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git commit -m "feat: recover durable research changes feed"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:main
