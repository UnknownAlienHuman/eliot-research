name: stage-owner-machine-read
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-owner-machine-read.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'UnknownAlienHuman/eliot-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - name: Stage exact reviewed source blobs without publishing a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'UnknownAlienHuman/eliot-research'
          base = 'ab16f5d1b78196aa10072cd3a4ad5a9c3675eda8'
          tree = 'b4f843c57008fcdcf2312f94f6fed82e7be5dde5'
          patch_sha = 'e4959668d28dd5fd5bbac53ecd5a4f2912588b3141f3cec3c8fb94b86858effa'
          workflow = '.github/workflows/stage-owner-machine-read.yml'
          chunks = [
            ('8709e93a7f179b5661a91d454d136c34757bfc6f', '8709e93a7f179b5661a91d454d136c34757bfc6f'),
            ('5d63277c0099c5d57d178a7037bc48b658821609', '5d63277c0099c5d57d178a7037bc48b658821609'),
            ('fc3872542c7a611a7fa09688695fef327fccc4c0', 'fc3872542c7a611a7fa09688695fef327fccc4c0'),
            ('2f6c0f3bdadf770f9a6cc97b5a3496a4a2aca539', '36616e8a06240c45e8686b7c00907e6b9d68107b'),
            ('02ec543958004c1735a976922a76799858a3e8d3', '02ec543958004c1735a976922a76799858a3e8d3'),
            ('c576447878ccd07bab945dc7626a2125b5d4d848', 'c576447878ccd07bab945dc7626a2125b5d4d848'),
          ]
          paths = [
            'apps/eliotr-core/src/research-artifact-reauthorization-http.ts',
            'apps/eliotr-core/src/research-run-list.ts',
            'apps/eliotr-core/src/source-revision-freshness.ts',
            'docs/implementation/backend-delivery-plan.md',
            'docs/implementation/gap-register.md',
            'docs/implementation/implementation-status.json',
            'docs/implementation/workflow-checkpoints.md',
            'infra/d1/core/migrations/0079_owner_machine_artifact_reads.sql',
            'packages/cloudflare-artifacts/src/artifact-draft-read-authority.ts',
            'packages/cloudflare-artifacts/src/artifact-draft-reader-core.ts',
            'packages/cloudflare-navigation/src/owner-historical-scope.ts',
          ]
          def git(*args):
            return subprocess.check_output(['git', *args], text=True).strip()
          def blob_sha(data):
            return hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          def api(path, data=None):
            payload = None if data is None else json.dumps(data).encode()
            request = urllib.request.Request('https://api.github.com/repos/'+repo+path, data=payload,
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
              method='GET' if data is None else 'POST')
            with urllib.request.urlopen(request, timeout=30) as response:
              return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert git('branch', '--show-current') == 'main'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == base
          parts = []
          for index, (wire_sha, expected_sha) in enumerate(chunks):
            stored = api('/git/blobs/'+wire_sha)
            assert stored['encoding'] == 'base64'
            part = base64.b64decode(stored['content'])
            assert blob_sha(part) == wire_sha
            if index == 3:
              # Correct one identified wire-copy character under the ORIGINAL chunk hash.
              assert part.count(b'S2GGjsw00zi') == 1
              part = part.replace(b'S2GGjsw00zi', b'S2GGjsw0zi', 1)
            assert blob_sha(part) == expected_sha
            parts.append(part)
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == patch_sha
          subprocess.run(['git','apply','--check'], input=patch, check=True)
          subprocess.run(['git','apply','--index'], input=patch, check=True)
          assert sorted(git('diff','--cached','--name-only').splitlines()) == paths
          subprocess.run(['git','rm','--cached','--',workflow],check=True)
          assert git('write-tree') == tree
          entries = []
          for path in paths:
            data = pathlib.Path(path).read_bytes()
            expected = blob_sha(data)
            result = api('/git/blobs', {'encoding':'base64','content':base64.b64encode(data).decode()})
            assert result['sha'] == expected
            entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          out = pathlib.Path('/tmp/owner-machine-read-manifest')
          out.mkdir(parents=True,exist_ok=True)
          (out/'manifest.json').write_text(json.dumps({'base':base,'transport_parent':os.environ['GITHUB_SHA'],
            'tree':tree,'patch_sha256':patch_sha,'entries':entries},indent=2)+'\n')
          print('Staged 11 exact reviewed source blobs; no ref, deployment or database changed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-machine-read-manifest
          path: /tmp/owner-machine-read-manifest/
          retention-days: 3
          if-no-files-found: error
