name: Apply computer-agent dispatch reassignment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          check-latest: false
      - name: Apply reviewed product diff
        run: |
          set -euo pipefail
          BASE="200710f4ba64ab73e15518b0a956ea75a5c24796"
          STAGING_HEAD="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE" "$STAGING_HEAD"
          UNEXPECTED="$(git diff --name-only "$BASE..$STAGING_HEAD" -- . \
            ':(exclude).github/reassignment-payload/**' \
            ':(exclude).github/workflows/apply-computer-agent-reassignment.yml')"
          if [[ -n "$UNEXPECTED" ]]; then
            echo "unexpected non-staging paths:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi
          gzip -dc .github/reassignment-payload/apply.py.gz > /tmp/apply.py
          python -m py_compile /tmp/apply.py
          python /tmp/apply.py
          git diff --check
      - name: Compile and verify focused contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          required = {
              'infra/d1/core/migrations/0093_computer_agent_dispatch_reassignment.sql':
                  'computer-agent-dispatch-reassignment-v1',
              'packages/contracts/src/computer-agent-dispatch.ts':
                  'ComputerAgentDispatchReassignmentSchema',
              'apps/eliotr-core/src/computer-agent-dispatch-reassignment.ts':
                  'createComputerAgentDispatchReassignmentService',
              'apps/eliotr-core/src/computer-agent-dispatch-status.ts': 'reassignment',
              'packages/interfaces/src/routes.ts':
                  'research.computer-agent-dispatches.reassign',
          }
          for name, marker in required.items():
              text = Path(name).read_text(encoding='utf-8')
              if marker not in text:
                  raise SystemExit(f'{name}: required marker missing')
          routes = Path('packages/interfaces/src/routes.ts').read_text(encoding='utf-8')
          pairs = re.findall(r'\{ method: "([A-Z]+)", path: "([^"]+)"', routes)
          if len(pairs) != len(set(pairs)):
              raise SystemExit('duplicate method/path route')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=AM'], text=True,
          ).splitlines()
          for name in changed:
              path = Path(name)
              if path.suffix not in {'.ts', '.tsx', '.js', '.mjs'} or '/src/' not in f'/{name}':
                  continue
              current = len(path.read_text(encoding='utf-8').splitlines())
              old = subprocess.run(['git', 'show', f'HEAD:{name}'], text=True, capture_output=True)
              if old.returncode != 0:
                  if current > 600:
                      raise SystemExit(f'new source exceeds 600 lines: {name} ({current})')
              elif len(old.stdout.splitlines()) <= 600 and current > 600:
                  raise SystemExit(f'changed source created a new violation: {name} ({current})')
          print('COMPUTER_AGENT_REASSIGNMENT_STATIC_OK')
          PY
          npm install --global pnpm@11.23.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eliotr/contracts --filter @eliotr/interfaces --filter @eliotr/core typecheck
          node --input-type=module <<'JS'
          import {
            ComputerAgentDispatchReassignSchema,
            ComputerAgentDispatchReassignmentSchema,
            ComputerAgentDispatchStatusSchema,
          } from './packages/contracts/dist/computer-agent-dispatch.js';

          const sha = 'a'.repeat(64);
          const run = {
            query: 'What is the verified result?',
            product: 'RESEARCH',
            scope_expression: { kind: 'PROJECT', project_id: 'project-1' },
            literals: [], evidence_grade: 'E1', budget_ref: 'research-budget-v1',
            max_results: 4, request_version: 'eliotr.research-run-request.v2',
            inquiry_protocol_ref: { id: 'protocol-1', revision: 1 },
          };
          const actor = {
            issuer: 'https://fixture.cloudflareaccess.com',
            authentication_method: 'service_token', subject: 'agent-1.access',
          };
          const dispatch = {
            protocol: 'eliotr.computer-agent-dispatch.v1', dispatch_id: 'dispatch-old',
            project_id: 'project-1', task_kind: 'RESEARCH_BRANCH_ANALYSIS',
            transport: 'WEB_INBOX', route_revision: 1, priority: 0,
            connection_id: 'muse', connection_revision: 1,
            client_grant_id: 'grant-1', client_grant_revision: 1,
            owner_principal_ref: 'owner-1', owner_credential_generation: 'owner-gen-1',
            actor,
            qualification: { challenge_id: 'challenge-1', observation_ref: 'observation-1',
              verified_credential_generation: 'agent-gen-1',
              ready_until: '2026-10-02T00:00:00.000Z', deployment_generation: 'deploy-1' },
            run_request: run, run_request_sha256: sha,
            created_at: '2026-10-01T00:00:00.000Z',
            expires_at: '2026-10-01T00:30:00.000Z',
          };
          const abandonment = {
            protocol: 'eliotr.computer-agent-dispatch-abandoned.v1',
            dispatch_id: dispatch.dispatch_id, project_id: dispatch.project_id,
            owner_principal_ref: dispatch.owner_principal_ref,
            owner_credential_generation: dispatch.owner_credential_generation,
            reason: 'OWNER_REASSIGNMENT', idempotency_key: 'abandon-1',
            request_sha256: 'b'.repeat(64), abandoned_at: '2026-10-01T00:05:00.000Z',
          };
          const reassignment = {
            protocol: 'eliotr.computer-agent-dispatch-reassigned.v1',
            predecessor_dispatch_id: dispatch.dispatch_id,
            successor_dispatch_id: 'dispatch-new', project_id: dispatch.project_id,
            owner_principal_ref: dispatch.owner_principal_ref,
            owner_credential_generation: 'owner-gen-2', predecessor_state: 'ABANDONED',
            run_request_sha256: sha, successor_transport: 'MCP_WRITE',
            successor_route_revision: 2, successor_connection_id: 'dot',
            successor_connection_revision: 1, successor_client_grant_id: 'grant-2',
            successor_client_grant_revision: 1, idempotency_key: 'reassign-1',
            request_sha256: 'c'.repeat(64), reassigned_at: '2026-10-01T00:10:00.000Z',
          };
          ComputerAgentDispatchReassignSchema.parse({
            expected_predecessor_state: 'ABANDONED', expected_run_request_sha256: sha,
            transport: 'MCP_WRITE', expected_route_revision: 2,
            connection_id: 'dot', connection_revision: 1,
            client_grant_id: 'grant-2', client_grant_revision: 1,
            expires_in_seconds: 900,
          });
          ComputerAgentDispatchReassignmentSchema.parse(reassignment);
          ComputerAgentDispatchStatusSchema.parse({
            protocol: 'eliotr.computer-agent-dispatch-status.v2', state: 'ABANDONED',
            dispatch, acceptance: null, abandonment, decline: null, reassignment,
          });
          let rejected = false;
          try {
            ComputerAgentDispatchReassignmentSchema.parse({
              ...reassignment, successor_dispatch_id: dispatch.dispatch_id,
            });
          } catch { rejected = true; }
          if (!rejected) throw new Error('self-reassignment was accepted');
          rejected = false;
          try {
            ComputerAgentDispatchStatusSchema.parse({
              protocol: 'eliotr.computer-agent-dispatch-status.v2', state: 'PENDING',
              dispatch, acceptance: null, abandonment: null, decline: null, reassignment,
            });
          } catch { rejected = true; }
          if (!rejected) throw new Error('non-terminal reassignment status was accepted');
          console.log('COMPUTER_AGENT_REASSIGNMENT_CONTRACT_OK');
          JS
      - name: Verify D1 and focused SQL behavior
        run: |
          set -euo pipefail
          python infra/d1/check-expression-depth.py
          python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          db.executescript('''
          CREATE TABLE schema_state(key TEXT PRIMARY KEY,value TEXT,updated_at TEXT);
          CREATE TABLE project_owner(project_id TEXT,principal_ref TEXT,PRIMARY KEY(project_id,principal_ref));
          CREATE TABLE computer_agent_dispatch(
            dispatch_id TEXT PRIMARY KEY, project_id TEXT, owner_principal_ref TEXT,
            owner_credential_generation TEXT, run_request_sha256 TEXT, transport TEXT,
            route_revision INTEGER, connection_id TEXT, connection_revision INTEGER,
            client_grant_id TEXT, client_grant_revision INTEGER, created_at TEXT
          );
          CREATE TABLE computer_agent_dispatch_acceptance(dispatch_id TEXT PRIMARY KEY);
          CREATE TABLE computer_agent_dispatch_abandonment(
            dispatch_id TEXT PRIMARY KEY, abandoned_at TEXT
          );
          CREATE TABLE computer_agent_dispatch_decline(
            dispatch_id TEXT PRIMARY KEY, declined_at TEXT
          );
          ''')
          db.executescript(Path(
            'infra/d1/core/migrations/0093_computer_agent_dispatch_reassignment.sql'
          ).read_text())
          db.execute("INSERT INTO project_owner VALUES ('project-1','owner-1')")
          def dispatch(identity, digest, created='2026-10-01T00:00:00.000Z'):
              db.execute('INSERT INTO computer_agent_dispatch VALUES (?,?,?,?,?,?,?,?,?,?,?,?)', (
                  identity, 'project-1', 'owner-1', 'owner-gen-2', digest, 'WEB_INBOX',
                  2, 'muse', 1, 'grant-2', 1, created,
              ))
          def receipt(predecessor, successor, state, digest, key, when):
              value = {
                  'protocol': 'eliotr.computer-agent-dispatch-reassigned.v1',
                  'predecessor_dispatch_id': predecessor,
                  'successor_dispatch_id': successor,
                  'project_id': 'project-1', 'owner_principal_ref': 'owner-1',
                  'owner_credential_generation': 'owner-gen-2',
                  'predecessor_state': state, 'run_request_sha256': digest,
                  'successor_transport': 'WEB_INBOX', 'successor_route_revision': 2,
                  'successor_connection_id': 'muse', 'successor_connection_revision': 1,
                  'successor_client_grant_id': 'grant-2',
                  'successor_client_grant_revision': 1, 'idempotency_key': key,
                  'request_sha256': hashlib.sha256(key.encode()).hexdigest(),
                  'reassigned_at': when,
              }
              text = json.dumps(value, sort_keys=True, separators=(',', ':'))
              return value, text, hashlib.sha256(text.encode()).hexdigest()
          def insert_reassignment(value, text, digest):
              db.execute('''INSERT INTO computer_agent_dispatch_reassignment VALUES (
                :predecessor_dispatch_id,:successor_dispatch_id,:project_id,
                :owner_principal_ref,:owner_credential_generation,:predecessor_state,
                :run_request_sha256,:successor_transport,:successor_route_revision,
                :successor_connection_id,:successor_connection_revision,
                :successor_client_grant_id,:successor_client_grant_revision,
                :idempotency_key,:request_sha256,:record_json,:record_sha256,:reassigned_at
              )''', {**value, 'record_json': text, 'record_sha256': digest})

          sha = 'a' * 64
          dispatch('old-1', sha)
          dispatch('new-1', sha, '2026-10-01T00:06:00.000Z')
          db.execute("INSERT INTO computer_agent_dispatch_abandonment VALUES ('old-1','2026-10-01T00:05:00.000Z')")
          value, text, digest = receipt('old-1','new-1','ABANDONED',sha,'reassign-1','2026-10-01T00:10:00.000Z')
          insert_reassignment(value, text, digest)
          assert db.execute('SELECT successor_dispatch_id FROM computer_agent_dispatch_reassignment WHERE predecessor_dispatch_id=?', ('old-1',)).fetchone() == ('new-1',)
          db.commit()

          def rejected(setup):
              try:
                  setup()
                  db.commit()
              except sqlite3.IntegrityError:
                  db.rollback()
                  return
              raise AssertionError('invalid reassignment was accepted')

          dispatch('old-2', sha); dispatch('new-2', sha)
          db.execute("INSERT INTO computer_agent_dispatch_acceptance VALUES ('old-2')")
          db.execute("INSERT INTO computer_agent_dispatch_abandonment VALUES ('old-2','2026-10-01T00:05:00.000Z')")
          db.commit()
          v,t,d = receipt('old-2','new-2','ABANDONED',sha,'reassign-2','2026-10-01T00:10:00.000Z')
          rejected(lambda: insert_reassignment(v,t,d))

          dispatch('old-3', sha); dispatch('new-3', 'b' * 64)
          db.execute("INSERT INTO computer_agent_dispatch_decline VALUES ('old-3','2026-10-01T00:05:00.000Z')")
          db.commit()
          v,t,d = receipt('old-3','new-3','DECLINED',sha,'reassign-3','2026-10-01T00:10:00.000Z')
          rejected(lambda: insert_reassignment(v,t,d))

          dispatch('old-4', sha); dispatch('new-4', sha)
          db.execute("INSERT INTO computer_agent_dispatch_decline VALUES ('old-4','2026-10-01T00:05:00.000Z')")
          db.execute("INSERT INTO computer_agent_dispatch_decline VALUES ('new-4','2026-10-01T00:06:00.000Z')")
          db.commit()
          v,t,d = receipt('old-4','new-4','DECLINED',sha,'reassign-4','2026-10-01T00:10:00.000Z')
          rejected(lambda: insert_reassignment(v,t,d))
          print('COMPUTER_AGENT_DISPATCH_REASSIGNMENT_SQL_OK')
          PY
      - name: Check source budgets and publish
        run: |
          set -euo pipefail
          set +e
          node scripts/check-budgets.mjs > "$RUNNER_TEMP/reassignment-budget.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/reassignment-budget.txt"
          BUDGET_REPORT="$RUNNER_TEMP/reassignment-budget.txt" python - <<'PY'
          from pathlib import Path
          import os
          report = Path(os.environ['BUDGET_REPORT']).read_text()
          if 'Source budgets: PASS' in report:
              print('COMPUTER_AGENT_REASSIGNMENT_GLOBAL_BUDGETS_PASS')
              raise SystemExit(0)
          known = {
              'packages/cloudflare-ai/src/dynamic-route-qualification.ts',
              'packages/cloudflare-ai/src/dynamic-route-rest-codec.ts',
              'packages/cloudflare-ai/src/model-gateway-response.ts',
              'packages/cloudflare-ai',
              'packages/cloudflare-artifacts/src/artifact-draft-reader-core.ts',
              'packages/cloudflare-research/src/research-owner-qualification-renewal.ts',
              'packages/cloudflare-research/src/research-report-admission.ts',
              'packages/cloudflare-research',
              'packages/cloudflare-research-stages/src/research-claim-audit-input.ts',
              'apps/eliotr-core/src/http.ts',
              'apps/eliotr-core/src/research-semantic-composition.ts',
              'apps/eliotr-core/src/wiki-publication-store.ts',
              'apps/eliotr-core',
              'Worker source',
              'apps/eliotr-pwa',
          }
          observed = set()
          for line in report.splitlines():
              if ' has ' in line and (' lines (max ' in line or ' source lines (max ' in line):
                  observed.add(line.split(' has ', 1)[0])
              elif line.startswith('Worker source is '):
                  observed.add('Worker source')
          unknown = observed - known
          if unknown:
              raise SystemExit(f'reassignment introduced source-budget violations: {sorted(unknown)}')
          if not observed:
              raise SystemExit('unrecognized source-budget report')
          print(f'COMPUTER_AGENT_REASSIGNMENT_SCOPED_BUDGET_OK known_debt={len(observed)} new_violations=0')
          PY
          STAGING_HEAD="$(git rev-parse HEAD)"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$STAGING_HEAD" ]]; then
            echo "origin/main moved during reassignment verification" >&2
            exit 1
          fi
          git rm -f .github/workflows/apply-computer-agent-reassignment.yml \
            .github/reassignment-payload/apply.py.gz
          git add \
            infra/d1/core/migrations/0093_computer_agent_dispatch_reassignment.sql \
            packages/contracts/src/computer-agent-dispatch.ts \
            apps/eliotr-core/src/computer-agent-dispatch-reassignment.ts \
            apps/eliotr-core/src/computer-agent-dispatch-record.ts \
            apps/eliotr-core/src/computer-agent-dispatch-status.ts \
            apps/eliotr-core/src/computer-agent-dispatch-store.ts \
            apps/eliotr-core/src/computer-agent-dispatch-http.ts \
            apps/eliotr-core/src/http-special-routes.ts \
            packages/interfaces/src/routes.ts \
            docs/adr/0007-external-agents-and-cloudflare-evolution.md \
            docs/implementation/muse-operator-runbook.md \
            docs/implementation/computer-agent-web-inbox.md
          git diff --cached --check
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: add explicit computer-agent reassignment' \
            -m 'Link one abandoned or declined dispatch to a fresh owner-authorized successor that reuses only the frozen Research request. Revalidate route, target, grant and qualification; never transfer an accepted run, task, lease or credential. Refs #301.'
          git push origin HEAD:main
