name: lifecycle-reconcile-product-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lifecycle-reconcile-product-once.yml

permissions:
  contents: write

concurrency:
  group: lifecycle-reconcile-product
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Wait for preceding product checkpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            git fetch origin main
            pending=0
            for workflow in research-changes-product-once.yml federation-product-once.yml; do
              if git cat-file -e "origin/main:.github/workflows/$workflow" 2>/dev/null; then
                pending=1
              fi
            done
            if [ "$pending" -eq 0 ]; then
              git reset --hard origin/main
              echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo 'preceding product checkpoints did not settle within 30 minutes' >&2
          exit 1
      - name: Derive the exact outbox lease schema and implement reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd()
          migrations = sorted((root / 'infra/d1/core/migrations').glob('*.sql'))
          joined = '\n'.join(path.read_text(encoding='utf-8') for path in migrations)
          table_match = re.search(
              r'CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?["`\[]?outbox["`\]]?\s*\((.*?)\)\s*;',
              joined,
              re.I | re.S,
          )
          if table_match is None:
              raise SystemExit('canonical outbox table definition was not found')
          body = table_match.group(1)
          columns: dict[str, str] = {}
          for raw in body.splitlines():
              line = raw.strip().rstrip(',')
              match = re.match(r'["`\[]?([A-Za-z_][A-Za-z0-9_]*)["`\]]?\s+(.+)', line)
              if match is None:
                  continue
              name, declaration = match.group(1), match.group(2)
              if name.upper() in {'PRIMARY', 'UNIQUE', 'CHECK', 'FOREIGN', 'CONSTRAINT'}:
                  continue
              columns[name.lower()] = declaration

          def choose(*names: str) -> str:
              for name in names:
                  if name in columns:
                      return name
              raise SystemExit(f'outbox schema lacks one of required columns: {names}')

          identifier = choose('event_id', 'outbox_id', 'id')
          state = choose('state', 'status')
          lease_owner = choose('lease_owner', 'leased_by', 'lease_holder')
          lease_expiry = choose('lease_expires_at', 'lease_until', 'leased_until', 'lease_expiry')
          updated = next((name for name in ('updated_at', 'modified_at') if name in columns), None)
          expiry_decl = columns[lease_expiry].upper()
          numeric_expiry = any(token in expiry_decl for token in ('INT', 'REAL', 'NUM'))

          def quote(name: str) -> str:
              if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', name):
                  raise SystemExit(f'unsafe SQL identifier: {name}')
              return f'"{name}"'

          qid, qstate = quote(identifier), quote(state)
          qowner, qexpiry = quote(lease_owner), quote(lease_expiry)
          set_parts = [f'{qstate} = \'PENDING\'', f'{qowner} = NULL', f'{qexpiry} = NULL']
          if updated is not None:
              set_parts.append(f'{quote(updated)} = ?3')
          set_sql = ', '.join(set_parts)
          update_bind = 'row.outbox_id, cutoff, stamp' if updated is not None else 'row.outbox_id, cutoff'

          module = f'''export interface OutboxReconcileResult {{
            readonly repaired: number;
            readonly still_pending: number;
          }}

          export interface OutboxReconcileInput {{
            readonly limit: number;
            readonly now?: () => number;
          }}

          interface OutboxRow {{
            readonly outbox_id: string | number;
          }}

          function requireCount(value: unknown, label: string): number {{
            if (!Number.isSafeInteger(value) || (value as number) < 0) {{
              throw new Error(`D1 returned an invalid ${{label}}`);
            }}
            return value as number;
          }}

          export async function reconcileExpiredOutboxLeases(
            database: D1Database,
            input: OutboxReconcileInput,
          ): Promise<OutboxReconcileResult> {{
            if (!Number.isSafeInteger(input.limit) || input.limit < 1 || input.limit > 1_000) {{
              throw new RangeError("reconcile limit must be an integer in [1, 1000]");
            }}
            const nowMs = (input.now ?? Date.now)();
            if (!Number.isSafeInteger(nowMs) || nowMs < 0) {{
              throw new RangeError("reconcile clock must return a non-negative safe integer");
            }}
            const cutoff = {'nowMs' if numeric_expiry else 'new Date(nowMs).toISOString()'};
            const stamp = new Date(nowMs).toISOString();
            const leased = await database.prepare(
              "SELECT {qid} AS outbox_id FROM outbox " +
              "WHERE {qstate} = 'LEASED' AND {qexpiry} <= ?1 " +
              "ORDER BY {qexpiry} ASC, {qid} ASC LIMIT ?2",
            ).bind(cutoff, input.limit).all<OutboxRow>();
            const rows = leased.results ?? [];
            let repaired = 0;
            for (const row of rows) {{
              const result = await database.prepare(
                "UPDATE outbox SET {set_sql} " +
                "WHERE {qid} = ?1 AND {qstate} = 'LEASED' AND {qexpiry} <= ?2",
              ).bind({update_bind}).run();
              repaired += requireCount(result.meta.changes, "outbox repair count");
            }}
            const pending = await database.prepare(
              "SELECT COUNT(*) AS pending_count FROM outbox " +
              "WHERE {qstate} IN ('PENDING','LEASED','FAILED')",
            ).first<{{ pending_count: number }}>();
            return {{
              repaired,
              still_pending: requireCount(pending?.pending_count ?? 0, "pending outbox count"),
            }};
          }}
          '''
          module = re.sub(r'^ {10}', '', module, flags=re.M)
          module_path = root / 'apps/eliotr-core/src/outbox-reconciler.ts'
          module_path.write_text(module, encoding='utf-8', newline='\n')

          test = '''import { describe, expect, it } from "vitest";
          import { reconcileExpiredOutboxLeases } from "../src/outbox-reconciler.js";

          interface Call {
            readonly sql: string;
            readonly values: readonly unknown[];
          }

          class Statement {
            private values: readonly unknown[] = [];
            public constructor(
              private readonly sql: string,
              private readonly calls: Call[],
              private readonly database: FakeDatabase,
            ) {}
            public bind(...values: readonly unknown[]): this {
              this.values = values;
              return this;
            }
            public async all<T>(): Promise<{ results: T[] }> {
              this.calls.push({ sql: this.sql, values: this.values });
              return { results: [{ outbox_id: "expired-1" }, { outbox_id: "raced-2" }] as T[] };
            }
            public async run(): Promise<{ meta: { changes: number } }> {
              this.calls.push({ sql: this.sql, values: this.values });
              return { meta: { changes: this.values[0] === "expired-1" ? 1 : 0 } };
            }
            public async first<T>(): Promise<T> {
              this.calls.push({ sql: this.sql, values: this.values });
              return { pending_count: this.database.pending } as T;
            }
          }

          class FakeDatabase {
            public readonly calls: Call[] = [];
            public readonly pending = 4;
            public prepare(sql: string): Statement {
              return new Statement(sql, this.calls, this);
            }
          }

          describe("outbox reconciliation", () => {
            it("requeues only expired leases won by the compare-and-set update", async () => {
              const database = new FakeDatabase();
              await expect(reconcileExpiredOutboxLeases(database as unknown as D1Database, {
                limit: 2,
                now: () => Date.parse("2026-09-11T12:00:00.000Z"),
              })).resolves.toEqual({ repaired: 1, still_pending: 4 });
              expect(database.calls).toHaveLength(4);
              expect(database.calls[0]?.sql).toContain("LIMIT ?2");
              expect(database.calls[1]?.sql).toContain("AND");
              expect(database.calls[1]?.values[0]).toBe("expired-1");
              expect(database.calls[2]?.values[0]).toBe("raced-2");
            });

            it("rejects unbounded limits and invalid clocks before D1", async () => {
              const database = new FakeDatabase();
              await expect(reconcileExpiredOutboxLeases(database as unknown as D1Database, {
                limit: 1_001,
              })).rejects.toBeInstanceOf(RangeError);
              await expect(reconcileExpiredOutboxLeases(database as unknown as D1Database, {
                limit: 1,
                now: () => Number.NaN,
              })).rejects.toBeInstanceOf(RangeError);
              expect(database.calls).toHaveLength(0);
            });
          });
          '''
          test = re.sub(r'^ {10}', '', test, flags=re.M)
          test_path = root / 'apps/eliotr-core/test/outbox-reconciler.test.ts'
          test_path.write_text(test, encoding='utf-8', newline='\n')

          composition_path = root / 'apps/eliotr-core/src/composition-root.ts'
          composition = composition_path.read_text(encoding='utf-8')
          import_line = 'import { reconcileExpiredOutboxLeases } from "./outbox-reconciler.js";\n'
          if import_line not in composition:
              composition = import_line + composition
          function_match = re.search(
              r'async function countPendingOutbox\(database: D1Database\): Promise<number> \{.*?^\}',
              composition,
              re.M | re.S,
          )
          if function_match is None:
              raise SystemExit('obsolete countPendingOutbox function was not found')
          composition = composition[:function_match.start()] + composition[function_match.end():]
          old = '''    async reconcile(limit: number) {
      if (!Number.isSafeInteger(limit) || limit < 1 || limit > 1_000) {
        throw new RangeError("reconcile limit must be an integer in [1, 1000]");
      }
      return { repaired: 0, still_pending: await countPendingOutbox(input.env.CORE_DB) };
    },'''
          new = '''    reconcile(limit: number) {
      return reconcileExpiredOutboxLeases(input.env.CORE_DB, { limit });
    },'''
          if old not in composition:
              raise SystemExit('fake lifecycle reconciliation anchor was not found')
          composition_path.write_text(
              composition.replace(old, new, 1),
              encoding='utf-8',
              newline='\n',
          )

          # Register exact ownership in both the machine manifest and parser-visible
          # packet documents.
          manifest_path = root / 'docs/agent-work/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          def find_packet(value: object, packet_id: str):
              if isinstance(value, dict):
                  if value.get('id') == packet_id:
                      return value
                  for child in value.values():
                      found = find_packet(child, packet_id)
                      if found is not None:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_packet(child, packet_id)
                      if found is not None:
                          return found
              return None

          owned = [
              'apps/eliotr-core/src/outbox-reconciler.ts',
              'apps/eliotr-core/test/outbox-reconciler.test.ts',
          ]
          packet = find_packet(manifest, 'ER-24')
          if packet is None:
              raise SystemExit('ER-24 packet is absent')
          key = 'owned_paths' if 'owned_paths' in packet else 'ownedPaths'
          for value in owned:
              if value not in packet[key]:
                  packet[key].append(value)
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          docs = list((root / 'docs/agent-work').glob('ER-24-*.md'))
          if len(docs) != 1:
              raise SystemExit(f'expected one ER-24 document, found {len(docs)}')
          doc_path = docs[0]
          doc = doc_path.read_text(encoding='utf-8')
          heading = re.search(r'(?im)^##\s+Owned paths\s*$', doc)
          if heading is None:
              raise SystemExit('ER-24 Owned paths heading is absent')
          insertion = heading.end()
          additions = ''.join(f'\n- `{value}`' for value in owned if f'`{value}`' not in doc[insertion:])
          doc_path.write_text(doc[:insertion] + additions + doc[insertion:], encoding='utf-8', newline='\n')

          print({
              'outbox_id': identifier,
              'state': state,
              'lease_owner': lease_owner,
              'lease_expiry': lease_expiry,
              'numeric_expiry': numeric_expiry,
          })
          PY
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify bounded reconciliation locally
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @eliotr/core exec vitest run test/outbox-reconciler.test.ts
          pnpm --filter @eliotr/core typecheck
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit verified reconciliation to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lifecycle-reconcile-product-once.yml
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconcile expired outbox leases instead of reporting zero"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$PRODUCT_BASE_SHA"
          git push origin HEAD:main
