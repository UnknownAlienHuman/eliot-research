name: research-governed-stages-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-governed-stages-once.yml

permissions:
  contents: write

concurrency:
  group: research-governed-stages
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Wait for storage, changes, federation and reconciliation checkpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 160); do
            git fetch origin main
            pending=0
            for workflow in \
              wiki-product-once.yml \
              research-changes-product-once.yml \
              federation-product-once.yml \
              lifecycle-reconcile-product-once.yml; do
              if git cat-file -e "origin/main:.github/workflows/$workflow" 2>/dev/null; then
                pending=1
              fi
            done
            if [ "$pending" -eq 0 ]; then
              git reset --hard origin/main
              echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo 'preceding checkpoints did not settle within 40 minutes' >&2
          exit 1
      - name: Fetch retained cognitive checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            pull/173/head:refs/remotes/origin/salvage-citations \
            pull/174/head:refs/remotes/origin/salvage-coverage \
            pull/175/head:refs/remotes/origin/salvage-synthesis
      - name: Extract only governed-stage implementation deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import subprocess

          root = Path.cwd()
          refs = [
              'refs/remotes/origin/salvage-synthesis',
              'refs/remotes/origin/salvage-citations',
              'refs/remotes/origin/salvage-coverage',
          ]

          def run(*args: str, check: bool = True) -> str:
              result = subprocess.run(args, text=True, encoding='utf-8', stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and result.returncode != 0:
                  raise SystemExit(f"command failed: {' '.join(args)}\n{result.stderr}")
              return result.stdout

          def show(ref: str, path: str) -> str | None:
              result = subprocess.run(['git', 'show', f'{ref}:{path}'], text=True, encoding='utf-8', stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              return result.stdout if result.returncode == 0 else None

          copied: list[str] = []
          shared_patches: list[tuple[str, str]] = []
          for ref in refs:
              base = run('git', 'merge-base', 'HEAD', ref).strip()
              changed = run('git', 'diff', '--name-only', base, ref).splitlines()
              for name in changed:
                  if not name.endswith(('.ts', '.tsx')):
                      continue
                  lower = name.lower()
                  cognitive = any(token in lower for token in (
                      'synthesis', 'citation', 'coverage', 'claim-audit', 'evidence-freeze',
                  ))
                  if not cognitive:
                      continue
                  allowed = name.startswith((
                      'packages/cloudflare-research/src/',
                      'packages/research/src/',
                      'apps/eliotr-core/src/',
                      'apps/eliotr-core/test/',
                  ))
                  if not allowed:
                      continue
                  if name in {
                      'apps/eliotr-core/src/research-stage-handlers.ts',
                      'packages/cloudflare-research/src/index.ts',
                      'packages/research/src/index.ts',
                  }:
                      patch = run('git', 'diff', '--binary', base, ref, '--', name, check=False)
                      if patch.strip():
                          patch_path = f'/tmp/{Path(name).name}-{len(shared_patches)}.patch'
                          Path(patch_path).write_text(patch, encoding='utf-8')
                          shared_patches.append((ref, patch_path))
                      continue
                  content = show(ref, name)
                  if content is None:
                      continue
                  target = root / name
                  current = target.read_text(encoding='utf-8') if target.exists() else None
                  if current == content:
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(content, encoding='utf-8', newline='\n')
                  copied.append(name)

          # Apply shared barrel/factory changes with Git's three-way merge. Conflicts
          # are rejected instead of resolving toward a stale quarantine branch.
          for ref, patch_path in shared_patches:
              result = subprocess.run(
                  ['git', 'apply', '--3way', '--whitespace=error-all', patch_path],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if result.returncode != 0:
                  print(f'skipped incompatible shared patch from {ref}: {Path(patch_path).name}')

          # Repair the known impossible conjunction from the quarantined coverage codec
          # and reject any equivalent surviving expression.
          repaired = 0
          for path in root.rglob('*.ts'):
              if any(part in {'.git', 'node_modules', 'dist', 'target'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'(requested_count\s*!==\s*[^\n;]+?)\s*&&\s*receipt\.requested_count\s*<\s*0',
                  r'\1',
                  text,
              )
              if count:
                  path.write_text(updated, encoding='utf-8', newline='\n')
                  repaired += count
          print(f'copied {len(copied)} cognitive files; repaired {repaired} impossible count guards')

          # Require production wiring. Prefer the freshest retained stage factory when
          # its patch applied; otherwise locate the generated handlers and insert them
          # only into existing named stage slots, never a second executor.
          handler_path = root / 'apps/eliotr-core/src/research-stage-handlers.ts'
          handler = handler_path.read_text(encoding='utf-8')
          required_stage_tokens = {
              'RESOLVE_CITATIONS': ('citation', 'resolve'),
              'CALCULATE_COVERAGE': ('coverage',),
          }
          missing = [stage for stage in required_stage_tokens if stage not in handler]
          if missing:
              raise SystemExit(f'production stage factory still lacks governed slots: {missing}')
          for stage, tokens in required_stage_tokens.items():
              stage_index = handler.find(stage)
              window = handler[stage_index:stage_index + 4_000].lower()
              if not all(token in window for token in tokens):
                  raise SystemExit(f'{stage} remains deterministic metadata instead of its governed handler')

          # Register newly introduced exact paths without stealing an existing owner.
          manifest_path = root / 'docs/agent-work/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          def packets(value: object):
              if isinstance(value, dict):
                  if isinstance(value.get('id'), str) and ('owned_paths' in value or 'ownedPaths' in value):
                      yield value
                  for child in value.values():
                      yield from packets(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from packets(child)

          packet_by_id = {packet['id']: packet for packet in packets(manifest)}
          owners: dict[str, str] = {}
          for packet_id, packet in packet_by_id.items():
              key = 'owned_paths' if 'owned_paths' in packet else 'ownedPaths'
              for path in packet[key]:
                  owners[path] = packet_id

          assigned: dict[str, list[str]] = {}
          for name in copied:
              if name in owners:
                  continue
              lower = name.lower()
              owner = 'ER-10' if any(token in lower for token in ('citation', 'coverage', 'claim-audit', 'evidence-freeze')) else 'ER-09'
              packet = packet_by_id.get(owner)
              if packet is None:
                  raise SystemExit(f'missing packet {owner}')
              key = 'owned_paths' if 'owned_paths' in packet else 'ownedPaths'
              packet[key].append(name)
              assigned.setdefault(owner, []).append(name)

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          for owner, paths in assigned.items():
              docs = list((root / 'docs/agent-work').glob(f'{owner}-*.md'))
              if len(docs) != 1:
                  raise SystemExit(f'{owner}: expected one packet document, found {len(docs)}')
              path = docs[0]
              text = path.read_text(encoding='utf-8')
              heading = re.search(r'(?im)^##\s+Owned paths\s*$', text)
              if heading is None:
                  raise SystemExit(f'{owner}: Owned paths heading missing')
              insertion = heading.end()
              additions = ''.join(f'\n- `{value}`' for value in paths if f'`{value}`' not in text[insertion:])
              path.write_text(text[:insertion] + additions + text[insertion:], encoding='utf-8', newline='\n')
          PY
      - name: Enforce cognitive and evidence invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.ts' 'requested_count.*!==.*&&.*requested_count.*<.*0' apps packages; then
            echo 'impossible coverage mismatch guard remains' >&2
            exit 1
          fi
          grep -RIn --include='*.test.ts' 'duplicate\|foreign\|stale\|purge\|max+1\|counterevidence' \
            packages/cloudflare-research/src packages/research/src apps/eliotr-core/test \
            >/tmp/governed-stage-negatives
          test -s /tmp/governed-stage-negatives
          grep -n 'RESOLVE_CITATIONS\|CALCULATE_COVERAGE' apps/eliotr-core/src/research-stage-handlers.ts
          if grep -RIn --include='*.ts' 'ENGINE_COMPLETED.*COMPLETE\|transport.*COMPLETED.*disposition' \
            apps/eliotr-core/src packages/research/src packages/cloudflare-research/src; then
            echo 'transport/engine completion appears to strengthen research disposition' >&2
            exit 1
          fi
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify governed stages locally without providers, Astro or Qdrant
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @eliotr/research test
          pnpm --filter @eliotr/cloudflare-research test
          pnpm --filter @eliotr/core test
          pnpm exec tsc -p apps/eliotr-core/test/tsconfig.json --pretty false
          pnpm typecheck
          pnpm lint
          pnpm boundaries:check
          pnpm budgets:check
          pnpm work-packets:check
          pnpm check:implementation-status
          git diff --check
      - name: Commit governed stages to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/research-governed-stages-once.yml
          git diff --check
          git config user.name "Eliot Research Product"
          git config user.email "eliot-product@users.noreply.github.com"
          git add -A
          git commit -m "feat: execute citation resolution and coverage stages"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$PRODUCT_BASE_SHA"
          git push origin HEAD:main
