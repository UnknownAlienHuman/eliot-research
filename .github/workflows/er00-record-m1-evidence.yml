name: er00-record-m1-evidence

on:
  push:
    branches:
      - "agent/ER-00-rust-m1-foundation-20260901"
    paths:
      - ".github/workflows/er00-record-m1-evidence.yml"

permissions:
  contents: write

jobs:
  record:
    if: github.ref_name == 'agent/ER-00-rust-m1-foundation-20260901'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Record exact M1 completion evidence
        run: python .github/er00-record-m1-evidence.py
      - name: Validate the documentation patch
        run: git diff --check
      - name: Commit the readiness record
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/implementation/production-readiness-plan.md \
            docs/implementation/gap-register.md \
            docs/agent-work/ER-00-workspace-and-verification-gates.md
          git commit -m "docs(readiness): record verified Rust M1 completion"
          git push origin "HEAD:${HEAD_REF}"
