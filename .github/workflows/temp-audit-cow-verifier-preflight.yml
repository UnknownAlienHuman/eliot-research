name: temp-audit-cow-verifier-preflight
on:
  push:
    branches:
      - audit/380-cow-verifier-preflight
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply repair and run scoped typecheck
        shell: bash
        run: |
          set -euo pipefail
          python .github/audit-380-cow-verifier-preflight.py
          rm .github/audit-380-cow-verifier-preflight.py \
            .github/workflows/temp-audit-cow-verifier-preflight.yml
          git diff --check
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @eliotr/cloudflare-research typecheck
          git add -A
          git diff --cached --check
          git config user.name "Iurii Lisenkov"
          git config user.email "71514792+UnknownAlienHuman@users.noreply.github.com"
          git commit -m "fix: preflight COW verifier inputs before effect (#380)"
          git push origin HEAD:audit/380-cow-verifier-preflight
