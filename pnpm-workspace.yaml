  - hono@4.13.14
  - '@ai-sdk/openai-compatible@3.0.79'
  - '@ai-sdk/provider-utils@5.0.69'
  - '@ai-sdk/anthropic@4.0.91'

overrides:
  '@modelcontextprotocol/client': 2.3.1
  '@modelcontextprotocol/server': 2.3.1
  '@modelcontextprotocol/sdk': 1.32.1
