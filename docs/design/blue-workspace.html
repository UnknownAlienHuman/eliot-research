let view='research',tab='overview',selection='antigravity',docTab='result',scenario='scope',runToken=0,selectedSources=new Set(sources),sourceFilter='',openSource='MemoryOS',checkPending=false;

function fillIcons(){$$('[data-icon]').forEach(e=>{e.innerHTML=icon(e.dataset.icon)})}
function modal(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog').showModal()}
function toast(message){const t=$('#toast');t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,4000)}
function showView(){runToken++;checkPending=false;view=['research','library','connections'].includes(location.hash.slice(1))?location.hash.slice(1):'research';$('#crumb').textContent={research:'Исследование',library:'Источники',connections:'Подключения'}[view];$$('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===view);if(a.dataset.nav===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});render()}

function row(d){return `<button class="connrow ${selection===d.id?'selected':''}" data-connection="${d.id}" aria-pressed="${selection===d.id}"><span class="logo">${d.logo}</span><span class="rowtitle"><strong>${d.name}</strong><small>${d.type}</small></span><span class="rowstatus">${badge(d.state,d.tone)}<small>${d.detail}</small></span>${icon('chevron')}</button>`}
function connections(){const listed=tab==='agents'?data.filter(d=>d.id!=='mcp'):tab==='mcp'?data.filter(d=>d.id==='mcp'):data.slice(0,4);return `<div class="content"><div class="between"><div><div class="kicker" style="margin-bottom:10px">РАБОЧЕЕ ПРОСТРАНСТВО</div><h1>Подключения</h1><p class="subhead">Кто подключён, что ему доступно и где нужна ваша помощь.</p></div><button class="primary" data-action="connect">${icon('plus')}Подключить клиента</button></div><div class="tabs" role="tablist" aria-label="Тип подключения">${[['overview','Обзор'],['mcp','MCP'],['agents','Агенты'],['log','Журнал']].map(([id,name])=>`<button class="tab" role="tab" id="tab-${id}" aria-controls="connection-panel" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}" data-tab="${id}">${name}</button>`).join('')}</div><div id="connection-panel" role="tabpanel" aria-labelledby="tab-${tab}">${tab==='log'?`<div style="padding:26px 0"><h2>История демонстрации</h2><p class="subhead">Только события этого макета. Это не журнал реальных подключений.</p>${logs.map(l=>`<div class="logline">${esc(l)}<small>Локальный сценарий · не серверная квитанция</small></div>`).join('')}</div>`:`<div class="route" aria-label="Направление подключения"><div class="route-node">${icon('agent')}Ваши агенты</div><span class="route-arrow">→</span><div class="route-node center">${icon('server')}ELIOT Research</div><span class="route-arrow external">→</span><div class="route-node external">${icon('book')}Разрешённые источники</div></div><div class="conn-grid"><div><div class="listhead"><span>${tab==='mcp'?'MCP-сервер ELIOT':tab==='agents'?'Агенты и клиентские приложения':'Подключения и клиенты'}</span><span>Последнее наблюдение · демо</span></div><div class="connlist">${listed.map(row).join('')}</div><div class="note amber" style="margin-top:18px">${icon('lock')} <strong>Подключение ≠ доступ к данным.</strong><br>Antigravity получает статус сервера, но не каталог источников.</div><h3 class="section-label">Проверяйте нужный маршрут</h3><p class="muted small">Сервер отвечает — это проверка сервера. Запрос, подтверждённый от конкретного клиента, — проверка подключения агента.</p>${tab==='mcp'?`<div class="note" style="margin-top:18px"><strong>Внешние MCP-серверы</strong><br>В выбранном профиле не реализован универсальный MCP-клиент. Сервисы, подключённые внутри Antigravity, не становятся прямыми подключениями ELIOT.</div>`:''}<p class="bottomnote">${icon('lock')}Демо: сеть, ключи и ваши агенты не используются.</p></div><aside id="connection-detail" class="inspector" aria-label="Детали подключения"></aside></div>`}</div></div>`}
function inspector(){const host=$('#connection-detail');if(!host)return;const d=data.find(d=>d.id===selection)||data[1];const unsupported=['eliot','codex','opencode','claude'].includes(d.id);host.innerHTML=`<div class="between"><h2>${d.name}</h2>${icon(d.id==='mcp'?'server':'agent')}</div><p class="subtitle">${d.id==='mcp'?'Проверка серверного маршрута':'Проверка подключения из клиента'} · демо</p><div class="status-detail">${badge(unsupported?'Проверка не выполнена':d.state,unsupported?'':d.tone)}</div><p class="subtitle">${unsupported?'Дата проверки неизвестна':'12 сентября · 12:42 UTC · пример'}</p>${unsupported?`<div class="note" style="margin:20px 0">Нет подтверждённого обращения этого клиента. Его имя в списке не доказывает, что он работает.</div><button class="secondary full" data-action="connect">Как подключить</button>`:`<ol class="steps" id="check-steps">${stepsMarkup(scenario)}</ol><div class="check-actions"><button class="primary full" data-action="check">${icon('check')}Проверить подключение</button><button class="secondary full" data-action="access">${icon('lock')}Посмотреть доступ</button></div><label class="demo-picker">Демо-сценарий <select id="scenario" aria-label="Демонстрационный сценарий">${[['scope','Нет доступа к каталогу'],['ready','Статус доступен'],['auth','Требуется вход'],['timeout','Нет ответа'],['version','Версия несовместима'],['toolerror','Ошибка инструмента']].map(([v,n])=>`<option value="${v}" ${scenario===v?'selected':''}>${n}</option>`).join('')}</select></label>`}<div class="divider"></div><p class="small muted">${unsupported?'Нет heartbeat-контракта — нет достоверного статуса «онлайн».':'Проверка только чтения. Без запуска модели, записи документов и расширения разрешений.'}</p>`}
function stepsMarkup(state,through=9){const fail={auth:1,timeout:0,version:2,toolerror:4,scope:5}[state];const labels=[['Адрес сервера','HTTPS · зарегистрированный маршрут'],['Авторизация','Проверена для конкретного клиента'],['Протокол MCP','Согласован 2025-06-18'],['Список инструментов','3 инструмента · каталог не выдан'],['Чтение статуса','eliotr_system_status · без записи'],['Каталог источников','Нужно отдельное разрешение']];return labels.map(([a,b],i)=>{let cls='',sign='✓';if(i>through||fail!==undefined&&i>fail){cls='idle';sign='—';b='Не выполнялось'}else if(i===fail){cls=state==='scope'?'warn':'error';sign='!';b={auth:'Войдите в аккаунт в клиенте',timeout:'Нет ответа в пределах тайм-аута',version:'Нет общей версии протокола',toolerror:'Ответ isError=true — это не успех',scope:'MCP_CATALOG_SCOPE_REQUIRED'}[state]}else if(i===5){cls='idle';sign='—';b='Не входит в проверку статуса'}return `<li class="step ${cls}"><span class="step-icon">${sign}</span><div><strong>${a}</strong><small>${b}</small></div></li>`}).join('')}
function research(){return `<div class="research"><aside class="corpus" aria-label="Источники"><div class="between"><h3>Источники <span class="muted">6</span></h3><button class="iconbtn" data-action="add" aria-label="Добавить источник">${icon('plus')}</button></div><input class="source-search" id="source-filter" aria-label="Найти источник" placeholder="Найти в подборке…" value="${esc(sourceFilter)}"><div class="kicker" style="font-size:9px;margin:4px 0 10px">ВЫБРАНО <span id="source-count">${selectedSources.size}</span> ИЗ 6</div><div id="sources">${sourceRows()}</div><div class="corpus-note">${icon('lock')}<br>Срез результата S-012<br>Выбор для нового вопроса не меняет уже полученный результат.</div></aside><section class="document"><div class="between"><span class="kicker">ОБЗОР ЛИТЕРАТУРЫ</span><button class="secondary source-toggle" data-action="sources">${icon('book')}Источники</button></div><h1>Как устроена память<br>AI-агентов?</h1><p class="subhead">Механизмы, ограничения и вопросы для проверки.</p><div class="docmeta">${badge('Черновик','amber')}${badge('6 источников · S-012')}<span class="muted small">Демонстрационный результат</span></div><form class="question" id="question-form"><label class="sr" for="question">Исследовательский вопрос</label><textarea id="question">Какие механизмы памяти подходят для ELIOT?</textarea><div class="between"><span class="pill">${icon('book')}По выбранным источникам</span><button class="primary" type="submit">Исследовать ${icon('arrow')}</button></div></form><div class="tabs" role="tablist" aria-label="Представления исследования">${[['result','Выводы'],['matrix','Сравнение'],['process','Ход работы']].map(([id,n])=>`<button class="tab" role="tab" id="doc-tab-${id}" aria-controls="doc-content" aria-selected="${docTab===id}" tabindex="${docTab===id?0:-1}" data-doctab="${id}">${n}</button>`).join('')}</div><article id="doc-content" class="docbody" role="tabpanel" aria-labelledby="doc-tab-${docTab}">${docContent()}</article><div class="bottomnote">${icon('search')}Выборочный поиск · полнота не установлена</div></section><aside class="evidence" aria-label="Первоисточник"><div class="between"><h2>Основание вывода</h2><button class="iconbtn close-evidence" data-action="close-evidence" aria-label="Закрыть источник">${icon('close')}</button></div><p class="muted small" style="margin-top:10px">${esc(openSource)} · демонстрационный источник</p><div class="paper"><div class="micro">ПРИМЕР ПРЕДСТАВЛЕНИЯ ТЕКСТА</div><h3>Memory architecture<br>Research notes</h3><p><mark>Хранение, обновление и извлечение знаний следует проверять отдельно.</mark></p><p style="margin-top:12px">Эта страница показывает расположение фрагмента и контекста, а не подлинный текст научной публикации.</p><div class="micro" style="margin-top:20px">ИЛЛЮСТРАЦИЯ · НЕ ОРИГИНАЛ PDF</div></div><span class="claimlabel">Рабочая гипотеза</span><blockquote>Разделение функций памяти — направление исследования, а не установленный результат.</blockquote>${badge('Поддержка не проверена','amber')}<dl class="metadata"><div><dt>Срез результата</dt><dd>S-012 · пример</dd></div><div><dt>Точность</dt><dd>Иллюстрация текста</dd></div><div><dt>EvidenceHandle</dt><dd>Не выпускался</dd></div></dl><button class="secondary full" data-action="context">Прочитать контекст ${icon('arrow')}</button></aside></div>`}
function docContent(){if(docTab==='matrix')return `<span class="claimlabel">План сопоставления · демо</span><h2>Сравниваем на одинаковых условиях</h2><div class="tablewrap"><table class="matrix"><thead><tr><th>Механизм</th><th>Материалы</th><th>Проверка</th></tr></thead><tbody><tr><td>Организация памяти</td><td>MemoryOS</td><td>Не выполнена</td></tr><tr><td>Обновление</td><td>A-MEM · Mem0</td><td>Не выполнена</td></tr><tr><td>Длительные задачи</td><td>LongMemEval</td><td>Не выполнена</td></tr></tbody></table></div><p class="muted small">Пустые результаты не означают отсутствие эффекта. Числа и выводы в макете не придуманы.</p>`;if(docTab==='process')return `<span class="claimlabel">Состояние результата</span><h2>Черновик, не заключение</h2><div class="note">Источники → поиск → рабочая гипотеза → проверка → результат.</div><p class="muted" style="margin-top:18px">В этом макете выполнение не запускалось. В продукте этапы поступают с сервера, а не вычисляются по таймеру.</p>`;return `<span class="claimlabel">01 / Рабочая гипотеза</span><h2>Разделять функции, а не только хранилища</h2><p><span class="quotehl">Хранение, обновление и проверку знаний стоит рассматривать как отдельные механизмы.</span><button class="cite" data-action="citation" aria-label="Открыть основание первой гипотезы">1</button></p><p class="muted">Для ELIOT нужно сравнить не только качество поиска, но и то, как система исправляет устаревшие сведения и сохраняет происхождение выводов.</p><div class="tablewrap"><table class="matrix"><thead><tr><th>Что проверить</th><th>Следующий шаг</th></tr></thead><tbody><tr><td>Обновление знаний</td><td>Сопоставить механизмы</td></tr><tr><td>Долгие задачи</td><td>Проверить условия тестов</td></tr></tbody></table></div><div class="note amber"><strong>Открытый вопрос</strong><br>Что подтверждается экспериментами, а что остаётся предположением?</div>`}
function sourceRows(){const filtered=sources.filter(s=>s.toLowerCase().includes(sourceFilter.toLowerCase()));return filtered.map((s,i)=>`<div class="sourcerow ${s===openSource?'selected':''}"><button class="source-open" data-source="${esc(s)}">${icon(i<4?'file':'book')}<span><strong>${esc(s)}</strong><small>${i<4?'Публикация':'Документ проекта'} · демо</small></span></button><label><span class="sr">Включить ${esc(s)}</span><input type="checkbox" data-sourcecheck="${esc(s)}" ${selectedSources.has(s)?'checked':''}></label></div>`).join('')||'<p class="muted small">В этой подборке совпадений нет.</p>'}
function library(){return `<div class="content"><div class="between"><div><div class="kicker" style="margin-bottom:10px">ПАМЯТЬ AI-АГЕНТОВ</div><h1>Источники</h1><p class="subhead">6 демонстрационных материалов. Выбор и чтение — разные действия.</p></div><button class="primary" data-action="add">${icon('plus')}Добавить</button></div><div class="library-grid">${sources.map(s=>`<button class="card" style="text-align:left" data-source="${esc(s)}">${icon('file')}<h3 style="margin:14px 0 6px">${esc(s)}</h3><p class="muted small">Демо-карточка · исходные байты не загружены</p></button>`).join('')}</div><div class="note" style="margin-top:26px">Загрузка, допуск источника, готовность поиска и точный фрагмент — отдельные состояния.</div></div>`}
async function check(){if(checkPending)return;const token=++runToken;checkPending=true;const button=$('[data-action="check"]');button.disabled=true;button.textContent='Демонстрация проверки…';for(let i=0;i<6;i++){await new Promise(r=>setTimeout(r,140));if(token!==runToken||view!=='connections')return;$('#check-steps').innerHTML=stepsMarkup(scenario,i)}checkPending=false;button.disabled=false;button.innerHTML=icon('check')+'Проверить ещё раз';const result={scope:'Статус доступен. Каталог требует отдельного разрешения.',ready:'Чтение статуса прошло. Доступ к данным не проверен.',auth:'Нужен вход в клиенте. Дальнейшие проверки не выполнены.',timeout:'Ответ не получен. Это не доказывает, что сервер выключен.',version:'Нет общей версии MCP. Инструменты не запрашивались.',toolerror:'HTTP-ответ получен, но инструмент вернул ошибку.'}[scenario];const summary={scope:['Нет доступа к каталогу','amber'],ready:['Статус доступен','blue'],auth:['Требует входа','amber'],timeout:['Ответ не получен','amber'],version:['Версия несовместима','red'],toolerror:['Ошибка инструмента','red']}[scenario];$('.status-detail').innerHTML=badge(summary[0],summary[1]);logs.unshift('Демо: '+result);toast('Демо: '+result)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.connection){selection=b.dataset.connection;scenario=selection==='spark'?'auth':selection==='mcp'?'ready':'scope';runToken++;checkPending=false;render();return}if(b.dataset.tab){tab=b.dataset.tab;if(tab==='mcp'){selection='mcp';scenario='ready'}else if(tab==='agents'&&selection==='mcp'){selection='antigravity';scenario='scope'}else if(tab==='overview'&&!data.slice(0,4).some(d=>d.id===selection)){selection='antigravity';scenario='scope'}runToken++;checkPending=false;render();$(`#tab-${tab}`)?.focus();return}if(b.dataset.doctab){docTab=b.dataset.doctab;render();$(`#doc-tab-${docTab}`)?.focus();return}if(b.dataset.source){openSource=b.dataset.source;if(view!=='research')location.hash='research';else{render();$('.evidence').classList.add('open')}return}const action=b.dataset.action;if(action==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return}if(action==='check'){void check();return}if(action==='close-dialog'){$('#dialog').close();return}if(action==='sources'){$('.corpus').classList.toggle('open');$('#source-filter').focus();return}if(action==='close-evidence'){$('.evidence').classList.remove('open');$('.cite')?.focus();return}if(action==='citation'){$('.evidence').classList.add('open');$('.close-evidence')?.focus();return}if(action==='find'){location.hash='research';setTimeout(()=>{$('.corpus')?.classList.add('open');$('#source-filter')?.focus()},0);return}if(action==='access')modal('Что доступно клиенту',`<p>Пример каталога активного MCP-профиля. Три выданных инструмента не означают доступ к библиотеке.</p><ul class="tool-list"><li><code>eliotr_system_status</code><br>Чтение статуса</li><li><code>eliotr_create_google_sync_plan</code><br>Создание плана, не Google-действие</li><li><code>eliotr_validate_google_sync_receipt</code><br>Проверка наблюдения, не допуск источника</li><li><code>eliotr_catalog</code><br>Не выдан · требуется service-scope</li></ul>`);else if(action==='connect')modal('Подключить клиент к ELIOT',`<p><strong>1. Выбрать клиент.</strong> Antigravity, Gemini Spark или отдельный согласованный агентский профиль.</p><p><strong>2. Настроить адрес и вход в клиенте.</strong> Ключи не вставляются в этот макет. Для выбранного Workspace-профиля не нужен новый Google Cloud проект.</p><p><strong>3. Выполнить проверку из клиента.</strong> ELIOT должен подтвердить авторизованный запрос этого клиента. Проверка сервера сама по себе недостаточна.</p><p><strong>4. Проверить разрешения.</strong> Доступ к проекту выдаётся отдельно. Эта демонстрация ничего не подключает.</p>`);else if(action==='wiki')modal('Материалы исследования','<p>Здесь планируются сохранённые обзоры, Wiki и отчёты. Публикация зависит от серверной реализации. В этом прототипе доступны исследование, источники и подключения.</p>');else if(action==='add')modal('Добавить источники','<p>В рабочем продукте здесь будут файл, нормализованная папка и доступные подключённые источники. Этот прототип не загружает данные и не выдаёт допуск источника.</p>');else if(action==='context')modal('Контекст и происхождение','<p>В рабочем интерфейсе здесь открывается соседний текст той же закреплённой ревизии. В этом макете цитата иллюстративная: оригинал, страница и EvidenceHandle отсутствуют.</p>')});

document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;runToken++;checkPending=false;inspector()}if(e.target.dataset.sourcecheck){const s=e.target.dataset.sourcecheck;if(e.target.checked)selectedSources.add(s);else selectedSources.delete(s);$('#source-count').textContent=selectedSources.size;toast('Выбор изменён для следующего вопроса. Срез результата S-012 сохранён.')}});
document.addEventListener('submit',e=>{e.preventDefault();modal('Исследование не запускалось','<p>Это автономный дизайн-прототип. В продукте кнопка запускает существующий серверный research.run, а не имитирует выводы в браузере.</p>')});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('[data-action="find"]').click()}if(e.key==='Escape'){$('.corpus')?.classList.remove('open');$('.evidence')?.classList.remove('open')}if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)&&e.target.matches('[role=tab]')){e.preventDefault();const all=$$('[role=tab]',e.target.closest('[role=tablist]'));const i=all.indexOf(e.target);all[e.key==='Home'?0:e.key==='End'?all.length-1:(i+(e.key==='ArrowRight'?1:-1)+all.length)%all.length].click()}});
window.addEventListener('hashchange',showView);window.addEventListener('pagehide',()=>runToken++);showView();
</script>
</body></html>
