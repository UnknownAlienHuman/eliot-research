  "src/evaluator\\.rs:138:5: replace verify_embedded_vectors -> Result<\\(\\), VectorVerificationError> with Ok\\(\\(\\)\\)",
  "src/stable_id\\.rs:36:5: replace verify_embedded_ingest_identity_vectors -> Result<\\(\\), StableIdVerificationError> with Ok\\(\\(\\)\\)",
  "src/stable_id\\.rs:46:5: replace verify_embedded_projection_identity_vectors -> Result<\\(\\), StableIdVerificationError> with Ok\\(\\(\\)\\)",
