  "src/canonical_body/evaluator\\.rs:134:5: replace verify_embedded_canonical_body_vectors -> Result<\\(\\), CanonicalBodyVerificationError> with Ok\\(\\(\\)\\)",
  "src/owner_token/evaluator\\.rs:133:5: replace verify_embedded_owner_token_vectors -> Result<\\(\\), OwnerTokenVerificationError> with Ok\\(\\(\\)\\)",
  "src/residency_key/evaluator\\.rs:143:5: replace verify_embedded_residency_key_vectors -> Result<\\(\\), ResidencyKeyVerificationError> with Ok\\(\\(\\)\\)",
  "src/stable_id/evaluator\\.rs:131:5: replace verify_embedded_stable_id_vectors -> Result<\\(\\), StableIdVerificationError> with Ok\\(\\(\\)\\)",
